<script>
/* Version 2 : charte claire unique. La marque du bureau (logo, couleurs) est
   reprise du dernier passage de ce compte, avant le premier rendu ;
   ui.js / portail.js la confirment ensuite. */
(function(){var r=document.documentElement,m="str";r.setAttribute("data-version","v2");r.setAttribute("data-theme","clair");try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();

<body class="large">

<div data-chrome></div>

<main>
  <div class="wrap entete">
    <h1>Carte des affaires <span id="titre-carte" class="compte-titre"></span></h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <section class="section">
      <div class="tete-section seule-action">
        <div class="outils">
          <label class="case" style="text-transform:none;letter-spacing:.04em">
            <input type="checkbox" id="voir-terminees"> Voir les affaires terminées
          </label>
        </div>
      </div>
      <div class="carte-aff" id="carte" role="application" aria-label="Carte des affaires : glisser pour déplacer, molette ou boutons pour zoomer">
        <div class="ca-scene" id="scene">
          <div class="ca-tuiles" id="tuiles"></div>
          <div id="points"></div>
        </div>
        <div class="ca-etat" id="etat" role="status"></div>
        <div class="ca-outils">
          <button type="button" id="plus" aria-label="Zoomer">+</button>
          <button type="button" id="moins" aria-label="Dézoomer">−</button>
          <button type="button" id="cadre" aria-label="Voir toutes les affaires" title="Voir toutes les affaires">⌖</button>
        </div>
        <div class="ca-fonds" role="group" aria-label="Fond de carte" id="fonds"></div>
        <div class="ca-credit">Carte © <a href="https://www.swisstopo.admin.ch" target="_blank" rel="noopener noreferrer">swisstopo</a> · adresses geo.admin.ch</div>
      </div>
      <div class="ca-manque" id="manque"></div>
    </section>
  </div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=6"></script>

<script>
/* Carte des affaires (28.09.2026)
   ---------------------------------------------------------------------------
   Toutes les affaires qui ont une adresse, sur le fond gris de swisstopo.
   Google Maps n'affiche pas plusieurs adresses sans clé payante : la carte est
   donc dessinée ici, sans bibliothèque, et chaque point renvoie vers Google Maps.
     - adresses → coordonnées : service de recherche de geo.admin.ch (gratuit,
       sans clé, adresses suisses), résultat gardé dans le navigateur
       (planif.geo) pour ne pas redemander à chaque ouverture ;
     - fond : tuiles WMTS de swisstopo en projection Web Mercator (EPSG:3857),
       zoom entier, glisser pour déplacer, molette, double-clic ou pincement pour zoomer ;
     - un losange à la teinte de l'affaire, son numéro à côté ; clic : bulle
       avec l'adresse, la phase, les tâches ouvertes, Google Maps et Tâches.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var D = window.Donnees, el = UI.el;

  var TUILE = 256, ZMIN = 6, ZMAX = 18;
  var WMTS = "https://wmts.geo.admin.ch/1.0.0/";
  // Trois fonds swisstopo, au choix ; le choix est gardé dans le navigateur (planif.carte.fond)
  var FONDS = [
    { cle: "plan", nom: "Plan", couche: "ch.swisstopo.pixelkarte-grau" },
    { cle: "couleur", nom: "Couleur", couche: "ch.swisstopo.pixelkarte-farbe" },
    { cle: "photo", nom: "Photo", couche: "ch.swisstopo.swissimage" }
  ];
  var fond = FONDS[0];
  try { fond = FONDS.filter(function (f) { return f.cle === localStorage.getItem("planif.carte.fond"); })[0] || FONDS[0]; } catch (e) {}
  var RECHERCHE = "https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&limit=1&sr=4326&searchText=";
  var CLE_GEO = "planif.geo";
  var OUBLI = 7 * 864e5;                       // une adresse introuvable est redemandée au bout d'une semaine

  var carte = document.getElementById("carte"), scene = document.getElementById("scene");
  var tuiles = document.getElementById("tuiles"), hotePoints = document.getElementById("points");
  var etat = document.getElementById("etat");

  // Vue : zoom entier, centre en pixels du monde à ce zoom. Suisse entière au départ.
  var vue = { z: 8, cx: 0, cy: 0 };
  var L = 0, H = 0;
  var affaires = [], positions = {}, choisi = null, bulle = null, dejaCadre = false;

  /* ---------------------------------------------------- projection */
  function monde(lat, lon, z) {
    var n = TUILE * Math.pow(2, z), s = Math.sin(lat * Math.PI / 180);
    return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
  }
  function centreSur(lat, lon, z) {
    vue.z = z; var p = monde(lat, lon, z); vue.cx = p[0]; vue.cy = p[1];
  }
  centreSur(46.8, 8.23, 8);

  /* --------------------------------------------- adresses → coordonnées */
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem(CLE_GEO) || "{}") || {}; } catch (e) { cache = {}; }
  function garde() { try { localStorage.setItem(CLE_GEO, JSON.stringify(cache)); } catch (e) {} }
  function cleAdresse(a) { return a.toLowerCase().replace(/[\s,]+/g, " ").trim(); }

  function cherche(texte, origines) {
    return fetch(RECHERCHE + encodeURIComponent(texte) + (origines ? "&origins=" + origines : ""))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var r = j && j.results && j.results[0], at = r && r.attrs;
        return at && isFinite(at.lat) && isFinite(at.lon) ? { lat: +at.lat, lon: +at.lon } : null;
      });
  }
  /** Coordonnées d'une adresse : l'adresse exacte d'abord, sinon le NPA ou la localité. */
  function localise(adresse) {
    var k = cleAdresse(adresse), c = cache[k];
    if (c && (c.lat != null || Date.now() - c.t < OUBLI)) return Promise.resolve(c.lat != null ? c : null);
    var texte = adresse.replace(/,/g, " ");
    return cherche(texte, "address")
      .then(function (p) { return p || cherche(texte, "zipcode,gg25"); })
      .then(function (p) {
        cache[k] = p ? { lat: p.lat, lon: p.lon, t: Date.now() } : { lat: null, t: Date.now() };
        garde();
        return p;
      });
  }

  /** Localise toutes les adresses, trois à la fois, en disant où on en est. */
  function localiseTout() {
    var aFaire = affaires.filter(function (a) { return !positions[a.id]; });
    var n = 0, total = aFaire.length, file = aFaire.slice(), panne = false;
    if (!total) return Promise.resolve();
    function suivant() {
      var a = file.shift();
      if (!a) return Promise.resolve();
      return localise(a.adresse).then(function (p) {
        positions[a.id] = p || false;
      }, function () { panne = true; })
        .then(function () {
          n++;
          etat.textContent = n < total ? "Localisation des adresses… " + n + " / " + total : "";
          dessinePoints();
          return suivant();
        });
    }
    etat.textContent = "Localisation des adresses… 0 / " + total;
    return Promise.all([suivant(), suivant(), suivant()]).then(function () {
      etat.textContent = panne ? "Service des adresses injoignable : réessaie plus tard." : "";
    });
  }

  /* ---------------------------------------------------------- dessin */
  function mesure() { var r = carte.getBoundingClientRect(); L = r.width; H = r.height; }

  function dessineTuiles() {
    var n = Math.pow(2, vue.z), x0 = vue.cx - L / 2, y0 = vue.cy - H / 2;
    var tx0 = Math.floor(x0 / TUILE), tx1 = Math.floor((x0 + L) / TUILE);
    var ty0 = Math.max(0, Math.floor(y0 / TUILE)), ty1 = Math.min(n - 1, Math.floor((y0 + H) / TUILE));
    var voulues = {};
    for (var ty = ty0; ty <= ty1; ty++) for (var tx = tx0; tx <= tx1; tx++) {
      var x = ((tx % n) + n) % n, cle = vue.z + "/" + x + "/" + ty;
      voulues[cle] = true;
      var img = tuiles.querySelector('img[data-t="' + cle + '"]');
      if (!img) {
        img = el("img", { alt: "", draggable: "false", "data-t": cle, src: WMTS + fond.couche + "/default/current/3857/" + cle + ".jpeg" });
        img.onerror = function () { this.style.visibility = "hidden"; };
        tuiles.appendChild(img);
      }
      img.style.transform = "translate(" + Math.round(tx * TUILE - x0) + "px," + Math.round(ty * TUILE - y0) + "px)";
    }
    [].slice.call(tuiles.children).forEach(function (img) { if (!voulues[img.getAttribute("data-t")]) img.remove(); });
  }

  function ecran(p) {
    var w = monde(p.lat, p.lon, vue.z);
    return [w[0] - (vue.cx - L / 2), w[1] - (vue.cy - H / 2)];
  }

  function dessinePoints() {
    UI.vide(hotePoints);
    affaires.forEach(function (a) {
      var p = positions[a.id];
      if (!p) return;
      var e = ecran(p);
      if (e[0] < -80 || e[1] < -40 || e[0] > L + 80 || e[1] > H + 40) return;
      var b = el("button", {
        type: "button", class: "ca-point" + (choisi === a.id ? " choisi" : ""),
        style: "--tt:" + UI.teinte(a.teinte) + ";left:" + Math.round(e[0]) + "px;top:" + Math.round(e[1]) + "px",
        "aria-label": a.code + " · " + a.nom + " — " + a.adresse
      }, [el("i", { "aria-hidden": "true" }), el("b", { text: a.code })]);
      b.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      b.addEventListener("click", function (ev) { ev.stopPropagation(); ouvreBulle(a); });
      hotePoints.appendChild(b);
    });
    placeBulle();
  }

  function dessine() { mesure(); dessineTuiles(); dessinePoints(); }

  /* ----------------------------------------------------------- bulle */
  function ouvreBulle(a) {
    fermeBulle();
    choisi = a.id;
    var n = D.taches({ affaireId: a.id, sansTerminees: true }).length;
    bulle = el("div", { class: "ca-bulle", role: "dialog", "aria-label": a.code + " · " + a.nom }, [
      el("button", { type: "button", class: "ferme", "aria-label": "Fermer", text: "×", onclick: fermeBulle }),
      el("div", { class: "code", style: "color:" + UI.teinte(a.teinte), text: a.code }),
      el("div", { class: "nom", text: a.nom }),
      el("div", { class: "det", text: a.adresse }),
      el("div", { class: "det", text: [a.phase ? "Phase " + D.libellePhase(a.phase) : "", D.STATUTS_AFFAIRE[a.statut],
        n + (n > 1 ? " tâches ouvertes" : " tâche ouverte")].filter(Boolean).join(" · ") }),
      el("div", { class: "liens" }, [
        el("a", { class: "btn btn-or", href: D.lienCarte(a), target: "_blank", rel: "noopener noreferrer", text: "Google Maps" }),
        el("a", { class: "btn", href: "/planif/taches/?affaire=" + encodeURIComponent(a.id) + "&membre=", text: "Tâches" })
      ])
    ]);
    bulle.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
    carte.appendChild(bulle);
    dessinePoints();
  }
  function placeBulle() {
    if (!bulle || !choisi || !positions[choisi]) return;
    var e = ecran(positions[choisi]), l = bulle.offsetWidth, h = bulle.offsetHeight;
    var x = Math.min(Math.max(12, e[0] - l / 2), L - l - 12);
    var y = e[1] - h - 18 < 12 ? e[1] + 18 : e[1] - h - 18;
    bulle.style.left = Math.round(x) + "px"; bulle.style.top = Math.round(Math.min(Math.max(12, y), H - h - 12)) + "px";
  }
  function fermeBulle() {
    if (bulle) bulle.remove();
    bulle = null;
    if (choisi) { choisi = null; dessinePoints(); }
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && bulle) fermeBulle(); });

  /* ------------------------------------------------ zoom et cadrage */
  function zoome(dz, px, py) {
    var z = Math.max(ZMIN, Math.min(ZMAX, vue.z + dz));
    if (z === vue.z) return;
    if (px == null) { px = L / 2; py = H / 2; }
    var k = Math.pow(2, z - vue.z), dx = px - L / 2, dy = py - H / 2;
    vue.cx = (vue.cx + dx) * k - dx; vue.cy = (vue.cy + dy) * k - dy; vue.z = z;
    dessine();
  }

  /** Toutes les affaires placées dans le cadre, au zoom le plus fort qui les tient. */
  function cadre() {
    var pts = affaires.map(function (a) { return positions[a.id]; }).filter(Boolean);
    if (!pts.length) return;
    mesure();
    var la0 = 90, la1 = -90, lo0 = 180, lo1 = -180;
    pts.forEach(function (p) { la0 = Math.min(la0, p.lat); la1 = Math.max(la1, p.lat); lo0 = Math.min(lo0, p.lon); lo1 = Math.max(lo1, p.lon); });
    var z = 15;
    while (z > ZMIN) {
      var a = monde(la1, lo0, z), b = monde(la0, lo1, z);
      if (b[0] - a[0] <= L - 120 && b[1] - a[1] <= H - 120) break;
      z--;
    }
    centreSur((la0 + la1) / 2, (lo0 + lo1) / 2, z);
    dessine();
  }

  /* Choix du fond : les tuiles déjà posées partent, les nouvelles arrivent */
  function dessineFonds() {
    var hote = UI.vide(document.getElementById("fonds"));
    carte.setAttribute("data-fond", fond.cle);
    FONDS.forEach(function (f) {
      var b = el("button", { type: "button", "aria-pressed": f === fond ? "true" : "false", text: f.nom });
      b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      b.addEventListener("click", function () {
        if (f === fond) return;
        fond = f;
        try { localStorage.setItem("planif.carte.fond", f.cle); } catch (e) {}
        UI.vide(tuiles);
        dessineFonds();
        dessine();
      });
      hote.appendChild(b);
    });
  }
  dessineFonds();

  document.getElementById("plus").addEventListener("click", function () { zoome(1); });
  document.getElementById("moins").addEventListener("click", function () { zoome(-1); });
  document.getElementById("cadre").addEventListener("click", cadre);
  ["plus", "moins", "cadre"].forEach(function (id) {
    document.getElementById(id).addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  });

  var roue = 0, derniereRoue = 0;
  carte.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = carte.getBoundingClientRect();
    roue += e.deltaY;
    if (Math.abs(roue) < 60 && Date.now() - derniereRoue < 300) return;
    if (Date.now() - derniereRoue < 180) return;           // un cran à la fois, même sur un pavé tactile
    derniereRoue = Date.now();
    zoome(roue < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
    roue = 0;
  }, { passive: false });
  carte.addEventListener("dblclick", function (e) {
    var r = carte.getBoundingClientRect();
    zoome(e.shiftKey ? -1 : 1, e.clientX - r.left, e.clientY - r.top);
  });

  /* Glisser (souris ou doigt) ; deux doigts : pincement, aperçu à l'échelle puis zoom entier au lâcher. */
  var doigts = {}, glisse = null, pince = null;
  function nbDoigts() { return Object.keys(doigts).length; }
  function ecart() {
    var p = Object.keys(doigts).map(function (k) { return doigts[k]; });
    return { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
  }
  carte.addEventListener("pointerdown", function (e) {
    if (e.button) return;
    fermeBulle();
    doigts[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { carte.setPointerCapture(e.pointerId); } catch (err) {}
    if (nbDoigts() === 1) { glisse = { x: e.clientX, y: e.clientY, cx: vue.cx, cy: vue.cy }; carte.classList.add("glisse"); }
    else if (nbDoigts() === 2) { glisse = null; pince = ecart(); pince.cx = vue.cx; pince.cy = vue.cy; }
  });
  carte.addEventListener("pointermove", function (e) {
    if (!doigts[e.pointerId]) return;
    doigts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (glisse) {
      vue.cx = glisse.cx - (e.clientX - glisse.x); vue.cy = glisse.cy - (e.clientY - glisse.y);
      dessine();
    } else if (pince && nbDoigts() === 2) {
      var m = ecart(), r = carte.getBoundingClientRect(), k = m.d / Math.max(1, pince.d);
      scene.style.transform = "translate(" + (m.x - r.left - (pince.x - r.left) * k) + "px," + (m.y - r.top - (pince.y - r.top) * k) + "px) scale(" + k + ")";
      pince.k = k; pince.m = m;
    }
  });
  function leve(e) {
    if (!doigts[e.pointerId]) return;
    delete doigts[e.pointerId];
    if (pince && nbDoigts() < 2) {
      scene.style.transform = "";
      if (pince.k) {
        var r = carte.getBoundingClientRect();
        // le point sous le milieu des doigts reste en place
        vue.cx = pince.cx + (pince.x - pince.m.x); vue.cy = pince.cy + (pince.y - pince.m.y);
        zoome(Math.round(Math.log(pince.k) / Math.LN2), pince.m.x - r.left, pince.m.y - r.top);
        dessine();
      }
      pince = null;
      glisse = null;
      doigts = {};
    }
    if (!nbDoigts()) { glisse = null; carte.classList.remove("glisse"); }
  }
  carte.addEventListener("pointerup", leve);
  carte.addEventListener("pointercancel", leve);
  window.addEventListener("resize", dessine);

  /* ------------------------------------------------------- les affaires */
  function rend() {
    var tous = document.getElementById("voir-terminees").checked;
    var toutes = D.affaires({ tous: tous });
    affaires = toutes.filter(function (a) { return a.adresse; });
    var sans = toutes.filter(function (a) { return !a.adresse; });

    document.getElementById("titre-carte").textContent =
      affaires.length + (affaires.length > 1 ? " affaires situées" : " affaire située");

    // Ce qui ne paraît pas sur la carte, et pourquoi
    function dit() {
      var hote = UI.vide(document.getElementById("manque"));
      var introuvables = affaires.filter(function (a) { return positions[a.id] === false; });
      [[sans, "Sans adresse"], [introuvables, "Adresse introuvable"]].forEach(function (g) {
        if (!g[0].length) return;
        hote.appendChild(el("div", { style: "margin-bottom:14px" }, [
          el("div", { class: "num-section", text: g[1] + " · " + g[0].length }),
          el("ul", {}, g[0].map(function (a) {
            return el("li", {}, [el("a", {
              class: "lien-doux", href: "/planif/affaires/?q=" + encodeURIComponent(a.code),
              title: "Ouvrir dans la liste des affaires pour compléter l'adresse", text: a.code + " · " + a.nom
            })]);
          }))
        ]));
      });
    }

    dessine();
    dit();
    localiseTout().then(function () {
      dit();
      if (!dejaCadre) { dejaCadre = true; cadre(); } else dessine();
    });
  }

  if (!UI.session()) return;
  D.pret().then(function () {
    UI.chrome("affaires", []);
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    document.getElementById("voir-terminees").addEventListener("change", rend);
    D.surRechargement(function () { positions = {}; rend(); });
    rend();
  }).catch(UI.echec);
})();
</script>
</body>
</html>
