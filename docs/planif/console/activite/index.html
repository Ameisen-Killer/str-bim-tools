<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activité · Planification</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F5F2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%236B5233'/%3E%3Cpath d='M28 82V27h24v55M52 82V46h21v36M20 82h60' fill='none' stroke='%23E9D6B0' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* Version 2 : charte claire unique. La marque du bureau (logo, couleurs) est
   reprise du dernier passage de ce compte, avant le premier rendu ;
   ui.js la confirme ensuite. */
(function(){var r=document.documentElement,m="str";r.setAttribute("data-version","v2");r.setAttribute("data-theme","clair");try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<link rel="stylesheet" href="/planif/assets/marque.css?v=3">
<link rel="stylesheet" href="/planif/assets/planif.css?v=107">
<link rel="stylesheet" href="/planif/assets/habillage.css?v=24">
<style>
  /* Console › Activité (15.10.2026, refaite le même jour dans l'esprit de la
     page /stats/ du site, demande de Tony) : qui ouvre l'outil, quand, combien
     de temps, et sur quelles pages. Journal tenu par la base (activite,
     activite_pages, fonction presence) ; lu par console_activite, réservée au
     super admin. Accent : la marque (--or) ; le vert « en ligne » et les
     teintes --t1…--t8 sont des couleurs d'état et de série, pas de marque. */
  :root{--ac-vert:#1F9D55;--ac-vert-rvb:31,157,85;--ac-gris:#F2F3EF;--ac-courbe:cubic-bezier(.55,.05,.25,1);--ac-sortie:cubic-bezier(.2,.75,.25,1)}
  .wrap.large{max-width:1500px}
  .ac-zone.sans-anim *,.ac-zone.sans-anim *::before,.ac-zone.sans-anim *::after{transition:none!important;animation:none!important}

  /* Apparition au défilement : chaque carte se pose, son contenu se trace */
  .ac-rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease var(--d,0s),transform .9s var(--ac-sortie) var(--d,0s)}
  .ac-rv.vu{opacity:1;transform:none}

  /* ------------------------------------------------------------ ouverture */
  .ac-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:end}
  .ac-hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:62%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(var(--or-rvb),.13),rgba(var(--or-rvb),0) 68%);pointer-events:none}
  .ac-trame{position:absolute;right:0;bottom:0;width:58%;height:100%;pointer-events:none;opacity:.55}
  .ac-trame path{fill:none;stroke:rgba(var(--or-rvb),.22);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s var(--ac-courbe) var(--d,.2s)}
  .vu .ac-trame path{stroke-dashoffset:0}
  .ac-hero > :not(.ac-trame){position:relative}
  .ac-retour{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--texte-faible);text-decoration:none;transition:color .2s}
  .ac-retour:hover{color:var(--or)}
  :root[data-version] h1.ac-titre{margin:10px 0 0;font-weight:300;font-size:clamp(46px,7vw,92px);line-height:.95;letter-spacing:-.02em}
  :root[data-version] .ac-zone .v,:root[data-version] .ac-zone .ac-chiffres b,:root[data-version] .ac-zone .ac-centre b{letter-spacing:-.02em}
  .ac-titre span{color:var(--or)}
  .ac-chapeau{margin:14px 0 0;max-width:36em;color:var(--texte-doux);font-size:15.5px}
  .ac-filtres{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:24px}
  .ac-periodes{display:inline-flex;background:var(--ac-gris);border-radius:999px;padding:4px;gap:2px;position:relative}
  .ac-periodes button{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:8px 16px;font:inherit;font-size:13.5px;
    color:var(--texte-doux);cursor:pointer;white-space:nowrap;transition:color .3s}
  .ac-periodes button:hover{color:var(--texte)}
  .ac-periodes button[aria-pressed="true"]{color:var(--or);font-weight:650}
  .ac-curseur{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:999px;background:#fff;
    box-shadow:0 1px 2px rgba(30,34,38,.08),0 4px 12px rgba(30,34,38,.08);transition:left .45s var(--ac-sortie),width .45s var(--ac-sortie)}
  .ac-select{height:38px;border:1px solid var(--ligne);border-radius:999px;background:#fff;padding:0 14px;font:inherit;font-size:13.5px;color:var(--texte);cursor:pointer;max-width:260px}
  .ac-select:focus{outline:none;border-color:var(--or)}
  .ac-choix{display:inline-flex;align-items:center;gap:8px;padding:3px 4px 3px 3px;border-radius:999px;background:var(--m-pale);font-size:13.5px;font-weight:650;animation:ac-pose .4s var(--ac-sortie) both}
  .ac-choix .ab-avatar{width:28px;height:28px;font-size:11px}
  .ac-choix button{border:0;background:rgba(var(--encre),.08);border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1;color:var(--texte-doux);transition:background .2s}
  .ac-choix button:hover{background:rgba(var(--encre),.16)}

  /* En ce moment */
  .ac-direct{justify-self:end;width:min(100%,420px);border-radius:14px;padding:18px 20px;background:linear-gradient(140deg,rgba(var(--ac-vert-rvb),.10),rgba(var(--ac-vert-rvb),.02) 70%);
    border:1px solid rgba(var(--ac-vert-rvb),.16)}
  .ac-direct.calme{background:var(--ac-gris);border-color:transparent}
  .ac-direct-tete{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--texte-doux)}
  .ac-pouls{position:relative;width:10px;height:10px;border-radius:50%;background:var(--ac-vert);flex:0 0 auto}
  .ac-pouls::before,.ac-pouls::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(var(--ac-vert-rvb),.55);animation:ac-onde 2.4s ease-out infinite}
  .ac-pouls::after{animation-delay:1.2s}
  .ac-direct.calme .ac-pouls{background:#A9ADB0}
  .ac-direct.calme .ac-pouls::before,.ac-direct.calme .ac-pouls::after{display:none}
  .ac-direct-n{margin-top:10px;font-weight:300;font-size:clamp(34px,4vw,48px);line-height:1;font-variant-numeric:tabular-nums}
  .ac-direct-n small{font-size:15px;font-weight:450;color:var(--texte-doux);margin-left:8px}
  .ac-pile{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin-top:14px;padding-left:8px}
  .ac-pile .ac-av{margin-left:-8px;animation:ac-pose .5s var(--ac-sortie) both;animation-delay:var(--d,0s)}
  .ac-pile .ab-avatar{width:34px;height:34px;font-size:12px;box-shadow:0 0 0 2.5px #fff}
  .ac-noms{margin-top:8px;font-size:13px;color:var(--texte-doux)}
  .ac-maj{font-size:12.5px;color:var(--texte-faible);white-space:nowrap}

  /* --------------------------------------------------------- chiffres clés */
  .ac-cles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
  .ac-cle{position:relative;overflow:hidden;background:#fff;border-radius:12px;box-shadow:var(--ab-ombre);padding:18px 20px 0;display:flex;flex-direction:column;min-height:168px}
  .ac-cle .l{font-size:13.5px;color:var(--texte-doux);font-weight:600}
  .ac-cle .v{margin-top:8px;font-weight:300;font-size:clamp(34px,3.6vw,50px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ac-cle .v small{font-size:.42em;font-weight:450;color:var(--texte-doux);margin-left:.2em;letter-spacing:0}
  .ac-cle .s{margin-top:6px;font-size:12.5px;color:var(--texte-faible)}
  .ac-cle.vedette{background:linear-gradient(150deg,var(--m-pale),#fff 75%)}
  .ac-cle.vedette .v{color:var(--or)}
  .ac-cle svg{display:block;margin:auto -20px 0;width:calc(100% + 40px);height:52px}
  .ac-spark-l{fill:none;stroke:rgba(var(--or-rvb),.85);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .ac-spark-a{fill:url(#ac-degrade-doux)}
  .ac-devoile{clip-path:inset(0 100% 0 0);transition:clip-path 1.8s var(--ac-courbe) var(--d,.3s)}
  .vu .ac-devoile,.ac-devoile.vu{clip-path:inset(0 0 0 0)}
  @media (max-width:980px){ .ac-cles{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---------------------------------------------------- courbe du temps */
  .ac-tete{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:6px}
  .ac-tete h2{margin:6px 0 0;font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.01em}
  .ac-tete h2 em{font-style:normal;color:var(--or)}
  .ac-courbe{position:relative;height:clamp(220px,30vh,300px);margin-top:18px}
  .ac-courbe svg.trace{position:absolute;left:0;right:0;top:12px;bottom:26px;width:100%;height:calc(100% - 38px);overflow:visible}
  .ac-ligne{fill:none;stroke:var(--or);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .ac-ligne.b{stroke:rgba(var(--encre),.38);stroke-width:1.4;stroke-dasharray:4 5}
  .ac-aire{fill:url(#ac-degrade)}
  .ac-grille{position:absolute;left:0;right:0;top:12px;bottom:26px;pointer-events:none}
  .ac-grille span{position:absolute;left:0;right:0;border-top:1px dashed var(--ligne-faible)}
  .ac-grille span:last-child{border-top:1px solid var(--ligne)}
  .ac-grille b{position:absolute;right:0;bottom:3px;font-size:11.5px;font-weight:450;color:var(--texte-faible)}
  .ac-axe{position:absolute;left:0;right:0;bottom:0;height:18px}
  .ac-axe span{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--texte-faible);white-space:nowrap}
  .ac-axe span.auj{color:var(--or);font-weight:650}
  .ac-survol{position:absolute;left:0;right:0;top:12px;bottom:26px;display:flex}
  .ac-survol > div{flex:1 1 0;position:relative}
  .ac-survol > div::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(var(--or-rvb),.35);opacity:0;transition:opacity .15s}
  .ac-survol > div:hover::before{opacity:1}
  .ac-point{position:absolute;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;border:2.5px solid var(--or);opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s var(--ac-sortie)}
  .ac-survol > div:hover .ac-point{opacity:1;transform:none}
  .ac-bulle{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,4px);z-index:3;background:var(--texte);color:#fff;border-radius:8px;padding:8px 11px;
    font-size:12px;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s}
  .ac-bulle b{display:block;font-size:14px;font-weight:650}
  .ac-survol > div:hover .ac-bulle{opacity:1;transform:translate(-50%,0)}
  .ac-survol > div.g .ac-bulle{left:0;transform:translate(0,4px)}
  .ac-survol > div.d .ac-bulle{left:auto;right:0;transform:translate(0,4px)}
  .ac-survol > div.g:hover .ac-bulle,.ac-survol > div.d:hover .ac-bulle{transform:none}
  .ac-legende{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:12.5px;color:var(--texte-doux)}
  .ac-legende span::before{content:"";display:inline-block;width:20px;margin-right:8px;vertical-align:middle;border-top:2.2px solid var(--or)}
  .ac-legende span.b::before{border-top:1.4px dashed rgba(var(--encre),.45)}

  /* ------------------------------------------ pages de l'outil + rythme */
  .ac-duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
  .ac-duo > .section{margin-bottom:0}
  .ac-pages{display:grid;grid-template-columns:180px minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:center;margin-top:16px}
  .ac-anneau{position:relative;width:180px;height:180px}
  .ac-anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ac-anneau circle{fill:none;stroke-width:14}
  .ac-anneau .fond{stroke:var(--ac-gris)}
  .ac-anneau .arc{stroke:var(--c);stroke-dasharray:0 100;stroke-dashoffset:var(--o);transition:stroke-dasharray 1.4s var(--ac-courbe) var(--d,.2s);cursor:pointer}
  .vu .ac-anneau .arc{stroke-dasharray:var(--p) 100}
  .ac-anneau .arc:hover{stroke-width:17}
  .ac-centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .ac-centre b{font-weight:300;font-size:30px;line-height:1;letter-spacing:-.02em}
  .ac-centre span{font-size:12px;color:var(--texte-faible);margin-top:4px}
  .ac-classement{display:grid;gap:12px;min-width:0}
  .ac-cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
  .ac-cl .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac-cl .n i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:9px;vertical-align:0}
  .ac-cl .x{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ac-cl .x small{color:var(--texte-faible);margin-left:6px}
  .ac-jauge{grid-column:1 / -1;height:6px;border-radius:99px;background:var(--ac-gris);overflow:hidden}
  .ac-jauge i{display:block;height:100%;width:var(--l);border-radius:inherit;background:var(--c,var(--or));transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ac-courbe) var(--d,.3s)}
  .vu .ac-jauge i{transform:none}
  .ac-vide{padding:30px 0 10px;text-align:center;color:var(--texte-faible);font-size:14.5px}
  .ac-vide b{display:block;font-size:16.5px;color:var(--texte);margin-bottom:6px;font-weight:600}

  .ac-rythme{display:grid;grid-template-columns:24px repeat(var(--n),minmax(0,1fr));gap:3px;margin-top:16px}
  .ac-rythme .j{font-size:12px;color:var(--texte-faible);align-self:center}
  .ac-rythme .h{font-size:10.5px;color:var(--texte-faible);white-space:nowrap;height:16px}
  .ac-rythme .c{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--ac-gris)}
  .ac-rythme .c i{width:78%;height:78%;border-radius:50%;background:rgba(var(--or-rvb),var(--a));transform:scale(0);transition:transform .9s var(--ac-sortie) var(--d,0s)}
  .vu .ac-rythme .c i{transform:scale(var(--s))}
  .ac-rythme .c:hover i{background:var(--or)}
  .ac-pic{margin:6px 0 0;font-size:13.5px;color:var(--texte-doux)}
  .ac-pic b{color:var(--or)}

  /* -------------------------------------------------------------- équipe */
  .ac-equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
  .ac-carte{position:relative;display:grid;gap:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:#fff;border:1px solid var(--ligne-faible);border-radius:14px;padding:16px;transition:border-color .25s,box-shadow .25s,transform .25s}
  .ac-carte:hover{border-color:rgba(var(--or-rvb),.35);box-shadow:var(--ab-ombre-haute);transform:translateY(-2px)}
  .ac-carte[aria-pressed="true"]{border-color:var(--or);background:linear-gradient(160deg,var(--m-pale),#fff 70%)}
  .ac-carte:focus-visible{outline:2px solid var(--or);outline-offset:2px}
  .ac-carte-tete{display:flex;align-items:center;gap:12px;min-width:0}
  .ac-anneau-av{position:relative;width:54px;height:54px;flex:0 0 auto}
  .ac-anneau-av svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ac-anneau-av circle{fill:none;stroke-width:3.2}
  .ac-anneau-av .fond{stroke:var(--ac-gris)}
  .ac-anneau-av .arc{stroke:var(--or);stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.4s var(--ac-courbe) var(--d,.3s)}
  .vu .ac-anneau-av .arc{stroke-dasharray:var(--p) 100}
  .ac-anneau-av .ac-av{position:absolute;inset:6px}
  .ac-anneau-av .ab-avatar{width:42px;height:42px;font-size:14px}
  .ac-qui{min-width:0}
  .ac-nom{display:block;font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac-sous{display:block;font-size:12.5px;color:var(--texte-faible);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac-sous.vif{color:var(--ac-vert);font-weight:600}
  .ac-chiffres{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .ac-chiffres b{font-weight:300;font-size:30px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ac-chiffres span{font-size:12.5px;color:var(--texte-faible);text-align:right}
  .ac-barres{display:flex;align-items:flex-end;gap:2px;height:34px}
  .ac-barres i{flex:1 1 0;min-width:1px;height:var(--h);min-height:2px;border-radius:2px;background:rgba(var(--or-rvb),.45);transform:scaleY(0);transform-origin:bottom;transition:transform .9s var(--ac-sortie) var(--d,.3s)}
  .ac-barres i.zero{background:var(--ac-gris)}
  .vu .ac-barres i{transform:none}
  .ac-pied-carte{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--texte-doux)}
  .ac-pied-carte em{font-style:normal;font-weight:600;color:var(--texte)}
  .ac-app{display:inline-flex;gap:6px;color:var(--texte-faible)}
  .ac-app svg{width:16px;height:16px}
  .ac-av{position:relative;display:inline-flex;flex:0 0 auto}
  .ac-av.vif::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ac-vert);border:2px solid #fff;animation:ac-halo 2s ease-out infinite}
  .ac-absents{margin-top:16px}
  .ac-absents summary{cursor:pointer;font-size:13.5px;color:var(--texte-doux);padding:8px 12px;border-radius:8px;list-style:none;display:inline-block}
  .ac-absents summary::-webkit-details-marker{display:none}
  .ac-absents summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .2s}
  .ac-absents[open] summary::before{transform:rotate(90deg)}
  .ac-absents summary:hover{background:#F6F7F4}
  .ac-absents ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
  .ac-absents li{display:flex;align-items:center;gap:10px;padding:6px 12px;opacity:.75}
  .ac-absents .ab-avatar{width:30px;height:30px;font-size:11px}

  /* -------------------------------------------------------------- journal */
  .ac-jour{margin-top:24px}
  .ac-jour:first-of-type{margin-top:6px}
  .ac-jour-tete{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ligne)}
  .ac-jour-tete h3{margin:0;font-size:15px;font-weight:650}
  .ac-jour-tete span{font-size:12.5px;color:var(--texte-faible);white-space:nowrap}
  .ac-s,.ac-axe-j{display:grid;grid-template-columns:minmax(150px,1.4fr) 118px minmax(0,3.2fr) 118px;gap:16px;align-items:center}
  .ac-s{padding:9px 0;border-bottom:1px solid var(--ligne-faible);opacity:0;transform:translateX(-8px);transition:opacity .6s ease var(--d,0s),transform .6s var(--ac-sortie) var(--d,0s)}
  .vu .ac-s{opacity:1;transform:none}
  .ac-s .ac-qui{display:flex;align-items:center;gap:10px}
  .ac-s .ab-avatar{width:30px;height:30px;font-size:11.5px}
  .ac-s .ac-nom{font-size:14px}
  .ac-heures{font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
  .ac-heures .fl{color:var(--texte-faible);margin:0 3px}

  function prepare(r) {

      seances: (r.seances || []).map(function (s) {
        return { email: s.email, bureauId: s.bureauId, appareil: s.appareil || "ordinateur",
                 debut: Date.parse(s.debut), fin: Date.parse(s.fin), actif: +s.actif || 0 };

      pages: (r.pages || []).map(function (x) {

  function maintenant() { return Date.now() - ecart; }
  function qui(email) {

  }
  function nomPage(p) {

  }

  function debutPeriode() {

  }
  /* Les cases de la période : les heures d'aujourd'hui, sinon les jours. */
  function cases() {
    var l = [], d = new Date(debutPeriode()), i;

  /* Le temps actif d'une séance réparti au prorata d'un intervalle. */

    var x = Math.max(s.debut, a), y = Math.min(s.fin, b);

  }

      return s.fin >= t0 && (!reglage.bureau || s.bureauId === reglage.bureau) && (!avecPersonne || !personne || s.email === personne);
    });
  }
  function pagesVues(avecPersonne) {
    var j0 = C.iso(new Date(debutPeriode()));
    return donnees.pages.filter(function (x) {
      return x.jour >= j0 && (!reglage.bureau || x.bureauId === reglage.bureau) && (!avecPersonne || !personne || x.email === personne);
    });
  }

  /* ----------------------------------------------------------- formats */

  function deux(n) { return (n < 10 ? "0" : "") + n; }
  function heure(t) { var d = new Date(t); return deux(d.getHours()) + ":" + deux(d.getMinutes()); }
  function duree(s) {
    s = Math.round(s || 0);
    if (s <= 0) return "0 min";
    if (s < 60) return "< 1 min";
    var m = Math.round(s / 60);
    if (m < 60) return m + " min";
    var h = Math.floor(m / 60), r = m % 60;

  /** Pour un grand chiffre : [valeur, unité, reste] */

  function jourIso(t) { return C.iso(new Date(t)); }
  function majuscule(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  var FMT_JOUR = new Intl.DateTimeFormat("fr-CH", { weekday: "long", day: "numeric", month: "long" });

  /* Courbe lisse qui ne dépasse jamais ses points (monotone, Fritsch-Carlson) */
  function cheminLisse(p) {

    if (!n) return "";
    if (n === 1) return "M" + p[0][0] + " " + p[0][1];
    var dx = [], pente = [], m = [];
    for (i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; pente[i] = (p[i + 1][1] - p[i][1]) / dx[i]; }
    m[0] = pente[0]; m[n - 1] = pente[n - 2];
    for (i = 1; i < n - 1; i++) m[i] = pente[i - 1] * pente[i] <= 0 ? 0 : (pente[i - 1] + pente[i]) / 2;
    for (i = 0; i < n - 1; i++) {

  function demarreCompteurs(racine) {
    [].forEach.call(racine.querySelectorAll(".v"), function (n) {

      el("p", { style: "margin-top:12px;color:var(--texte-doux);font-size:15px;max-width:52em", text: texte }),

  function dessine(silencieux) {

        ])

            donnees.nbBureaux > 1 && !reglage.bureau ? el("span", { class: "ac-sous", text: nomBureau(s.bureauId) }) : null

          el("span", { class: "ac-heures" }, [heure(s.debut), el("span", { class: "fl", text: "→" }), live ? el("span", { class: "live", text: "en cours" }) : heure(s.fin)]),
