<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Console · Planification · STR Bim Tools</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<script>
/* Thème posé avant le premier rendu : préférence de l'utilisateur connecté, sinon la dernière utilisée */
(function(){var r=document.documentElement;try{var s=JSON.parse(localStorage.getItem("planif.session")||"null"),c=localStorage.getItem("planif.theme:"+(s&&s.email||""))||localStorage.getItem("planif.theme")||"sombre";if(c==="systeme")c=matchMedia("(prefers-color-scheme: light)").matches?"clair":"sombre";r.setAttribute("data-theme",c);var f={clair:"#F3F0E8",ab:"#F5F5F4"}[c];if(f)document.querySelector("meta[name=theme-color]").setAttribute("content",f);}catch(e){r.setAttribute("data-theme","sombre");}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M9 27V9h8v18M17 27V15h7v12' fill='none' stroke='%23D6A85C' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preload" href="/assets/polices/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/polices/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=2">
<link rel="stylesheet" href="/planif/assets/planif.css?v=51">
<style>
  /* La console travaille sur des tableaux larges : elle prend toute la fenêtre
     au lieu des 1360 px du reste du site, et s'aligne ainsi sur la barre du
     haut et le pied, qui vont déjà d'un bord à l'autre. Le chapeau garde ses
     52 em : une ligne de texte longue de deux mètres ne se lit pas. */
  .wrap.large{max-width:none}

  /* Menu des sections, à gauche : une seule section à la fois, le menu reste
     en vue pendant qu'on fait défiler la section ouverte. */
  .console-grille{display:grid;grid-template-columns:210px minmax(0,1fr);gap:clamp(24px,3vw,48px);align-items:start}
  .console-menu{position:sticky;top:76px;display:grid;gap:1px}
  .console-menu button{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;
    background:none;border:0;border-left:1px solid var(--ligne);border-radius:0;
    padding:12px 0 12px 14px;text-align:left;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--texte-faible);transition:color .25s,border-color .25s,padding-left .25s;
  }
  .console-menu button:hover{color:var(--texte);border-left-color:var(--or-doux)}
  .console-menu button[aria-current="true"]{color:var(--or);border-left-color:var(--or);padding-left:18px}
  .console-menu .compte{font-size:11px;letter-spacing:.06em;color:var(--texte-faible)}
  .console-menu button[aria-current="true"] .compte{color:var(--or-doux)}
  /* La section ouverte ne porte plus de filet : le menu sépare déjà */
  .console-vue > .section{border-top:0;padding-top:0}
  .console-vue > .section[hidden]{display:none}
  @media (max-width:860px){
    .console-grille{grid-template-columns:minmax(0,1fr);gap:18px}
    .console-menu{
      position:static;grid-auto-flow:column;grid-auto-columns:max-content;gap:0;
      overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ligne);
    }
    .console-menu::-webkit-scrollbar{display:none}
    .console-menu button{
      border-left:0;border-bottom:1px solid transparent;margin-bottom:-1px;
      padding:12px 16px;min-height:44px;white-space:nowrap;
    }
    .console-menu button:hover{border-left:0;border-bottom-color:var(--or-doux)}
    .console-menu button[aria-current="true"]{border-left:0;border-bottom-color:var(--or);padding-left:16px}
    .console-menu .compte{display:none}
  }

  /* Liste des utilisateurs : une ligne par personne, réglée sur place. Les
     menus déroulants remplacent l'ouverture de la fiche pour les quatre
     champs qu'on change le plus souvent. */
  #utilisateurs table.liste td{padding-top:7px;padding-bottom:7px;vertical-align:middle}
  #utilisateurs table.liste .principal{font-size:15px}
  /* Assez large pour lire l'intitulé : un menu rogné à « Structur… » ne dit
     plus rien. Le tableau défile plutôt que de comprimer ses colonnes. */
  .sel-ligne{
    width:100%;min-width:136px;max-width:210px;
    font-family:var(--sans);font-weight:300;font-size:13.5px;color:var(--texte);
    background:rgba(var(--encre),.03);border:1px solid var(--ligne);border-radius:0;
    padding:5px 8px;height:32px;cursor:pointer;
    text-transform:none;letter-spacing:.02em;transition:border-color .25s,color .25s;
  }
  .sel-ligne.court{min-width:108px;max-width:140px}
  #utilisateurs table.liste th{white-space:nowrap}
  #utilisateurs table.liste td.num{white-space:nowrap}
  .sel-ligne:hover{border-color:var(--or-doux)}
  .sel-ligne:focus{outline:none;border-color:var(--or)}
  .sel-ligne:disabled{opacity:.4;cursor:default}
  .sel-ligne.vide{color:var(--texte-faible)}
  .sel-ligne.suspendu{color:var(--alerte);border-color:rgba(var(--alerte-rvb),.45)}
  .mail-ligne{font-family:var(--mono);font-size:12.5px;color:var(--texte-doux);word-break:break-all}
  .quand-ligne{font-family:var(--mono);font-size:12px;color:var(--texte-faible);white-space:nowrap}
  @media (max-width:640px){
    .sel-ligne{max-width:none;height:40px;font-size:16px}
  }

  /* Propre à la console : lignes suspendues, listes éditables du formulaire de bureau */
  table.liste tr.suspendu td{opacity:.55}
  table.liste tr.suspendu td.actions{opacity:1}
  .principal .etiq{margin-left:10px;vertical-align:2px}
  .lien-nombre{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ligne);text-underline-offset:4px;transition:color .25s}
  .lien-nombre:hover{color:var(--or);text-decoration-color:currentColor}
  .acces-etat{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--texte-doux)}
  .acces-etat.alerte{color:var(--alerte)}
  .acces-etat.attente{color:var(--texte-faible)}

  .liste-edit{display:grid;gap:8px}
  .ligne-edit{display:flex;align-items:center;gap:10px}
  .ligne-edit input[type=text],table.matrice input[type=text]{
    flex:1 1 auto;min-width:0;width:100%;
    font-family:var(--sans);font-weight:300;font-size:15px;color:var(--texte);
    background:rgba(var(--encre),.03);border:1px solid var(--ligne);border-radius:0;padding:7px 10px;height:36px;
    transition:border-color .25s,background .25s;
  }
  .ligne-edit input[type=text]:focus,table.matrice input[type=text]:focus{outline:none;border-color:var(--or-doux);background:rgba(var(--encre),.05)}
  .ligne-edit .meta,table.matrice .meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--texte-faible);white-space:nowrap}
  .ajout-ligne{margin-top:10px}
  .matrice-defile{overflow-x:auto;scrollbar-width:thin}
  table.matrice{border-collapse:collapse;width:100%}
  table.matrice th{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--texte-faible);
    font-weight:400;text-align:center;padding:0 8px 8px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
  }
  table.matrice th:first-child{text-align:left;padding-left:0}
  table.matrice td{padding:4px 8px;border-top:1px solid var(--ligne-faible);text-align:center;vertical-align:middle}
  table.matrice td:first-child{padding-left:0;text-align:left;width:100%;min-width:180px}
  table.matrice td:last-child{padding-right:0}
  table.matrice input[type=checkbox]{accent-color:var(--or);width:18px;height:18px;margin:0;cursor:pointer}
  .compacte fieldset > p.aide{margin-top:8px;font-size:12.5px;color:var(--texte-faible);line-height:1.45}
  .compacte fieldset > p.aide + *{margin-top:12px}
  .perte{margin-top:18px;border-left:2px solid var(--alerte);padding:8px 0 8px 12px;font-size:13.5px;color:var(--texte-doux)}
  .al.fait{border-left-color:rgba(159,184,163,.9)}
  .al a{color:var(--or);text-underline-offset:3px}
  .al code{font-family:var(--mono);font-size:12.5px;color:var(--texte)}
  @media (max-width:640px){
    .ligne-edit input[type=text],table.matrice input[type=text]{font-size:16px;height:44px}
    .ligne-edit .meta{display:none}
  }
</style>
</head>
<body>

<div data-chrome></div>

<main>
  <div class="wrap large entete">
    <h1>Console</h1>
    <p class="chapeau">Les bureaux d'études et les personnes qui y travaillent : leur fiche au planning et, pour celles qui s'y connectent, leur accès. Chacune ne voit que les données de son bureau ; toi, tu passes de l'un à l'autre par le menu du bureau, en haut de page.</p>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap large" id="console"></div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=4"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=15"></script>
<script src="/planif/assets/donnees.js?v=23"></script>
<script src="/planif/assets/ui.js?v=34"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, SB = window.Sb, el = UI.el;

  var etat = null;            // réponse de console_etat : { moi, bureaux, membres, utilisateurs }
  var auth = null;            // réglages publics de Supabase Auth (inscriptions, confirmation)
  var barre = null;           // recherche des utilisateurs
  var filtreBureau = "";
  var bureauDroits = "";          // bureau dont on règle les droits (section Droits)
  var hotes = {};             // conteneurs, remplis à chaque rafraîchissement
  var suivi = UI.suiviApparitions();
  var RE_MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var zone = document.getElementById("console");

  if (!UI.session()) return;

  if (!UI.avecBase) {
    UI.pied();
    document.querySelector(".entete").classList.add("vu");
    return message("Sans base", "La console gère les bureaux de la base en ligne. Sans base configurée, l'outil fonctionne en mode local et n'a rien à gérer ici.");
  }

  D.chargeProfil().then(function (p) {
    var admin = p.multi && p.superAdmin;
    UI.chrome("console", admin ? actionsBarre() : []);
    UI.pied();
    document.querySelector(".entete").classList.add("vu");
    if (!p.multi) {
      return message("Migration à exécuter",
        "La base n'est pas encore passée en multi-bureaux. Exécute migration-multi-bureaux.sql dans Supabase " +
        "(SQL Editor > New query), après y avoir mis ton adresse, puis recharge cette page.");
    }
    if (!p.superAdmin) return message("Accès réservé", "La console est réservée au super admin de l'outil.");
    construit();
    return Promise.all([
      recharge(),
      SB.reglagesAuth().then(function (r) { auth = r; })
    ]).then(rafraichit);
  }).catch(UI.echec);

  function actionsBarre() {
    return [
      { label: "Nouveau bureau", icone: "ico-ajout-bureau", action: function () { formulaireBureau(null); } },
      { label: "Nouvel utilisateur", or: true, icone: "ico-ajout-membre", action: function () { formulaireUtilisateur(null); } }
    ];
  }

  function message(titre, texte) {
    UI.vide(zone).appendChild(el("section", { class: "section" }, [
      el("div", { class: "carte" }, [
        el("div", { class: "num-section", text: titre }),
        el("p", { style: "margin-top:12px;color:var(--texte-doux);font-size:15px;max-width:52em", text: texte }),
        el("a", { class: "btn", href: "/planif/", style: "margin-top:20px" }, ["Retour au planning"])
      ])
    ]));
  }

  /* ------------------------------------------------------------- données */

  function recharge() {
    return SB.rpc("console_etat").then(function (e) { etat = e; });
  }

  /* Après une écriture : l'état de la console, et le profil, dont la barre tire
     la liste des bureaux et le nom du bureau affiché. */
  function apresChangement() {
    return Promise.all([recharge(), D.chargeProfil(true)]).then(function () {
      UI.chrome("console", actionsBarre());
      rafraichit();
    });
  }

  function bureau(id) { return etat.bureaux.filter(function (b) { return b.id === id; })[0] || null; }
  function nomBureau(id) { var b = bureau(id); return b ? b.nom : "—"; }
  function utilisateursDe(id) { return etat.utilisateurs.filter(function (u) { return u.bureauId === id; }); }
  function affiche(b) { var p = D.profil(); return !!(p && p.bureau && p.bureau.id === b.id); }
  function nb(n, sing, plur) { return n + " " + (n > 1 ? plur : sing); }

  function nomCanton(code) {
    var c = C.CANTONS.filter(function (x) { return x.code === code; })[0];
    return c ? "Fériés : " + c.nom : "";
  }

  /** « 19.09.2026 · 17:43 », à l'heure locale */
  function quand(horodatage) {
    var d = new Date(horodatage);
    if (isNaN(d.getTime())) return "—";
    var deux = function (n) { return (n < 10 ? "0" : "") + n; };
    return C.fmtCH(C.iso(d)) + " · " + deux(d.getHours()) + ":" + deux(d.getMinutes());
  }

  /* ------------------------------------------------------------- squelette */

  function construit() {
    UI.vide(zone);
    // Lu tout de suite : plus bas, la barre de recherche réécrit l'adresse.
    var sectionDepart = cleDuHash();
    hotes.menu = el("nav", { class: "console-menu", "aria-label": "Sections de la console" });
    hotes.vue = el("div", { class: "console-vue" });
    zone.appendChild(el("div", { class: "console-grille" }, [hotes.menu, hotes.vue]));

    hotes.titreBureaux = el("h2");
    hotes.bureaux = el("div", { class: "defile" });
    hotes.vue.appendChild(el("section", { class: "section", id: "bureaux" }, [
      el("div", { class: "tete-section" }, [
        el("div", {}, [el("div", { class: "num-section", text: "01 — Bureaux" }), hotes.titreBureaux]),
        el("div", { class: "outils" }, [
          el("button", { class: "btn btn-or", type: "button", onclick: function () { formulaireBureau(null); } }, [
            el("span", { class: "ico-txt ico-ajout-bureau", "aria-hidden": "true" }), "Nouveau bureau"
          ])
        ])
      ]),
      hotes.bureaux
    ]));

    hotes.titreUtilisateurs = el("h2");
    hotes.recherche = el("div");
    hotes.filtre = el("select", {
      class: "btn", style: "text-transform:none;letter-spacing:.04em;max-width:320px", "aria-label": "Filtrer par bureau"
    });
    hotes.filtre.addEventListener("change", function () { filtreBureau = hotes.filtre.value; dessineUtilisateurs(); });
    hotes.utilisateurs = el("div", { class: "defile" });
    hotes.vue.appendChild(el("section", { class: "section", id: "utilisateurs" }, [
      el("div", { class: "tete-section" }, [
        el("div", {}, [el("div", { class: "num-section", text: "02 — Utilisateurs" }), hotes.titreUtilisateurs]),
        el("div", { class: "outils" }, [
          el("button", { id: "btn-nouvelle", class: "btn btn-or", type: "button", onclick: function () { formulaireUtilisateur(null); } }, [
            el("span", { class: "ico-txt ico-ajout-membre", "aria-hidden": "true" }), "Nouvel utilisateur"
          ])
        ])
      ]),
      hotes.recherche,
      el("div", { class: "plan-barre", style: "margin-top:-8px" }, [hotes.filtre]),
      hotes.utilisateurs
    ]));
    barre = UI.recherche({
      hote: hotes.recherche,
      exemple: "Rechercher un nom, une adresse, un bureau…",
      surSaisie: dessineUtilisateurs,
      surEntree: function () { var l = selection(); if (l.length === 1) formulaireUtilisateur(l[0]); }
    });

    hotes.titreDroits = el("h2");
    hotes.filtreDroits = el("select", {
      class: "btn", style: "text-transform:none;letter-spacing:.04em;max-width:320px", "aria-label": "Bureau dont on règle les droits"
    });
    hotes.filtreDroits.addEventListener("change", function () { bureauDroits = hotes.filtreDroits.value; dessineDroits(); });
    hotes.droits = el("div", { class: "defile" });
    hotes.vue.appendChild(el("section", { class: "section", id: "droits" }, [
      el("div", { class: "tete-section" }, [
        el("div", {}, [el("div", { class: "num-section", text: "03 — Droits" }), hotes.titreDroits])
      ]),
      el("div", { class: "plan-barre", style: "margin-top:4px" }, [hotes.filtreDroits]),
      hotes.droits
    ]));

    hotes.miseEnRoute = el("div");
    hotes.vue.appendChild(el("section", { class: "section", id: "mise-en-route" }, [
      el("div", { class: "tete-section" }, [
        el("div", {}, [el("div", { class: "num-section", text: "04 — Mise en route" }), el("h2", { text: "Réglages Supabase" })])
      ]),
      hotes.miseEnRoute
    ]));

    construitMenu();
    montre(sectionDepart);
    window.addEventListener("hashchange", function () { montre(cleDuHash(), true); });
  }

  /* ------------------------------------------------------------------ menu
     Une section à la fois : la console est un outil de réglage, on y vient
     pour une chose précise. L'adresse garde la section ouverte (#utilisateurs),
     ce qui permet d'y renvoyer depuis le planning. */

  var SECTIONS = [
    { cle: "bureaux", label: "Bureaux" },
    { cle: "utilisateurs", label: "Utilisateurs" },
    { cle: "droits", label: "Droits" },
    { cle: "mise-en-route", label: "Mise en route" }
  ];

  function cleDuHash() {
    var h = String(location.hash || "").replace(/^#/, "");
    return SECTIONS.some(function (s) { return s.cle === h; }) ? h : SECTIONS[0].cle;
  }

  function construitMenu() {
    UI.vide(hotes.menu);
    SECTIONS.forEach(function (s) {
      var compte = el("span", { class: "compte" });
      var b = el("button", { type: "button", "data-cle": s.cle, onclick: function () { montre(s.cle); } },
        [el("span", { text: s.label }), compte]);
      hotes.menu.appendChild(b);
      s.hoteCompte = compte;
    });
  }

  /** Affiche une section. depuisAdresse : l'adresse a déjà la bonne valeur. */
  function montre(cle, depuisAdresse) {
    SECTIONS.forEach(function (s) {
      var section = document.getElementById(s.cle);
      if (section) section.hidden = s.cle !== cle;
      var b = hotes.menu.querySelector('[data-cle="' + s.cle + '"]');
      if (b) b.setAttribute("aria-current", String(s.cle === cle));
    });
    if (!depuisAdresse && location.hash !== "#" + cle) {
      history.replaceState(null, "", "#" + cle);
    }
  }

  function majComptes() {
    if (!etat) return;
    var valeurs = {
      bureaux: etat.bureaux.length,
      utilisateurs: migrationFaite() ? personnes().length : "!",
      droits: "",
      "mise-en-route": ""
    };
    SECTIONS.forEach(function (s) {
      if (s.hoteCompte) s.hoteCompte.textContent = valeurs[s.cle] === "" ? "" : String(valeurs[s.cle]);
    });
  }

  function rafraichit() {
    if (!etat) return;
    dessineBureaux();
    remplitFiltre();
    dessineUtilisateurs();
    dessineDroits();
    dessineMiseEnRoute();
    majComptes();
  }

  /* ----------------------------------------------------------------- bureaux */

  function dessineBureaux() {
    var liste = etat.bureaux;
    hotes.titreBureaux.textContent = nb(liste.length, "bureau", "bureaux");
    if (!liste.length) {
      UI.vide(hotes.bureaux).appendChild(el("div", { class: "vide", text: "Aucun bureau" }));
      return;
    }
    var corps = el("tbody");
    liste.forEach(function (b) {
      var nbU = utilisateursDe(b.id).length;
      var details = [b.actif ? "" : "Suspendu", nomCanton(b.canton),
        b.succursales.length ? nb(b.succursales.length, "succursale", "succursales") : ""].filter(Boolean).join(" · ");
      corps.appendChild(el("tr", { class: b.actif ? "" : "suspendu" }, [
        el("td", {}, [
          el("div", { class: "principal" }, [b.nom, affiche(b) ? el("span", { class: "etiq ing", text: "Affiché" }) : null]),
          el("div", { class: "secondaire", text: details })
        ]),
        el("td", { class: "num" }, [
          b.membres ? el("button", {
            type: "button", class: "lien-nombre", title: "Voir ses utilisateurs",
            onclick: function () { filtreBureau = b.id; remplitFiltre(); dessineUtilisateurs(); montre("utilisateurs"); }
          }, [String(b.membres)]) : "0"
        ]),
        el("td", { class: "num", text: String(nbU) }),
        el("td", { class: "num", text: String(b.affaires) }),
        el("td", { class: "num", text: String(b.taches) }),
        el("td", { class: "num", text: b.activite ? quand(b.activite) : "—" }),
        el("td", { class: "actions" }, [
          el("button", { class: "btn", type: "button", title: "Afficher ce bureau dans le planning", onclick: function () { ouvreBureau(b); } }, ["Ouvrir"]),
          UI.boutonIcone("modifier", "Modifier", b.nom, function () { formulaireBureau(b); }),
          UI.boutonIcone("supprimer", "Supprimer", b.nom, function () { supprimeBureau(b); })
        ])
      ]));
    });
    UI.vide(hotes.bureaux).appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, ["Bureau", "Utilisateurs", "Avec accès", "Affaires", "Tâches", "Dernière activité", ""].map(function (t) {
        return el("th", { text: t });
      }))]),
      corps
    ]));
  }

  function ouvreBureau(b) {
    UI.toast("Ouverture du bureau « " + b.nom + " »…");
    SB.rpc("choisit_bureau", { p_bureau: b.id })
      .then(function () { location.href = "/planif/"; })
      .catch(function (e) { UI.toast(e.message); });
  }

  /** Code stable d'une nouvelle succursale ou discipline, tiré de son nom : « Génie civil » → genie_civil. */
  function codeLibre(nom, pris, prefixe) {
    var base = String(nom || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30);
    if (!/^[a-z]/.test(base)) base = prefixe + (base ? "_" + base : "");
    var code = base, n = 2;
    while (pris[code]) code = base + "_" + n++;
    return code;
  }

  function formulaireBureau(b) {
    var nouveau = !b;
    var compteur = 0;
    function cle() { return "k" + (++compteur); }

    // Copies de travail : rien ne part vers la base avant « Enregistrer »
    var discs = (b ? b.disciplines : []).map(function (d) { return { cle: cle(), code: d.code, nom: d.nom, membres: d.membres || 0 }; });
    var parCode = {};
    discs.forEach(function (d) { parCode[d.code] = d; });
    var succs = (b ? b.succursales : []).map(function (s) {
      var avec = {};
      (s.disciplines || []).forEach(function (c) { if (parCode[c]) avec[parCode[c].cle] = true; });
      return { cle: cle(), code: s.code, nom: s.nom, membres: s.membres || 0, avec: avec };
    });
    var pertes = [];                                    // retraits qui touchent des membres

    var champs = el("div", { class: "grille-champs" }, [
      UI.champ({ nom: "nom", label: "Nom du bureau", valeur: b ? b.nom : "", exemple: "Bureau d'études Exemple SA", large: true }),
      UI.champ({
        nom: "actif", label: "Accès au bureau", type: "select", valeur: b ? String(b.actif) : "true",
        options: [{ valeur: "true", label: "Ouvert" }, { valeur: "false", label: "Suspendu : ses utilisateurs n'entrent plus" }]
      }),
      UI.champ({
        nom: "canton", label: "Jours fériés", type: "select", valeur: b ? b.canton : "VD",
        options: C.CANTONS.map(function (c) { return { valeur: c.code, label: c.nom }; })
      }),
      UI.champ({
        nom: "capaciteDefaut", label: "Capacité par défaut (j/sem.)", type: "number", pas: "0.5", min: "0.5", max: "7",
        inputmode: "decimal", valeur: b ? b.capaciteDefaut : 5
      })
    ]);

    var zoneSucc = el("div"), zoneDisc = el("div"), zonePertes = el("div");

    function texte(obj, exemple, apres) {
      var i = el("input", { type: "text", value: obj.nom, placeholder: exemple, "aria-label": exemple, autocomplete: "off", spellcheck: "false" });
      i.addEventListener("input", function () { obj.nom = i.value; if (apres) apres(); });
      return i;
    }
    function membres(n) { return n ? el("span", { class: "meta", text: nb(n, "membre", "membres") }) : null; }

    function retire(liste, obj, genre) {
      liste.splice(liste.indexOf(obj), 1);
      if (obj.code && obj.membres) {
        pertes.push(obj.membres + (obj.membres > 1 ? " membres perdront leur " : " membre perdra sa ") + genre + " « " + obj.nom + " ».");
      }
      dessine();
    }

    function dessineSuccursales() {
      var l = el("div", { class: "liste-edit" });
      if (!succs.length) l.appendChild(el("p", { class: "aide", text: "Aucune succursale : le champ disparaît des fiches de l'équipe." }));
      succs.forEach(function (s) {
        l.appendChild(el("div", { class: "ligne-edit" }, [
          texte(s, "Nom de la succursale", dessineDisciplines),
          membres(s.membres),
          UI.boutonIcone("supprimer", "Retirer", s.nom || "succursale", function () { retire(succs, s, "succursale"); })
        ]));
      });
      UI.vide(zoneSucc).appendChild(l);
      zoneSucc.appendChild(el("button", {
        class: "btn btn-nu ajout-ligne", type: "button",
        onclick: function () {
          var s = { cle: cle(), code: "", nom: "", membres: 0, avec: {} };
          discs.forEach(function (d) { s.avec[d.cle] = true; });
          succs.push(s);
          dessine();
          var champsTexte = zoneSucc.querySelectorAll("input[type=text]");
          champsTexte[champsTexte.length - 1].focus();
        }
      }, ["+ Ajouter une succursale"]));
    }

    function dessineDisciplines() {
      var corps = el("tbody");
      discs.forEach(function (d) {
        corps.appendChild(el("tr", {}, [
          el("td", {}, [el("div", { class: "ligne-edit" }, [texte(d, "Nom de la discipline"), membres(d.membres)])]),
          succs.map(function (s) {
            var c = el("input", { type: "checkbox", "aria-label": (d.nom || "Discipline") + " à " + (s.nom || "cette succursale") });
            c.checked = !!s.avec[d.cle];
            c.addEventListener("change", function () { s.avec[d.cle] = c.checked; });
            return el("td", {}, [c]);
          }),
          el("td", {}, [UI.boutonIcone("supprimer", "Retirer", d.nom || "discipline", function () {
            succs.forEach(function (s) { delete s.avec[d.cle]; });
            retire(discs, d, "discipline");
          })])
        ].reduce(function (a, x) { return a.concat(x); }, [])));
      });
      var tete = el("tr", {}, [el("th", { text: succs.length ? "Discipline · présente à" : "Discipline" })]
        .concat(succs.map(function (s) { return el("th", { text: s.nom || "…", title: s.nom }); }))
        .concat([el("th", {})]));
      UI.vide(zoneDisc);
      if (!discs.length) {
        zoneDisc.appendChild(el("p", { class: "aide", text: "Aucune discipline : le champ disparaît des fiches de l'équipe." }));
      } else {
        zoneDisc.appendChild(el("div", { class: "matrice-defile" }, [el("table", { class: "matrice" }, [el("thead", {}, [tete]), corps])]));
      }
      zoneDisc.appendChild(el("button", {
        class: "btn btn-nu ajout-ligne", type: "button",
        onclick: function () {
          var d = { cle: cle(), code: "", nom: "", membres: 0 };
          succs.forEach(function (s) { s.avec[d.cle] = true; });   // nouvelle discipline : présente partout
          discs.push(d);
          dessine();
          var champsTexte = zoneDisc.querySelectorAll("input[type=text]");
          champsTexte[champsTexte.length - 1].focus();
        }
      }, ["+ Ajouter une discipline"]));
    }

    function dessine() {
      dessineSuccursales();
      dessineDisciplines();
      UI.vide(zonePertes);
      if (pertes.length) {
        zonePertes.appendChild(el("div", { class: "perte" }, ["À l'enregistrement : " + pertes.join(" ")]));
      }
    }

    var corps = el("div", {}, [
      champs,
      el("fieldset", {}, [
        el("div", { class: "legende", text: "Succursales" }),
        el("p", { class: "aide", text: "Les sites du bureau. Chaque membre de l'équipe peut être rattaché à l'un d'eux." }),
        zoneSucc
      ]),
      el("fieldset", {}, [
        el("div", { class: "legende", text: "Disciplines" }),
        el("p", { class: "aide", text: "Les départements du bureau, et les succursales où chacun existe. Une succursale sans aucune case cochée propose toutes les disciplines." }),
        zoneDisc
      ]),
      zonePertes
    ]);
    dessine();

    UI.ouvre({
      surtitre: nouveau ? "Nouveau bureau" : "Modifier le bureau",
      titre: nouveau ? "Bureau d'études" : b.nom,
      corps: corps,
      compacte: true,
      boutons: [
        { label: "Annuler" },
        {
          label: nouveau ? "Créer le bureau" : "Enregistrer", or: true, entree: true, action: function () {
            var v = UI.lit(champs);
            if (!String(v.nom || "").trim()) { UI.toast("Le nom du bureau est obligatoire."); return false; }
            var vides = succs.concat(discs).some(function (o) { return !String(o.nom || "").trim(); });
            if (vides) { UI.toast("Donne un nom à chaque succursale et à chaque discipline, ou retire les lignes vides."); return false; }
            var doublon = function (l) {
              var vus = {};
              return l.some(function (o) { var k = o.nom.trim().toLowerCase(); if (vus[k]) return true; vus[k] = true; return false; });
            };
            if (doublon(succs) || doublon(discs)) { UI.toast("Deux succursales, ou deux disciplines, portent le même nom."); return false; }

            // Codes des nouvelles lignes, tirés de leur nom et uniques dans le bureau
            var prisD = {}, prisS = {};
            discs.forEach(function (d) { if (d.code) prisD[d.code] = true; });
            succs.forEach(function (s) { if (s.code) prisS[s.code] = true; });
            discs.forEach(function (d) { if (!d.code) { d.code = codeLibre(d.nom, prisD, "d"); prisD[d.code] = true; } });
            succs.forEach(function (s) { if (!s.code) { s.code = codeLibre(s.nom, prisS, "s"); prisS[s.code] = true; } });

            var donnees = {
              id: b ? b.id : null,
              nom: v.nom.trim(),
              actif: v.actif === "true",
              canton: v.canton,
              capaciteDefaut: parseFloat(String(v.capaciteDefaut).replace(",", ".")) || 5,
              disciplines: discs.map(function (d) { return { code: d.code, nom: d.nom.trim() }; }),
              succursales: succs.map(function (s) {
                return {
                  code: s.code, nom: s.nom.trim(),
                  disciplines: discs.filter(function (d) { return s.avec[d.cle]; }).map(function (d) { return d.code; })
                };
              })
            };
            return SB.rpc("console_enregistre_bureau", { p: donnees }).then(function () {
              UI.toast(nouveau ? "Bureau « " + donnees.nom + " » créé." : "Bureau enregistré.");
              return apresChangement();
            }).catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  function supprimeBureau(b) {
    var siens = utilisateursDe(b.id);
    if (siens.some(function (u) { return u.superAdmin; })) {
      return UI.toast("Tu es rattaché à ce bureau : rattache-toi d'abord à un autre (Utilisateurs, ton adresse, Modifier).");
    }
    var corps = el("div", {}, [
      el("p", {
        style: "color:var(--texte-doux);font-size:15px;max-width:46em;margin-bottom:20px",
        text: "Le bureau « " + b.nom + " » sera supprimé avec tout son contenu : " +
          nb(b.membres, "membre", "membres") + ", " + nb(b.affaires, "affaire", "affaires") + ", " + nb(b.taches, "tâche", "tâches") +
          ", leurs absences, ses succursales, ses disciplines et ses réglages. " +
          (siens.length ? nb(siens.length, "utilisateur perdra son accès", "utilisateurs perdront leur accès") + ". " : "") +
          "Cette action est définitive : exporte d'abord ses données (Ouvrir, puis Données > Exporter) si tu veux en garder une copie."
      }),
      el("div", { class: "grille-champs" }, [
        UI.champ({ nom: "confirmation", label: "Pour confirmer, tape le nom du bureau", exemple: b.nom, large: true })
      ])
    ]);
    UI.ouvre({
      surtitre: "Supprimer un bureau",
      titre: b.nom,
      corps: corps,
      compacte: true,
      boutons: [
        { label: "Annuler" },
        {
          label: "Supprimer définitivement", rouge: true, action: function () {
            var saisi = corps.querySelector("[name=confirmation]").value.trim().toLowerCase();
            if (saisi !== b.nom.trim().toLowerCase()) {
              UI.toast("Le nom tapé ne correspond pas : rien n'a été supprimé.");
              return false;
            }
            var etaitAffiche = affiche(b);
            return SB.rpc("console_supprime_bureau", { p_bureau: b.id }).then(function () {
              UI.toast("Bureau « " + b.nom + " » supprimé.");
              if (etaitAffiche) filtreBureau = "";
              return apresChangement();
            }).catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  /* ---------------------------------------------------------------- personnes
     Une personne, c'est sa fiche au planning (prénom, métier, statuts, capacité…) et, si
     elle se connecte à l'outil, son accès. Les deux s'enregistrent ensemble.
     Un accès sans fiche reste possible — le super admin, un externe : il
     paraît ici sans métier ni capacité, et peut recevoir sa fiche plus tard. */

  function remplitFiltre() {
    var f = UI.vide(hotes.filtre);
    f.appendChild(el("option", { value: "" }, ["Tous les bureaux"]));
    etat.bureaux.forEach(function (b) { f.appendChild(el("option", { value: b.id }, [b.nom])); });
    if (!bureau(filtreBureau)) filtreBureau = "";
    f.value = filtreBureau;
  }

  /* Succursales et disciplines appartiennent à un bureau : la console en sert
     plusieurs, elle ne peut pas se reposer sur les listes du bureau affiché. */
  function listesDe(idBureau) {
    var b = bureau(idBureau);
    return { succursales: (b && b.succursales) || [], disciplines: (b && b.disciplines) || [] };
  }

  function nomListe(liste, code) {
    var x = liste.filter(function (e) { return e.code === code; })[0];
    return x ? x.nom : "";
  }

  /** Disciplines ouvertes dans une succursale ; aucune déclarée : toutes celles du bureau. */
  function disciplinesDe(idBureau, codeSucc) {
    var l = listesDe(idBureau);
    var s = l.succursales.filter(function (e) { return e.code === codeSucc; })[0];
    if (!s || !s.disciplines || !s.disciplines.length) return l.disciplines.map(function (d) { return d.code; });
    return s.disciplines;
  }

  function rattachement(p) {
    var l = listesDe(p.bureauId);
    return [nomListe(l.succursales, p.succursale), nomListe(l.disciplines, p.discipline)].filter(Boolean).join(" · ");
  }

  /** Fiches et accès réunis : chaque membre, puis les accès qui n'ont pas de fiche. */
  function personnes() {
    var liste = (etat.membres || []).map(function (m) {
      return {
        id: m.id, bureauId: m.bureauId, prenom: m.prenom, nom: m.nom,
        metier: m.metier, statuts: m.statuts || [],
        succursale: m.succursale, discipline: m.discipline, capacite: m.capacite,
        actif: m.actif, taches: m.taches || 0, fiche: true,
        email: m.email || "", accesActif: !!m.accesActif, superAdmin: !!m.superAdmin,
        compte: !!m.compte, confirme: !!m.confirme, derniereConnexion: m.derniereConnexion
      };
    });
    (etat.utilisateurs || []).forEach(function (u) {
      if (u.membreId) return;
      liste.push({
        id: null, bureauId: u.bureauId, prenom: "", nom: "", metier: null, statuts: [],
        succursale: null, discipline: null, capacite: null,
        actif: true, taches: 0, fiche: false,
        email: u.email, accesActif: !!u.actif, superAdmin: !!u.superAdmin,
        compte: !!u.compte, confirme: !!u.confirme, derniereConnexion: u.derniereConnexion,
        ajoute: u.ajoute
      });
    });
    return liste;
  }

  function nomDe(p) { return p.fiche ? p.prenom + " " + p.nom : p.email; }

  /** Où en est la personne : de la fiche sans accès à la dernière connexion. */
  function situation(p) {
    if (!p.email)           return { texte: "Ne se connecte pas", classe: "attente" };
    if (!p.accesActif)      return { texte: "Accès suspendu", classe: "alerte" };
    if (p.derniereConnexion) return { texte: "Dernière connexion : " + quand(p.derniereConnexion), classe: "" };
    if (p.confirme)         return { texte: "Compte activé, jamais connecté", classe: "attente" };
    if (p.compte)           return { texte: "Lien envoyé, pas encore ouvert", classe: "attente" };
    return { texte: "Pas encore de compte : envoie-lui le lien", classe: "attente" };
  }

  function champsCherches(p) {
    return [nomDe(p), p.email, nomBureau(p.bureauId), D.libelleMetier(p.metier),
            rattachement(p), situation(p).texte, connexionTexte(p),
            p.superAdmin ? "super admin" : ""]
      .concat(D.statutsDe(p).map(D.libelleStatut));
  }

  function selection(sansTexte) {
    var mots = sansTexte || !barre ? [] : barre.termes();
    return personnes().filter(function (p) {
      if (filtreBureau && p.bureauId !== filtreBureau) return false;
      return UI.correspond(champsCherches(p), mots);
    });
  }

  /* La base d'avant la migration ne renvoie pas les fiches de l'équipe : sans
     ce garde-fou, la console montrerait une poignée d'accès et laisserait
     croire que les membres ont disparu. */
  function migrationFaite() { return !!(etat && etat.membres); }

  /* Idem pour le métier séparé des statuts : tant que la base parle encore de
     « role », la console montrerait tout le monde « à désigner » et sans aucune
     casquette. On le dit plutôt que de le laisser croire. */
  function statutsEnBase() {
    return !(etat && etat.membres && etat.membres.length) || ("metier" in etat.membres[0]);
  }

  function dessineUtilisateurs() {
    if (!etat) return;
    if (!migrationFaite()) {
      hotes.titreUtilisateurs.textContent = "Migration à exécuter";
      UI.vide(hotes.utilisateurs).appendChild(el("div", { class: "al grave" }, [
        el("span", { class: "q", text: "À faire" }),
        el("div", {}, [
          el("b", { text: "Les utilisateurs de l'équipe ne sont pas encore ici." }),
          el("p", { style: "margin-top:8px;color:var(--texte-doux);font-size:15px;max-width:52em" }, [
            "La base tient encore les membres et les accès dans deux listes séparées. Exécute ",
            el("code", { text: "migration-console-membres.sql" }),
            " dans Supabase (SQL Editor > New query), après y avoir remplacé le domaine d'exemple en tête du fichier, puis recharge cette page."
          ]),
          el("p", { class: "aide", style: "margin-top:10px;font-size:13.5px;color:var(--texte-faible)", text:
            "Elle donne à chaque membre actif son adresse et un accès suspendu : aucun courriel ne part, tu ouvres les accès un par un ensuite." })
        ])
      ]));
      return;
    }
    suivi.debut();
    var liste = selection(), mots = barre ? barre.termes() : [];
    var total = personnes().length;
    hotes.titreUtilisateurs.textContent = nb(total, "utilisateur", "utilisateurs");
    if (barre) barre.compte(liste.length, selection(true).length);
    UI.vide(hotes.utilisateurs);
    if (!statutsEnBase()) {
      hotes.utilisateurs.appendChild(el("div", { class: "al grave" }, [
        el("span", { class: "q", text: "À faire" }),
        el("div", {}, [
          el("b", { text: "Le métier et les statuts ne sont pas encore dans la base." }),
          el("p", { style: "margin-top:8px;color:var(--texte-doux);font-size:15px;max-width:52em" }, [
            "La base tient encore un rôle unique, qui mélange le métier et la place dans la société. Exécute ",
            el("code", { text: "migration-roles-statuts.sql" }),
            " dans Supabase (SQL Editor > New query), puis recharge cette page. En attendant, les métiers et les statuts affichés ci-dessous ne veulent rien dire."
          ])
        ])
      ]));
    }
    if (!liste.length) {
      hotes.utilisateurs.appendChild(el("div", {
        class: "vide", text: filtreBureau || mots.length ? "Aucun utilisateur pour cette recherche" : "Aucun utilisateur"
      }));
      return;
    }
    // Colonne Bureau seulement quand la liste en mêle plusieurs : sinon elle
    // répète la même valeur sur chaque ligne et vole de la place aux menus.
    var plusieursBureaux = liste.some(function (p) { return p.bureauId !== liste[0].bureauId; });
    var corps = el("tbody");
    liste.forEach(function (p) {
      var cellules = [
        // Le nom, puis son adresse juste dessous : c'est par là qu'on cherche.
        el("td", {}, [
          el("div", { class: "principal" }, [
            UI.surligne(nomDe(p), mots),
            p.superAdmin ? el("span", { class: "etiq ing", text: "Super admin" }) : null,
            p.fiche && !p.actif ? el("span", { class: "etiq", text: "Inactif" }) : null
          ]),
          p.fiche ? el("div", { class: "mail-ligne" }, [UI.surligne(p.email || "sans adresse", mots)]) : null
        ]),
        el("td", {}, [selSuccursale(p)]),
        el("td", {}, [selDiscipline(p)]),
        el("td", {}, [selMetier(p)]),
        el("td", {}, [basculesStatuts(p)]),
        el("td", { class: "num", text: p.fiche ? C.fmtJours(p.capacite) : "—" }),
        el("td", {}, [selAcces(p)]),
        el("td", {}, [el("span", { class: "quand-ligne" }, [UI.surligne(connexionTexte(p), mots)])])
      ];
      if (plusieursBureaux) cellules.splice(1, 0, el("td", {}, [UI.surligne(nomBureau(p.bureauId), mots)]));
      cellules.push(el("td", { class: "actions" }, [
        p.email && p.accesActif ? UI.boutonIcone("lien", "Envoyer un lien de connexion", nomDe(p), function () { envoieLien(p); }) : null,
        UI.boutonIcone("modifier", "Ouvrir la fiche", nomDe(p), function () { formulaireUtilisateur(p); }),
        p.superAdmin ? null : UI.boutonIcone("supprimer", "Supprimer", nomDe(p), function () { supprimeUtilisateur(p); })
      ]));
      corps.appendChild(suivi.marque(el("tr", { class: p.actif && (!p.email || p.accesActif) ? "" : "suspendu" }, cellules), p.id || p.email));
    });
    var entetes = ["Utilisateur", "Succursale", "Discipline", "Métier", "Statuts", "j/sem.", "Accès", "Dernière connexion", ""];
    if (plusieursBureaux) entetes.splice(1, 0, "Bureau");
    hotes.utilisateurs.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, entetes.map(function (t) { return el("th", { text: t }); }))]),
      corps
    ]));
  }

  /* ------------------------------------------------------------------ droits
     Les droits se donnent à des groupes, jamais à une personne : on coche la
     case au croisement d'un groupe et d'un droit. Qui ne porte aucun statut est
     un utilisateur « lambda » — il n'a aucun de ces droits et mène son propre
     travail, sans pouvoir engager celui des autres.
     L'interface ne fait que refléter la base : les mêmes règles y sont posées
     en RLS, une requête lancée hors de l'outil se heurte aux mêmes refus. */

  function droitsEnBase() {
    return !!(etat && etat.bureaux.length && etat.bureaux[0].droits);
  }

  /** Le bureau dont on règle les droits : celui choisi, sinon le sien. */
  function bureauDesDroits() {
    if (!etat || !etat.bureaux.length) return null;
    var b = bureau(bureauDroits);
    if (b) return b;
    var prof = D.profil();
    return (prof && prof.bureau && bureau(prof.bureau.id)) || etat.bureaux[0];
  }

  /** Une case du tableau : un droit pour un groupe, enregistré au clic. */
  function caseDroit(b, statut, droit, accordes) {
    var avant = accordes.indexOf(droit) >= 0;
    var input = el("input", {
      type: "checkbox",
      "aria-label": D.DROITS[droit].titre + " — " + D.STATUTS_PLURIEL[statut] + " de " + b.nom
    });
    input.checked = avant;
    input.addEventListener("change", function () {
      var voulu = input.checked;
      var liste = D.ORDRE_DROITS.filter(function (x) {
        return x === droit ? voulu : accordes.indexOf(x) >= 0;
      });
      // Un code que cette version de l'outil ne connaît pas encore reste en place
      accordes.forEach(function (x) { if (D.ORDRE_DROITS.indexOf(x) < 0) liste.push(x); });
      input.disabled = true;
      SB.rpc("console_enregistre_droits", { p: { bureauId: b.id, statut: statut, droits: liste } })
        .then(function () {
          UI.toast(D.STATUTS_PLURIEL[statut] + " : " + (voulu ? "droit accordé" : "droit retiré") +
                   " — " + D.DROITS[droit].titre.toLowerCase() + ".");
          return apresChangement();
        })
        .catch(function (e) {
          UI.toast(e.message);
          input.checked = avant;
          input.disabled = false;
        });
    });
    return el("label", { class: "case", style: "justify-content:center" }, [input]);
  }

  function dessineDroits() {
    if (!etat) return;
    UI.vide(hotes.droits);
    hotes.titreDroits.textContent = "Ce que chaque groupe peut faire";

    if (!migrationFaite() || !statutsEnBase() || !droitsEnBase()) {
      hotes.filtreDroits.hidden = true;
      hotes.droits.appendChild(el("div", { class: "al grave" }, [
        el("span", { class: "q", text: "À faire" }),
        el("div", {}, [
          el("b", { text: "Les droits ne sont pas encore dans la base." }),
          el("p", { style: "margin-top:8px;color:var(--texte-doux);font-size:15px;max-width:52em" }, [
            "Exécute dans Supabase (SQL Editor > New query), dans cet ordre : ",
            el("code", { text: "migration-roles-statuts.sql" }),
            ", puis coche les statuts de chacun dans « Utilisateurs », puis ",
            el("code", { text: "migration-droits-groupes.sql" }),
            ". Recharge ensuite cette page."
          ]),
          el("p", { class: "aide", style: "margin-top:10px;font-size:13.5px;color:var(--texte-faible)", text:
            "Tant que la dernière n'est pas passée, chacun peut tout faire dans son bureau, comme aujourd'hui." })
        ])
      ]));
      return;
    }

    var b = bureauDesDroits();
    bureauDroits = b.id;
    hotes.filtreDroits.hidden = etat.bureaux.length < 2;
    UI.vide(hotes.filtreDroits);
    etat.bureaux.forEach(function (x) {
      hotes.filtreDroits.appendChild(el("option", { value: x.id, selected: x.id === b.id }, [x.nom]));
    });

    var corps = el("tbody");
    D.ORDRE_STATUTS.forEach(function (s) {
      var accordes = (b.droits && b.droits[s]) || [];
      var n = (etat.membres || []).filter(function (m) {
        return m.bureauId === b.id && m.actif && D.aStatut(m, s);
      }).length;
      var cellules = [el("td", {}, [
        el("div", { class: "principal", text: D.STATUTS_PLURIEL[s] }),
        el("div", { class: "secondaire", text: n
          ? n + (n > 1 ? " personnes" : " personne")
          : "personne — à cocher dans « Utilisateurs »" })
      ])];
      D.ORDRE_DROITS.forEach(function (d) {
        cellules.push(el("td", { class: "num" }, [caseDroit(b, s, d, accordes)]));
      });
      corps.appendChild(el("tr", {}, cellules));
    });

    hotes.droits.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, [el("th", { text: "Groupe" })].concat(
        D.ORDRE_DROITS.map(function (d) {
          return el("th", { class: "num", title: D.DROITS[d].aide, text: D.DROITS[d].titre });
        })
      ))]),
      corps
    ]));

    var legende = el("div", { style: "margin-top:22px;max-width:56em" }, [
      el("div", { class: "legende", text: "Ce que veut dire chaque droit" })
    ]);
    D.ORDRE_DROITS.forEach(function (d) {
      legende.appendChild(el("p", { style: "margin-top:10px;font-size:14px;color:var(--texte-doux)" }, [
        el("b", { text: D.DROITS[d].titre + " — " }),
        D.DROITS[d].aide
      ]));
    });
    legende.appendChild(el("p", {
      class: "aide", style: "margin-top:18px;font-size:13.5px;color:var(--texte-faible)",
      text: "Une personne qui ne porte aucun de ces trois statuts n'a aucun de ces droits : elle crée et modifie les tâches dont une part est la sienne, gère ses propres absences, et travaille normalement sur les affaires existantes. Les statuts se cochent dans « Utilisateurs ». Toi, super admin, tu passes partout."
    }));
    hotes.droits.appendChild(legende);
  }

  /* ------------------------------------------------- réglages sur la ligne
     Quatre menus déroulants et trois bascules par utilisateur : le geste
     courant — désigner un métier, cocher un statut, rattacher à une succursale,
     suspendre un accès — se fait sans ouvrir la fiche. Chacun renvoie la
     personne entière à la base, le champ changé mis à jour ; en cas de refus,
     le réglage reprend sa valeur d'avant. */

  function menu(p, options, valeur, aria, surChoix, classes) {
    var s = el("select", { class: "sel-ligne" + (classes ? " " + classes : ""), "aria-label": aria + " de " + nomDe(p) });
    options.forEach(function (o) {
      s.appendChild(el("option", { value: o.valeur, selected: String(o.valeur) === String(valeur == null ? "" : valeur) }, [o.label]));
    });
    if (!valeur) s.classList.add("vide");
    s.addEventListener("change", function () {
      var avant = valeur == null ? "" : String(valeur);
      var choisi = s.value;
      s.disabled = true;
      surChoix(choisi, function () { s.value = avant; s.disabled = false; });
    });
    return s;
  }

  /** Enregistre la personne avec un champ changé. */
  function enregistreVite(p, modif, message, annule) {
    /* Tant que la base parle de « role », cette console n'a pas de métier à lui
       donner : l'enregistrer effacerait le rôle de la personne. On refuse. */
    if (!statutsEnBase()) {
      UI.toast("Exécute d'abord migration-roles-statuts.sql dans Supabase.");
      annule();
      return Promise.resolve();
    }
    var donnees = {
      id: p.id, bureauId: p.bureauId, prenom: p.prenom, nom: p.nom,
      metier: p.metier, statuts: p.statuts || [],
      succursale: p.succursale, discipline: p.discipline, capacite: p.capacite,
      actif: p.actif, avecFiche: p.fiche,
      email: p.email, avecAcces: !!p.email, accesActif: p.accesActif
    };
    Object.keys(modif).forEach(function (c) { donnees[c] = modif[c]; });
    return SB.rpc("console_enregistre_personne", { p: donnees }).then(function () {
      UI.toast(message);
      return apresChangement();
    }).catch(function (e) { UI.toast(e.message); annule(); });
  }

  function selSuccursale(p) {
    var l = listesDe(p.bureauId);
    if (!p.fiche || !l.succursales.length) return el("span", { class: "secondaire", text: "—" });
    var options = [{ valeur: "", label: "Non renseignée" }].concat(l.succursales.map(function (s) {
      return { valeur: s.code, label: s.nom };
    }));
    return menu(p, options, p.succursale, "Succursale", function (code, annule) {
      // La discipline suit : celle d'avant n'existe peut-être pas dans la nouvelle succursale.
      var possibles = disciplinesDe(p.bureauId, code);
      var disc = possibles.indexOf(p.discipline) >= 0 ? p.discipline : (possibles.length === 1 ? possibles[0] : "");
      enregistreVite(p, { succursale: code, discipline: disc },
        nomDe(p) + " : " + (code ? nomListe(l.succursales, code) : "sans succursale") + ".", annule);
    });
  }

  function selDiscipline(p) {
    var l = listesDe(p.bureauId);
    if (!p.fiche || !l.disciplines.length) return el("span", { class: "secondaire", text: "—" });
    var codes = disciplinesDe(p.bureauId, p.succursale);
    var options = [{ valeur: "", label: "Non renseignée" }].concat(codes.map(function (c) {
      return { valeur: c, label: nomListe(l.disciplines, c) };
    }));
    return menu(p, options, p.discipline, "Discipline", function (code, annule) {
      enregistreVite(p, { discipline: code },
        nomDe(p) + " : " + (code ? nomListe(l.disciplines, code) : "sans discipline") + ".", annule);
    });
  }

  function selMetier(p) {
    if (!p.fiche) return el("span", { class: "secondaire", text: "—" });
    var options = [{ valeur: "", label: "À désigner" }].concat(Object.keys(D.METIERS).map(function (k) {
      return { valeur: k, label: D.METIERS[k] };
    }));
    return menu(p, options, p.metier, "Métier", function (metier, annule) {
      enregistreVite(p, { metier: metier },
        nomDe(p) + " : " + D.libelleMetier(metier).toLowerCase() + ".", annule);
    });
  }

  /* Les statuts se cochent sur la ligne : trois bascules, allumées quand la
     personne les porte. C'est le geste courant — désigner les associés, les
     chefs de secteur et les chefs de projet d'un bureau entier sans ouvrir
     quatre-vingts fiches. La fiche, elle, garde les cases en toutes lettres. */
  function basculesStatuts(p) {
    if (!p.fiche) return el("span", { class: "secondaire", text: "—" });
    var boite = el("div", { class: "statuts-ligne bascules" });
    D.ORDRE_STATUTS.forEach(function (s) {
      var porte = D.aStatut(p, s);
      var b = el("button", {
        type: "button", class: "etiq statut " + s + (porte ? " porte" : ""),
        title: D.STATUTS[s] + (porte ? " — cliquer pour retirer" : " — cliquer pour ajouter"),
        "aria-pressed": porte ? "true" : "false",
        "aria-label": D.STATUTS[s] + " de " + nomDe(p)
      }, [D.STATUTS_COURTS[s]]);
      b.addEventListener("click", function () {
        var avant = D.statutsDe(p);
        var apres = porte ? avant.filter(function (x) { return x !== s; }) : avant.concat([s]);
        b.disabled = true;
        enregistreVite(p, { statuts: apres },
          nomDe(p) + (porte ? " n'est plus " : " est ") + D.STATUTS[s].toLowerCase() + ".",
          function () { b.disabled = false; });
      });
      boite.appendChild(b);
    });
    return boite;
  }

  /** Ouvrir ou suspendre l'accès. Sans adresse, il n'y a rien à ouvrir. */
  function selAcces(p) {
    if (!p.email) return el("span", { class: "secondaire", text: "Sans accès" });
    var s = menu(p, [
      { valeur: "true", label: "Ouvert" },
      { valeur: "false", label: "Suspendu" }
    ], String(p.accesActif), "Accès", function (val, annule) {
      enregistreVite(p, { accesActif: val === "true" },
        nomDe(p) + (val === "true" ? " : accès ouvert." : " : accès suspendu."), annule);
    }, "court" + (p.accesActif ? "" : " suspendu"));
    if (p.superAdmin) { s.disabled = true; s.title = "Le super admin garde son accès."; }
    return s;
  }

  /** Dernière connexion, ou l'étape où en est la personne. */
  function connexionTexte(p) {
    if (!p.email) return "—";
    if (p.derniereConnexion) return quand(p.derniereConnexion);
    if (p.confirme) return "compte activé";
    if (p.compte) return "lien envoyé";
    return "jamais venue";
  }

  /* ------------------------------------------------------- l'adresse proposée
     Même règle que la base (adresse_depuis_nom) : Tony Varin → t.varin@…
     Le domaine est celui que portent déjà les adresses du bureau ; aucune
     adresse n'est écrite dans le dépôt. */

  function simplifie(t) {
    return String(t || "").toLowerCase()
      .replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/ø/g, "o").replace(/ß/g, "ss")
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9-]/g, "");
  }

  /** Domaine le plus répandu parmi les accès du bureau, sinon tous bureaux confondus. */
  function domaineDe(idBureau) {
    function cherche(id) {
      var comptes = {}, meilleur = "", n = 0;
      (etat.utilisateurs || []).forEach(function (u) {
        if (id && u.bureauId !== id) return;
        var d = String(u.email || "").split("@")[1];
        if (!d) return;
        comptes[d] = (comptes[d] || 0) + 1;
        if (comptes[d] > n) { n = comptes[d]; meilleur = d; }
      });
      return meilleur;
    }
    return cherche(idBureau) || cherche("");
  }

  function proposeAdresse(prenom, nom, idBureau) {
    var p = simplifie(prenom), f = simplifie(nom), d = domaineDe(idBureau);
    return p && f && d ? p.charAt(0) + "." + f + "@" + d : "";
  }

  /* ------------------------------------------------------------- formulaire */

  function formulaireUtilisateur(p) {
    var nouveau = !p;
    if (!migrationFaite()) return UI.toast("Exécute d'abord migration-console-membres.sql dans Supabase.");
    if (!statutsEnBase()) return UI.toast("Exécute d'abord migration-roles-statuts.sql dans Supabase.");
    if (!etat || !etat.bureaux.length) return UI.toast("Crée d'abord un bureau.");
    var prof = D.profil();
    var bureauInit = p ? p.bureauId
      : (filtreBureau || (prof.bureau && bureau(prof.bureau.id) ? prof.bureau.id : etat.bureaux[0].id));
    var capDefaut = (bureau(bureauInit) || {}).capaciteDefaut || 5;

    /* --------------------------------------------------------- la fiche --- */
    var chBureau = UI.champ({
      nom: "bureauId", label: "Bureau", type: "select", valeur: bureauInit,
      options: etat.bureaux.map(function (b) { return { valeur: b.id, label: b.nom + (b.actif ? "" : " (suspendu)") }; })
    });
    var chPrenom = UI.champ({ nom: "prenom", label: "Prénom", valeur: p ? p.prenom : "", exemple: "Camille", autocomplete: "given-name" });
    var chNom    = UI.champ({ nom: "nom", label: "Nom", valeur: p ? p.nom : "", exemple: "Berger", autocomplete: "family-name" });
    var chSucc   = UI.champ({ nom: "succursale", label: "Succursale", type: "select", valeur: "", options: [] });
    var chDisc   = UI.champ({ nom: "discipline", label: "Discipline", type: "select", valeur: "", options: [] });
    var chMetier = UI.champ({
      nom: "metier", label: "Métier", type: "select", valeur: p ? p.metier : "",
      options: [{ valeur: "", label: "À désigner" }].concat(Object.keys(D.METIERS).map(function (k) {
        return { valeur: k, label: D.METIERS[k] };
      })),
      aide: "Un seul. Seuls les ingénieurs et les dessinateurs paraissent au planning."
    });
    // Les statuts se cumulent entre eux et avec le métier : on peut être
    // ingénieur, administrateur et chef de projet à la fois.
    var chStatuts = UI.cases("statuts", D.ORDRE_STATUTS.map(function (s) {
      return { valeur: s, label: D.STATUTS[s] };
    }), p ? D.statutsDe(p) : []);
    var chCap    = UI.champ({
      nom: "capacite", label: "Capacité (j/sem.)", type: "number", pas: "0.5", min: "0.5", max: "7", inputmode: "decimal",
      valeur: p && p.capacite != null ? p.capacite : capDefaut,
      aide: "5 pour un plein temps, 4 pour un 80 %."
    });
    var chActif  = UI.champ({
      nom: "actif", label: "Présence à l'effectif", type: "select", valeur: p && p.fiche ? String(p.actif) : "true",
      options: [{ valeur: "true", label: "Actif" }, { valeur: "false", label: "Inactif — masqué du planning" }]
    });

    var fiche = el("fieldset", {}, [
      el("div", { class: "legende", text: "Au planning" }),
      el("div", { class: "grille-champs" }, [chBureau, chMetier, chPrenom, chNom, chSucc, chDisc, chCap, chActif])
    ]);

    var statuts = el("fieldset", {}, [
      el("div", { class: "legende", text: "Statuts dans la société" }),
      chStatuts,
      el("p", {
        class: "aide", style: "margin-top:10px;font-size:13px;color:var(--texte-faible);max-width:46em",
        text: "À cocher autant que nécessaire, ou aucune. Un administrateur est un associé du bureau. Ces statuts s'ajoutent au métier : on peut être ingénieur, administrateur et chef de projet à la fois."
      })
    ]);

    /* ---------------------------------------------------------- l'accès --- */
    var aAcces = el("input", { type: "checkbox" });
    aAcces.checked = p ? !!p.email : true;
    var chMail = UI.champ({
      nom: "email", label: "Adresse e-mail", type: "email", valeur: p ? p.email : "",
      exemple: "c.berger@bureau.ch", large: true
    });
    var chAcces = UI.champ({
      nom: "accesActif", label: "État de l'accès", type: "select",
      valeur: p && p.email ? String(p.accesActif) : "false",
      options: [
        { valeur: "false", label: "Suspendu — n'ouvre pas encore l'outil" },
        { valeur: "true", label: "Ouvert" }
      ]
    });
    var champsAcces = el("div", { class: "grille-champs", style: "margin-top:12px" }, [chMail, chAcces]);

    var envoi = el("input", { type: "checkbox" });
    var boiteEnvoi = el("div", { class: "cases", style: "margin-top:12px" }, [
      el("label", { class: "case" }, [envoi, "Envoyer tout de suite le lien de bienvenue"])
    ]);
    var aideEnvoi = el("p", {
      class: "aide", style: "margin-top:10px;font-size:13px;color:var(--texte-faible);max-width:46em",
      text: "Le courriel lui fait choisir son mot de passe. Sans envoi, elle passera par « Mot de passe oublié ou première connexion » sur la page de connexion."
    });

    var acces = el("fieldset", {}, [
      el("div", { class: "legende", text: "Accès à l'outil" }),
      el("div", { class: "cases" }, [el("label", { class: "case" }, [aAcces, "Se connecte à l'outil"])]),
      champsAcces, boiteEnvoi, aideEnvoi
    ]);

    var corps = el("div", {}, [fiche, statuts, acces]);
    var selBureau = chBureau.querySelector("select");
    var selSucc = chSucc.querySelector("select"), selDisc = chDisc.querySelector("select");
    var inPrenom = chPrenom.querySelector("input"), inNom = chNom.querySelector("input");
    var inMail = chMail.querySelector("input"), selAcces = chAcces.querySelector("select");
    var mailTenuAMain = !!(p && p.email);

    /* L'adresse est la clé du compte : une fois celui-ci créé, elle ne bouge plus. */
    if (p && p.compte) {
      inMail.readOnly = true;
      chMail.appendChild(el("div", { class: "aide", text: "Son compte est créé : pour changer d'adresse, retire son accès puis donne-lui-en un autre." }));
    }
    if (p && p.superAdmin) { aAcces.disabled = true; selAcces.disabled = true; }

    function remplitListes(succGardee, discGardee) {
      var idB = selBureau.value, l = listesDe(idB);
      UI.vide(selSucc).appendChild(el("option", { value: "" }, ["Non renseignée"]));
      l.succursales.forEach(function (s) { selSucc.appendChild(el("option", { value: s.code }, [s.nom])); });
      selSucc.value = l.succursales.some(function (s) { return s.code === succGardee; }) ? succGardee : "";
      chSucc.style.display = l.succursales.length ? "" : "none";

      var codes = disciplinesDe(idB, selSucc.value);
      UI.vide(selDisc).appendChild(el("option", { value: "" }, ["Non renseignée"]));
      codes.forEach(function (c) { selDisc.appendChild(el("option", { value: c }, [nomListe(l.disciplines, c)])); });
      selDisc.value = codes.indexOf(discGardee) >= 0 ? discGardee : (codes.length === 1 ? codes[0] : "");
      chDisc.style.display = l.disciplines.length ? "" : "none";
    }
    remplitListes(p ? p.succursale : "", p ? p.discipline : "");

    selBureau.addEventListener("change", function () {
      remplitListes(selSucc.value, selDisc.value);
      majAdresse();
    });
    selSucc.addEventListener("change", function () { remplitListes(selSucc.value, selDisc.value); });

    /* Tant que l'adresse n'a pas été touchée à la main, elle suit le nom. */
    function majAdresse() {
      if (mailTenuAMain || inMail.readOnly) return;
      inMail.value = proposeAdresse(inPrenom.value, inNom.value, selBureau.value);
    }
    inPrenom.addEventListener("input", majAdresse);
    inNom.addEventListener("input", majAdresse);
    inMail.addEventListener("input", function () { mailTenuAMain = true; });

    function majAcces() {
      var ouvert = aAcces.checked;
      champsAcces.style.display = ouvert ? "" : "none";
      boiteEnvoi.style.display = ouvert && !(p && p.compte) ? "" : "none";
      aideEnvoi.style.display = boiteEnvoi.style.display;
      if (ouvert) majAdresse();
    }
    aAcces.addEventListener("change", majAcces);
    majAcces();

    UI.ouvre({
      surtitre: nouveau ? "Nouvel utilisateur" : "Modifier",
      titre: nouveau ? "Fiche et accès" : nomDe(p),
      corps: corps,
      boutons: [
        { label: "Annuler" },
        {
          label: nouveau ? "Créer" : "Enregistrer", or: true, entree: true, action: function () {
            var v = UI.lit(corps);
            var veutAcces = aAcces.checked;
            var adresse = String(v.email || "").trim().toLowerCase();
            if (!String(v.prenom || "").trim()) { UI.toast("Le prénom est obligatoire."); return false; }
            if (!String(v.nom || "").trim())    { UI.toast("Le nom est obligatoire."); return false; }
            if (veutAcces && !RE_MAIL.test(adresse)) { UI.toast("Cette adresse e-mail n'est pas valide."); return false; }

            var donnees = {
              id: p && p.id ? p.id : null, bureauId: v.bureauId,
              prenom: v.prenom, nom: v.nom, metier: v.metier, statuts: v.statuts || [],
              succursale: v.succursale, discipline: v.discipline,
              capacite: v.capacite, actif: v.actif === "true", avecFiche: true,
              email: veutAcces ? adresse : "", avecAcces: veutAcces,
              accesActif: veutAcces && v.accesActif === "true"
            };
            return SB.rpc("console_enregistre_personne", { p: donnees }).then(function () {
              var envoyer = veutAcces && envoi.checked && boiteEnvoi.style.display !== "none";
              if (!envoyer) {
                UI.toast(nouveau ? "Personne créée." : "Fiche enregistrée.");
                return apresChangement();
              }
              return SB.envoieLien(adresse).then(function () {
                UI.toast("Personne créée, lien envoyé à " + adresse + ".");
                return apresChangement();
              }, function (e) {
                // La fiche est enregistrée ; seul le courriel n'est pas parti.
                return apresChangement().then(function () { setTimeout(function () { alerteEnvoi(adresse, e); }, 0); });
              });
            }).catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  function envoieLien(p) {
    UI.confirme("Envoyer un lien à " + p.email + " ?",
      p.compte
        ? "Un courriel part tout de suite. Le lien ouvre l'outil et lui fait choisir un nouveau mot de passe."
        : "Un courriel part tout de suite. Le lien crée son compte et lui fait choisir son mot de passe.",
      "Envoyer"
    ).then(function (ok) {
      if (!ok) return;
      UI.toast("Envoi en cours…");
      SB.envoieLien(p.email).then(function () {
        UI.toast("Lien envoyé à " + p.email + ".");
        return apresChangement();
      }).catch(function (e) { alerteEnvoi(p.email, e); });
    });
  }

  /** Courriel refusé : on dit pourquoi, et quel réglage de Supabase y remédie. */
  function alerteEnvoi(adresse, e) {
    var m = e.message || "";
    var conseil = /SMTP|équipe Supabase|Limite d'envoi/i.test(m)
      ? "Branche un serveur d'envoi à toi : voir « 03 — Mise en route », plus bas."
      : /création de comptes est fermée/i.test(m)
      ? "Autorise la création des comptes : voir « 03 — Mise en route », plus bas."
      : /non autoris/i.test(m)
      ? "La garde a refusé l'adresse : vérifie que son accès est ouvert, dans un bureau ouvert."
      : "";
    UI.ouvre({
      surtitre: "Courriel non envoyé",
      titre: adresse,
      compacte: true,
      corps: el("div", {}, [
        el("p", { style: "color:var(--texte-doux);font-size:15px;max-width:46em", text: "L'accès est bien inscrit, mais le courriel n'est pas parti. " + m }),
        conseil ? el("p", { class: "aide", style: "margin-top:12px;font-size:14px;color:var(--texte-doux)", text: conseil }) : null
      ]),
      boutons: [{ label: "Compris", or: true }]
    });
  }

  function supprimeUtilisateur(p) {
    // Un accès sans fiche : seul l'accès part. Une fiche : tout part avec elle.
    if (!p.fiche) {
      UI.confirme("Retirer l'accès de " + p.email + " ?",
        "Cette adresse n'ouvrira plus l'outil. Son compte de connexion reste, mais ne donne plus accès à rien : " +
        "pour lui rendre l'accès, il suffira de l'inscrire à nouveau.",
        "Retirer l'accès", true
      ).then(function (ok) {
        if (!ok) return;
        SB.rpc("console_supprime_utilisateur", { p_email: p.email }).then(function () {
          UI.toast("Accès retiré.");
          return apresChangement();
        }).catch(function (e) { UI.toast(e.message); });
      });
      return;
    }
    var suites = [
      p.taches ? "Ses " + p.taches + (p.taches > 1 ? " tâches sont conservées" : " tâche est conservée") + ", mais se retrouve" + (p.taches > 1 ? "nt" : "") + " sans affectation." : "",
      p.email ? "Son accès à l'outil est retiré." : "",
      "Ses absences et ses équipes d'affaire partent avec elle."
    ].filter(Boolean).join(" ");
    UI.confirme("Supprimer " + nomDe(p) + " ?", suites, "Supprimer", true).then(function (ok) {
      if (!ok) return;
      SB.rpc("console_supprime_membre", { p_membre: p.id }).then(function () {
        UI.toast("Personne supprimée.");
        return apresChangement();
      }).catch(function (e) { UI.toast(e.message); });
    });
  }

  /* ---------------------------------------------------------- mise en route
     Ce que le navigateur peut vérifier seul (inscriptions, confirmation de
     l'adresse) est coché d'office ; le reste se vérifie dans Supabase. */

  function dessineMiseEnRoute() {
    var ref = (/^https:\/\/([a-z0-9]+)\.supabase\.co/i.exec((window.PLANIF_CONFIG.supabase || {}).url || "") || [])[1];
    function lien(chemin, texte) {
      return ref ? el("a", { href: "https://supabase.com/dashboard/project/" + ref + chemin, target: "_blank", rel: "noopener" }, [texte]) : texte;
    }
    function point(etatPoint, titre, contenu) {
      var q = { fait: "Fait", manque: "À faire", verifier: "À vérifier" }[etatPoint];
      return el("div", { class: "al" + (etatPoint === "fait" ? " fait" : etatPoint === "manque" ? " grave" : "") }, [
        el("span", { class: "q", text: q }),
        el("div", {}, [el("b", { text: titre }), " "].concat(contenu))
      ]);
    }
    var inscriptions = auth ? (auth.disable_signup ? "manque" : "fait") : "verifier";
    var confirmation = auth ? (auth.mailer_autoconfirm ? "manque" : "fait") : "verifier";

    UI.vide(hotes.miseEnRoute).appendChild(el("div", { class: "alertes" }, [
      point("fait", "Base multi-bureaux.", ["migration-multi-bureaux.sql est exécutée : cette page s'affiche."]),
      point("verifier", "Annuaire des contacts.", [
        "La page Annuaire tient le carnet d'adresses du bureau : clients, architectes, entreprises. ",
        lien("/sql", "SQL Editor"), " : exécuter ", el("code", { text: "migration-annuaire.sql" }),
        " (dépôt). Sans elle, la page s'affiche mais reste vide et n'enregistre rien."
      ]),
      point("verifier", "Passer la main sur une tâche.", [
        "Sans le droit « créer des tâches pour les autres », chacun peut confier sa part à un collègue du même métier. ",
        lien("/sql", "SQL Editor"), " : exécuter ", el("code", { text: "migration-passer-la-main.sql" }),
        " (dépôt). Sans elle, la base refuse le geste."
      ]),
      point("verifier", "Serveur d'envoi (SMTP).", [
        "Sans lui, Supabase ne livre ses courriels qu'aux membres de ton équipe Supabase, 2 par heure. ",
        lien("/auth/smtp", "Authentication > Emails > SMTP Settings"),
        " : un service d'envoi comme Resend, ou une boîte aux lettres à toi."
      ]),
      point("verifier", "Modèles de courriels en français.", [
        lien("/auth/templates", "Authentication > Emails > Templates"),
        " : « Confirm signup », « Magic Link » et « Reset Password ». Textes prêts dans ",
        el("code", { text: "reglages-supabase.md" }), " (dépôt)."
      ]),
      point("verifier", "Garde des comptes.", [
        lien("/auth/hooks", "Authentication > Auth Hooks"),
        " : « Before User Created », type Postgres, fonction ", el("code", { text: "public.garde_creation_compte" }),
        ". Sans elle, n'importe qui peut se créer un compte (qui n'ouvre rien, la base restant fermée)."
      ]),
      point(inscriptions, "Création des comptes autorisée.", [
        inscriptions === "manque" ? "Fermée : les nouveaux utilisateurs ne peuvent pas activer leur accès. " : "",
        lien("/auth/providers", "Authentication > Sign In / Providers"), " : « Allow new users to sign up » activé ; la garde filtre les adresses."
      ]),
      point(confirmation, "Confirmation de l'adresse obligatoire.", [
        confirmation === "manque" ? "Désactivée : quelqu'un qui connaît une adresse inscrite pourrait ouvrir son compte à sa place. " : "",
        lien("/auth/providers", "Authentication > Sign In / Providers > Email"), " : « Confirm email » activé."
      ])
    ]));
  }
})();
</script>
</body>
</html>
