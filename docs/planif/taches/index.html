<body class="large">

<div data-chrome></div>

<main>
  <div class="wrap entete">
    <h1>Tâches <span id="titre-liste" class="compte-titre"></span></h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <section class="section">
      <div data-recherche></div>
      <button class="btn seul-mobile" type="button" id="btn-filtres" aria-controls="filtres" aria-expanded="false" style="width:100%;justify-content:space-between;margin-bottom:16px">
        <span>Filtres</span><span id="nb-filtres" class="or"></span>
      </button>
      <div class="grille-champs" id="filtres" style="max-width:1100px;margin-bottom:26px"></div>
      <!-- Téléphone seulement : la barre du haut y cache ses actions -->
      <button class="btn seul-mobile" type="button" id="btn-csv" style="width:100%;justify-content:center;margin-bottom:16px"><span class="ico-txt ico-export" aria-hidden="true"></span>Export CSV</button>
      <div class="defile" id="liste"></div>
    </section>
  </div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=4"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=15"></script>
<script src="/planif/assets/donnees.js?v=23"></script>
<script src="/planif/assets/calculs.js?v=6"></script>
<script src="/planif/assets/ui.js?v=34"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var filtres = { affaire: "", membre: "", statut: "", masqueTerminees: true };
  var barre = null;                                 // recherche instantanée
  var suivi = UI.suiviApparitions();

  if (!UI.session()) return;

  D.pret().then(function () {
    var p = new URLSearchParams(location.search);
    if (p.get("affaire")) filtres.affaire = p.get("affaire");
    if (p.get("membre")) filtres.membre = p.get("membre");
    // Ouverte depuis le menu, sans consigne : chacun voit d'abord ses propres tâches.
    // « ?membre= » vide, ou un lien qui vise une affaire, laissent la vue sur toute l'équipe.
    else if (!p.has("membre") && !filtres.affaire) {
      var moi = D.monMembre();
      if (moi) filtres.membre = moi.id;
    }

    /* L'export à gauche de « Nouvelle tâche » : les deux actions de la page
       sont dans la barre. Sur téléphone la barre masque ses actions au profit
       du bouton flottant — l'export y garde donc son bouton dans la page. */
    UI.chrome("taches", [
      { label: "Export CSV", icone: "ico-export", action: exporteCSV },
      { label: "Nouvelle tâche", or: true, icone: "ico-ajout-tache", action: function () { formulaire(null); } }
    ]);
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    document.getElementById("btn-csv").addEventListener("click", exporteCSV);
    document.getElementById("btn-filtres").addEventListener("click", function () {
      var ouvert = document.getElementById("filtres").classList.toggle("ouvert");
      this.setAttribute("aria-expanded", String(ouvert));
    });

    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher une tâche, une affaire, une personne…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) formulaire(l[0].id); }
    });

    rendFiltres();
    D.surRechargement(dessine);
    dessine();

    if (p.get("nouvelle") === "1") formulaire(null);
    if (p.get("tache")) formulaire(p.get("tache"));
  }).catch(UI.echec);

  /* --------------------------------------------------------------- filtres */

  function rendFiltres() {
    var hote = document.getElementById("filtres");
    UI.vide(hote);

    var chAffaire = UI.champ({
      nom: "f-affaire", label: "Affaire", type: "select", valeur: filtres.affaire,
      options: [{ valeur: "", label: "Toutes les affaires" }].concat(
        D.affaires({ tous: true }).map(function (a) { return { valeur: a.id, label: a.code + " · " + a.nom }; }))
    });
    var chMembre = UI.champ({
      nom: "f-membre", label: "Membre", type: "select", valeur: filtres.membre,
      options: [{ valeur: "", label: "Toute l'équipe" }, { valeur: "a-affecter", label: "À affecter (sans personne)" }]
        .concat(UI.optionsParMetier(D.membres({ tous: true })))
    });
    var chStatut = UI.champ({
      nom: "f-statut", label: "Statut", type: "select", valeur: filtres.statut,
      options: [{ valeur: "", label: "Tous les statuts" }].concat(
        Object.keys(D.STATUTS_TACHE).map(function (k) { return { valeur: k, label: D.STATUTS_TACHE[k] }; }))
    });
    hote.appendChild(chAffaire); hote.appendChild(chMembre);
    hote.appendChild(chStatut);

    var masque = el("input", { type: "checkbox" });
    masque.checked = filtres.masqueTerminees;
    masque.addEventListener("change", function () { filtres.masqueTerminees = masque.checked; dessine(); });
    hote.appendChild(el("div", { class: "champ", style: "justify-content:flex-end" }, [
      el("label", {
        class: "case", style: "white-space:nowrap",
        title: "Les tâches terminées, et celles dont la part de la personne regardée est rendue"
      }, [masque, "Masquer les terminées"])
    ]));

    chAffaire.querySelector("select").addEventListener("change", function () { filtres.affaire = this.value; dessine(); });
    chMembre.querySelector("select").addEventListener("change", function () { filtres.membre = this.value; dessine(); });
    chStatut.querySelector("select").addEventListener("change", function () { filtres.statut = this.value; dessine(); });
  }

  /** Tout ce qui, dans une tâche, peut être cherché. */
  function champsCherches(t) {
    var a = D.affaire(t.affaireId);
    return [
      t.titre, t.note, a && a.code, a && a.nom,
      t.ingenieurId && D.nomMembre(t.ingenieurId),
      t.dessinateurId && D.nomMembre(t.dessinateurId),
      D.STATUTS_TACHE[t.statut],
      Calc.nonAffectees(t).length ? "À affecter" : ""
    ];
  }

  // Texte de recherche de chaque tâche, plié une fois par version des données
  // plutôt qu'à chaque frappe : sur des milliers de tâches, c'est ce qui coûtait.
  var foins = { v: -1, parId: {} };
  function foinDe(t) {
    if (foins.v !== D.version()) foins = { v: D.version(), parId: {} };
    return foins.parId[t.id] || (foins.parId[t.id] = UI.foin(champsCherches(t)));
  }

  /**
   * Plus rien à faire là-dessus, pour qui regarde : la tâche est terminée, ou
   * la part de cette personne est rendue alors que l'autre métier travaille
   * encore. La personne de référence est celle du filtre « Membre », sinon moi.
   */
  function rendu(t) {
    if (t.statut === "termine") return true;
    var qui = filtres.membre && filtres.membre !== "a-affecter" ? filtres.membre : (D.monMembre() || {}).id;
    var parts = partsDe(t, qui);
    return parts.length > 0 && parts.every(function (r) { return t[D.PARTS[r].fini]; });
  }

  /**
   * opts.sansTexte : ignore la recherche (pour le total du compteur)
   * opts.terminees : force l'inclusion des tâches terminées et des parts rendues
   */
  function selection(opts) {
    opts = opts || {};
    var mots = opts.sansTexte || !barre ? [] : barre.termes();
    var sansPersonne = filtres.membre === "a-affecter";   // tâches dont une charge attend encore quelqu'un
    return D.taches({ affaireId: filtres.affaire || null, membreId: sansPersonne ? null : (filtres.membre || null) })
      .filter(function (t) {
        if (sansPersonne && !Calc.nonAffectees(t).length) return false;
        if (filtres.masqueTerminees && !opts.terminees && rendu(t)) return false;
        if (filtres.statut && t.statut !== filtres.statut) return false;
        return !mots.length || UI.contient(foinDe(t), mots);
      });
  }

  /* ------------------------------------------------------------- affichage */

  var affichage = null;                             // paquets en cours, à arrêter au prochain rendu

  function dessine() {
    var taches = selection();
    var mots = barre ? barre.termes() : [];
    var hote = document.getElementById("liste");
    if (affichage) affichage.fin();
    UI.vide(hote);
    suivi.debut();
    if (barre) barre.compte(taches.length, selection({ sansTexte: true }).length);

    // Nombre de filtres actifs, rappelé sur le bouton qui les replie (téléphone)
    var actifs = [filtres.affaire, filtres.membre, filtres.statut].filter(Boolean).length;
    document.getElementById("nb-filtres").textContent = actifs ? actifs + (actifs > 1 ? " actifs" : " actif") : "";

    var charge = taches.reduce(function (s, t) { return s + Calc.chargeTotale(t); }, 0);
    document.getElementById("titre-liste").textContent =
      taches.length + (taches.length > 1 ? " tâches" : " tâche") + " · " + C.fmtJours(charge) + " j";

    if (!taches.length) {
      hote.appendChild(sansResultat(mots, actifs));
      return;
    }

    var auj = C.isoAuj(), lundi = C.lundi(auj);
    var corps = el("tbody");

    /* Rangement par semaine. Chaque tâche paraît une fois, dans la première
       semaine où il reste à y travailler : celle de son début, ou la semaine en
       cours si elle a déjà commencé. Les retards passent devant, les tâches
       terminées avant cette semaine ferment la liste. */
    var infos = taches.map(function (t, i) {
      var debut = debutDe(t);
      var groupe = t.statut !== "termine" && t.echeance < auj ? "retard"
        : t.echeance < lundi ? "passe"
        : C.lundi(debut > lundi ? debut : lundi);
      return { t: t, i: i, debut: debut, groupe: groupe };
    });
    function rang(g) { return g === "retard" ? 0 : g === "passe" ? 2 : 1; }
    infos.sort(function (x, y) {
      return rang(x.groupe) - rang(y.groupe) || (x.groupe < y.groupe ? -1 : x.groupe > y.groupe ? 1 : 0) || x.i - y.i;
    });
    var bilans = {};
    infos.forEach(function (o) {
      var b = bilans[o.groupe] || (bilans[o.groupe] = { n: 0, charge: 0 });
      b.n++; b.charge += Calc.chargeTotale(o.t);
    });

    hote.appendChild(el("table", { class: "liste", style: "min-width:900px" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Tâche" }),
        el("th", { text: "Affectations" }),
        el("th", { text: "Charge" }),
        el("th", { text: "Période" }),
        el("th", { text: "Avancement" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));

    // La semaine en cours s'affiche toujours, même vide, sauf pendant une recherche
    var semaineVue = !!mots.length || !!bilans[lundi], groupeCourant = null;

    // 150 lignes tout de suite, la suite en approchant du bas de la page
    affichage = UI.paquets({ elements: infos, taille: 150, hote: hote, ajoute: function (o) {
      if (o.groupe !== groupeCourant) {
        if (!semaineVue && rang(o.groupe) > 0) {
          semaineVue = true;
          corps.appendChild(titreGroupe(lundi, { n: 0, charge: 0 }));
          corps.appendChild(el("tr", { class: "groupe-vide" }, [
            el("td", { colspan: "6", class: "secondaire", text: "Rien à faire ni à commencer cette semaine" })
          ]));
        }
        groupeCourant = o.groupe;
        corps.appendChild(titreGroupe(o.groupe, bilans[o.groupe]));
      }
      corps.appendChild(ligne(o.t, o.debut));
    } });

    function titreGroupe(g, b) {
      var titre, sous;
      if (g === "retard") { titre = "En retard"; sous = "Échéance dépassée"; }
      else if (g === "passe") { titre = "Terminées avant cette semaine"; sous = "Échéance passée"; }
      else {
        var s = C.semaineISO(g), n = Math.round(C.diff(lundi, g) / 7);
        titre = "Semaine " + s.num + (s.annee !== C.semaineISO(lundi).annee ? " · " + s.annee : "");
        sous = (n === 0 ? "Cette semaine" : n === 1 ? "Semaine prochaine" : "Dans " + n + " semaines") +
               " · " + C.fmtCourt(g) + " → " + C.fmtCourt(C.ajoute(g, 6));
      }
      return el("tr", { class: "groupe-taches" + (g === "retard" ? " retard" : g === lundi ? " actuelle" : "") }, [
        el("td", { colspan: "6" }, [
          el("div", { class: "num-section", text: sous }),
          el("h3", {}, [
            titre,
            el("span", { class: "compte", text: b.n + (b.n > 1 ? " tâches" : " tâche") + " · " + C.fmtJours(b.charge) + " j" })
          ])
        ])
      ]);
    }

    function ligne(t, debut) {
      var a = D.affaire(t.affaireId);
      var teinte = UI.teinte(a ? a.teinte : 1);
      var retard = t.statut !== "termine" && t.echeance < auj;
      var reste = C.diff(auj, t.echeance);

      // Une étiquette par métier, qui sert aussi de bascule : un clic termine
      // cette part-là sans fermer l'autre (l'ingénieur qui boucle son calcul
      // laisse le dessin au planning).
      var gens = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px" });
      [
        { role: "ingenieur", classe: "ing", charge: t.chargeInge, membre: t.ingenieurId, fini: t.finiInge },
        { role: "dessinateur", classe: "des", charge: t.chargeDessin, membre: t.dessinateurId, fini: t.finiDessin }
      ].forEach(function (p) {
        if (!(p.charge > 0)) return;
        var nom = p.membre ? D.nomMembre(p.membre) : "À affecter";
        var label = D.PARTS[p.role].label;
        gens.appendChild(el("button", {
          type: "button",
          class: "etiq " + p.classe + (p.membre ? "" : " a-affecter") + (p.fini ? " finie" : ""),
          "aria-pressed": p.fini ? "true" : "false",
          title: (p.fini ? "Rouvrir le " : "Terminer le ") + label.toLowerCase() + " de « " + t.titre + " »",
          onclick: function () { terminePart(t.id, p.role, !p.fini); }
        }, [
          el("i", { class: "coche", "aria-hidden": "true" }),
          UI.surligne(nom, mots),
          " · " + C.fmtJours(p.charge) + " j"
        ]));
      });

      var rangee = el("tr", { class: "cliquable" + (t.statut === "termine" ? " fini" : ""), tabindex: "0" }, [
        el("td", {}, [el("div", { class: "tache-titre" }, [
          bascules(t),
          el("div", {}, [
            el("div", { class: "principal" }, [UI.surligne(t.titre, mots)]),
            // Affaire concernée, sous le libellé : numéro dans sa teinte, puis nom
            el("div", { class: "affaire-ligne", style: "display:flex;align-items:baseline;gap:8px;margin-top:4px;font-size:13.5px;line-height:1.4;color:var(--texte-doux)" }, [
              el("span", { class: "pastille", style: "color:" + teinte + ";align-self:center", "aria-hidden": "true" }),
              el("span", { class: "num", style: "color:" + teinte + ";font-size:11.5px;letter-spacing:.08em;white-space:nowrap" }, [UI.surligne(a ? a.code : "—", mots)]),
              a ? el("span", {}, [UI.surligne(a.nom, mots)]) : null
            ]),
            t.note ? el("div", { class: "secondaire" }, [UI.surligne(t.note, mots)]) : null
          ])
        ])]),
        el("td", {}, [gens]),
        el("td", {}, [
          el("div", { class: "num", text: C.fmtJours(Calc.chargeTotale(t)) + " j" })
        ]),
        el("td", { class: "num", style: "white-space:nowrap" }, [
          el("div", { text: C.fmtCH(debut) + " →" }),
          el("div", { style: retard ? "color:var(--alerte)" : "color:var(--or)", text: C.fmtCH(t.echeance) }),
          el("div", { class: "secondaire", text: t.statut === "termine" ? "" : (retard ? Math.abs(reste) + " j de retard" : reste === 0 ? "aujourd'hui" : "dans " + reste + " j") })
        ]),
        el("td", {}, [
          el("span", { class: "statut s-" + t.statut }, [el("i", { "aria-hidden": "true" }), UI.surligne(D.STATUTS_TACHE[t.statut], mots)]),
          t.avancement ? el("div", { class: "jauge" }, [el("i", { style: "width:" + t.avancement + "%" })]) : null,
          t.avancement ? el("div", { class: "secondaire", text: t.avancement + " %" }) : null
        ]),
        el("td", { class: "actions" }, [
          UI.boutonIcone("modifier", "Modifier", t.titre, function () { formulaire(t.id); }),
          // Supprimer demande le droit, ou que la tâche nous concerne (même règle qu'en base)
          D.peutEcrireTache(t)
            ? UI.boutonIcone("supprimer", "Supprimer", t.titre, function () { supprime(t); })
            : null
        ])
      ]);

      /* Un clic n'importe où sur la ligne ouvre la fiche rapide : le même volet
         que le tableau de bord, pour régler statut, avancement, affectation ou
         échéance sans passer par le formulaire complet (le crayon, lui, l'ouvre).
         Les boutons de la ligne gardent leur rôle, et une sélection de texte
         n'ouvre rien. */
      rangee.addEventListener("click", function (ev) {
        if (ev.target.closest("button, a, input, label, select, textarea")) return;
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed && rangee.contains(sel.anchorNode)) return;
        fiche(t.id);
      });
      rangee.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" || ev.target !== rangee) return;
        ev.preventDefault();
        fiche(t.id);
      });
      return suivi.marque(rangee, t.id);
    }
  }

  // Début de chaque tâche, calculé une fois par version des données : le
  // rangement par semaine en a besoin pour toutes les tâches, à chaque frappe.
  var debuts = { v: -1, parId: {} };
  function debutDe(t) {
    if (debuts.v !== D.version()) debuts = { v: D.version(), parId: {} };
    return debuts.parId[t.id] || (debuts.parId[t.id] = Calc.debutEffectif(t, D.canton()));
  }

  /* ------------------------------------------------ terminer en un clic */

  var avantFin = {};                                // statut et avancement d'avant la coche, pour revenir en arrière
  var avantCours = {};                              // idem avant le départ de la course

  // Les deux bascules d'avancement, la course au-dessus du pouce
  function bascules(t) {
    return el("div", { class: "tache-bascules" }, [course(t), coche(t)]);
  }

  /**
   * Les parts de la tâche qui me reviennent : le calcul si j'en suis
   * l'ingénieur, le dessin si j'en suis le dessinateur, les deux si je porte
   * tout. Vide si la tâche ne m'est pas confiée (chef de projet, secrétariat) :
   * le pouce ferme alors la tâche entière.
   */
  function partsDe(t, membreId) {
    if (!membreId) return [];
    var out = [];
    if (t.chargeInge > 0 && t.ingenieurId === membreId) out.push("ingenieur");
    if (t.chargeDessin > 0 && t.dessinateurId === membreId) out.push("dessinateur");
    return out;
  }

  function mesParts(t) {
    var moi = D.monMembre();
    return partsDe(t, moi && moi.id);
  }

  // Bouton à bascule : l'icône est pâle tant que le travail est ouvert, dorée une
  // fois fini. Il ferme ce qui me revient — ma part seule si je n'en porte qu'une ;
  // les étiquettes d'affectation, elles, ferment n'importe quelle part.
  function coche(t) {
    var miennes = mesParts(t);
    var fini = miennes.length
      ? miennes.every(function (r) { return t[D.PARTS[r].fini]; })
      : t.statut === "termine";
    var quoi = miennes.length === 1 ? " le " + D.PARTS[miennes[0]].label.toLowerCase() + " de « "
      : miennes.length ? " ma part de « " : " « ";
    return el("button", {
      type: "button", class: "ico ico-coche" + (fini ? " fait" : ""),
      "aria-pressed": fini ? "true" : "false",
      title: (fini ? "Rouvrir" : "Terminer") +
             (miennes.length === 1 ? " le " + D.PARTS[miennes[0]].label.toLowerCase()
              : miennes.length ? " ma part" : " la tâche entière"),
      "aria-label": (fini ? "Rouvrir" : "Terminer") + quoi + t.titre + " »",
      onclick: function () { termine(t.id, !fini); }
    });
  }

  // Bouton à bascule : l'icône est pâle tant que la tâche n'est pas lancée, dorée une fois en cours
  function course(t) {
    var lancee = t.statut === "en_cours";
    return el("button", {
      type: "button", class: "ico ico-course" + (lancee ? " actif" : ""),
      "aria-pressed": lancee ? "true" : "false",
      title: lancee ? "Retirer « En cours »" : "Marquer comme en cours",
      "aria-label": (lancee ? "Retirer « En cours » de « " : "Marquer comme en cours « ") + t.titre + " »",
      onclick: function () { demarre(t.id, !lancee); }
    });
  }

  function demarre(id, lance) {
    var t = D.tache(id);
    if (!t) return;
    var champs;
    if (lance) {
      // Relancée depuis « terminé », la tâche repart à son avancement d'avant la coche, jamais à 100 %
      var repart = t.statut === "termine";
      var avance = repart ? (avantFin[id] ? avantFin[id].avancement : 0) : t.avancement;
      avantCours[id] = { statut: repart ? "a_faire" : t.statut, avancement: avance };
      champs = { statut: "en_cours" };
      if (repart) champs.avancement = avance;
      delete avantFin[id];
    } else {
      champs = avantCours[id] || { statut: "a_faire" };
      delete avantCours[id];
    }
    var retour = champs.statut;
    D.retoucheTache(id, champs).then(function () {
      dessine();
      UI.toast(lance ? "Tâche en cours." : "Statut remis à « " + D.STATUTS_TACHE[retour] + " ».",
        lance ? { label: "Annuler", action: function () { demarre(id, false); } } : null);
    }).catch(function (e) { dessine(); UI.toast(e.message); });
  }

  /**
   * Terminer (ou rouvrir) une seule part : le calcul côté ingénieur, le dessin
   * côté dessinateur. La charge de la part fermée quitte le planning, l'autre
   * y reste ; la tâche ne passe « Terminé » qu'à la dernière part fermée.
   */
  function terminePart(id, role, fait) {
    var t = D.tache(id);
    if (!t) return;
    var champs = {};
    champs[D.PARTS[role].fini] = fait;
    if (fait) avantFin[id] = { statut: t.statut, avancement: t.avancement };
    else if (avantFin[id]) {           // annulation : la tâche retrouve son état d'avant
      champs.statut = avantFin[id].statut;
      champs.avancement = avantFin[id].avancement;
      delete avantFin[id];
    }
    var label = D.PARTS[role].label;
    D.retoucheTache(id, champs).then(function () {
      dessine();
      var apres = D.tache(id);
      UI.toast(fait ? label + " terminé." + (apres && apres.statut === "termine" ? " Tâche terminée." : "")
                    : label + " rouvert.",
        { label: "Annuler", action: function () { terminePart(id, role, !fait); } });
    }).catch(function (e) { dessine(); UI.toast(e.message); });
  }

  function termine(id, fait) {
    var t = D.tache(id);
    if (!t) return;

    /* La tâche m'est confiée : le pouce ne ferme que ce que je fais. Le
       dessinateur qui a rendu ses plans ne clôt pas le calcul de l'ingénieur,
       et l'ingénieur qui a fini sa note laisse le dessin ouvert. */
    var miennes = mesParts(t);
    if (miennes.length && miennes.length < 2) return terminePart(id, miennes[0], fait);
    if (miennes.length === 2) {
      // Je porte les deux : elles se ferment ensemble, en une écriture
      var deux = {};
      deux[D.PARTS.ingenieur.fini] = fait;
      deux[D.PARTS.dessinateur.fini] = fait;
      if (fait) avantFin[id] = { statut: t.statut, avancement: t.avancement };
      else if (avantFin[id]) {
        deux.statut = avantFin[id].statut;
        deux.avancement = avantFin[id].avancement;
        delete avantFin[id];
      }
      D.retoucheTache(id, deux).then(function () {
        dessine();
        UI.toast(fait ? "Tâche terminée." : "Tâche rouverte.",
          { label: "Annuler", action: function () { termine(id, !fait); } });
      }).catch(function (e) { dessine(); UI.toast(e.message); });
      return;
    }

    var champs;
    if (fait) {
      avantFin[id] = { statut: t.statut, avancement: t.avancement };
      champs = { statut: "termine", avancement: 100 };
    } else {
      // Rouverte : l'état d'avant la coche s'il est connu, sinon « en cours »
      champs = avantFin[id] || { statut: "en_cours" };
      delete avantFin[id];
    }
    D.retoucheTache(id, champs).then(function () {
      dessine();
      UI.toast(fait ? "Tâche terminée." : "Tâche rouverte.",
        fait ? { label: "Annuler", action: function () { termine(id, false); } } : null);
    }).catch(function (e) { dessine(); UI.toast(e.message); });
  }

  /** Aucun résultat : dire pourquoi, et proposer la sortie la plus probable. */
  function sansResultat(mots, filtresActifs) {
    var q = barre ? barre.valeur().trim() : "";
    var bloc = el("div", { class: "sans-resultat" });
    if (!q) {
      bloc.appendChild(el("p", { class: "q", text: "Aucune tâche ne correspond" }));
      return bloc;
    }
    bloc.appendChild(el("p", { class: "q" }, ["Rien pour « ", el("em", { text: q }), " »"]));

    var terminees = filtres.masqueTerminees
      ? selection({ terminees: true }).filter(rendu).length : 0;
    if (terminees) {
      bloc.appendChild(el("p", { class: "aide", text: terminees + (terminees > 1 ? " tâches correspondent, terminées ou déjà rendues de ton côté." : " tâche correspond, terminée ou déjà rendue de ton côté.") }));
      bloc.appendChild(el("button", {
        class: "btn btn-or", type: "button", text: "Afficher les terminées",
        onclick: function () { filtres.masqueTerminees = false; rendFiltres(); dessine(); }
      }));
    } else if (filtresActifs) {
      bloc.appendChild(el("p", { class: "aide", text: "La recherche porte sur les tâches filtrées." }));
      bloc.appendChild(el("button", {
        class: "btn btn-or", type: "button", text: "Retirer les filtres",
        onclick: function () { filtres.affaire = ""; filtres.membre = ""; filtres.statut = ""; rendFiltres(); dessine(); }
      }));
    } else {
      bloc.appendChild(el("p", { class: "aide", text: "La recherche porte sur le libellé, la note, l'affaire, les personnes et le statut." }));
    }
    return bloc;
  }

  /* ------------------------------------------------------------ formulaire */

  // Formulaire commun avec le tableau de bord (ui.js) : il s'ouvre sur place des deux côtés
  function formulaire(idTache) {
    UI.formulaireTache(idTache, { affaireId: filtres.affaire, surEnregistrement: dessine });
  }

  /* Fiche rapide, elle aussi commune au tableau de bord : la tâche entière,
     avec une affectation et une case par part chargée. */
  function fiche(idTache) {
    UI.ficheTache(idTache, { surEnregistrement: dessine });
  }

  function supprime(t) {
    UI.confirme("Supprimer la tâche ?", t.titre, "Supprimer", true).then(function (ok) {
      if (!ok) return;
      D.suppTache(t.id).then(function () { dessine(); UI.toast("Tâche supprimée."); })
        .catch(function (e) { UI.toast(e.message); });
    });
  }

  /* -------------------------------------------------------------- export */

  function exporteCSV() {
    var lignes = [["Affaire", "Libellé", "Tâche", "Charge ingénieur (j)", "Ingénieur", "Calcul terminé",
                   "Charge dessin (j)", "Dessinateur", "Dessin terminé", "Début", "Échéance", "Statut", "Avancement (%)", "Note"]];
    var oui = function (t, cle, charge) { return t[charge] > 0 ? (t[cle] ? "oui" : "non") : ""; };
    selection().forEach(function (t) {
      var a = D.affaire(t.affaireId);
      lignes.push([
        a ? a.code : "", a ? a.nom : "", t.titre,
        C.fmtJours(t.chargeInge), t.ingenieurId ? D.nomMembre(t.ingenieurId) : "", oui(t, "finiInge", "chargeInge"),
        C.fmtJours(t.chargeDessin), t.dessinateurId ? D.nomMembre(t.dessinateurId) : "", oui(t, "finiDessin", "chargeDessin"),
        C.fmtCH(Calc.debutEffectif(t, D.canton())), C.fmtCH(t.echeance),
        D.STATUTS_TACHE[t.statut], t.avancement, t.note || ""
      ]);
    });
    UI.telecharge("taches-" + C.isoAuj() + ".csv", UI.csv(lignes), "text/csv;charset=utf-8");
    UI.toast("Export CSV généré.");
  }
})();
</script>
