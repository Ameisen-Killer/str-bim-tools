<script>
/* Carte de charge (27.09.2026)
   ---------------------------------------------------------------------------
   Une case par personne et par semaine, teintée selon son taux de charge :
   la question du lundi — qui peut prendre du travail, et quand ça coince —
   se lit en deux secondes. Les chiffres sont ceux du planning : même
   répartition (Calc.repartition), même capacité (jours travaillés, absences,
   fériés du canton, temps partiel).

   Lecture :
     - une seule teinte, l'accent du thème, qui fonce avec la charge (cinq
       paliers) : la couleur dit « combien », jamais « qui » ;
     - la surcharge (> 100 %) prend la couleur d'alerte, porte un « ! » et son
       pourcentage : jamais la couleur seule ;
     - une semaine sans aucun jour travaillé (absence, fériés) est hachurée ;
     - la ligne « Équipe » fait la moyenne de ce qui est affiché, la ligne
       « À affecter » compte les jours qui n'ont encore personne ;
     - « Libre dès » : la première semaine où la personne est sous 70 %.
   Survol : la ligne affiche ses pourcentages, la colonne s'éclaire, une bulle
   détaille la semaine. Clic (ou Entrée) : les tâches de la semaine, chacune
   ouvrant sa fiche rapide.
   Filtre d'affaire : la répartition reste calculée sur tout le travail de
   chacun (c'est lui qui occupe les jours), mais seule la part de l'affaire
   est comptée — « qui travaille sur B12, et quand ».
   --------------------------------------------------------------------------- */
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var CLE_VUE = "planif.carte";
  var vue = { debut: null, semaines: 12, metier: "", affaire: "" };
  var memorise0 = null;
  try { memorise0 = localStorage.getItem(CLE_VUE); Object.assign(vue, JSON.parse(memorise0 || "{}")); } catch (e) {}
  if (!memorise0 && window.innerWidth < 760) vue.semaines = 8;
  vue.semaines = [8, 12, 16, 26].indexOf(+vue.semaines) >= 0 ? +vue.semaines : 12;
  vue.debut = C.lundi(vue.debut || C.isoAuj());
  // Une vue mémorisée qui a vieilli repart de la semaine en cours
  if (C.diff(vue.debut, C.lundi(C.isoAuj())) > 7 * 26) vue.debut = C.lundi(C.isoAuj());

  var SEUIL_LIBRE = 0.7;               // « libre » : sous 70 % de charge
  var sems = [], lignes = [], detail = {};

  function memorise() { try { localStorage.setItem(CLE_VUE, JSON.stringify(vue)); } catch (e) {} }

  if (!UI.session()) return;

  D.pret().then(function () {
    UI.chrome("charge", [
      { label: "Exporter en PDF", icone: "ico-export", action: exportePdf }
    ]);
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");

    document.getElementById("prec").addEventListener("click", function () { decale(-1); });
    document.getElementById("suiv").addEventListener("click", function () { decale(1); });
    document.getElementById("auj").addEventListener("click", function () {
      vue.debut = C.lundi(C.isoAuj()); memorise(); rend();
    });
    var hz = document.getElementById("horizon");
    hz.value = String(vue.semaines);
    hz.addEventListener("change", function () { vue.semaines = +hz.value; memorise(); rend(); });
    var fm = document.getElementById("f-metier");
    fm.value = vue.metier || "";
    fm.addEventListener("change", function () { vue.metier = fm.value; memorise(); rend(); });

    remplitAffaires();
    var fa = document.getElementById("f-affaire");
    fa.addEventListener("change", function () { vue.affaire = fa.value; memorise(); rend(); });

    document.getElementById("f-lisse").replaceWith(UI.caseLissage(rend));

    D.surRechargement(function () { remplitAffaires(); rend(); });
    rend();
  }).catch(UI.echec);

  function remplitAffaires() {
    var fa = UI.vide(document.getElementById("f-affaire"));
    fa.appendChild(el("option", { value: "" }, ["Toutes les affaires"]));
    D.affaires({}).forEach(function (a) {
      fa.appendChild(el("option", { value: a.id }, [a.code + " · " + a.nom]));
    });
    if (vue.affaire && !D.affaire(vue.affaire)) vue.affaire = "";
    fa.value = vue.affaire || "";
  }

  function decale(n) { vue.debut = C.ajoute(vue.debut, 7 * n); memorise(); rend(); }

  /* ---------------------------------------------------------- les chiffres */

  function palier(taux, capacite, charge) {
    if (capacite <= 0) return charge > 0.005 ? "trop" : "ferme";
    if (charge <= 0.005) return "p0";
    if (taux > 1.02) return "trop";
    if (taux > 0.9) return "p5";
    if (taux > 0.75) return "p4";
    if (taux > 0.5) return "p3";
    if (taux > 0.25) return "p2";
    return "p1";
  }

  function pourcent(taux) { return Math.round(taux * 100) + " %"; }

  function calcule() {
    var canton = D.canton();
    var jours = C.serie(vue.debut, vue.semaines * 7);
    sems = Calc.semaines(jours);

    var ouvertes = D.taches({ sansTerminees: true });
    var tous = D.membres({ planifies: true });
    var rep = Calc.repartition(ouvertes, tous, canton);
    var dansAffaire = null;
    if (vue.affaire) {
      dansAffaire = Object.create(null);
      ouvertes.forEach(function (t) { if (t.affaireId === vue.affaire) dansAffaire[t.id] = true; });
    }

    var membres = tous.filter(function (m) { return !vue.metier || D.cote(m.metier) === vue.metier; });
    // Affaire choisie : son équipe, et qui y porte une part ouverte
    if (vue.affaire) {
      var a = D.affaire(vue.affaire), garde = Object.create(null);
      if (a) a.ingenieurs.concat(a.dessinateurs).forEach(function (i) { garde[i] = true; });
      ouvertes.forEach(function (t) {
        if (t.affaireId !== vue.affaire) return;
        if (t.ingenieurId) garde[t.ingenieurId] = true;
        if (t.dessinateurId) garde[t.dessinateurId] = true;
      });
      membres = membres.filter(function (m) { return garde[m.id]; });
    }
    var ORDRE = { ingenieur: 0, dessinateur: 1 };
    function rang(m) { var c = D.cote(m.metier); return c in ORDRE ? ORDRE[c] : 9; }   // 0 est un rang : pas de « || »
    membres = membres.map(function (m, i) { return { m: m, i: i }; })
      .sort(function (x, y) { return rang(x.m) - rang(y.m) || x.i - y.i; })
      .map(function (o) { return o.m; });

    detail = {};
    lignes = membres.map(function (m) {
      var r = rep[m.id] || {};
      var cases = sems.map(function (s) {
        var charge = 0, capacite = 0, absents = 0, parts = {};
        s.jours.forEach(function (j) {
          var cap = Calc.capaciteJour(m, j, canton);
          capacite += cap;
          if (!cap && !C.chome(j, canton) && Calc.absenceLe(m, j)) absents++;
          var cel = r[j];
          if (!cel) return;
          cel.parts.forEach(function (p) {
            if (dansAffaire && !dansAffaire[p.tacheId]) return;
            charge += p.jours;
            var k = p.tacheId + "|" + p.role;
            parts[k] = (parts[k] || 0) + p.jours;
          });
        });
        var taux = capacite > 0 ? charge / capacite : (charge > 0 ? 99 : 0);
        var c = { m: m, s: s, charge: charge, capacite: capacite, taux: taux, absents: absents,
                  palier: palier(taux, capacite, charge), parts: parts };
        detail[m.id + "|" + s.jours[0]] = c;
        return c;
      });
      var libre = null;
      for (var i = 0; i < cases.length; i++) {
        if (cases[i].capacite > 0 && cases[i].taux < SEUIL_LIBRE) { libre = i; break; }
      }
      return { m: m, cases: cases, libre: libre };
    });

    // Charges sans personne, étalées sur les jours ouvrés de leur fenêtre
    var libres = sems.map(function () { return 0; });
    var indexJour = Object.create(null);
    sems.forEach(function (s, k) { s.jours.forEach(function (j) { indexJour[j] = k; }); });
    ouvertes.forEach(function (t) {
      if (vue.affaire && t.affaireId !== vue.affaire) return;
      var fin = Calc.finEffective(t);
      if (!fin) return;
      Calc.nonAffectees(t).forEach(function (na) {
        if (vue.metier && na.role !== vue.metier) return;
        // En retard : la charge repart d'aujourd'hui, comme au planning (Calc.fenetre)
        var f = Calc.fenetre(na.charge, Calc.finPart(t, na.role, canton), null, canton);
        var ouvres = [], j = f.debut, g = 0;
        while (g++ < 800) { if (C.estOuvre(j, canton)) ouvres.push(j); if (j >= f.fin) break; j = C.ajoute(j, 1); }
        if (!ouvres.length) ouvres = [f.fin];
        ouvres.forEach(function (x) { if (x in indexJour) libres[indexJour[x]] += na.charge / ouvres.length; });
      });
    });

    var equipe = sems.map(function (s, k) {
      var ch = 0, cap = 0;
      lignes.forEach(function (l) { ch += l.cases[k].charge; cap += l.cases[k].capacite; });
      return { charge: ch, capacite: cap, taux: cap > 0 ? ch / cap : 0 };
    });
    return { equipe: equipe, libres: libres };
  }

  /* --------------------------------------------------------------- rendu */

  function rend() {
    var totaux = calcule();
    var auj = C.lundi(C.isoAuj());
    var derniere = sems[sems.length - 1];

    // Période, titre, papier
    var p = UI.vide(document.getElementById("periode"));
    p.appendChild(el("b", { text: "S" + sems[0].num + " → S" + derniere.num }));
    p.appendChild(document.createTextNode(" · " + C.fmtCourt(sems[0].jours[0]) + " → " + C.fmtCourt(derniere.jours[derniere.jours.length - 1])));
    UI.defileTexte(document.getElementById("titre-carte"),
      lignes.length + (lignes.length > 1 ? " personnes" : " personne") + " · " + sems.length + " semaines");
    document.getElementById("imp-periode").textContent = p.textContent +
      (vue.affaire && D.affaire(vue.affaire) ? "  ·  " + D.affaire(vue.affaire).code + " seulement" : "");
    document.getElementById("imp-edition").textContent = "édité le " + C.fmtCH(C.isoAuj());

    rendCles(totaux);

    var hote = document.getElementById("carte");
    var premier = !hote.firstChild;
    var avant = UI.photo(hote);
    UI.vide(hote);
    hote.style.setProperty("--n", sems.length);
    hote.classList.toggle("entre", premier);

    // En-tête : mois, puis numéros de semaine
    hote.appendChild(el("div", { class: "cc-coin" }));
    var moisPrec = "";
    sems.forEach(function (s, k) {
      var lundi = s.jours[0], mois = C.fmtMoisCourt ? C.fmtMoisCourt(lundi) : "";
      var actuelle = lundi === auj;
      hote.appendChild(el("div", {
        class: "cc-sem" + (actuelle ? " actuelle" : ""), "data-col": k, role: "columnheader",
        "data-anim": "h|" + lundi, title: "Semaine " + s.num + " · " + C.fmtCourt(lundi) + " → " + C.fmtCourt(C.ajoute(lundi, 6))
      }, [
        el("span", { class: "cc-mois", text: mois !== moisPrec ? mois : "" }),
        el("b", { text: "S" + s.num }),
        el("span", { class: "cc-date", text: C.fmtCourt(lundi) })
      ]));
      moisPrec = mois;
    });
    hote.appendChild(el("div", { class: "cc-sem cc-fin", role: "columnheader" }, [el("b", { text: "Libre dès" })]));

    // Équipe : la moyenne de ce qui est affiché
    ligneSynthese("Équipe", lignes.length ? "Moyenne affichée" : "", totaux.equipe.map(function (e) {
      return { palier: e.capacite > 0 ? palier(e.taux, e.capacite, e.charge) : "ferme", texte: e.capacite > 0 ? pourcent(e.taux) : "",
               bulle: e.capacite > 0 ? C.fmtJours(Math.round(e.charge * 10) / 10) + " j sur " + C.fmtJours(Math.round(e.capacite * 10) / 10) + " j" : "" };
    }), "equipe");

    // À affecter : des jours, pas un taux
    if (totaux.libres.some(function (x) { return x > 0.05; })) {
      ligneSynthese("À affecter", "Jours sans personne", totaux.libres.map(function (x) {
        return { palier: x > 0.05 ? "libre" : "p0", texte: x > 0.05 ? C.fmtJours(Math.round(x * 2) / 2) + " j" : "",
                 bulle: x > 0.05 ? C.fmtJours(Math.round(x * 10) / 10) + " j de travail sans personne" : "" };
      }), "a-affecter");
    }

    var groupe = null;
    lignes.forEach(function (l, r) {
      var cote = D.cote(l.m.metier);
      if (cote !== groupe) {
        groupe = cote;
        hote.appendChild(el("div", { class: "cc-groupe", "data-anim": "g|" + cote, text: cote === "dessinateur" ? "Dessinateurs" : "Ingénieurs" }));
      }
      hote.appendChild(el("div", { class: "cc-nom", "data-anim": "n|" + l.m.id, "data-ligne": r, role: "rowheader" }, [
        el("span", { class: "n", text: l.m.prenom + " " + l.m.nom }),
        el("span", { class: "r", text: D.libelleMetier(l.m.metier) + (l.m.capacite && l.m.capacite < 5 ? " · " + Math.round(l.m.capacite / 5 * 100) + " %" : "") })
      ]));
      l.cases.forEach(function (c, k) {
        hote.appendChild(caseMembre(c, k, r));
      });
      hote.appendChild(el("div", { class: "cc-libre" + (l.libre === null ? " jamais" : l.libre === 0 ? " maintenant" : ""), "data-anim": "l|" + l.m.id },
        [l.libre === null ? "Pas avant S" + (derniere.num + 1) : l.libre === 0 ? "Maintenant" : "S" + sems[l.libre].num]));
    });
    if (!lignes.length) {
      hote.appendChild(el("div", { class: "cc-vide", text: vue.affaire ? "Personne ne travaille sur cette affaire." : "Aucun ingénieur ni dessinateur à afficher." }));
    }

    if (!premier) UI.joue(hote, avant);
    rendLegende();
  }

  function ligneSynthese(titre, sous, cases, classe) {
    var hote = document.getElementById("carte");
    hote.appendChild(el("div", { class: "cc-nom cc-synthese " + classe, "data-anim": "n|" + classe, role: "rowheader" }, [
      el("span", { class: "n", text: titre }), sous ? el("span", { class: "r", text: sous }) : null
    ]));
    cases.forEach(function (c, k) {
      var s = sems[k];
      hote.appendChild(el("div", {
        class: "cc-case cc-synth " + c.palier + " " + classe, "data-col": k, style: "--i:" + k,
        "data-anim": "c|" + classe + "|" + s.jours[0], "data-bulle": c.bulle ? titre + " · S" + s.num + "\n" + c.bulle : "",
        role: "gridcell"
      }, [el("span", { class: "val", text: c.texte })]));
    });
    hote.appendChild(el("div", { class: "cc-libre", "aria-hidden": "true" }));
  }

  function caseMembre(c, k, r) {
    var val = c.palier === "ferme" ? "" : c.palier === "trop" && c.capacite <= 0 ? C.fmtJours(Math.round(c.charge * 10) / 10) + " j" : pourcent(c.taux);
    var etiquette = c.m.prenom + " " + c.m.nom + ", semaine " + c.s.num + " : " +
      (c.palier === "ferme" ? "aucun jour travaillé" : C.fmtJours(Math.round(c.charge * 10) / 10) + " jours sur " + C.fmtJours(Math.round(c.capacite * 10) / 10) + ", " + val) +
      (c.palier === "trop" ? ", surcharge" : "");
    return el("button", {
      type: "button", class: "cc-case " + c.palier, "data-col": k, "data-ligne": r, style: "--i:" + (k + r * 0.35).toFixed(2),
      "data-anim": "c|" + c.m.id + "|" + c.s.jours[0], "data-cle": c.m.id + "|" + c.s.jours[0],
      role: "gridcell", "aria-label": etiquette,
      onclick: function () { ouvreSemaine(c); }
    }, [
      c.palier === "trop" ? el("i", { class: "cc-alerte", "aria-hidden": "true", text: "!" }) : null,
      el("span", { class: "val", text: val })
    ]);
  }

  function rendCles(totaux) {
    var hote = document.getElementById("cles");
    var anciens = [].map.call(hote.querySelectorAll(".cle .v"), function (v) { return v._texte != null ? v._texte : v.textContent; });
    UI.vide(hote);
    var ch = 0, cap = 0, trop = 0;
    lignes.forEach(function (l) { l.cases.forEach(function (c) { ch += c.charge; cap += c.capacite; if (c.palier === "trop") trop++; }); });
    var aAffecter = totaux.libres.reduce(function (s, x) { return s + x; }, 0);
    var taux = cap > 0 ? Math.round(ch / cap * 100) : 0;
    var rang = 0;
    function cle(v, l, classe) {
      var valeur = el("div", { class: "v" });
      hote.appendChild(el("div", { class: "cle" + (classe ? " " + classe : "") }, [valeur, el("div", { class: "l", text: l })]));
      UI.defileTexte(valeur, v, anciens[rang++]);
    }
    cle(taux + " %", "Taux moyen", taux > 100 ? "alerte" : "or");
    cle(C.fmtJours(Math.round(Math.max(0, cap - ch))), "Jours encore libres", "");
    cle(C.fmtJours(Math.round(aAffecter)), "Jours à affecter", aAffecter > 0.5 ? "or" : "");
    cle(String(trop), trop > 1 ? "Semaines en surcharge" : "Semaine en surcharge", trop ? "alerte" : "");
  }

  function rendLegende() {
    var hote = UI.vide(document.getElementById("legende"));
    [["p1", "< 25 %"], ["p2", "25 – 50 %"], ["p3", "50 – 75 %"], ["p4", "75 – 90 %"], ["p5", "90 – 100 %"]].forEach(function (x) {
      hote.appendChild(el("span", {}, [el("i", { class: "cc-ech " + x[0], "aria-hidden": "true" }), x[1]]));
    });
    hote.appendChild(el("span", {}, [el("i", { class: "cc-ech trop", "aria-hidden": "true" }, [el("b", { text: "!" })]), "Surcharge"]));
    hote.appendChild(el("span", {}, [el("i", { class: "cc-ech ferme", "aria-hidden": "true" }), "Aucun jour travaillé"]));
    hote.appendChild(el("span", { text: "Libre dès : première semaine sous " + Math.round(SEUIL_LIBRE * 100) + " %" }));
  }

  /* ------------------------------------------------ survol : ligne, colonne, bulle */

  var bulle = null, survolee = null;
  function montreBulle(cell) {
    if (!bulle) { bulle = el("div", { class: "cc-bulle", role: "tooltip" }); document.body.appendChild(bulle); }
    UI.vide(bulle);
    var cle = cell.getAttribute("data-cle"), c = cle ? detail[cle] : null;
    if (c) {
      var lundi = c.s.jours[0];
      bulle.appendChild(el("div", { class: "t", text: c.m.prenom + " " + c.m.nom }));
      bulle.appendChild(el("div", { class: "s", text: "Semaine " + c.s.num + " · " + C.fmtCourt(lundi) + " → " + C.fmtCourt(C.ajoute(lundi, 4)) }));
      if (c.palier === "ferme") bulle.appendChild(el("div", { class: "v", text: "Aucun jour travaillé" }));
      else bulle.appendChild(el("div", { class: "v" + (c.palier === "trop" ? " alerte" : "") }, [
        el("b", { text: c.capacite > 0 ? pourcent(c.taux) : "Surcharge" }),
        "  " + C.fmtJours(Math.round(c.charge * 10) / 10) + " j sur " + C.fmtJours(Math.round(c.capacite * 10) / 10) + " j"
      ]));
      if (c.absents) bulle.appendChild(el("div", { class: "s", text: "Absent " + c.absents + (c.absents > 1 ? " jours" : " jour") }));
      var parts = Object.keys(c.parts).map(function (k) { return { k: k, j: c.parts[k] }; })
        .sort(function (a, b) { return b.j - a.j; });
      parts.slice(0, 5).forEach(function (x) {
        var t = D.tache(x.k.split("|")[0]); if (!t) return;
        var a = D.affaire(t.affaireId);
        bulle.appendChild(el("div", { class: "p" }, [
          el("span", { class: "code", style: "color:" + UI.teinte(a ? a.teinte : 1), text: a ? a.code : "—" }),
          el("span", { class: "lib", text: t.titre }),
          el("span", { class: "j", text: C.fmtJours(Math.round(x.j * 10) / 10) + " j" })
        ]));
      });
      if (parts.length > 5) bulle.appendChild(el("div", { class: "s", text: "et " + (parts.length - 5) + " autres" }));
      if (parts.length) bulle.appendChild(el("div", { class: "aide", text: "Clic : le détail de la semaine" }));
    } else {
      var texte = cell.getAttribute("data-bulle");
      if (!texte) return cacheBulle();
      texte.split("\n").forEach(function (l, i) { bulle.appendChild(el("div", { class: i ? "v" : "t", text: l })); });
    }
    bulle.classList.add("vue");
    var r = cell.getBoundingClientRect(), b = bulle.getBoundingClientRect();
    var x = Math.min(window.innerWidth - b.width - 8, Math.max(8, r.left + r.width / 2 - b.width / 2));
    var y = r.top - b.height - 10;
    if (y < 8) y = r.bottom + 10;
    bulle.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }
  function cacheBulle() { if (bulle) bulle.classList.remove("vue"); }

  function survole(cell) {
    var hote = document.getElementById("carte");
    if (survolee === cell) return;
    survolee = cell;
    [].forEach.call(hote.querySelectorAll(".col-vue, .ligne-vue"), function (n) { n.classList.remove("col-vue", "ligne-vue"); });
    if (!cell) { cacheBulle(); return; }
    // La colonne s'éclaire, la ligne montre ses pourcentages
    var col = cell.getAttribute("data-col"), ligne = cell.getAttribute("data-ligne");
    [].forEach.call(hote.querySelectorAll('[data-col="' + col + '"]'), function (n) { n.classList.add("col-vue"); });
    if (ligne !== null) [].forEach.call(hote.querySelectorAll('[data-ligne="' + ligne + '"]'), function (n) { n.classList.add("ligne-vue"); });
    montreBulle(cell);
  }
  (function () {
    var hote = document.getElementById("carte");
    hote.addEventListener("pointerover", function (e) {
      if (e.pointerType === "touch") return;
      survole(e.target.closest(".cc-case"));
    });
    hote.addEventListener("pointerleave", function () { survole(null); });
    hote.addEventListener("focusin", function (e) { var c = e.target.closest(".cc-case"); if (c) survole(c); });
    hote.addEventListener("focusout", function () { survole(null); });
    document.getElementById("carte-defile").addEventListener("scroll", function () { survole(null); }, { passive: true });
    window.addEventListener("scroll", function () { if (survolee) survole(null); }, { passive: true });
  })();

  /* ---------------------------------------------------- le détail d'une semaine */

  function ouvreSemaine(c) {
    survole(null);
    var lundi = c.s.jours[0];
    var corps = el("div", {});
    corps.appendChild(el("p", { class: "aide", style: "font-size:14px;margin:0 0 18px;color:var(--texte-doux)" },
      [c.palier === "ferme" ? "Aucun jour travaillé cette semaine." :
        C.fmtJours(Math.round(c.charge * 10) / 10) + " j de travail pour " + C.fmtJours(Math.round(c.capacite * 10) / 10) + " j disponibles" +
        (c.capacite > 0 ? " — " + pourcent(c.taux) + "." : ".") + (c.absents ? " Absent " + c.absents + (c.absents > 1 ? " jours." : " jour.") : "")]));
    var parts = Object.keys(c.parts).map(function (k) { return { k: k, j: c.parts[k] }; }).sort(function (a, b) { return b.j - a.j; });
    if (!parts.length) {
      corps.appendChild(el("p", { style: "color:var(--texte-faible);margin:0", text: "Rien de planifié : de la place pour une nouvelle tâche." }));
    } else {
      var liste = el("div", { class: "cc-detail" });
      parts.forEach(function (x) {
        var id = x.k.split("|")[0], role = x.k.split("|")[1], t = D.tache(id); if (!t) return;
        var a = D.affaire(t.affaireId);
        liste.appendChild(el("button", { type: "button", class: "cc-det", onclick: function () {
          UI.ferme(); UI.ficheTache(t.id, { surEnregistrement: D.redessine });
        } }, [
          el("span", { class: "pal-teinte", style: "background:" + UI.teinte(a ? a.teinte : 1), "aria-hidden": "true" }),
          el("span", { class: "lib" }, [
            el("span", { class: "t", text: t.titre }),
            el("span", { class: "s", text: (a ? a.code + " · " : "") + D.METIERS[role] + " · échéance " + C.fmtCourt(t.echeance) })
          ]),
          el("span", { class: "j", text: C.fmtJours(Math.round(x.j * 10) / 10) + " j" })
        ]));
      });
      corps.appendChild(liste);
    }
    UI.ouvre({
      surtitre: "Semaine " + c.s.num + " · " + C.fmtCourt(lundi) + " → " + C.fmtCourt(C.ajoute(lundi, 4)),
      titre: c.m.prenom + " " + c.m.nom,
      corps: corps, compacte: true,
      boutons: [
        { label: "Ses tâches", gauche: true, action: function () { location.href = "/planif/taches/?membre=" + encodeURIComponent(c.m.id); } },
        { label: "Voir au planning", action: function () { versPlanning(c.m.id, lundi); } },
        { label: "Fermer", or: true, entree: true }
      ]
    });
  }

  /* Le tableau de bord lit sa vue dans le navigateur : on la pose sur la
     semaine et la personne, puis on y va. */
  function versPlanning(idMembre, lundi) {
    var v = {};
    try { v = JSON.parse(localStorage.getItem("planif.vue") || "{}") || {}; } catch (e) {}
    v.debut = lundi; v.membre = idMembre; v.affaire = vue.affaire || "";
    try { localStorage.setItem("planif.vue", JSON.stringify(v)); } catch (e) {}
    location.href = "/planif/planning/";
  }

  function exportePdf() { UI.imprime("Carte de charge " + C.fmtCH(C.isoAuj())); }
})();
</script>
</body>
</html>
