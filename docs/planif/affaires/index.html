/* Le bandeau du haut de la page précédente, posé avant le premier rendu ;
   ui.js (chrome) le remplace à l'identique dès que le profil est lu. De même
   pour la sous-barre du module (planifSousNav, appelée sous l'en-tête). */
(function(){var m="local",d=location.pathname.split("/")[2]||"";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=s&&s.email||"local";var b=JSON.parse(localStorage.getItem("planif.barre:"+m)||"null"),c=document.querySelector("[data-chrome]");if(b&&b.html&&c&&!c.firstChild){c.innerHTML=b.html;c.setAttribute("data-provisoire","");if(b.h)document.documentElement.style.setProperty("--h-chrome",b.h+"px");[].forEach.call(c.querySelectorAll("a[data-dossiers]"),function(a){if((" "+a.getAttribute("data-dossiers")+" ").indexOf(" "+d+" ")>=0)a.setAttribute("aria-current","page");});}}catch(e){}
window.planifSousNav=function(){try{var t=JSON.parse(localStorage.getItem("planif.sousnav:"+m)||"{}")[d],e=document.querySelector("main .entete");if(!t||!e||document.querySelector(".sous-nav-wrap"))return;var w=document.createElement("div");w.className="wrap sous-nav-wrap";w.innerHTML=t;e.parentNode.insertBefore(w,e.nextSibling);var l=w.querySelectorAll("a"),q=location.pathname+location.search,ok=null;[].forEach.call(l,function(a){if(a.getAttribute("href")===q)ok=a;});[].forEach.call(l,function(a){if(!ok&&a.getAttribute("href")===location.pathname)ok=a;});if(ok)ok.setAttribute("aria-current","page");}catch(x){}};})();
</script>

<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var barre = null;                                 // recherche instantanée
  var succursales = [];                             // codes cochés (« _ » : non renseignée) ; aucun : toutes
  var fSucc = null, nbOptSucc = -1;
  var suivi = UI.suiviApparitions();

  if (!UI.session()) return;

  D.pret().then(function () {
    // Ouvrir une affaire demande le droit : sans lui, le bouton ne paraît pas.
    var peutCreer = D.aDroit("affaires_creer");
    // La carte d'abord, à gauche de « Nouvelle affaire » ; sur téléphone, son bouton est dans la page
    var versCarte = { label: "Carte des affaires", icone: "ico-carte", action: function () { location.href = "/planif/carte/"; } };
    UI.chrome("affaires", peutCreer
      ? [versCarte, { label: "Nouvelle affaire", or: true, icone: "ico-ajout-affaire", action: function () { formulaire(null); } }]
      : [versCarte]);
    UI.pied();
    // Collé sous la barre, le bloc de recherche se resserre (planif.css)
    UI.colleSousBarre(document.querySelector(".tete-collante"));
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    document.getElementById("voir-terminees").addEventListener("change", dessine);
    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher une affaire, un numéro, une personne…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) formulaire(l[0].id); }
    });
    succursales = succursalesRetenues();
    rendSuccursales();
    // « Non renseignée » paraît ou disparaît avec la dernière affaire sans succursale
    D.surRechargement(function () { if (optionsSuccursales().length !== nbOptSucc) rendSuccursales(); dessine(); });
    dessine();

    /* « Détail de l'affaire » (fenêtre d'avancement, 13.10.2026) : ?affaire=<id>
       ouvre sa fiche ; la recherche (?q=) l'isole dans la liste derrière. */
    var url = new URL(location.href), demandee = D.affaire(url.searchParams.get("affaire") || "");
    if (url.searchParams.has("affaire")) {
      url.searchParams.delete("affaire");
      history.replaceState(null, "", url.pathname + url.search + url.hash);
    }
    if (demandee) {
      if (demandee.statut === "terminee") { document.getElementById("voir-terminees").checked = true; dessine(); }
      formulaire(demandee.id);
    }
  }).catch(UI.echec);

  /* Le choix des succursales : celles du bureau, plus « Non renseignée » (« _ »,
     qu'aucun code ne peut prendre) dès qu'une affaire n'en a pas. Retenu sur
     cet appareil (13.10.2026). */
  var CLE_SUCC = "planif.affaires.succursales";
  function optionsSuccursales() {
    var o = Object.keys(D.SUCCURSALES).map(function (c) { return { valeur: c, label: D.SUCCURSALES[c] }; });
    if (D.affaires({ tous: true }).some(function (a) { return !a.succursale; })) o.push({ valeur: "_", label: "Non renseignée" });
    return o;
  }
  function retiensSuccursales(v) { try { localStorage.setItem(CLE_SUCC, JSON.stringify(v)); } catch (e) {} }
  function succursalesRetenues() {
    try { var v = JSON.parse(localStorage.getItem(CLE_SUCC) || "[]"); return Array.isArray(v) ? v.map(String) : []; }
    catch (e) { return []; }
  }

  /* Filtre Succursale (13.10.2026) : plusieurs choix, rien de coché = toutes ;
     caché quand il n'offre qu'un choix. */
  function rendSuccursales() {
    var options = optionsSuccursales();
    nbOptSucc = options.length;
    fSucc = UI.multiChoix({
      libelle: "Filtrer : succursales", tous: "Toutes les succursales", pluriel: "succursales",
      options: options, valeurs: succursales,
      surChange: function (v) { succursales = v; retiensSuccursales(v); dessine(); }
    });
    succursales = fSucc.valeurs();
    var hote = UI.vide(document.getElementById("f-succursale"));
    hote.appendChild(fSucc.noeud);
    hote.style.display = options.length > 1 ? "" : "none";
  }

  /* ------------------------------------------------------------- affichage */

  function champsCherches(a) {
    return [a.code, a.nom, a.adresse, a.note, D.STATUTS_AFFAIRE[a.statut], D.libellePhase(a.phase), D.SUCCURSALES[a.succursale]]
      .concat(a.ingenieurs.concat(a.dessinateurs).map(D.nomMembre))
      .concat(a.responsableId ? [D.nomMembre(a.responsableId), "responsable"] : []);
  }

  function selection(opts) {
    opts = opts || {};
    var tous = opts.tous || document.getElementById("voir-terminees").checked;
    var mots = opts.sansTexte || !barre ? [] : barre.termes();
    return D.affaires({ tous: tous }).filter(function (a) {
      if (succursales.length && succursales.indexOf(a.succursale || "_") < 0) return false;
      return UI.correspond(champsCherches(a), mots);
    });
  }

  function dessine() {
    var affaires = selection();
    var mots = barre ? barre.termes() : [];
    var hote = document.getElementById("liste");
    UI.vide(hote);
    suivi.debut();
    if (barre) barre.compte(affaires.length, selection({ sansTexte: true }).length);
    document.getElementById("titre-liste").textContent =
      affaires.length + (affaires.length > 1 ? " affaires" : " affaire");

    if (!affaires.length) {
      var q = barre ? barre.valeur().trim() : "";
      if (!q && succursales.length) {
        hote.appendChild(el("div", { class: "sans-resultat" }, [
          el("p", { class: "q", text: "Aucune affaire dans " + (succursales.length > 1 ? "ces succursales" : "cette succursale") }),
          el("button", { class: "btn btn-or", type: "button", text: "Toutes les succursales",
            onclick: function () { succursales = []; fSucc.pose([]); retiensSuccursales([]); dessine(); } })
        ]));
        return;
      }
      if (!q) {
        hote.appendChild(el("div", { class: "vide", text: "Aucune affaire — commence par en créer une" }));
        return;
      }
      var bloc = el("div", { class: "sans-resultat" }, [el("p", { class: "q" }, ["Rien pour « ", el("em", { text: q }), " »"])]);
      var cachees = document.getElementById("voir-terminees").checked ? 0
        : selection({ tous: true }).filter(function (a) { return a.statut === "terminee"; }).length;
      if (cachees) {
        bloc.appendChild(el("p", { class: "aide", text: cachees + (cachees > 1 ? " affaires terminées correspondent." : " affaire terminée correspond.") }));
        bloc.appendChild(el("button", {
          class: "btn btn-or", type: "button", text: "Voir les affaires terminées",
          onclick: function () { document.getElementById("voir-terminees").checked = true; dessine(); }
        }));
      } else {
        bloc.appendChild(el("p", { class: "aide", text: "La recherche porte sur le numéro, le libellé, l'adresse, la note, la phase, le statut et l'équipe." }));
      }
      hote.appendChild(bloc);
      return;
    }

    var corps = el("tbody");
    affaires.forEach(function (a) {
      var taches = D.taches({ affaireId: a.id });
      var restant = taches.reduce(function (s, t) {
        // Une part déjà bouclée (calcul ou dessin) ne compte plus dans le reste à faire
        return s + Calc.chargeOuverte(t) * (1 - (t.avancement || 0) / 100);
      }, 0);
      var enRetard = taches.filter(function (t) { return t.statut !== "termine" && t.echeance < C.isoAuj(); }).length;
      var t = UI.teinte(a.teinte);

      var equipe = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px" });
      // Un nom cherché s'affiche en entier, pour que le passage trouvé soit visible
      // Le responsable d'affaire (13.10.2026) : en tête, son nom encadré
      function etiquette(m, classe) {
        var cherche = mots.length && UI.correspond([m.prenom + " " + m.nom], mots);
        var nom = cherche ? m.prenom + " " + m.nom : m.prenom + " " + m.nom.charAt(0) + ".";
        var resp = m.id === a.responsableId;
        return el("span", { class: "etiq " + classe + (resp ? " resp" : ""), title: resp ? "Responsable d'affaire" : null }, [UI.surligne(nom, mots)]);
      }
      // Ingénieurs puis dessinateurs, par ordre alphabétique dans chaque groupe
      function tries(ids) { return ids.filter(function (x) { return x !== a.responsableId; }).map(D.membre).filter(Boolean).sort(D.compareMembres); }
      var resp = a.responsableId ? D.membre(a.responsableId) : null;
      if (resp) equipe.appendChild(etiquette(resp, D.cote(resp.metier) === "dessinateur" ? "des" : "ing"));
      tries(a.ingenieurs).forEach(function (m) { equipe.appendChild(etiquette(m, "ing")); });
      tries(a.dessinateurs).forEach(function (m) { equipe.appendChild(etiquette(m, "des")); });
      if (!equipe.childNodes.length) equipe.appendChild(el("span", { class: "secondaire", text: "Aucun membre affecté" }));

      corps.appendChild(suivi.marque(el("tr", {}, [
        el("td", {}, [
          el("div", { style: "display:flex;align-items:center;gap:9px" }, [
            el("span", { class: "pastille", style: "color:" + t, "aria-hidden": "true" }),
            el("span", { class: "num", style: "color:" + t + ";font-size:12px;letter-spacing:.1em" }, [a.code ? UI.surligne(a.code, mots) : el("span", { style: "opacity:.6;letter-spacing:.02em", text: "sans n°" })]),
            // Succursale de l'affaire (13.10.2026)
            D.SUCCURSALES[a.succursale] ? el("span", { class: "secondaire" }, [UI.surligne(D.SUCCURSALES[a.succursale], mots)]) : null
          ]),
          el("div", { class: "principal", style: "margin-top:4px" }, [UI.surligne(a.nom, mots)]),
          a.adresse ? el("div", { class: "secondaire" }, [UI.surligne(a.adresse, mots)]) : null,
          a.note ? el("div", { class: "secondaire" }, [UI.surligne(a.note, mots)]) : null
        ]),
        el("td", {}, [equipe]),
        el("td", {}, [
          el("div", { class: "num", text: taches.length + (taches.length > 1 ? " tâches" : " tâche") }),
          el("div", { class: "secondaire", text: C.fmtJours(restant) + " j restants" }),
          enRetard ? el("div", { class: "secondaire", style: "color:var(--alerte)", text: enRetard + (enRetard > 1 ? " en retard" : " en retard") }) : null
        ]),
        el("td", { class: "num", text: a.echeance ? C.fmtCH(a.echeance) : "—" }),
        el("td", {}, (a.phase ? [
          el("div", { class: "num" }, [UI.surligne(a.phase, mots)]),
          D.PHASES[a.phase] ? el("div", { class: "secondaire" }, [UI.surligne(D.PHASES[a.phase], mots)]) : null
        ] : [el("span", { class: "secondaire", text: "—" })]).concat([resumeMandat(a)])),
        el("td", {}, [
          el("span", { class: "statut s-" + (a.statut === "active" ? "en_cours" : a.statut === "terminee" ? "termine" : "attente") }, [
            el("i", { "aria-hidden": "true" }), UI.surligne(D.STATUTS_AFFAIRE[a.statut], mots)
          ])
        ]),
        el("td", { class: "actions" }, [
          UI.lienIcone("taches", "Tâches", D.libelleAffaire(a), "/planif/taches/?affaire=" + encodeURIComponent(a.id)),
          // Sans adresse, pas de carte : le bouton ne paraît pas
          a.adresse ? UI.lienIcone("carte", "Voir sur Google Maps", a.code + " · " + a.adresse, D.lienCarte(a), true) : null,
          // Avancement (et facturation, pour qui la voit) des phases du mandat
          D.phasesMandat(a).length
            ? UI.boutonIcone("avancement", D.voitFacturation() ? "Avancement et facturation" : "Avancement", D.libelleAffaire(a),
                function () { Mandat.saisie(a.id, { surEnregistrement: dessine, detail: function () { formulaire(a.id); } }); })
            : null,
          UI.boutonIcone("modifier", "Modifier", D.libelleAffaire(a), function () { formulaire(a.id); }),
          // Retirer une affaire emporte ses tâches : le même droit que pour l'ouvrir.
          D.aDroit("affaires_creer")
            ? UI.boutonIcone("supprimer", "Supprimer", D.libelleAffaire(a), function () { supprime(a, taches.length); })
            : null
        ])
      ]), a.id));
    });

    hote.appendChild(el("table", { class: "liste", style: "min-width:940px" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Affaire" }),
        el("th", { text: "Équipe" }),
        el("th", { text: "Charge" }),
        el("th", { text: "Échéance" }),
        el("th", { text: "Phase SIA" }),
        el("th", { text: "Statut" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));
  }

  /* Sous la phase en cours : les phases du mandat et l'avancement moyen */
  function resumeMandat(a) {
    var ph = D.phasesMandat(a);
    if (!ph.length) return null;
    var av = Math.round(ph.reduce(function (s, p) { return s + D.valeurPhase(a, p.phase, "avancement"); }, 0) / ph.length);
    var texte = "Mandat " + ph.map(function (p) { return p.phase; }).join(" ") + " · " + av + " %";
    if (D.voitFacturation()) {
      var fa = Math.round(ph.reduce(function (s, p) { return s + D.valeurPhase(a, p.phase, "facturation"); }, 0) / ph.length);
      texte += " · fact. " + fa + " %";
    }
    return el("div", { class: "secondaire", style: "margin-top:4px;font-size:12.5px", title: "Phases du mandat, avancement moyen" + (D.voitFacturation() ? " et facturation moyenne" : ""), text: texte });
  }

  /* ------------------------------------------------------------ formulaire */

  function formulaire(idAffaire) {
    var a = idAffaire ? D.affaire(idAffaire) : null;
    // Les inactifs déjà dans l'équipe restent proposés (cochés) : absents de la
    // liste, ils étaient retirés de l'affaire sans prévenir à l'enregistrement.
    function candidats(role, deja) {
      return D.membres({ cote: role, tous: true })
        .filter(function (m) { return m.actif || deja.indexOf(m.id) >= 0; })
        .map(function (m) {
          return { valeur: m.id, label: m.prenom + " " + m.nom + (D.aStatut(m, "administrateur") ? " · administrateur" : "") + (m.actif ? "" : " (inactif)") };
        });
    }
    var ings = candidats("ingenieur", a ? a.ingenieurs : []);
    var dess = candidats("dessinateur", a ? a.dessinateurs : []);

    // Teinte : proposer la première libre pour éviter deux affaires identiques
    var prises = D.affaires({ tous: true }).filter(function (x) { return !a || x.id !== a.id; }).map(function (x) { return x.teinte; });
    var libre = 1; while (libre < 8 && prises.indexOf(libre) >= 0) libre++;

    var teintes = el("div", { class: "cases" });
    for (var i = 1; i <= 8; i++) {
      (function (n) {
        var input = el("input", { type: "radio", name: "teinte", value: String(n) });
        input.checked = (a ? a.teinte : libre) === n;
        teintes.appendChild(el("label", {
          class: "case case-teinte", title: "Teinte " + n,
          style: "color:" + UI.teinte(n) + ";border-color:color-mix(in srgb," + UI.teinte(n) + " 40%,transparent)"
        }, [input, el("span", { class: "pastille", "aria-hidden": "true" }), el("span", { class: "sr", text: "Teinte " + n })]));
      })(i);
    }

    var editeurMandat = Mandat.editeur(a ? a.mandat : {});
    var corps = el("div", {}, [
      el("div", { class: "grille-champs" }, [
        UI.champ({ nom: "code", label: "Numéro d'affaire", valeur: a ? a.code : "", exemple: "25-042", aide: "Facultatif : à ajouter plus tard s'il n'est pas encore attribué." }),
        // Phase SIA 112
        UI.champ({
          nom: "phase", label: "Phase SIA", type: "select", valeur: a && a.phase ? a.phase : "",
          options: [{ valeur: "", label: "— Non renseignée —" }]
            .concat(a && a.phase && !D.PHASES[a.phase] ? [{ valeur: a.phase, label: a.phase }] : [])
            .concat(D.ORDRE_PHASES.map(function (p) { return { valeur: p, label: D.libellePhase(p) }; }))
        }),
        UI.champ({ nom: "nom", label: "Libellé", valeur: a ? a.nom : "", exemple: "Immeuble de logements — gros œuvre", large: true }),
        // Un seul champ, tel qu'on le taperait dans Google Maps
        UI.champ({ nom: "adresse", label: "Adresse", valeur: a ? a.adresse : "", exemple: "Rue du Lac 12, 1201 Genève", large: true }),
        UI.champ({
          nom: "statut", label: "Statut", type: "select", valeur: a ? a.statut : "active",
          options: Object.keys(D.STATUTS_AFFAIRE).map(function (k) { return { valeur: k, label: D.STATUTS_AFFAIRE[k] }; })
        }),
        UI.champ({ nom: "echeance", label: "Échéance générale", type: "date", valeur: a ? a.echeance : "", aide: "Facultative : repère d'ensemble." }),
        // Responsable d'affaire (13.10.2026) : une personne de l'équipe du bureau
        UI.champ({
          nom: "responsableId", label: "Responsable d'affaire", type: "select", valeur: a && a.responsableId ? a.responsableId : "",
          options: [{ valeur: "", label: "— Non désigné —" }].concat(UI.optionsParMetier(
            D.membres({ tous: true }).filter(function (m) { return m.actif || (a && m.id === a.responsableId); })))
        }),
        // Succursale (13.10.2026), facultative : une nouvelle affaire prend celle de la personne qui la crée
        champSuccursale(a),
        UI.champ({ nom: "note", label: "Note", type: "textarea", valeur: a ? a.note : "", exemple: "Contexte, points de vigilance…", large: true })
      ]),
      el("fieldset", { style: "margin-top:26px" }, [
        el("div", { class: "legende", text: "Mandat : phases SIA et disciplines" }),
        el("p", { class: "aide", style: "margin:0 0 10px", text: "Coche, pour chaque phase du mandat, les disciplines concernées. L'avancement et la facturation se suivent ensuite phase par phase (bouton jauge de la liste, page Facturation)." }),
        editeurMandat
      ]),
      el("fieldset", { style: "margin-top:26px" }, [
        el("div", { class: "legende", text: "Teinte de l'affaire" }),
        teintes
      ]),
      el("fieldset", { style: "margin-top:26px" }, [
        el("div", { class: "legende", text: "Ingénieurs de l'affaire" }),
        UI.cases("ingenieurs", ings, a ? a.ingenieurs : [])
      ]),
      el("fieldset", { style: "margin-top:22px" }, [
        el("div", { class: "legende", text: "Dessinateurs de l'affaire" }),
        UI.cases("dessinateurs", dess, a ? a.dessinateurs : [])
      ])
    ]);

    UI.ouvre({
      surtitre: a ? "Modifier" : "Nouvelle affaire",
      titre: a ? D.libelleAffaire(a) : "Affaire",
      corps: corps,
      boutons: [
        { label: "Annuler" },
        {
          label: "Enregistrer", or: true, action: function () {
            var v = UI.lit(corps);
            var radio = corps.querySelector("input[name=teinte]:checked");
            v.teinte = radio ? radio.value : 1;
            v.mandat = Mandat.litEditeur(editeurMandat);
            var p = a ? D.majAffaire(a.id, v) : D.ajouteAffaire(v);
            return p.then(function () { dessine(); UI.toast(a ? "Affaire modifiée." : "Affaire créée."); })
              .catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  /** Le choix de la succursale ; absent quand le bureau n'a aucune succursale. */
  function champSuccursale(a) {
    var codes = Object.keys(D.SUCCURSALES);
    if (!codes.length) return null;
    var moi = D.monMembre();
    var valeur = a ? a.succursale : (moi && D.SUCCURSALES[moi.succursale] ? moi.succursale : "");
    return UI.champ({
      nom: "succursale", label: "Succursale", type: "select", valeur: valeur,
      options: [{ valeur: "", label: "— Non renseignée —" }]
        .concat(codes.map(function (c) { return { valeur: c, label: D.SUCCURSALES[c] }; }))
    });
  }

  function supprime(a, nbTaches) {
    UI.confirme(
      "Supprimer l'affaire " + (a.code || "« " + a.nom + " »") + " ?",
      nbTaches ? "Ses " + nbTaches + (nbTaches > 1 ? " tâches seront supprimées" : " tâche sera supprimée") + " en même temps. Cette action est définitive."
        : "Cette action est définitive.",
      "Supprimer", true
    ).then(function (ok) {
      if (!ok) return;
      D.suppAffaire(a.id).then(function () { dessine(); UI.toast("Affaire supprimée."); })
        .catch(function (e) { UI.toast(e.message); });
    });
  }
})();
</script>
</body>
</html>
