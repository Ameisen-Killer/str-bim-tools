<main>
  <!-- Page du module Communication (07.10.2026) : même titre, et la sous-barre
       « Le bureau aujourd'hui » / « Absences et congés » (ui.js) en dessous. -->
  <div class="wrap entete">
    <h1>Communication</h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <!-- en-tête du papier : invisible à l'écran, imprimé en tête du PDF -->
  <div class="wrap entete-impression">
    <h1>Calendrier des absences</h1>
    <div class="ligne">
      <span id="imp-periode"></span>
      <span id="imp-edition"></span>
    </div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <section class="section">
      <!-- La recherche reste sous les yeux quand on descend ; l'en-tête du
           planning se colle juste en dessous (--h-collee). -->
      <div class="tete-collante seule-recherche">
        <div data-recherche></div>
      </div>
      <div class="plan-barre">
        <button class="btn" type="button" id="prec" aria-label="Mois précédent">◀<span class="txt"> Précédent</span></button>
        <button class="btn" type="button" id="auj">Ce mois</button>
        <button class="btn" type="button" id="suiv" aria-label="Mois suivant"><span class="txt">Suivant </span>▶</button>
        <span class="plan-periode" id="periode"></span>
        <span style="flex:1 1 auto"></span>
        <select id="duree" class="btn" style="text-transform:none;letter-spacing:.04em" aria-label="Période affichée">
          <option value="0">1 semaine</option>
          <option value="1">1 mois</option>
          <option value="2">2 mois</option>
          <option value="3">3 mois</option>
        </select>
        <select id="f-metier" class="btn" style="text-transform:none;letter-spacing:.04em" aria-label="Filtrer par métier">
          <option value="">Toute l'équipe</option>
          <option value="ingenieur">Ingénieurs</option>
          <option value="dessinateur">Dessinateurs</option>
          <option value="administratif">Administratifs</option>
        </select>
        <label class="case" style="text-transform:none;letter-spacing:.04em">
          <input type="checkbox" id="f-masque"> Masquer qui n'a rien
        </label>
      </div>

      <!-- Téléphone seulement : la barre du haut y cache ses actions au profit
           du bouton flottant, l'export garde donc un bouton dans la page. -->
      <button class="btn seul-mobile" type="button" id="pdf" style="width:100%;justify-content:center;margin-bottom:16px"><span class="ico-txt ico-export" aria-hidden="true"></span>Exporter en PDF</button>

      <!-- L'en-tête du calendrier vit hors du conteneur qui défile de côté :
           c'est la seule façon qu'il se colle sous la barre du haut quand on
           descend dans la page (dans un conteneur à overflow, « sticky » se
           raccroche au conteneur, qui lui ne défile pas verticalement). Son
           défilement latéral est recopié depuis celui du calendrier. -->
      <div class="plan-tete" id="plan-tete" style="margin-top:28px">
        <div class="plan" id="plan-tete-grille"></div>
      </div>

      <div class="plan-defile" id="plan-defile">
        <div class="plan" id="plan"></div>
      </div>

      <div class="legende-plan">
        <span><i class="cg" aria-hidden="true"></i> Absence</span>
        <span><i class="ch" aria-hidden="true"></i> Jour chômé ou férié</span>
        <span><i class="off" aria-hidden="true"></i> Jour non travaillé</span>
        <span><i class="demi" aria-hidden="true"></i> Demi-journée</span>
        <span><i class="au" aria-hidden="true"></i> Aujourd'hui</span>
        <span>Dernière ligne : nombre d'absents dans la journée</span>
      </div>
    </section>

    <section class="section">
      <div class="tete-section">
        <h2 id="titre-liste">Périodes</h2>
      </div>
      <div class="defile" id="liste"></div>
    </section>
  </div>

<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var CLE_VUE = "planif.absences";
  /* mois : 1 à 3 mois affichés, ou 0 pour une semaine (07.10.2026) ; la
     période part alors du lundi, sinon du premier du mois. */
  var vue = { debut: null, mois: 1, metier: "", masque: false };
  try { Object.assign(vue, JSON.parse(localStorage.getItem(CLE_VUE) || "{}")); } catch (e) {}
  vue.mois = parseInt(vue.mois, 10);
  vue.mois = isNaN(vue.mois) ? 1 : Math.min(3, Math.max(0, vue.mois));
  vue.debut = cale(vue.debut || C.isoAuj());

  var jours = [], lignes = [], jaugeParJour = {}, nomsParJour = {}, joursDe = {};
  // Nom explicite : « barre » est déjà la fonction qui dessine une barre du planning
  var barreRecherche = null;

  function memorise() {
    try { localStorage.setItem(CLE_VUE, JSON.stringify(vue)); } catch (e) {}
  }

  if (!UI.session()) return;

  D.pret().then(function () {
    /* L'export à gauche de « Nouvelle absence » : les deux actions de la page
       sont dans la barre, comme sur la page Tâches. */
    UI.chrome("absences", [
      { label: "Exporter en PDF", icone: "ico-export", action: exportePdf },
      { label: "Nouvelle absence", or: true, icone: "ico-absence", action: nouvelle }
    ]);
    UI.pied();
    // Collée sous la barre, la recherche se resserre (planif.css)
    UI.colleSousBarre(document.querySelector(".tete-collante"));
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");

    document.getElementById("prec").addEventListener("click", function () { decale(-1); });
    document.getElementById("suiv").addEventListener("click", function () { decale(1); });
    document.getElementById("auj").addEventListener("click", function () {
      vue.debut = cale(C.isoAuj()); memorise(); rend();
    });

    var duree = document.getElementById("duree");
    duree.value = String(vue.mois);
    duree.addEventListener("change", function () {
      var avant = vue.mois;
      vue.mois = parseInt(duree.value, 10);
      // Vers la semaine : celle d'aujourd'hui si elle est affichée, sinon la
      // première du mois affiché ; vers les mois : le mois de la semaine affichée.
      if (vue.mois === 0 && avant !== 0) {
        var auj = C.isoAuj(), d = C.premierMois(vue.debut);
        var fin = C.ajoute(C.ajouteMois(d, avant), -1);
        vue.debut = cale(auj >= d && auj <= fin ? auj : C.ajoute(d, 6));
      } else vue.debut = cale(vue.debut);
      memorise(); rend();
    });

    var fr = document.getElementById("f-metier");
    fr.value = vue.metier || "";
    fr.addEventListener("change", function () { vue.metier = fr.value; memorise(); rend(); });

    var fm = document.getElementById("f-masque");
    fm.checked = !!vue.masque;
    fm.addEventListener("change", function () { vue.masque = fm.checked; memorise(); rend(); });

    document.getElementById("pdf").addEventListener("click", exportePdf);

    barreRecherche = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher un nom, un métier, une succursale, un motif d'absence…",
      surSaisie: rend,
      surEntree: function () { if (lignes.length === 1) UI.absences(lignes[0].id, rend); }
    });

    D.surRechargement(rend);
    rend();
  }).catch(UI.echec);

  function decale(n) {
    vue.debut = vue.mois === 0 ? C.ajoute(vue.debut, 7 * n) : C.ajouteMois(vue.debut, n);
    memorise(); rend();
  }

  /** Début de la période qui contient la date : lundi en vue semaine, premier du mois sinon. */
  function cale(j) { return vue.mois === 0 ? C.lundi(j) : C.premierMois(j); }

  /** Les boutons parlent de semaine ou de mois selon la vue. */
  function libellesBoutons() {
    var sem = vue.mois === 0;
    document.getElementById("auj").textContent = sem ? "Cette semaine" : "Ce mois";
    document.getElementById("prec").setAttribute("aria-label", sem ? "Semaine précédente" : "Mois précédent");
    document.getElementById("suiv").setAttribute("aria-label", sem ? "Semaine suivante" : "Mois suivant");
  }

  function nouvelle() { UI.nouvelleAbsence({ surChangement: rend }); }

  // Passage téléphone <-> ordinateur : la largeur des colonnes change
  var etroit = window.matchMedia("(max-width:640px)");
  var surChangement = function () { if (jours.length) rend(); };
  if (etroit.addEventListener) etroit.addEventListener("change", surChangement);
  else if (etroit.addListener) etroit.addListener(surChangement);

  /* L'en-tête collé suit le calendrier quand on défile de côté. */
  (function () {
    var defile = document.getElementById("plan-defile"), tete = document.getElementById("plan-tete");
    defile.addEventListener("scroll", function () { tete.scrollLeft = defile.scrollLeft; }, { passive: true });
  })();

  /* --------------------------------------------------------------- rendu */

  function rend() {
    var canton = D.canton();
    libellesBoutons();
    var fin = vue.mois === 0 ? C.ajoute(vue.debut, 6) : C.ajoute(C.ajouteMois(vue.debut, vue.mois), -1);
    jours = C.serie(vue.debut, C.diff(vue.debut, fin) + 1);
    var premier = jours[0], dernier = jours[jours.length - 1];

    // Regroupés par métier, par ordre alphabétique dans chacun
    var tous = [].concat.apply([], D.parMetier(D.membres({ metier: vue.metier || null })).map(function (g) { return g.membres; }));

    /* La recherche retire des lignes du calendrier : tout ce qui suit — jauge
       du bas, liste des périodes — porte donc sur ce qui reste affiché,
       comme le fait déjà le filtre par métier. */
    var mots = barreRecherche ? barreRecherche.termes() : [];
    var membres = !mots.length ? tous : tous.filter(function (m) {
      return UI.correspond(champsMembre(m).concat(motifsDe(m, premier, dernier)), mots);
    });
    if (barreRecherche) barreRecherche.compte(membres.length, tous.length);

    /* Une seule traversée pour tout ce qui suit : les jours d'absence de
       chacun, et le nombre d'absents jour par jour. Un congé posé un dimanche,
       un jour férié ou un jour où la personne ne travaille pas ne compte pas :
       elle n'aurait pas travaillé. Une demi-journée compte pour moitié. */
    jaugeParJour = {}; nomsParJour = {}; joursDe = {};
    membres.forEach(function (m) {
      var n = 0;
      jours.forEach(function (j) {
        if (!Calc.absenceLe(m, j) || !C.estOuvre(j, canton)) return;
        var p = Calc.poidsJour(m, j);
        if (!p) return;
        n += p;
        jaugeParJour[j] = (jaugeParJour[j] || 0) + 1;
        (nomsParJour[j] || (nomsParJour[j] = [])).push(m.prenom + " " + m.nom);
      });
      joursDe[m.id] = n;
    });

    lignes = vue.masque ? membres.filter(function (m) { return joursDe[m.id] > 0; }) : membres;

    var periodes = D.absences({ depuis: premier, jusqu: dernier, metier: vue.metier || null });
    // Une période se retient sur son propre motif : chercher « vacances » ne
    // fait pas remonter la maladie de la même personne.
    if (mots.length) periodes = periodes.filter(function (p) {
      return UI.correspond(champsMembre(p.membre).concat(p.absence.motif), mots);
    });

    rendPeriode(membres.length);
    rendPlan(canton);
    rendListe(periodes);
  }

  /** Ce qui, dans un membre, peut être cherché : son identité et son rattachement. */
  function champsMembre(m) {
    return [m.prenom + " " + m.nom, D.libelleMetier(m.metier),
            D.SUCCURSALES[m.succursale], D.DISCIPLINES[m.discipline]];
  }

  /** Les motifs de ses absences qui touchent la période affichée. */
  function motifsDe(m, premier, dernier) {
    return m.absences.filter(function (a) {
      return a.debut <= dernier && (a.fin || a.debut) >= premier;
    }).map(function (a) { return a.motif; });
  }

  function libellePeriode() {
    if (vue.mois === 0) {
      var a = jours[0], b = jours[jours.length - 1];
      return "Semaine " + C.semaineISO(a).num + " · " + (a.slice(0, 7) === b.slice(0, 7)
        ? C.quantieme(a) + " – " + C.quantieme(b) + " " + C.fmtMois(b)
        : C.fmtCourt(a) + " – " + C.fmtCourt(b) + " " + b.slice(0, 4));
    }
    var m = C.mois(jours);
    return m.length === 1 ? C.fmtMois(jours[0]) : C.fmtMois(jours[0]) + " → " + C.fmtMois(jours[jours.length - 1]);
  }

  function libelleMetier() {
    return vue.metier ? D.libelleMetier(vue.metier) + "s" : "Toute l'équipe";
  }

  function rendPeriode(nbMembres) {
    var p = UI.vide(document.getElementById("periode"));
    p.appendChild(el("b", { text: libellePeriode() }));

    var cherche = barreRecherche && barreRecherche.valeur().trim();
    document.getElementById("imp-periode").textContent =
      libellePeriode() + "  ·  " + C.fmtCH(jours[0]) + " → " + C.fmtCH(jours[jours.length - 1]) + "  ·  " + libelleMetier() +
      (cherche ? "  ·  « " + cherche + " »" : "");
    document.getElementById("imp-edition").textContent =
      nbMembres + (nbMembres > 1 ? " membres" : " membre") + "  ·  édité le " + C.fmtCH(C.isoAuj());
  }

  /* ---------------------------------------------------------- calendrier */

  function rendPlan(canton) {
    var plan = UI.vide(document.getElementById("plan"));
    var tete = UI.vide(document.getElementById("plan-tete-grille"));
    var n = jours.length, auj = C.isoAuj(), premier = jours[0];

    // Samedi et dimanche à demi-largeur : on n'y travaille pas, la place va aux jours ouvrés.
    var nWeekend = jours.filter(C.estWeekend).length, nOuvre = n - nWeekend;
    var cols = jours.map(function (j) {
      return C.estWeekend(j) ? "minmax(0,.5fr)" : "minmax(0,1fr)";
    }).join(" ");
    var mini = etroit.matches
      ? Math.max(320, nOuvre * 20 + nWeekend * 10) + "px"
      : Math.max(760, 186 + nOuvre * 26 + nWeekend * 13) + "px";

    // Deux grilles, mêmes colonnes : l'en-tête reste aligné sur les barres.
    // « dense » suit aussi : c'est lui qui, sur le papier, ne garde que les lundis.
    [plan, tete].forEach(function (g) {
      g.style.setProperty("--n", n);
      g.style.setProperty("--cols", cols);
      g.style.minWidth = mini;
      g.classList.toggle("dense", n > 45);
    });

    /* ---- en-tête : mois, semaines, puis jours ---- */
    tete.appendChild(el("div", { class: "pl-nom pl-tete-nom" }, [
      el("div", { class: "pl-membre" }, [el("span", { class: "r", text: libelleMetier() })])
    ]));

    var lignesMois = el("div", { class: "pl-sems" });
    C.mois(jours).forEach(function (mo) {
      lignesMois.appendChild(el("div", {
        class: "pl-mois", style: "--span:" + mo.jours.length,
        text: mo.jours.length > 10 || (vue.mois === 0 && mo.jours.length > 3) ? C.fmtMois(mo.premier) : C.fmtMoisCourt(mo.premier)
      }));
    });

    // Au-delà d'un mois, « Semaine 36 » ne tient plus dans sept colonnes : « S36 ».
    var court = n > 45;
    var lignesSem = el("div", { class: "pl-sems" });
    Calc.semaines(jours).forEach(function (s) {
      var actuelle = s.jours.indexOf(auj) >= 0;
      lignesSem.appendChild(el("div", {
        class: "pl-sem" + (actuelle ? " actuelle" : ""),
        style: "--span:" + s.jours.length,
        text: court || s.jours.length <= 3 ? "S" + s.num : "Semaine " + s.num
      }));
    });

    var lignesJour = el("div", { class: "pl-jours" });
    jours.forEach(function (j) {
      var motif = C.chome(j, canton);
      // Les lundis sont marqués : sur trois mois, le papier ne garde qu'eux
      // comme repères, sinon les quantièmes se touchent.
      var lundi = C.jourCourt(j) === "Lu";
      lignesJour.appendChild(el("div", {
        class: "pl-jour" + (motif ? " chome" : "") + (j === auj ? " auj" : "") + (lundi ? " lu" : ""),
        title: motif || C.fmtLong(j)
      }, [
        el("span", { class: "j", text: C.jourCourt(j) }),
        el("b", { text: String(C.quantieme(j)) })
      ]));
    });

    tete.appendChild(el("div", { class: "pl-zone pl-tete-zone" }, [lignesMois, lignesSem, lignesJour]));

    /* ---- une ligne par membre ---- */
    if (!lignes.length) {
      plan.appendChild(el("div", { class: "pl-nom" }));
      plan.appendChild(el("div", { class: "pl-zone" }, [
        el("div", { class: "vide", text: barreRecherche && barreRecherche.valeur().trim() ? "Personne ne correspond à cette recherche"
          : vue.masque ? "Personne n'est absent sur la période" : "Aucun membre à afficher" })
      ]));
      return;
    }

    var groupeCourant = null;
    function metierDe(m) { return D.METIERS[m.metier] ? m.metier : ""; }
    lignes.forEach(function (m) {
      // Un intertitre à chaque changement de métier, comme au tableau de bord
      if (metierDe(m) !== groupeCourant) {
        groupeCourant = metierDe(m);
        var nbGroupe = lignes.filter(function (x) { return metierDe(x) === groupeCourant; }).length;
        plan.appendChild(el("div", { class: "pl-groupe" }, [
          el("div", {}, [
            el("div", { class: "num-section", text: nbGroupe + (nbGroupe > 1 ? " membres" : " membre") }),
            el("h3", { text: D.TITRES_METIERS[groupeCourant] })
          ])
        ]));
      }
      var nb = joursDe[m.id];
      plan.appendChild(el("div", { class: "pl-nom" }, [
        el("div", { class: "pl-membre" }, [
          el("div", {}, [
            el("div", { class: "n", text: m.prenom + " " + m.nom }),
            el("div", { class: "r", text: D.libelleMetier(m.metier) }),
            el("div", { class: "c", text: nb ? C.fmtJours(nb) + " j d'absence" : "—" })
          ])
        ])
      ]));

      var fond = el("div", { class: "pl-fond", "aria-hidden": "true" });
      jours.forEach(function (j) {
        var classes = [];
        if (C.chome(j, canton)) classes.push("chome");
        else {
          var p = Calc.poidsJour(m, j);                 // semaine type : jour off, demi-journée
          if (!p) classes.push("off");
          else if (p < 1) classes.push("demi");
        }
        if (j === auj) classes.push("auj");
        fond.appendChild(el("i", { class: classes.join(" ") }));
      });

      var piste = el("div", { class: "pl-piste" });
      var periodes = m.absences.filter(function (a) {
        return (a.fin || a.debut) >= premier && a.debut <= jours[n - 1];
      }).slice().sort(function (x, y) { return x.debut < y.debut ? -1 : 1; });

      var pistesFin = [];                       // dernière colonne occupée par piste
      periodes.forEach(function (a) {
        var fin = a.fin || a.debut;
        var d = a.debut < premier ? premier : a.debut;
        var f = fin > jours[n - 1] ? jours[n - 1] : fin;
        var c1 = C.diff(premier, d) + 1, c2 = C.diff(premier, f) + 1;
        var cn = Math.max(1, c2 - c1 + 1);

        var l = 0;
        while (l < pistesFin.length && pistesFin[l] >= c1) l++;
        pistesFin[l] = c1 + cn - 1;

        piste.appendChild(barre(m, a, c1, cn, l + 1, canton, d, f));
      });
      // Ligne vide laissée nue : sur une équipe entière, répéter « aucune
      // absence » à chaque ligne remplit le calendrier de bruit.

      plan.appendChild(el("div", { class: "pl-zone", dataset: { membre: m.id } }, [fond, piste]));
    });

    /* ---- dernière ligne : combien d'absents chaque jour ---- */
    plan.appendChild(el("div", { class: "pl-nom" }, [
      el("div", { class: "pl-membre" }, [el("span", { class: "r", text: "Absents" })])
    ]));

    var seuil = Math.max(2, Math.ceil(lignes.length / 3));
    var compte = el("div", { class: "cal-compte" });
    jours.forEach(function (j) {
      var nbj = jaugeParJour[j] || 0;
      var chome = !!C.chome(j, canton);
      compte.appendChild(el("i", {
        class: chome ? "chome" : nbj === 0 ? "vide" : nbj >= seuil ? "fort" : "",
        title: nbj ? C.fmtLong(j) + " : " + nomsParJour[j].join(", ") : C.fmtLong(j),
        text: chome || !nbj ? "·" : String(nbj)
      }));
    });
    plan.appendChild(el("div", { class: "pl-zone" }, [compte]));
  }

  /* La barre porte les jours ouvrés VISIBLES, pas ceux de toute la période :
     c'est ce que compte la ligne du membre. La période
     entière, elle, est rappelée dans l'infobulle et dans la liste du bas. */
  function barre(m, a, c1, cn, ligne, canton, visibleDe, visibleA) {
    var fin = a.fin || a.debut;
    var deborde = a.debut < visibleDe || fin > visibleA;
    // Au poids de la semaine type : le mercredi off d'un temps partiel ne se compte pas
    var ouvres = Calc.joursTravaillesEntre(m, visibleDe, visibleA, canton);
    var total = Calc.joursTravaillesEntre(m, a.debut, fin, canton);
    var classes = ["bt", "conge"];
    if (cn <= 2) classes.push("etroite");
    if (a.debut < visibleDe) classes.push("deb-g");
    if (fin > visibleA) classes.push("deb-d");

    var n = el("div", {
      class: classes.join(" "),
      style: "--c1:" + c1 + ";--cn:" + cn + ";--l:" + ligne,
      tabindex: "0", role: "button",
      title: m.prenom + " " + m.nom + "\n" + a.motif + "\n" +
             C.fmtCH(a.debut) + " → " + C.fmtCH(fin) + "\n" +
             C.fmtJours(total) + (total > 1 ? " jours ouvrés" : " jour ouvré") +
             (deborde ? "\nDont " + C.fmtJours(ouvres) + " sur la période affichée" : "")
    }, [
      el("span", { class: "mot", text: a.motif }),
      el("span", { class: "jr", text: C.fmtJours(ouvres) + " j" })
    ]);

    n.addEventListener("click", function () { UI.absences(m.id, rend); });
    n.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); UI.absences(m.id, rend); }
    });
    return n;
  }

  /* --------------------------------------------------------- liste plate */

  function rendListe(periodes) {
    var hote = UI.vide(document.getElementById("liste"));
    document.getElementById("titre-liste").textContent =
      periodes.length ? "Périodes · " + periodes.length : "Périodes";

    if (!periodes.length) {
      hote.appendChild(el("div", { class: "vide",
        text: barreRecherche && barreRecherche.valeur().trim() ? "Aucune absence pour cette recherche" : "Aucune absence sur la période" }));
      return;
    }

    var canton = D.canton();
    var corps = el("tbody");
    periodes.forEach(function (p) {
      var m = p.membre, a = p.absence, fin = a.fin || a.debut;
      var ouvres = Calc.joursTravaillesEntre(m, a.debut, fin, canton);
      corps.appendChild(el("tr", {}, [
        el("td", {}, [
          el("div", { class: "principal", text: m.prenom + " " + m.nom }),
          el("div", { class: "secondaire", text: D.libelleMetier(m.metier) })
        ]),
        el("td", { text: a.motif }),
        el("td", { class: "num", text: C.fmtCH(a.debut) + " → " + C.fmtCH(fin) }),
        el("td", { class: "num", text: C.fmtJours(ouvres) + (ouvres > 1 ? " jours ouvrés" : " jour ouvré") }),
        el("td", { class: "actions" }, [
          UI.boutonIcone("modifier", "Modifier", m.prenom + " " + m.nom + " · " + a.motif, function () { UI.absences(m.id, rend); })
        ])
      ]));
    });

    hote.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Membre" }),
        el("th", { text: "Motif" }),
        el("th", { text: "Période" }),
        el("th", { text: "Durée" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));
  }

  /* -------------------------------------------------------------- export */

  function exportePdf() {
    var debut = jours[0].slice(0, 7), fin = jours[jours.length - 1].slice(0, 7);
    UI.imprime("absences-" + debut + (fin === debut ? "" : "_" + fin));
  }
})();
</script>
</body>
</html>
