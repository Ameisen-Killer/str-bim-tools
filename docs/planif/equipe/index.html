   ui.js (chrome) le remplace à l'identique dès que le profil est lu. De même

(function(){var m="local",d=location.pathname.split("/")[2]||"";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=s&&s.email||"local";var b=JSON.parse(localStorage.getItem("planif.barre:"+m)||"null"),c=document.querySelector("[data-chrome]");if(b&&b.html&&c&&!c.firstChild){c.innerHTML=b.html;c.setAttribute("data-provisoire","");if(b.h)document.documentElement.style.setProperty("--h-chrome",b.h+"px");[].forEach.call(c.querySelectorAll("a[data-dossiers]"),function(a){if((" "+a.getAttribute("data-dossiers")+" ").indexOf(" "+d+" ")>=0)a.setAttribute("aria-current","page");});}}catch(e){}
window.planifSousNav=function(){try{var t=JSON.parse(localStorage.getItem("planif.sousnav:"+m)||"{}")[d],e=document.querySelector("main .entete");if(!t||!e||document.querySelector(".sous-nav-wrap"))return;var w=document.createElement("div");w.className="wrap sous-nav-wrap";w.innerHTML=t;e.parentNode.insertBefore(w,e.nextSibling);var l=w.querySelectorAll("a"),q=location.pathname+location.search,ok=null;[].forEach.call(l,function(a){if(a.getAttribute("href")===q)ok=a;});[].forEach.call(l,function(a){if(!ok&&a.getAttribute("href")===location.pathname)ok=a;});if(ok)ok.setAttribute("aria-current","page");}catch(x){}};})();
</script>

<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var barre = null;                                 // recherche instantanée
  var suivi = UI.suiviApparitions();
  var CLE_FILTRES = "planif.equipe.filtres";
  var CLE_AFFAIRE = "planif.equipe.affaire";         // ancien réglage, repris une fois
  /* Menus à cases (14.10.2026) : les codes cochés, rien de coché = tout.
     « _ » pour une succursale ou une discipline non renseignée. Les
     succursales réduisent les menus Discipline et Affaire. */
  var filtres = { succursales: [], disciplines: [], groupes: [], affaires: [] };

  // Une section par métier. Les membres pas encore désignés viennent en tête :
  // c'est là qu'il reste du travail. Les statuts, eux, se cumulent : ils ne
  // rangent personne dans une section, ils s'affichent en étiquettes.
  var SECTIONS = [
    // fixe : le titre ne s'accorde pas — « 2 À désigner », comme au calendrier des absences (14.10.2026)
    { metier: "", titre: "À désigner", sing: "membre à désigner", plur: "membres à désigner", fixe: "À désigner", masqueSiVide: true },
    { metier: "ingenieur", titre: "Ingénieurs", sing: "ingénieur", plur: "ingénieurs" },
    { metier: "dessinateur", titre: "Dessinateurs", sing: "dessinateur", plur: "dessinateurs" },
    { metier: "administratif", titre: "Administratifs", sing: "administratif", plur: "administratifs" }
  ];

  if (!UI.session()) return;

  D.pret().then(function () {
    // Les fiches se tiennent dans la console : d'ici, on consulte, on pose les
    // absences et chacun règle ses jours travaillés.
    var p = D.profil();
    var actions = [];
    if (p && p.superAdmin) actions.push({ label: "Console", or: true, icone: "ico-ajout-membre", action: function () { location.href = "/planif/console/#utilisateurs"; } });
    if (D.monMembre()) actions.push({ label: "Mes jours", or: !actions.length, icone: "ico-jours", action: function () { UI.joursTravailles(null, dessine); } });
    UI.chrome("equipe", actions);
    UI.pied();
    // Collé sous la barre, le bloc de recherche se resserre (planif.css)
    UI.colleSousBarre(document.querySelector(".tete-collante"));
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    document.getElementById("btn-filtres").addEventListener("click", function () {
      var ouvert = document.getElementById("filtres").classList.toggle("ouvert");
      this.setAttribute("aria-expanded", String(ouvert));
    });
    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher un nom, un métier, un statut, un téléphone, une absence…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) UI.absences(l[0].id, dessine); }
    });

    var lu = {};
    try { lu = JSON.parse(localStorage.getItem(CLE_FILTRES) || "{}") || {}; } catch (e) {}
    try { if (!lu.affaire && !lu.affaires) lu.affaire = localStorage.getItem(CLE_AFFAIRE) || ""; } catch (e) {}
    // Anciens réglages à une seule valeur (succursale, discipline, statut, affaire) repris en cases cochées
    [["succursales", "succursale"], ["disciplines", "discipline"], ["groupes", "statut"], ["affaires", "affaire"]].forEach(function (c) {
      var v = Array.isArray(lu[c[0]]) ? lu[c[0]] : (lu[c[1]] ? [lu[c[1]]] : []);
      filtres[c[0]] = v.map(String);
    });

    rendFiltres();
    D.surRechargement(dessine);
    dessine();

    /* Arrivée depuis un jour off de l'accueil (14.10.2026) : ?jours=<membre>
       ouvre ses jours travaillés. */
    var versJours = new URLSearchParams(location.search).get("jours");
    if (versJours) {
      history.replaceState(null, "", location.pathname + location.hash);
      if (D.membre(versJours)) UI.joursTravailles(versJours, dessine);
    }
  }).catch(UI.echec);

  function memorise() {
    try { localStorage.setItem(CLE_FILTRES, JSON.stringify(filtres)); } catch (e) {}
  }

  /* --------------------------------------------------------------- filtres
     Rangés comme ceux de la page Tâches (14.10.2026) : Succursale,
     Discipline, Rôle (les groupes de la fiche « groupes ») et Affaire, tous
     en menus à cases. */

  /** Dans une des succursales cochées (aucune cochée : tout passe). */
  function dansSuccursales(x) {
    return !filtres.succursales.length || (!!x && filtres.succursales.indexOf(x.succursale || "_") >= 0);
  }

  /* Les succursales du bureau, plus « Non renseignée » (« _ », qu'aucun code
     ne peut prendre) dès qu'une fiche n'en a pas. */
  function optionsSuccursales() {
    var o = Object.keys(D.SUCCURSALES).map(function (c) { return { valeur: c, label: D.SUCCURSALES[c] }; });
    if (D.membres({ tous: true }).some(function (m) { return !m.succursale; })) o.push({ valeur: "_", label: "Non renseignée" });
    return o;
  }

  /** Disciplines proposées : celles des succursales cochées (toutes si aucune, ou « Non renseignée »),
   *  plus « Non renseignée » dès qu'une fiche n'en a pas. */
  function optionsDisciplines() {
    var codes = filtres.succursales, cles;
    if (!codes.length || codes.indexOf("_") >= 0) cles = D.disciplinesDe("");
    else {
      var vu = {};
      codes.forEach(function (c) { D.disciplinesDe(c).forEach(function (k) { vu[k] = true; }); });
      cles = Object.keys(D.DISCIPLINES).filter(function (k) { return vu[k]; });
    }
    var o = cles.map(function (k) { return { valeur: k, label: D.DISCIPLINES[k] }; });
    if (o.length && D.membres({ tous: true }).some(function (m) { return !m.discipline; })) o.push({ valeur: "_", label: "Non renseignée" });
    return o;
  }

  /* Groupe (14.10.2026, demande de Tony, comme sur Absences et congés) : les
     groupes du bureau sans les chefs de secteur et de projet, à leur place
     les ingénieurs et les dessinateurs (« metier:… », le métier de la fiche). */
  var GROUPES_ECARTES = { chef_secteur: true, chef_projet: true };
  var METIERS_GROUPE = ["ingenieur", "dessinateur"];
  function optionsGroupes() {
    return D.ORDRE_STATUTS.filter(function (g) { return !GROUPES_ECARTES[g]; })
      .map(function (g) { return { valeur: g, label: D.STATUTS_PLURIEL[g] }; })
      .concat(METIERS_GROUPE.map(function (c) { return { valeur: "metier:" + c, label: D.TITRES_METIERS[c] }; }));
  }
  function dansGroupe(m, g) {
    return g.indexOf("metier:") === 0 ? m.metier === g.slice(7) : D.aStatut(m, g);
  }

  /** Les affaires des succursales cochées. */
  function optionsAffaires() {
    return D.affaires({ tous: true }).filter(dansSuccursales)
      .map(function (a) { return { valeur: a.id, label: D.libelleAffaire(a) }; });
  }

  // Les menus se refont quand une option paraît ou disparaît (« Non renseignée », un groupe, une affaire)
  var empreinte = "";
  function empreinteOptions() {
    return [optionsSuccursales(), optionsDisciplines(), optionsGroupes(), optionsAffaires()].map(function (o) {
      return o.map(function (x) { return x.valeur; }).join(",");
    }).join("|");
  }

  /** Un menu à cases et son libellé, rangé comme une liste de la ligne de filtres. */
  function champCases(libelle, cle, o, apres) {
    o.surChange = function (v) { filtres[cle] = v; if (apres) apres(); memorise(); dessine(); };
    o.valeurs = filtres[cle];
    var f = UI.multiChoix(o);
    filtres[cle] = f.valeurs();
    var ch = el("div", { class: "champ champ-mc" }, [
      el("label", { text: libelle, onclick: function () { f.noeud.querySelector("button").click(); } }),
      f.noeud
    ]);
    // Caché quand il n'offre qu'un choix (un bureau sans succursales ni disciplines n'affiche pas ces filtres)
    if (o.options.length < 2) ch.style.display = "none";
    return ch;
  }

  function rendFiltres() {
    var hote = UI.vide(document.getElementById("filtres"));

    var chDisc, chAffaire;
    var chSucc = champCases("Succursale", "succursales", {
      libelle: "Filtrer : succursales", tous: "Toutes les succursales", pluriel: "succursales",
      options: optionsSuccursales()
    }, function () {
      // Les succursales changent : Discipline et Affaire ne gardent que ce qui en relève
      var d = champDiscipline(), a = champAffaire();
      hote.replaceChild(d, chDisc); chDisc = d;
      hote.replaceChild(a, chAffaire); chAffaire = a;
      empreinte = empreinteOptions();
    });
    chDisc = champDiscipline(); chAffaire = champAffaire();
    // « Qui sont les chefs de projet ? » — la question se pose sans passer par la recherche
    var chGroupe = champCases("Rôle", "groupes", {
      libelle: "Filtrer : rôles", tous: "Tous les rôles", pluriel: "rôles", options: optionsGroupes()
    });

    hote.appendChild(chSucc); hote.appendChild(chDisc); hote.appendChild(chGroupe); hote.appendChild(chAffaire);
    empreinte = empreinteOptions();
    memorise();
  }

  function champDiscipline() {
    return champCases("Discipline", "disciplines", {
      libelle: "Filtrer : disciplines", tous: "Toutes les disciplines", pluriel: "disciplines", options: optionsDisciplines()
    });
  }

  function champAffaire() {
    return champCases("Affaire", "affaires", {
      libelle: "Filtrer : affaires", tous: "Toutes les affaires", pluriel: "affaires", options: optionsAffaires(), large: true
    });
  }

  /* ------------------------------------------------------------- affichage */

  function rattachement(m) {
    return [D.SUCCURSALES[m.succursale], D.DISCIPLINES[m.discipline]].filter(Boolean).join(" · ");
  }

  function champsCherches(m) {
    return [m.prenom + " " + m.nom, D.libelleMetier(m.metier), rattachement(m), m.actif ? "" : "inactif",
            m.telInterne, m.telExterne, m.telNatel]
      .concat(D.statutsDe(m).map(D.libelleStatut))
      .concat(aVenir(m).map(function (a) { return a.motif; }));
  }

  /* Absences en cours ou à venir : une période terminée ne s'affiche plus
     (11.10.2026, demande de Tony). Elle reste en base. */
  function aVenir(m) {
    var auj = C.isoAuj();
    return m.absences.filter(function (a) { return (a.fin || a.debut) >= auj; });
  }

  /** Numéro cliquable : « 079 123 45 67 » compose tel:0791234567 sans les espaces. */
  function lienTel(numero, mots) {
    return el("a", { href: "tel:" + numero.replace(/[^+0-9]/g, ""), class: "lien-doux" }, [UI.surligne(numero, mots)]);
  }

  /* Téléphones de la fiche, tenus par chacun dans « Mon profil » : l'interne
     (numéro court du bureau), la ligne directe et le natel, chacun avec son libellé. */
  function telephones(m, mots) {
    var lignes = [["Int.", m.telInterne], ["Dir.", m.telExterne], ["Natel", m.telNatel]].filter(function (l) { return l[1]; });
    if (!lignes.length) return el("span", { class: "secondaire", text: "—" });
    return el("div", {}, lignes.map(function (l) {
      return el("div", { class: "num" }, [
        el("span", { class: "secondaire", style: "margin-right:6px", text: l[0] }),
        lienTel(l[1], mots)
      ]);
    }));
  }

  function selection(metier, sansTexte) {
    var mots = sansTexte || !barre ? [] : barre.termes();
    var dans = filtres.affaires.length ? membresAffaires(filtres.affaires) : null;
    return D.membres({ metier: metier == null ? null : metier, tous: true })
      .filter(function (m) {
        if (!dansSuccursales(m)) return false;
        if (filtres.disciplines.length && filtres.disciplines.indexOf(m.discipline || "_") < 0) return false;
        if (filtres.groupes.length && !filtres.groupes.some(function (g) { return dansGroupe(m, g); })) return false;
        return (!dans || dans[m.id]) && UI.correspond(champsCherches(m), mots);
      });
  }

  // Est « dans l'affaire » qui y est rattaché dans la fiche affaire ou qui y porte au moins une tâche ;
  // plusieurs affaires cochées : dans l'une au moins
  function membresAffaires(ids) {
    var dans = Object.create(null);
    ids.forEach(function (id) {
      var a = D.affaire(id);
      if (!a) return;
      a.ingenieurs.concat(a.dessinateurs).forEach(function (i) { dans[i] = true; });
      D.taches({ affaireId: id }).forEach(function (t) {
        if (t.ingenieurId) dans[t.ingenieurId] = true;
        if (t.dessinateurId) dans[t.dessinateurId] = true;
      });
    });
    return dans;
  }

  // Répartition de la charge : calculée une fois par version des données, et non
  // une fois par section à chaque frappe. Sur 6 000 tâches, c'était l'essentiel du temps.
  var cacheRep = { v: -1, rep: null };
  function repartitionCourante() {
    if (cacheRep.v !== D.version()) {
      cacheRep = { v: D.version(), rep: Calc.repartition(D.taches({ sansTerminees: true }), D.membres({ tous: true }), D.canton()) };
    }
    return cacheRep.rep;
  }

  function dessine() {
    suivi.debut();
    if (barre) barre.compte(selection().length, selection(null, true).length);

    // Nombre de filtres actifs, rappelé sur le bouton qui les replie (téléphone)
    // Une option paraît ou disparaît (« Non renseignée », une affaire créée…) : les menus se refont
    if (empreinte && empreinteOptions() !== empreinte) rendFiltres();
    var actifs = [filtres.succursales.length, filtres.disciplines.length, filtres.groupes.length, filtres.affaires.length].filter(Boolean).length;
    document.getElementById("nb-filtres").textContent = actifs ? actifs + (actifs > 1 ? " actifs" : " actif") : "";

    var hote = UI.vide(document.getElementById("sections"));
    SECTIONS.forEach(function (s) {
      var membres = selection(s.metier);
      if (s.masqueSiVide && !membres.length) return;
      var liste = el("div", { class: "defile" });
      hote.appendChild(el("section", { class: "section" }, [
        el("div", { class: "tete-section" }, [
          // Le nombre devant le métier, sans ligne « 01 — Ingénieurs » au-dessus (14.10.2026, demande de Tony)
          el("div", {}, [
            el("h2", { class: "titre-metier", text: membres.length + " " + (s.fixe || (membres.length > 1 ? s.plur : s.sing).replace(/^./, function (c) { return c.toUpperCase(); })) })
          ]),
        ]),
        liste
      ]));
      rendListe(s, membres, liste);
    });
  }

  function rendListe(s, membres, hote) {
    var mots = barre ? barre.termes() : [];
    var q = barre ? barre.valeur().trim() : "";
    var filtre = filtres.succursales.length || filtres.disciplines.length || filtres.groupes.length || filtres.affaires.length;

    if (!membres.length) {
      hote.appendChild(q
        ? el("div", { class: "sans-resultat", style: "padding:26px 0 10px" }, [
            el("p", { class: "aide", style: "margin:0" }, ["Aucun " + s.sing + " pour « ", el("em", { style: "font-style:normal;color:var(--or)", text: q }), " »"])
          ])
        : el("div", { class: "vide", text: filtre ? "Aucun " + s.sing + " pour ces filtres" : "Aucun " + s.sing + " — les fiches se créent dans la console" }));
      return;
    }

    // Charge de la semaine en cours, pour situer chacun d'un coup d'œil. Pas pour
    // un collaborateur (11.10.2026, demande de Tony) : la charge des autres ne le
    // regarde pas, comme au tableau de bord.
    var voitCharge = D.aDroit("planning_equipe");
    var jours = C.serie(C.lundi(C.isoAuj()), 7);
    var rep = voitCharge ? repartitionCourante() : {};
    var planifie = !!D.PLANIFIES[s.metier];

    var corps = el("tbody");
    membres.forEach(function (m) {
      var b = voitCharge ? Calc.bilan(m, jours, rep[m.id], D.canton()) : null;
      var pourcent = b && b.capacite > 0 ? Math.min(140, Math.round(b.taux * 100)) : 0;
      var periodes = aVenir(m), prochaine = periodes[0];
      var sousTitre = rattachement(m);

      corps.appendChild(suivi.marque(el("tr", { style: m.actif ? "" : "opacity:.45" }, [
        el("td", {}, [
          el("div", { class: "principal" }, [UI.surligne(m.prenom + " " + m.nom, mots)]),
          el("div", { class: "secondaire" }, [sousTitre ? UI.surligne(sousTitre, mots)
            : (Object.keys(D.SUCCURSALES).length ? "Succursale non renseignée" : "")])
        ]),
        el("td", {}, [
          el("div", {}, [UI.surligne(D.libelleMetier(m.metier), mots)]),
          // Les statuts se cumulent : ils s'écrivent sous le métier, pas à sa place
          D.statutsDe(m).length
            ? el("div", { class: "statuts-ligne", style: "margin-top:5px" }, UI.etiquettesStatuts(m))
            : null
        ]),
        el("td", {}, [telephones(m, mots)]),
        el("td", { class: "num", title: D.detailJours(m) }, [
          C.fmtJours(m.capacite) + " j/sem.",
          D.libelleJours(m) ? el("div", { class: "secondaire", text: D.libelleJours(m) }) : null
        ]),
        !voitCharge ? null : el("td", {}, planifie ? [
          el("div", { class: "num", text: C.fmtJours(b.charge) + " / " + C.fmtJours(b.capacite) + " j" }),
          el("div", { class: "jauge" }, [el("i", { style: "width:" + Math.min(100, pourcent) + "%;" + (b.charge > b.capacite + 0.05 ? "background:var(--alerte)" : "") })])
        ] : [el("span", { class: "secondaire", text: "—" })]),
        el("td", {}, [
          periodes.length
            ? el("div", {}, [
                el("div", { class: "num", text: periodes.length + (periodes.length > 1 ? " périodes" : " période") }),
                prochaine ? el("div", { class: "secondaire" }, [UI.surligne(prochaine.motif, mots), " · " + C.fmtCourt(prochaine.debut) + " → " + C.fmtCourt(prochaine.fin)]) : null
              ])
            : el("span", { class: "secondaire", text: "—" })
        ]),
        el("td", { class: "actions" }, [
          UI.boutonIcone("jours", D.peutJours(m.id) ? "Jours travaillés" : "Jours travaillés (consultation)", m.prenom + " " + m.nom, function () { UI.joursTravailles(m.id, dessine); }),
          UI.boutonIcone("absence", "Absences", m.prenom + " " + m.nom, function () { UI.absences(m.id, dessine); })
        ])
      ]), m.id));
    });

    hote.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Nom et rattachement" }),
        el("th", { text: "Métier et statuts" }),
        el("th", { text: "Téléphones" }),
        el("th", { text: "Capacité" }),
        voitCharge ? el("th", { text: "Cette semaine" }) : null,
        el("th", { text: "Absences" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));
  }

})();
</script>
</body>
</html>
