<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Équipe · Planification · STR Bim Tools</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<script>
/* Thème posé avant le premier rendu : préférence de l'utilisateur connecté, sinon la dernière utilisée */
(function(){var r=document.documentElement;try{var s=JSON.parse(localStorage.getItem("planif.session")||"null"),c=localStorage.getItem("planif.theme:"+(s&&s.email||""))||localStorage.getItem("planif.theme")||"sombre";if(c==="systeme")c=matchMedia("(prefers-color-scheme: light)").matches?"clair":"sombre";r.setAttribute("data-theme",c);if(c==="clair")document.querySelector("meta[name=theme-color]").setAttribute("content","#F3F0E8");}catch(e){r.setAttribute("data-theme","sombre");}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M9 27V9h8v18M17 27V15h7v12' fill='none' stroke='%23D6A85C' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preload" href="/assets/polices/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/polices/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=2">
<link rel="stylesheet" href="/planif/assets/planif.css?v=25">
</head>
<body>

<div data-chrome></div>

<main>
  <div class="wrap entete">
    <div class="surtitre">Planification</div>
    <h1>Équipe</h1>
    <p class="chapeau">Les membres des succursales, leur rôle, leur capacité hebdomadaire et leurs absences. Seuls les ingénieurs et les dessinateurs paraissent au tableau de bord ; la capacité y sert de référence pour faire apparaître une surcharge.</p>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <div data-recherche style="margin-top:10px"></div>
    <div class="plan-barre" style="margin-top:-8px">
      <select id="f-succursale" class="btn" style="text-transform:none;letter-spacing:.04em" aria-label="Filtrer par succursale"></select>
      <select id="f-discipline" class="btn" style="text-transform:none;letter-spacing:.04em;max-width:320px" aria-label="Filtrer par discipline"></select>
      <select id="f-affaire" class="btn" style="text-transform:none;letter-spacing:.04em;max-width:320px" aria-label="Filtrer par affaire"></select>
    </div>
    <div id="sections"></div>
  </div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=4"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=7"></script>
<script src="/planif/assets/donnees.js?v=12"></script>
<script src="/planif/assets/calculs.js?v=5"></script>
<script src="/planif/assets/ui.js?v=19"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var barre = null;                                 // recherche instantanée
  var suivi = UI.suiviApparitions();
  var CLE_FILTRES = "planif.equipe.filtres";
  var CLE_AFFAIRE = "planif.equipe.affaire";         // ancien réglage, repris une fois
  var filtres = { affaire: "", succursale: "", discipline: "" };

  // Une section par rôle. Les membres pas encore désignés viennent en tête :
  // c'est là qu'il reste du travail.
  var SECTIONS = [
    { role: "", titre: "À désigner", sing: "membre à désigner", plur: "membres à désigner", masqueSiVide: true },
    { role: "ingenieur", titre: "Ingénieurs", sing: "ingénieur", plur: "ingénieurs", nouveau: "Nouvel ingénieur" },
    { role: "dessinateur", titre: "Dessinateurs", sing: "dessinateur", plur: "dessinateurs", nouveau: "Nouveau dessinateur" },
    { role: "administrateur", titre: "Administrateurs", sing: "administrateur", plur: "administrateurs", nouveau: "Nouvel administrateur" },
    { role: "administratif", titre: "Administratifs", sing: "administratif", plur: "administratifs", nouveau: "Nouvel administratif" }
  ];

  if (!UI.session()) return;

  D.pret().then(function () {
    UI.chrome("equipe", [{ label: "Nouveau membre", or: true, action: function () { formulaire(null, ""); } }]);
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher un nom, une succursale, une discipline, une absence…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) formulaire(l[0].id); }
    });

    try { Object.assign(filtres, JSON.parse(localStorage.getItem(CLE_FILTRES) || "{}")); } catch (e) {}
    try { if (!filtres.affaire) filtres.affaire = localStorage.getItem(CLE_AFFAIRE) || ""; } catch (e) {}
    if (!D.affaire(filtres.affaire)) filtres.affaire = "";
    if (!D.SUCCURSALES[filtres.succursale]) filtres.succursale = "";

    var fa = document.getElementById("f-affaire");
    fa.appendChild(el("option", { value: "" }, ["Toutes les affaires"]));
    D.affaires({ tous: true }).forEach(function (a) {
      fa.appendChild(el("option", { value: a.id }, [a.code + " · " + a.nom]));
    });
    fa.value = filtres.affaire;
    fa.addEventListener("change", function () { filtres.affaire = fa.value; memorise(); dessine(); });

    var fs = document.getElementById("f-succursale");
    fs.appendChild(el("option", { value: "" }, ["Toutes les succursales"]));
    Object.keys(D.SUCCURSALES).forEach(function (k) {
      fs.appendChild(el("option", { value: k }, [D.SUCCURSALES[k]]));
    });
    fs.value = filtres.succursale;
    fs.addEventListener("change", function () {
      filtres.succursale = fs.value;
      optionsDiscipline();
      memorise(); dessine();
    });

    var fd = document.getElementById("f-discipline");
    fd.addEventListener("change", function () { filtres.discipline = fd.value; memorise(); dessine(); });
    optionsDiscipline();

    D.surRechargement(dessine);
    dessine();
  }).catch(UI.echec);

  function memorise() {
    try { localStorage.setItem(CLE_FILTRES, JSON.stringify(filtres)); } catch (e) {}
  }

  /** Le filtre de discipline ne propose que celles de la succursale choisie. */
  function optionsDiscipline() {
    var fd = UI.vide(document.getElementById("f-discipline"));
    var cles = disciplinesDe(filtres.succursale);
    if (cles.indexOf(filtres.discipline) < 0) filtres.discipline = "";
    fd.appendChild(el("option", { value: "" }, ["Toutes les disciplines"]));
    cles.forEach(function (k) { fd.appendChild(el("option", { value: k }, [D.DISCIPLINES[k]])); });
    fd.value = filtres.discipline;
  }

  function disciplinesDe(succursale) {
    return succursale ? D.DISCIPLINES_PAR_SUCCURSALE[succursale].slice() : Object.keys(D.DISCIPLINES);
  }

  /* ------------------------------------------------------------- affichage */

  function rattachement(m) {
    return [D.SUCCURSALES[m.succursale], D.DISCIPLINES[m.discipline]].filter(Boolean).join(" · ");
  }

  function champsCherches(m) {
    return [m.prenom + " " + m.nom, m.email, D.libelleRole(m.role), rattachement(m), m.actif ? "" : "inactif"]
      .concat(m.absences.map(function (a) { return a.motif; }));
  }

  function selection(role, sansTexte) {
    var mots = sansTexte || !barre ? [] : barre.termes();
    var dans = filtres.affaire ? membresAffaire(filtres.affaire) : null;
    return D.membres({ role: role == null ? null : role, tous: true })
      .filter(function (m) {
        if (filtres.succursale && m.succursale !== filtres.succursale) return false;
        if (filtres.discipline && m.discipline !== filtres.discipline) return false;
        return (!dans || dans[m.id]) && UI.correspond(champsCherches(m), mots);
      });
  }

  // Est « dans l'affaire » qui y est rattaché dans la fiche affaire ou qui y porte au moins une tâche
  function membresAffaire(id) {
    var a = D.affaire(id), dans = Object.create(null);
    if (!a) return dans;
    a.ingenieurs.concat(a.dessinateurs).forEach(function (i) { dans[i] = true; });
    D.taches({ affaireId: id }).forEach(function (t) {
      if (t.ingenieurId) dans[t.ingenieurId] = true;
      if (t.dessinateurId) dans[t.dessinateurId] = true;
    });
    return dans;
  }

  // Répartition de la charge : calculée une fois par version des données, et non
  // une fois par section à chaque frappe. Sur 6 000 tâches, c'était l'essentiel du temps.
  var cacheRep = { v: -1, rep: null };
  function repartitionCourante() {
    if (cacheRep.v !== D.version()) {
      cacheRep = { v: D.version(), rep: Calc.repartition(D.taches({ sansTerminees: true }), D.membres({ tous: true }), D.canton()) };
    }
    return cacheRep.rep;
  }

  function dessine() {
    suivi.debut();
    if (barre) barre.compte(selection().length, selection(null, true).length);
    var hote = UI.vide(document.getElementById("sections"));
    var n = 0;
    SECTIONS.forEach(function (s) {
      var membres = selection(s.role);
      if (s.masqueSiVide && !membres.length) return;
      n++;
      var liste = el("div", { class: "defile" });
      hote.appendChild(el("section", { class: "section" }, [
        el("div", { class: "tete-section" }, [
          el("div", {}, [
            el("div", { class: "num-section", text: (n < 10 ? "0" : "") + n + " — " + s.titre }),
            el("h2", { text: membres.length + " " + (membres.length > 1 ? s.plur : s.sing).replace(/^./, function (c) { return c.toUpperCase(); }) })
          ]),
          s.nouveau ? el("div", { class: "outils" }, [
            el("button", { class: "btn btn-or", type: "button", text: s.nouveau, onclick: function () { formulaire(null, s.role); } })
          ]) : null
        ]),
        liste
      ]));
      rendListe(s, membres, liste);
    });
  }

  function rendListe(s, membres, hote) {
    var mots = barre ? barre.termes() : [];
    var q = barre ? barre.valeur().trim() : "";
    var filtre = filtres.affaire || filtres.succursale || filtres.discipline;

    if (!membres.length) {
      hote.appendChild(q
        ? el("div", { class: "sans-resultat", style: "padding:26px 0 10px" }, [
            el("p", { class: "aide", style: "margin:0" }, ["Aucun " + s.sing + " pour « ", el("em", { style: "font-style:normal;color:var(--or)", text: q }), " »"])
          ])
        : el("div", { class: "vide", text: filtre ? "Aucun " + s.sing + " pour ces filtres" : "Aucun " + s.sing + " enregistré" }));
      return;
    }

    // Charge de la semaine en cours, pour situer chacun d'un coup d'œil
    var jours = C.serie(C.lundi(C.isoAuj()), 7);
    var rep = repartitionCourante();
    var planifie = !!D.PLANIFIES[s.role];

    var corps = el("tbody");
    membres.forEach(function (m) {
      var b = Calc.bilan(m, jours, rep[m.id], D.canton());
      var pourcent = b.capacite > 0 ? Math.min(140, Math.round(b.taux * 100)) : 0;
      var prochaine = m.absences.filter(function (a) { return (a.fin || a.debut) >= C.isoAuj(); })[0];
      var sousTitre = [rattachement(m), m.email].filter(Boolean).join(" · ");

      corps.appendChild(suivi.marque(el("tr", { style: m.actif ? "" : "opacity:.45" }, [
        el("td", {}, [
          el("div", { class: "principal" }, [UI.surligne(m.prenom + " " + m.nom, mots)]),
          el("div", { class: "secondaire" }, [sousTitre ? UI.surligne(sousTitre, mots) : "Succursale non renseignée"])
        ]),
        el("td", {}, [choixRole(m)]),
        el("td", { class: "num", text: C.fmtJours(m.capacite) + " j/sem." }),
        el("td", {}, planifie ? [
          el("div", { class: "num", text: C.fmtJours(b.charge) + " / " + C.fmtJours(b.capacite) + " j" }),
          el("div", { class: "jauge" }, [el("i", { style: "width:" + Math.min(100, pourcent) + "%;" + (b.charge > b.capacite + 0.05 ? "background:var(--alerte)" : "") })])
        ] : [el("span", { class: "secondaire", text: "—" })]),
        el("td", {}, [
          m.absences.length
            ? el("div", {}, [
                el("div", { class: "num", text: m.absences.length + (m.absences.length > 1 ? " périodes" : " période") }),
                prochaine ? el("div", { class: "secondaire" }, [UI.surligne(prochaine.motif, mots), " · " + C.fmtCourt(prochaine.debut) + " → " + C.fmtCourt(prochaine.fin)]) : null
              ])
            : el("span", { class: "secondaire", text: "—" })
        ]),
        el("td", { class: "actions" }, [
          UI.boutonIcone("absence", "Absences", m.prenom + " " + m.nom, function () { UI.absences(m.id, dessine); }),
          UI.boutonIcone("modifier", "Modifier", m.prenom + " " + m.nom, function () { formulaire(m.id); }),
          UI.boutonIcone("supprimer", "Supprimer", m.prenom + " " + m.nom, function () { supprime(m); })
        ])
      ]), m.id));
    });

    hote.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Nom et rattachement" }),
        el("th", { text: "Rôle" }),
        el("th", { text: "Capacité" }),
        el("th", { text: "Cette semaine" }),
        el("th", { text: "Absences" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));
  }

  function optionsRole() {
    return [{ valeur: "", label: "À désigner" }].concat(Object.keys(D.ROLES).map(function (k) {
      return { valeur: k, label: D.ROLES[k] };
    }));
  }

  /** Désignation directe depuis la liste, sans ouvrir la fiche. */
  function choixRole(m) {
    var s = el("select", {
      class: "btn", "aria-label": "Rôle de " + m.prenom + " " + m.nom,
      style: "text-transform:none;letter-spacing:.04em;padding-block:6px"
    });
    optionsRole().forEach(function (o) {
      s.appendChild(el("option", { value: o.valeur, selected: o.valeur === m.role }, [o.label]));
    });
    s.addEventListener("change", function () {
      var v = Object.assign({}, m, { role: s.value });
      D.majMembre(m.id, v).then(function () {
        dessine();
        UI.toast(m.prenom + " " + m.nom + " : " + D.libelleRole(v.role).toLowerCase() + ".");
      }).catch(function (e) { s.value = m.role; UI.toast(e.message); });
    });
    return s;
  }

  /* ------------------------------------------------------------ formulaire */

  function formulaire(idMembre, roleDefaut) {
    var m = idMembre ? D.membre(idMembre) : null;
    var succ0 = m ? m.succursale : (filtres.succursale || "");
    var corps = el("div", { class: "grille-champs" }, [
      UI.champ({ nom: "prenom", label: "Prénom", valeur: m ? m.prenom : "", exemple: "Camille", autocomplete: "given-name" }),
      UI.champ({ nom: "nom", label: "Nom", valeur: m ? m.nom : "", exemple: "Berger", autocomplete: "family-name" }),
      UI.champ({
        nom: "succursale", label: "Succursale", type: "select", valeur: succ0,
        options: [{ valeur: "", label: "Non renseignée" }].concat(Object.keys(D.SUCCURSALES).map(function (k) {
          return { valeur: k, label: D.SUCCURSALES[k] };
        }))
      }),
      UI.champ({ nom: "discipline", label: "Discipline", type: "select", valeur: "", options: [] }),
      UI.champ({
        nom: "role", label: "Rôle", type: "select", valeur: m ? m.role : (roleDefaut || ""),
        options: optionsRole()
      }),
      UI.champ({
        nom: "capacite", label: "Capacité (j/sem.)", type: "number", pas: "0.5", min: "0.5", max: "7", inputmode: "decimal",
        valeur: m ? m.capacite : D.reglages().capaciteDefaut,
        aide: "5 pour un plein temps, 4 pour un 80 %."
      }),
      UI.champ({ nom: "email", label: "Adresse e-mail (facultative)", type: "email", valeur: m ? m.email : "", exemple: "camille.berger@exemple.ch", large: true }),
      UI.champ({
        nom: "actif", label: "Présence à l'effectif", type: "select", valeur: m ? String(m.actif) : "true",
        options: [{ valeur: "true", label: "Actif" }, { valeur: "false", label: "Inactif — masqué du planning" }]
      })
    ]);

    // La liste des disciplines suit la succursale choisie
    var selSucc = corps.querySelector("[name=succursale]"), selDisc = corps.querySelector("[name=discipline]");
    function remplitDisciplines(garde) {
      UI.vide(selDisc);
      selDisc.appendChild(el("option", { value: "" }, ["Non renseignée"]));
      disciplinesDe(selSucc.value).forEach(function (k) {
        selDisc.appendChild(el("option", { value: k }, [D.DISCIPLINES[k]]));
      });
      selDisc.value = disciplinesDe(selSucc.value).indexOf(garde) >= 0 ? garde : "";
    }
    remplitDisciplines(m ? m.discipline : (filtres.discipline || ""));
    // Une seule discipline possible (Nyon) : elle est choisie d'office
    selSucc.addEventListener("change", function () {
      var cles = disciplinesDe(selSucc.value);
      remplitDisciplines(cles.length === 1 ? cles[0] : selDisc.value);
    });

    UI.ouvre({
      surtitre: m ? "Modifier" : "Nouveau membre",
      titre: m ? m.prenom + " " + m.nom : "Membre de l'équipe",
      corps: corps,
      boutons: [
        { label: "Annuler" },
        {
          label: "Enregistrer", or: true, action: function () {
            var v = UI.lit(corps);
            v.actif = v.actif === "true";
            var p = m ? D.majMembre(m.id, v) : D.ajouteMembre(v);
            return p.then(function () { dessine(); UI.toast(m ? "Membre modifié." : "Membre ajouté."); })
              .catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  function supprime(m) {
    var n = D.taches({ membreId: m.id }).length;
    UI.confirme(
      "Supprimer " + m.prenom + " " + m.nom + " ?",
      n ? "Ce membre est affecté à " + n + (n > 1 ? " tâches" : " tâche") + ". Les tâches sont conservées mais se retrouveront sans affectation."
        : "Ce membre sera retiré de l'équipe et des affaires auxquelles il participe.",
      "Supprimer", true
    ).then(function (ok) {
      if (!ok) return;
      D.suppMembre(m.id).then(function () { dessine(); UI.toast("Membre supprimé."); })
        .catch(function (e) { UI.toast(e.message); });
    });
  }
})();
</script>
</body>
</html>
