<script>
/* Version 2 : charte claire unique. La marque du bureau (logo, couleurs) est
   reprise du dernier passage de ce compte, avant le premier rendu ;
   ui.js / portail.js la confirment ensuite. */
(function(){var r=document.documentElement,m="str";r.setAttribute("data-version","v2");r.setAttribute("data-theme","clair");try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();

<style>
/* « 31 Ingénieurs » : même titre que les intertitres du calendrier des
   absences (planif.css .pl-groupe h3, habillage.css h3) — 14.10.2026 */
:root[data-version="v2"] .tete-section h2.titre-metier{font-size:clamp(21px,2.4vw,28px);font-weight:650}
@media print{:root[data-version="v2"] .tete-section h2.titre-metier{font-size:12pt}}
/* Bandeau de gauche repliable (02.11.2026, demande de Tony, repris du bureau /planif2/) :
   recherche, « Tous », « Administrateurs », chaque succursale et ses secteurs, puis les
   rôles et l'affaire. Il remplace la ligne de filtres à cases. */
.eq-page{display:grid;grid-template-columns:272px 28px minmax(0,1fr);align-items:start;margin-top:10px}
.eq-page.replie{grid-template-columns:0 28px minmax(0,1fr)}
.eq-bandeau{position:sticky;top:calc(var(--h-chrome,0px) + 10px);max-height:calc(100vh - var(--h-chrome,0px) - 20px);overflow:auto;
  display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--noir);box-shadow:var(--ab-ombre)}
.eq-page.replie .eq-bandeau{visibility:hidden;padding:0;overflow:hidden}
.eq-bandeau .recherche{margin:0;padding:2px 0 8px}
.eq-bandeau .recherche-champ{font-size:16px;min-width:0}
.eq-bandeau .recherche-touche{display:none}
.eq-replier{position:sticky;top:calc(var(--h-chrome,0px) + 22px);justify-self:center;width:24px;height:44px;padding:0;border:1px solid var(--ligne);border-radius:7px;
  background:var(--noir);color:var(--texte-doux);font-size:16px;cursor:pointer;box-shadow:var(--ab-ombre)}
.eq-replier:hover{color:var(--or);border-color:var(--or-doux)}
.eq-arbre{display:flex;flex-direction:column;gap:1px}
.eq-arbre .titre-groupe{margin:12px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--texte-faible)}
.eq-arbre button{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:5px 9px;border:0;border-radius:7px;background:none;
  font:inherit;font-size:13.5px;color:var(--texte);text-align:left;cursor:pointer}
.eq-arbre button:hover{background:var(--ab-vert-pale)}
.eq-arbre button[aria-current="true"]{background:var(--ab-vert-clair);font-weight:600}
.eq-arbre button.niv1{padding-left:24px;font-size:13px;color:var(--texte-doux)}
.eq-arbre button.niv0{font-weight:600}
.eq-arbre button .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-arbre button .n{flex:none;font-size:12px;color:var(--texte-faible);font-variant-numeric:tabular-nums}
.eq-affaire{display:flex;flex-direction:column;gap:4px;margin:4px 8px 0;font-size:12px;color:var(--texte-faible)}
.eq-affaire select{width:100%;min-height:34px;padding:4px 8px;border:1px solid var(--ligne);border-radius:7px;background:#fff;font:inherit;font-size:13px;color:var(--texte)}
.eq-contenu{min-width:0}
.eq-contenu .section:first-child{margin-top:0}
@media (max-width:760px){
  .eq-page,.eq-page.replie{grid-template-columns:minmax(0,1fr)}
  .eq-bandeau{position:static;max-height:none}
  .eq-page.replie .eq-bandeau{display:none}
  .eq-replier{position:static;width:100%;height:38px;margin:8px 0 10px;font-size:14px}
}
@media print{.eq-bandeau,.eq-replier{display:none}.eq-page{display:block}}
/* Présence de la semaine (02.11.2026, repris du bureau /planif2/) : l'initiale du jour, une LED dessous */
.eq-sem{position:relative;z-index:0;display:flex;gap:6px}
.eq-jour{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:16px}
.eq-jour i{font-style:normal;font-size:11px;line-height:12px;font-weight:600;color:var(--texte-faible)}
.eq-jour.auj i{color:var(--or)}
.eq-jour.auj::before{content:"";position:absolute;inset:-4px -2px;border-radius:6px;background:var(--ab-vert-pale);z-index:-1}
.eq-led{width:10px;height:10px;border-radius:50%;background:#D9DBD5;box-shadow:inset 0 1px 1px rgba(0,0,0,.12)}
.eq-led.on{background:#3FB950;box-shadow:0 0 6px rgba(63,185,80,.7),inset 0 -1px 1px rgba(0,0,0,.15)}
.eq-led.demi{background:linear-gradient(90deg,#3FB950 50%,#D9DBD5 50%);box-shadow:0 0 4px rgba(63,185,80,.45)}
.eq-capa{margin-top:6px;font-size:12px;color:var(--texte-faible)}
/* Mêmes colonnes d'une section à l'autre (02.11.2026) : largeurs fixées, plus calculées sur le contenu */
.eq-contenu table.liste{table-layout:fixed;width:100%}
.eq-contenu table.liste .c-nom{width:20%}
.eq-contenu table.liste .c-metier{width:17%}
.eq-contenu table.liste .c-tel{width:17%}
.eq-contenu table.liste .c-pres{width:130px}
.eq-contenu table.liste .c-charge{width:15%}
.eq-contenu table.liste .c-abs{width:auto}
.eq-contenu table.liste .c-act{width:130px}
.eq-contenu table.liste td{overflow-wrap:anywhere}
</style>

<script>
/* Le bandeau du haut de la page précédente, posé avant le premier rendu ;
   ui.js (chrome) le remplace à l'identique dès que le profil est lu. De même
   pour la sous-barre du module (planifSousNav, appelée sous l'en-tête). */
(function(){var m="local",d=location.pathname.split("/")[2]||"";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=s&&s.email||"local";var b=JSON.parse(localStorage.getItem("planif.barre:"+m)||"null"),c=document.querySelector("[data-chrome]");if(b&&b.html&&c&&!c.firstChild){c.innerHTML=b.html;c.setAttribute("data-provisoire","");if(b.h)document.documentElement.style.setProperty("--h-chrome",b.h+"px");[].forEach.call(c.querySelectorAll("a[data-dossiers]"),function(a){if((" "+a.getAttribute("data-dossiers")+" ").indexOf(" "+d+" ")>=0)a.setAttribute("aria-current","page");});}}catch(e){}
window.planifSousNav=function(){try{var t=JSON.parse(localStorage.getItem("planif.sousnav:"+m)||"{}")[d],e=document.querySelector("main .entete");if(!t||!e||document.querySelector(".sous-nav-wrap"))return;var w=document.createElement("div");w.className="wrap sous-nav-wrap";w.innerHTML=t;e.parentNode.insertBefore(w,e.nextSibling);var l=w.querySelectorAll("a"),q=location.pathname+location.search,ok=null;[].forEach.call(l,function(a){if(a.getAttribute("href")===q)ok=a;});[].forEach.call(l,function(a){if(!ok&&a.getAttribute("href")===location.pathname)ok=a;});if(ok)ok.setAttribute("aria-current","page");}catch(x){}};})();
</script>

<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var barre = null;                                 // recherche instantanée
  var suivi = UI.suiviApparitions();
  var CLE_FILTRES = "planif.equipe.filtres";
  var CLE_AFFAIRE = "planif.equipe.affaire";         // ancien réglage, repris une fois
  /* Menus à cases (14.10.2026) : les codes cochés, rien de coché = tout.
     « _ » pour une succursale ou une discipline non renseignée. Les
     succursales réduisent les menus Discipline et Affaire. */
  var filtres = { succursales: [], disciplines: [], groupes: [], affaires: [] };

  // Une section par métier. Les membres pas encore désignés viennent en tête :
  // c'est là qu'il reste du travail. Les statuts, eux, se cumulent : ils ne
  // rangent personne dans une section, ils s'affichent en étiquettes.
  var SECTIONS = [
    // fixe : le titre ne s'accorde pas — « 2 À désigner », comme au calendrier des absences (14.10.2026)
    { metier: "", titre: "À désigner", sing: "membre à désigner", plur: "membres à désigner", fixe: "À désigner", masqueSiVide: true },
    { metier: "ingenieur", titre: "Ingénieurs", sing: "ingénieur", plur: "ingénieurs" },
    { metier: "dessinateur", titre: "Dessinateurs", sing: "dessinateur", plur: "dessinateurs" },
    { metier: "administratif", titre: "Administratifs", sing: "administratif", plur: "administratifs" }
  ];

  if (!UI.session()) return;

  D.pret().then(function () {
    // Les fiches se tiennent dans la console : d'ici, on consulte, on pose les
    // absences et chacun règle ses jours travaillés.
    var p = D.profil();
    var actions = [];
    if (p && p.superAdmin) actions.push({ label: "Console", or: true, icone: "ico-ajout-membre", action: function () { location.href = "/planif/console/#utilisateurs"; } });
    if (D.monMembre()) actions.push({ label: "Mes jours", or: !actions.length, icone: "ico-jours", action: function () { UI.joursTravailles(null, dessine); } });
    UI.chrome("equipe", actions);
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");
    bandeau();
    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher un nom, un métier, un téléphone…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) UI.absences(l[0].id, dessine); }
    });

    var lu = {};
    try { lu = JSON.parse(localStorage.getItem(CLE_FILTRES) || "{}") || {}; } catch (e) {}
    try { if (!lu.affaire && !lu.affaires) lu.affaire = localStorage.getItem(CLE_AFFAIRE) || ""; } catch (e) {}
    // Anciens réglages à une seule valeur (succursale, discipline, statut, affaire) repris en cases cochées
    [["succursales", "succursale"], ["disciplines", "discipline"], ["groupes", "statut"], ["affaires", "affaire"]].forEach(function (c) {
      var v = Array.isArray(lu[c[0]]) ? lu[c[0]] : (lu[c[1]] ? [lu[c[1]]] : []);
      filtres[c[0]] = v.map(String);
    });
    // Le bandeau ne garde qu'un rôle et une affaire ; succursale et secteur s'y choisissent
    filtres.groupes = []; filtres.affaires = filtres.affaires.slice(0, 1);
    filtres.succursales = []; filtres.disciplines = [];

    // À l'ouverture : sa succursale et son secteur (les administrateurs sur « Administrateurs »)
    var moi = D.monMembre();
    if (moi) cle = estAdmin(moi) ? "admin" : "d:" + (moi.succursale || "_") + "|" + (moi.discipline || "_");
    if (cle !== "tous" && !D.membres({ tous: true }).some(dansCle)) cle = "tous";
    if (new URLSearchParams(location.search).get("q")) cle = "tous";
    D.surRechargement(dessine);
    dessine();

    /* Arrivée depuis un jour off de l'accueil (14.10.2026) : ?jours=<membre>
       ouvre ses jours travaillés. */
    var versJours = new URLSearchParams(location.search).get("jours");
    if (versJours) {
      history.replaceState(null, "", location.pathname + location.hash);
      if (D.membre(versJours)) UI.joursTravailles(versJours, dessine);
    }
  }).catch(UI.echec);

  function memorise() {
    try { localStorage.setItem(CLE_FILTRES, JSON.stringify(filtres)); } catch (e) {}
  }

  /* --------------------------------------------------------------- bandeau
     02.11.2026 (demande de Tony) : le bandeau de gauche du bureau /planif2/
     remplace les menus à cases. Une entrée d'équipe à la fois (Tous,
     Administrateurs, une succursale, un de ses secteurs), un rôle, une affaire. */
  var cle = "tous";                  // tous | admin | s:<succursale> | d:<succursale>|<discipline>
  var CLE_REPLIE = "planif.equipe.replie";

  function sansAccents(x) { return String(x || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function estAdminDisc(code) { return /^administrateur/.test(sansAccents(code)) || /^administrateur/.test(sansAccents(D.DISCIPLINES[code])); }
  function estAdmin(m) { return D.aStatut(m, "administrateur") || estAdminDisc(m.discipline); }
  function dansCle(m) {
    if (cle === "tous") return true;
    if (cle === "admin") return estAdmin(m);
    if (cle.indexOf("s:") === 0) return (m.succursale || "_") === cle.slice(2);
    var p = cle.slice(2).split("|");
    return (m.succursale || "_") === p[0] && (m.discipline || "_") === p[1] && !estAdmin(m);
  }
  function dansSuccursales(a) {        // affaires proposées : celles de la succursale choisie
    var s = cle.indexOf("s:") === 0 ? cle.slice(2) : cle.indexOf("d:") === 0 ? cle.slice(2).split("|")[0] : null;
    return !s || s === "_" || !a.succursale || a.succursale === s;
  }

  function replie(oui) {
    var page = document.getElementById("eq-page"), b = document.getElementById("eq-replier");
    page.classList.toggle("replie", oui);
    var mobile = innerWidth <= 760;
    b.textContent = mobile ? (oui ? "Recherche et équipes ▾" : "Masquer ▴") : (oui ? "›" : "‹");
    b.title = oui ? "Afficher le bandeau" : "Réduire le bandeau";
    b.setAttribute("aria-expanded", String(!oui));
    try { localStorage.setItem(CLE_REPLIE, oui ? "1" : ""); } catch (e) {}
  }
  function bandeau() {
    var garde = null;
    try { garde = localStorage.getItem(CLE_REPLIE); } catch (e) {}
    replie(garde === null ? innerWidth <= 760 : garde === "1");
    document.getElementById("eq-replier").addEventListener("click", function () {
      replie(!document.getElementById("eq-page").classList.contains("replie"));
    });
  }

  /* Rôles (14.10.2026, comme sur Absences et congés) : les groupes du bureau sans les
     chefs de secteur et de projet, à leur place les ingénieurs et les dessinateurs. */
  var GROUPES_ECARTES = { chef_secteur: true, chef_projet: true };
  var METIERS_GROUPE = ["ingenieur", "dessinateur"];
  function optionsGroupes() {
    return D.ORDRE_STATUTS.filter(function (g) { return !GROUPES_ECARTES[g]; })
      .map(function (g) { return { valeur: g, label: D.STATUTS_PLURIEL[g] }; })
      .concat(METIERS_GROUPE.map(function (c) { return { valeur: "metier:" + c, label: D.TITRES_METIERS[c] }; }));
  }
  function dansGroupe(m, g) {
    return g.indexOf("metier:") === 0 ? m.metier === g.slice(7) : D.aStatut(m, g);
  }

  function entree(hote, cleE, nom, n, niv, actif, choix) {
    var b = el("button", { type: "button", class: "niv" + niv, "aria-current": String(actif) }, [
      el("span", { class: "nom", text: nom }), n != null ? el("span", { class: "n", text: String(n) }) : null
    ]);
    b.addEventListener("click", function () { choix(cleE); if (innerWidth <= 760) replie(true); });
    hote.appendChild(b);
  }
  function rendArbre() {
    var hote = UI.vide(document.getElementById("eq-arbre"));
    // Une affaire choisie : les nombres ne comptent que les personnes qui y sont (02.11.2026)
    var dansAff = filtres.affaires.length ? membresAffaires(filtres.affaires) : null;
    var tous = D.membres({ tous: true }).filter(function (m) { return !dansAff || dansAff[m.id]; });
    function compte(f) { return tous.filter(f).length; }
    function choisit(k) { cle = k; memorise(); dessine(); }
    entree(hote, "tous", "Tous", tous.length, 0, cle === "tous", choisit);
    var nAdmin = compte(estAdmin);
    var toute = D.membres({ tous: true });            // la structure du bandeau ne bouge pas ; seuls les nombres suivent l'affaire
    if (toute.some(estAdmin)) entree(hote, "admin", "Administrateurs", nAdmin, 0, cle === "admin", choisit);
    var succ = Object.keys(D.SUCCURSALES);
    if (toute.some(function (m) { return !m.succursale; }) && succ.length) succ.push("_");
    (succ.length ? succ : ["_"]).forEach(function (s) {
      var dansS = function (m) { return (m.succursale || "_") === s && !estAdmin(m); };
      if (succ.length) entree(hote, "s:" + s, s === "_" ? "Sans succursale" : D.SUCCURSALES[s], compte(function (m) { return (m.succursale || "_") === s; }), 0, cle === "s:" + s, choisit);
      var discs = {};
      toute.filter(dansS).forEach(function (m) { discs[m.discipline || "_"] = 0; });
      tous.filter(dansS).forEach(function (m) { discs[m.discipline || "_"]++; });
      var ordre = Object.keys(D.DISCIPLINES);
      Object.keys(discs).sort(function (a, b) { return (a === "_" ? 999 : ordre.indexOf(a)) - (b === "_" ? 999 : ordre.indexOf(b)); }).forEach(function (d) {
        var k = "d:" + s + "|" + d;
        entree(hote, k, d === "_" ? "Secteur non renseigné" : D.DISCIPLINES[d], discs[d], succ.length ? 1 : 0, cle === k, choisit);
      });
    });
    // Affaire : son responsable et l'équipe de sa fiche
    var aff = D.affaires({ tous: true }).filter(dansSuccursales);
    if (filtres.affaires.length && !aff.some(function (a) { return a.id === filtres.affaires[0]; })) filtres.affaires = [];
    if (aff.length) {
      hote.appendChild(el("p", { class: "titre-groupe", text: "Affaire" }));
      var sel = el("select", { "aria-label": "Filtrer par affaire" }, [el("option", { value: "", text: "Toutes les affaires" })]
        .concat(D.optionsAffaires(aff, function (a) { return el("option", { value: a.id, text: D.libelleAffaire(a) }); })
          .map(function (x) { return x.options ? el("optgroup", { label: x.groupe }, x.options) : x; })));
      sel.value = filtres.affaires[0] || "";
      // Choisir une affaire montre toute son équipe : le bandeau repasse sur « Tous » (05.11.2026, demande de Tony)
      sel.addEventListener("change", function () { filtres.affaires = sel.value ? [sel.value] : []; if (sel.value) cle = "tous"; memorise(); dessine(); });
      hote.appendChild(el("label", { class: "eq-affaire" }, [sel]));
    }
  }

  /* ------------------------------------------------------------- affichage */

  function rattachement(m) {
    return [D.SUCCURSALES[m.succursale], D.DISCIPLINES[m.discipline]].filter(Boolean).join(" · ");
  }

  function champsCherches(m) {
    return [m.prenom + " " + m.nom, D.libelleMetier(m.metier), rattachement(m), m.actif ? "" : "inactif",
            m.telInterne, m.telExterne, m.telNatel]
      .concat(D.statutsDe(m).map(D.libelleStatut))
      .concat(aVenir(m).map(function (a) { return a.motif; }));
  }

  /* Absences en cours ou à venir : une période terminée ne s'affiche plus
     (11.10.2026, demande de Tony). Elle reste en base. */
  function aVenir(m) {
    var auj = C.isoAuj();
    return m.absences.filter(function (a) { return (a.fin || a.debut) >= auj; });
  }

  /** Numéro cliquable : « 079 123 45 67 » compose tel:0791234567 sans les espaces. */
  function lienTel(numero, mots) {
    return el("a", { href: "tel:" + numero.replace(/[^+0-9]/g, ""), class: "lien-doux" }, [UI.surligne(numero, mots)]);
  }

  /* Téléphones de la fiche, tenus par chacun dans « Mon profil » : l'interne
     (numéro court du bureau), la ligne directe et le natel, chacun avec son libellé. */
  function telephones(m, mots) {
    var lignes = [["Int.", m.telInterne], ["Dir.", m.telExterne], ["Natel", m.telNatel]].filter(function (l) { return l[1]; });
    if (!lignes.length) return el("span", { class: "secondaire", text: "—" });
    return el("div", {}, lignes.map(function (l) {
      return el("div", { class: "num" }, [
        el("span", { class: "secondaire", style: "margin-right:6px", text: l[0] }),
        lienTel(l[1], mots)
      ]);
    }));
  }

  function selection(metier, sansTexte) {
    var mots = sansTexte || !barre ? [] : barre.termes();
    var dans = filtres.affaires.length ? membresAffaires(filtres.affaires) : null;
    return D.membres({ metier: metier == null ? null : metier, tous: true })
      .filter(function (m) {
        if (!dansCle(m)) return false;
        if (filtres.groupes.length && !filtres.groupes.some(function (g) { return dansGroupe(m, g); })) return false;
        return (!dans || dans[m.id]) && UI.correspond(champsCherches(m), mots);
      });
  }

  // Est « dans l'affaire » son responsable et l'équipe inscrite dans la fiche affaire, rien d'autre :
  // les tâches n'y font plus entrer personne (05.11.2026, demande de Tony) ;
  // plusieurs affaires cochées : dans l'une au moins
  function membresAffaires(ids) {
    var dans = Object.create(null);
    ids.forEach(function (id) {
      var a = D.affaire(id);
      if (!a) return;
      if (a.responsableId) dans[a.responsableId] = true;
      a.ingenieurs.concat(a.dessinateurs).forEach(function (i) { dans[i] = true; });
    });
    return dans;
  }

  // Répartition de la charge : calculée une fois par version des données, et non
  // une fois par section à chaque frappe. Sur 6 000 tâches, c'était l'essentiel du temps.
  var cacheRep = { v: -1, rep: null };
  function repartitionCourante() {
    if (cacheRep.v !== D.version()) {
      cacheRep = { v: D.version(), rep: Calc.repartition(D.taches({ sansTerminees: true }), D.membres({ tous: true }), D.canton()) };
    }
    return cacheRep.rep;
  }

  function dessine() {
    suivi.debut();
    if (barre) barre.compte(selection().length, selection(null, true).length);

    rendArbre();

    var hote = UI.vide(document.getElementById("sections"));
    SECTIONS.forEach(function (s) {
      var membres = selection(s.metier);
      // Une section sans personne ne s'affiche pas (02.11.2026, demande de Tony)
      if (!membres.length) return;
      var liste = el("div", { class: "defile" });
      hote.appendChild(el("section", { class: "section" }, [
        el("div", { class: "tete-section" }, [
          // Le nombre devant le métier, sans ligne « 01 — Ingénieurs » au-dessus (14.10.2026, demande de Tony)
          el("div", {}, [
            el("h2", { class: "titre-metier", text: membres.length + " " + (s.fixe || (membres.length > 1 ? s.plur : s.sing).replace(/^./, function (c) { return c.toUpperCase(); })) })
          ]),
        ]),
        liste
      ]));
      rendListe(s, membres, liste);
    });
    if (!hote.firstChild) {
      var q = barre ? barre.valeur().trim() : "";
      hote.appendChild(el("section", { class: "section" }, [el("div", { class: "vide",
        text: q ? "Personne ne correspond à « " + q + " »." : "Personne dans cette équipe." })]));
    }
  }

  /* La semaine en cours, du lundi au vendredi : LED allumée présent, à moitié
     pour une demi-journée, éteinte absent, jour non travaillé ou chômé. */
  var JOURS_LED = ["L", "M", "M", "J", "V"], NOMS_LED = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
  function presenceSemaine(m) {
    var auj = C.isoAuj(), canton = D.canton();
    return el("div", { class: "eq-sem" }, C.serie(C.lundi(auj), 5).map(function (j, i) {
      var ch = C.chome(j, canton), a = ch ? null : Calc.absenceLe(m, j);
      var p = ch || a ? 0 : (Calc.poidsJour(m, j) || 0);
      return el("span", { class: "eq-jour" + (j === auj ? " auj" : ""),
        title: NOMS_LED[i] + " " + C.fmtCourt(j) + " : " + (ch ? ch : a ? "absent" + (a.motif ? " (" + a.motif + ")" : "") :
          p >= 1 ? "présent" : p > 0 ? "demi-journée" : "ne travaille pas ce jour") }, [
        el("i", { text: JOURS_LED[i] }), el("span", { class: "eq-led" + (p >= 1 ? " on" : p > 0 ? " demi" : "") })
      ]);
    }));
  }

  /* Modifier la fiche d'un membre (02.11.2026, demande de Tony) : avec le droit
     « membres_modifier ». Les groupes, l'accès et l'adresse restent à la console. */
  function ficheMembre(id) {
    var m = D.membre(id);
    if (!m) return;
    var opt = function (liste, vide) {
      return [{ valeur: "", label: vide }].concat(Object.keys(liste).map(function (k) { return { valeur: k, label: liste[k] }; }));
    };
    var corps = el("div", {}, [
      el("div", { class: "grille-champs" }, [
        UI.champ({ nom: "prenom", label: "Prénom", valeur: m.prenom }),
        UI.champ({ nom: "nom", label: "Nom", valeur: m.nom }),
        UI.champ({ nom: "metier", label: "Métier", type: "select", valeur: m.metier || "", options: opt(D.METIERS, "— À désigner —") }),
        UI.champ({ nom: "capacite", label: "Capacité (jours par semaine)", type: "number", valeur: m.capacite, pas: "0.5", min: "0.5", max: "7",
          inputmode: "decimal", aide: "Les jours travaillés se règlent avec le bouton « Jours travaillés »." }),
        Object.keys(D.SUCCURSALES).length
          ? UI.champ({ nom: "succursale", label: "Succursale", type: "select", valeur: m.succursale || "", options: opt(D.SUCCURSALES, "— Non renseignée —") })
          : null,
        UI.champ({ nom: "discipline", label: "Secteur", type: "select", valeur: m.discipline || "", options: opt(D.DISCIPLINES, "— Non renseigné —") }),
        UI.champ({ nom: "telInterne", label: "Téléphone interne", valeur: m.telInterne || "", inputmode: "tel" }),
        UI.champ({ nom: "telExterne", label: "Ligne directe", valeur: m.telExterne || "", inputmode: "tel" }),
        UI.champ({ nom: "telNatel", label: "Natel", valeur: m.telNatel || "", inputmode: "tel" })
      ])
    ]);
    UI.ouvre({
      surtitre: "Modifier la fiche", titre: m.prenom + " " + m.nom, corps: corps,
      boutons: [
        { label: "Annuler" },
        { label: "Enregistrer", or: true, action: function () {
          var v = UI.lit(corps);
          if (!("succursale" in v)) v.succursale = m.succursale || "";
          return D.modifieFiche(m.id, v).then(function () { dessine(); UI.toast("Fiche enregistrée."); })
            .catch(function (e) { UI.toast(e.message); return false; });
        } }
      ]
    });
  }

  function rendListe(s, membres, hote) {
    var mots = barre ? barre.termes() : [];
    var q = barre ? barre.valeur().trim() : "";
    var filtre = cle !== "tous" || filtres.groupes.length || filtres.affaires.length;

    if (!membres.length) {
      hote.appendChild(q
        ? el("div", { class: "sans-resultat", style: "padding:26px 0 10px" }, [
            el("p", { class: "aide", style: "margin:0" }, ["Aucun " + s.sing + " pour « ", el("em", { style: "font-style:normal;color:var(--or)", text: q }), " »"])
          ])
        : el("div", { class: "vide", text: filtre ? "Aucun " + s.sing + " pour ces filtres" : "Aucun " + s.sing + " — les fiches se créent dans la console" }));
      return;
    }

    // Charge de la semaine en cours, pour situer chacun d'un coup d'œil. Pas pour
    // un collaborateur (11.10.2026, demande de Tony) : la charge des autres ne le
    // regarde pas, comme au tableau de bord.
    var voitCharge = D.aDroit("planning_equipe");
    var jours = C.serie(C.lundi(C.isoAuj()), 7);
    var rep = voitCharge ? repartitionCourante() : {};
    var planifie = !!D.PLANIFIES[s.metier];

    var corps = el("tbody");
    membres.forEach(function (m) {
      var b = voitCharge ? Calc.bilan(m, jours, rep[m.id], D.canton()) : null;
      var pourcent = b && b.capacite > 0 ? Math.min(140, Math.round(b.taux * 100)) : 0;
      var periodes = aVenir(m), prochaine = periodes[0];
      var sousTitre = rattachement(m);

      corps.appendChild(suivi.marque(el("tr", { style: m.actif ? "" : "opacity:.45" }, [
        el("td", {}, [
          el("div", { class: "principal" }, [UI.surligne(m.prenom + " " + m.nom, mots)]),
          el("div", { class: "secondaire" }, [sousTitre ? UI.surligne(sousTitre, mots)
            : (Object.keys(D.SUCCURSALES).length ? "Succursale non renseignée" : "")])
        ]),
        el("td", {}, [
          el("div", {}, [UI.surligne(D.libelleMetier(m.metier), mots)]),
          // Les statuts se cumulent : ils s'écrivent sous le métier, pas à sa place
          D.statutsDe(m).length
            ? el("div", { class: "statuts-ligne", style: "margin-top:5px" }, UI.etiquettesStatuts(m))
            : null
        ]),
        el("td", {}, [telephones(m, mots)]),
        el("td", { title: D.detailJours(m) }, [presenceSemaine(m), el("div", { class: "eq-capa num", text: C.fmtJours(m.capacite) + " j/sem." })]),
        !voitCharge ? null : el("td", {}, planifie ? [
          el("div", { class: "num", text: C.fmtJours(b.charge) + " / " + C.fmtJours(b.capacite) + " j" }),
          el("div", { class: "jauge" }, [el("i", { style: "width:" + Math.min(100, pourcent) + "%;" + (b.charge > b.capacite + 0.05 ? "background:var(--alerte)" : "") })])
        ] : [el("span", { class: "secondaire", text: "—" })]),
        el("td", {}, [
          periodes.length
            ? el("div", {}, [
                el("div", { class: "num", text: periodes.length + (periodes.length > 1 ? " périodes" : " période") }),
                prochaine ? el("div", { class: "secondaire" }, [UI.surligne(prochaine.motif, mots), " · " + C.fmtCourt(prochaine.debut) + " → " + C.fmtCourt(prochaine.fin)]) : null
              ])
            : el("span", { class: "secondaire", text: "—" })
        ]),
        el("td", { class: "actions" }, [
          D.aDroit("membres_modifier") ? UI.boutonIcone("modifier", "Modifier la fiche", m.prenom + " " + m.nom, function () { ficheMembre(m.id); }) : null,
          UI.boutonIcone("jours", D.peutJours(m.id) ? "Jours travaillés" : "Jours travaillés (consultation)", m.prenom + " " + m.nom, function () { UI.joursTravailles(m.id, dessine); }),
          UI.boutonIcone("absence", "Absences", m.prenom + " " + m.nom, function () { UI.absences(m.id, dessine); })
        ])
      ]), m.id));
    });

    hote.appendChild(el("table", { class: "liste" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { class: "c-nom", text: "Nom et rattachement" }),
        el("th", { class: "c-metier", text: "Métier et statuts" }),
        el("th", { class: "c-tel", text: "Téléphones" }),
        el("th", { class: "c-pres", text: "Présence" }),
        voitCharge ? el("th", { class: "c-charge", text: "Cette semaine" }) : null,
        el("th", { class: "c-abs", text: "Absences" }),
        el("th", { class: "c-act", text: "" })
      ])]),
      corps
    ]));
  }

})();
</script>
</body>
</html>
