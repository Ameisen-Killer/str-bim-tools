<script>
/* Version 2 : charte claire unique. La marque du bureau (logo, couleurs) est
   reprise du dernier passage de ce compte, avant le premier rendu ;
   ui.js / portail.js la confirment ensuite. */
(function(){var r=document.documentElement,m="str";r.setAttribute("data-version","v2");r.setAttribute("data-theme","clair");try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();

<link rel="preload" href="/assets/polices/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/polices/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>

<body class="large">

<div data-chrome></div>

<main>
  <div class="wrap entete">
    <h1>Tableau de bord</h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <section class="section">
      <!-- La recherche reste sous les yeux quand on descend ; l'en-tête du
           planning se colle juste en dessous (--h-collee). -->
      <div class="tete-collante seule-recherche">
        <div data-recherche></div>
      </div>
      <div class="plan-barre">
        <button class="btn" type="button" id="prec" aria-label="Semaine précédente">◀<span class="txt"> Précédente</span></button>
        <button class="btn" type="button" id="auj">Aujourd'hui</button>
        <button class="btn" type="button" id="suiv" aria-label="Semaine suivante"><span class="txt">Suivante </span>▶</button>
        <span class="plan-periode" id="periode"></span>
        <span style="flex:1 1 auto"></span>
        <select id="duree" class="btn" style="text-transform:none;letter-spacing:.04em" aria-label="Nombre de semaines affichées">
          <option value="7">1 semaine</option>
          <option value="14" selected>2 semaines</option>
          <option value="28">4 semaines</option>
        </select>
        <select id="f-affaire" class="btn" style="text-transform:none;letter-spacing:.04em;max-width:240px" aria-label="Filtrer par affaire"></select>
        <select id="f-cote" class="btn" style="text-transform:none;letter-spacing:.04em" aria-label="Filtrer par métier">
          <option value="">Toute l'équipe</option>
          <option value="ingenieur">Ingénieurs</option>
          <option value="dessinateur">Dessinateurs</option>
        </select>
        <select id="f-membre" class="btn" style="text-transform:none;letter-spacing:.04em;max-width:200px" aria-label="Filtrer par membre"></select>
        <label class="case" style="text-transform:none;letter-spacing:.04em">
          <input type="checkbox" id="f-occupes"> Masquer qui n'a rien
        </label>
        <span id="f-lisse"></span>
      </div>

      <div class="cles" id="cles"></div>

      <!-- L'en-tête du planning vit hors du conteneur qui défile de côté : c'est
           la seule façon qu'il se colle sous la barre du haut quand on descend
           dans la page (dans un conteneur à overflow, « sticky » se raccroche au
           conteneur, qui lui ne défile pas verticalement). Son défilement
           latéral est recopié depuis celui du planning. -->
      <div class="plan-tete" id="plan-tete" style="margin-top:28px">
        <div class="plan" id="plan-tete-grille"></div>
      </div>

      <div class="plan-defile" id="plan-defile">
        <div class="plan" id="plan"></div>
      </div>

      <div class="legende-plan">
        <span><i class="ech" aria-hidden="true"></i> Échéance</span>
        <span><i class="ret" aria-hidden="true"></i> En retard</span>
        <span><i class="dash" aria-hidden="true"></i> Charge ingénieur</span>
        <span><i class="coche" aria-hidden="true"></i> Part terminée</span>
        <span><span class="pastille" style="color:var(--texte-faible)" aria-hidden="true"></span> Teinte de l'affaire</span>
        <span id="leg-lis" hidden><i class="lis" aria-hidden="true"></i> Commence plus tôt (lissage)</span>
        <span>Fond hachuré : absence</span>
        <span><i class="off" aria-hidden="true"></i> Jour non travaillé</span>
        <span><i class="demi" aria-hidden="true"></i> Demi-journée</span>
      </div>
    </section>

    <section class="section">
      <div class="tete-section">
        <h2 id="titre-alertes">Alertes</h2>
      </div>
      <div class="alertes" id="alertes"></div>
    </section>
  </div>
</main>

<div data-pied></div>

<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;

  var CLE_VUE = "planif.vue";
  var vue = { debut: null, duree: 14, affaire: "", cote: "", membre: null, occupes: false };
  var memorise0 = null;
  try { memorise0 = localStorage.getItem(CLE_VUE); Object.assign(vue, JSON.parse(memorise0 || "{}")); } catch (e) {}
  // Première visite sur un écran étroit : une seule semaine, sinon tout est illisible.
  if (!memorise0 && window.innerWidth < 760) vue.duree = 7;
  if (!vue.debut) vue.debut = C.lundi(C.isoAuj());

  function memorise() {
    try { localStorage.setItem(CLE_VUE, JSON.stringify(vue)); } catch (e) {}
  }

  if (!UI.session()) return;

  D.pret().then(function () {
    UI.chrome("tableau", [{
      label: "Nouvelle tâche", or: true, icone: "ico-ajout-tache",
      // Sur place : le formulaire complet s'ouvre sans quitter le tableau de bord
      action: function () { UI.formulaireTache(null, { affaireId: vue.affaire, surEnregistrement: rend }); }
    }]);
    UI.pied();
    // Collée sous la barre, la recherche se resserre (planif.css)
    UI.colleSousBarre(document.querySelector(".tete-collante"));
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");

    document.getElementById("prec").addEventListener("click", function () { decale(-7); });
    document.getElementById("suiv").addEventListener("click", function () { decale(7); });
    document.getElementById("auj").addEventListener("click", function () {
      vue.debut = C.lundi(C.isoAuj()); memorise(); rend();
    });
    var duree = document.getElementById("duree");
    duree.value = String(vue.duree);
    duree.addEventListener("change", function () { vue.duree = parseInt(duree.value, 10); memorise(); rend(); });

    var fa = document.getElementById("f-affaire");
    fa.appendChild(el("option", { value: "" }, ["Toutes les affaires"]));
    D.affaires({ tous: true }).forEach(function (a) {
      fa.appendChild(el("option", { value: a.id, selected: a.id === vue.affaire }, [a.code + " · " + a.nom]));
    });
    fa.value = vue.affaire || "";
    fa.addEventListener("change", function () { vue.affaire = fa.value; memorise(); rend(); });

    var fr = document.getElementById("f-cote");
    fr.value = vue.cote || "";
    if (fr.value !== (vue.cote || "")) vue.cote = "";
    fr.addEventListener("change", function () { vue.cote = fr.value; memorise(); rend(); });

    // Première ouverture : chacun se voit d'abord lui-même. Le choix fait ensuite
    // dans la liste est mémorisé comme les autres filtres, « Toute l'équipe » compris.
    if (vue.membre == null) {
      var moi = D.monMembre();
      vue.membre = moi && moi.actif && D.PLANIFIES[moi.metier] ? moi.id : "";
      memorise();
    }
    var fm = document.getElementById("f-membre");
    UI.vide(fm).appendChild(el("option", { value: "" }, ["Toute l'équipe"]));
    D.parMetier(D.membres({ planifies: true })).forEach(function (g) {
      var groupe = el("optgroup", { label: g.titre });
      g.membres.forEach(function (m) { groupe.appendChild(el("option", { value: m.id }, [m.prenom + " " + m.nom])); });
      fm.appendChild(groupe);
    });
    fm.value = vue.membre || "";
    if (fm.value !== (vue.membre || "")) { vue.membre = ""; fm.value = ""; }   // fiche devenue inactive ou supprimée
    fm.addEventListener("change", function () { vue.membre = fm.value; memorise(); rend(); });

    var fo = document.getElementById("f-occupes");
    fo.checked = !!vue.occupes;
    fo.addEventListener("change", function () { vue.occupes = fo.checked; memorise(); rend(); });
    document.getElementById("f-lisse").replaceWith(UI.caseLissage(rend));

    barreRecherche = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher une personne, une affaire, une tâche…",
      surSaisie: rend
    });

    D.surRechargement(rend);
    rend();
  }).catch(UI.echec);

  function decale(n) { vue.debut = C.ajoute(vue.debut, n); memorise(); rend(); }

  // Passage téléphone <-> ordinateur (rotation, fenêtre redimensionnée) : la mise en page change
  var etroit = window.matchMedia("(max-width:640px)");
  var surChangement = function () { if (jours.length) rend(); };
  if (etroit.addEventListener) etroit.addEventListener("change", surChangement);
  else if (etroit.addListener) etroit.addListener(surChangement);

  /* L'en-tête collé suit le planning quand on défile de côté. */
  (function () {
    var defile = document.getElementById("plan-defile"), tete = document.getElementById("plan-tete");
    defile.addEventListener("scroll", function () { tete.scrollLeft = defile.scrollLeft; }, { passive: true });
  })();

  /* --------------------------------------------------------------- rendu */

  var jours = [], sems = [], membres = [], rep = {};
  var cacheRep = { cle: null, rep: null }, cacheAlertes = { cle: null, liste: [] };
  // Nom explicite : « barre » est déjà la fonction qui dessine une barre du planning
  var barreRecherche = null;
  var vusRecherche = null;                          // ids retenus par la recherche, sinon null

  function rend() {
    var canton = D.canton();
    jours = C.serie(vue.debut, vue.duree);
    sems = Calc.semaines(jours);

    var taches = D.taches({ sansTerminees: false }).filter(function (t) {
      if (vue.affaire && t.affaireId !== vue.affaire) return false;
      return true;
    });

    membres = D.membres({ planifies: true }).slice();   // administrateurs, administratifs et non désignés n'ont pas de planning
    // La répartition ne dépend ni de la semaine affichée ni de la durée : changer
    // de semaine ne la recalcule pas. Seuls les données, le filtre d'affaire ou le canton la périment.
    var lisse = Calc.lissage();
    var cle = D.version() + "|" + (vue.affaire || "") + "|" + canton + "|" + lisse + "|" + C.isoAuj();
    if (cacheRep.cle !== cle) {
      // Les tâches terminées restent dessinées mais ne pèsent plus sur la charge,
      // comme sur la page Équipe et dans les alertes
      var enCours = taches.filter(function (t) { return t.statut !== "termine"; });
      var repartie = Calc.repartition(enCours, membres, canton, { lisse: lisse });

      // Toutes les affectations et leur fenêtre, calculées une fois ; chaque semaine affichée n'en garde que ce qui la touche.
      // Une part ouverte en retard repart d'aujourd'hui (Calc.fenetre) : elle pèse là où le travail se fera.
      // Lissée, une barre commence au premier jour que la répartition lui a avancé.
      var affectations = [];
      taches.forEach(function (t) {
        var fin = Calc.finEffective(t);
        if (!fin) return;
        Calc.affectations(t).forEach(function (af) {
          // Tâche enchaînée : la barre du calcul s'arrête la veille du début du dessin
          var finAf = Calc.finPart(t, af.role, canton);
          var info = {
            tache: t, role: af.role, charge: af.charge, fin: finAf, echeancePart: finAf, membreId: af.membreId, fini: af.fini,
            debut: Calc.debutAffectation(t, af, canton)
          };
          if (t.statut !== "termine" && !af.fini) {
            var f = Calc.fenetre(af.charge, finAf, D.membre(af.membreId), canton);
            if (f.reportee) { info.debut = f.debut; info.fin = f.fin; info.reportee = true; }
            var av = Calc.avance(repartie, af.membreId, t.id, af.role);
            if (av && av < info.debut) { info.debut = av; info.avancee = true; }
          }
          affectations.push(info);
        });
      });
      // Charges sans personne : placées sur le seul calendrier du canton, en attendant quelqu'un
      var aAffecter = [];
      enCours.forEach(function (t) {
        var fin = Calc.finEffective(t);
        if (!fin) return;
        Calc.nonAffectees(t).forEach(function (na) {
          var f = Calc.fenetre(na.charge, Calc.finPart(t, na.role, canton), null, canton);
          aAffecter.push({
            tache: t, role: na.role, charge: na.charge, fin: f.fin, membreId: null,
            debut: f.debut, reportee: f.reportee
          });
        });
      });
      cacheRep = { cle: cle, rep: repartie, affectations: affectations, aAffecter: aAffecter };
    }
    rep = cacheRep.rep;
    document.getElementById("leg-lis").hidden = !lisse;

    // Ingénieurs d'abord, dessinateurs ensuite ; l'ordre alphabétique est gardé dans chaque groupe.
    // Un administratif ne porte pas de tâches : il ne paraît pas ici.
    var ORDRE_COTES = { ingenieur: 0, dessinateur: 1 };
    // Affaire choisie : seulement son équipe, sinon ses barres se perdent parmi des dizaines de lignes vides
    var dansAffaire = vue.affaire ? membresAffaire(vue.affaire, taches) : null;
    membres = membres.filter(function (m) {
        return (!vue.membre || m.id === vue.membre)
          && (!vue.cote || D.cote(m.metier) === vue.cote) && (!dansAffaire || dansAffaire[m.id]);
      })
      .map(function (m, i) { return { m: m, i: i }; })
      .sort(function (x, y) {
        return rang(x.m) - rang(y.m) || x.i - y.i;
      })
      .map(function (o) { return o.m; });
    function rang(m) { var c = D.cote(m.metier); return c in ORDRE_COTES ? ORDRE_COTES[c] : 9; }

    // index des barres à dessiner, par membre
    var barres = {}, premier = jours[0], dernier = jours[jours.length - 1];
    cacheRep.affectations.forEach(function (info) {
      if (info.fin < premier || info.debut > dernier) return;             // hors fenêtre
      (barres[info.membreId] || (barres[info.membreId] = [])).push(info);
    });

    // Charges à affecter, par métier : elles ouvrent le planning
    var libres = {};
    cacheRep.aAffecter.forEach(function (info) {
      if (info.fin < premier || info.debut > dernier) return;
      if (vue.cote && info.role !== vue.cote) return;
      (libres[info.role] || (libres[info.role] = [])).push(info);
    });

    /* La recherche retire des lignes, comme les filtres au-dessus : les clés et
       les bilans portent donc sur ce qui reste affiché. Une personne se retient
       sur son identité ou sur ce qu'elle porte dans la fenêtre — on garde alors
       toute sa ligne, une barre isolée ne dirait rien de sa charge. Une charge
       sans personne, elle, se retient sur sa seule tâche. */
    var mots = barreRecherche ? barreRecherche.termes() : [];
    var nbAvantRecherche = membres.length;
    vusRecherche = null;
    if (mots.length) {
      membres = membres.filter(function (m) {
        return UI.correspond(champsMembre(m).concat(champsDesBarres(barres[m.id])), mots);
      });
      vusRecherche = Object.create(null);
      membres.forEach(function (m) { vusRecherche[m.id] = true; });
      Object.keys(libres).forEach(function (r) {
        libres[r] = libres[r].filter(function (info) { return UI.correspond(champsTache(info.tache), mots); });
        if (!libres[r].length) delete libres[r];
      });
    }
    if (barreRecherche) barreRecherche.compte(membres.length, nbAvantRecherche);

    if (vue.occupes) membres = membres.filter(function (m) { return barres[m.id] && barres[m.id].length; });

    rendPeriode();
    rendCles(canton);
    /* Le planning glisse d'un état à l'autre (UI.joue) : une barre déplacée,
       réaffectée ou recalculée rejoint sa place, une ligne filtrée remonte,
       une tâche terminée s'éteint. Pas pendant la frappe d'une recherche. */
    var hotePlan = document.getElementById("plan");
    var avantPlan = UI.enFrappe() ? null : UI.photo(hotePlan);
    rendPlan(barres, libres, canton);
    UI.joue(hotePlan, avantPlan, { entrees: true });
    rendAlertes(canton);
  }

  /** Ce qui, dans un membre, peut être cherché : son identité et son rattachement. */
  function champsMembre(m) {
    return [m.prenom + " " + m.nom, D.libelleMetier(m.metier),
            D.SUCCURSALES[m.succursale], D.DISCIPLINES[m.discipline]];
  }

  /** Ce qui, dans une tâche, peut être cherché depuis le planning. */
  function champsTache(t) {
    var a = D.affaire(t.affaireId);
    return [t.titre, t.note, a && a.code, a && a.nom, D.STATUTS_TACHE[t.statut]];
  }

  /** Les tâches que cette personne porte dans la fenêtre affichée. */
  function champsDesBarres(liste) {
    var champs = [];
    (liste || []).forEach(function (info) { champs = champs.concat(champsTache(info.tache)); });
    return champs;
  }

  /** Est « dans l'affaire » qui y est rattaché dans la fiche affaire ou qui y porte une tâche (même règle que la page Équipe). */
  function membresAffaire(id, tachesAffaire) {
    var a = D.affaire(id), dans = Object.create(null);
    if (a) a.ingenieurs.concat(a.dessinateurs).forEach(function (i) { dans[i] = true; });
    tachesAffaire.forEach(function (t) {
      if (t.ingenieurId) dans[t.ingenieurId] = true;
      if (t.dessinateurId) dans[t.dessinateurId] = true;
    });
    return dans;
  }

  function rendPeriode() {
    var p = document.getElementById("periode");
    UI.vide(p);
    var premiere = sems[0], derniere = sems[sems.length - 1];
    p.appendChild(el("b", { text: premiere.num === derniere.num ? "S" + premiere.num : "S" + premiere.num + " → S" + derniere.num }));
    p.appendChild(document.createTextNode(" · " + C.fmtCourt(jours[0]) + " → " + C.fmtCourt(jours[jours.length - 1])));
  }

  function rendCles(canton) {
    var hote = document.getElementById("cles");
    // Les valeurs d'avant, pour que les chiffres défilent jusqu'aux nouvelles
    var anciens = [].map.call(hote.querySelectorAll(".cle .v"), function (v) { return v._texte != null ? v._texte : v.textContent; });
    UI.vide(hote);
    var rangCle = 0;
    var charge = 0, capacite = 0;
    membres.forEach(function (m) {
      var b = Calc.bilan(m, jours, rep[m.id], canton);
      charge += b.charge; capacite += b.capacite;
    });
    var taux = capacite > 0 ? Math.round(charge / capacite * 100) : 0;
    var auj = C.isoAuj();
    // Les trois autres chiffres suivent le filtre : le retard aussi, sinon il compte pour toute l'équipe
    var retard = D.taches({ sansTerminees: true, membreId: vue.membre || null }).filter(function (t) {
      if (!t.echeance || t.echeance >= auj) return false;
      if (vue.affaire && t.affaireId !== vue.affaire) return false;
      // En recherche, seuls les retards des personnes restées à l'écran
      return !vusRecherche
        || (t.ingenieurId && vusRecherche[t.ingenieurId])
        || (t.dessinateurId && vusRecherche[t.dessinateurId]);
    }).length;

    function cle(v, l, classe) {
      var valeur = el("div", { class: "v" });
      hote.appendChild(el("div", { class: "cle" + (classe ? " " + classe : "") }, [
        valeur, el("div", { class: "l", text: l })
      ]));
      UI.defileTexte(valeur, v, anciens[rangCle++]);
    }
    cle(C.fmtJours(charge), "Jours affectés", "");
    cle(C.fmtJours(capacite), "Jours disponibles", "");
    cle(taux + " %", "Taux d'occupation", taux > 100 ? "alerte" : "or");
    cle(String(retard), "Tâches en retard", retard ? "alerte" : "");
  }

  /* ---------------------------------------------------------------- plan */

  function rendPlan(barres, libres, canton) {
    var plan = UI.vide(document.getElementById("plan"));
    var tete = UI.vide(document.getElementById("plan-tete-grille"));
    var n = jours.length, auj = C.isoAuj();

    // Samedi et dimanche à demi-largeur : on n'y travaille pas, la place va aux jours ouvrés.
    var nWeekend = jours.filter(C.estWeekend).length, nOuvre = n - nWeekend;
    var cols = jours.map(function (j) {
      return C.estWeekend(j) ? "minmax(0,.5fr)" : "minmax(0,1fr)";
    }).join(" ");
    var mini = etroit.matches
      ? (nOuvre * 44 + nWeekend * 22) + "px"             // une semaine tient dans l'écran d'un téléphone
      : Math.max(760, 186 + nOuvre * 38 + nWeekend * 19) + "px";

    // Deux grilles, mêmes colonnes : l'en-tête reste aligné sur les barres.
    [plan, tete].forEach(function (g) {
      g.style.setProperty("--n", n);
      g.style.setProperty("--cols", cols);
      g.style.minWidth = mini;
    });

    /* ---- en-tête : semaines puis jours ---- */
    tete.appendChild(el("div", { class: "pl-nom pl-tete-nom" }, [
      el("div", { class: "pl-membre" }, [el("span", { class: "r", text: "Équipe" })])
    ]));

    var lignesSem = el("div", { class: "pl-sems" });
    sems.forEach(function (s) {
      var actuelle = s.jours.indexOf(auj) >= 0;
      lignesSem.appendChild(el("div", {
        class: "pl-sem" + (actuelle ? " actuelle" : ""),
        style: "--span:" + s.jours.length,
        text: "Semaine " + s.num
      }));
    });

    var lignesJour = el("div", { class: "pl-jours" });
    jours.forEach(function (j) {
      var motif = C.chome(j, canton);
      lignesJour.appendChild(el("div", {
        class: "pl-jour" + (motif ? " chome" : "") + (j === auj ? " auj" : ""),
        title: motif || C.fmtLong(j)
      }, [C.jourCourt(j), el("b", { text: String(C.quantieme(j)) })]));
    });

    tete.appendChild(el("div", { class: "pl-zone pl-tete-zone" }, [lignesSem, lignesJour]));

    // Fond d'une ligne : jours chômés, absences du membre (aucune pour une ligne à affecter), aujourd'hui
    function fondDe(m) {
      var fond = el("div", { class: "pl-fond", "aria-hidden": "true" });
      jours.forEach(function (j) {
        var classes = [];
        if (C.chome(j, canton)) classes.push("chome");
        else if (m && Calc.absenceLe(m, j)) classes.push("abs");
        else if (m && !Calc.poidsJour(m, j)) classes.push("off");  // jour où la personne ne travaille pas
        else if (m && Calc.poidsJour(m, j) < 1) classes.push("demi");
        if (j === auj) classes.push("auj");
        fond.appendChild(el("i", { class: classes.join(" ") }));
      });
      return fond;
    }

    // Piste d'une ligne : ses barres, empilées quand elles se chevauchent
    function pisteDe(barresLigne) {
      var piste = el("div", { class: "pl-piste" });
      var liste = barresLigne.slice().sort(function (x, y) {
        return x.debut < y.debut ? -1 : x.debut > y.debut ? 1 : 0;
      });
      if (vue.duree === 7) placeAuDemiJour(liste, piste, canton);
      else {
        var pistesFin = [];                     // dernière colonne occupée par piste
        liste.forEach(function (info) {
          var c1 = Math.max(1, C.diff(jours[0], info.debut) + 1);
          var c2 = Math.min(n, C.diff(jours[0], info.fin) + 1);
          if (c2 < 1 || c1 > n) return;
          var cn = Math.max(1, c2 - c1 + 1);

          var l = 0;
          while (l < pistesFin.length && pistesFin[l] >= c1) l++;
          pistesFin[l] = c1 + cn - 1;

          piste.appendChild(barre(info, c1, cn, l + 1, canton));
        });
      }
      if (!liste.length) piste.appendChild(el("div", { class: "pl-vide", text: "Rien de planifié" }));
      return piste;
    }

    /* ---- tout en haut : les charges qui n'ont encore personne ----
       Une ligne par métier. Glisser une barre sur un membre la lui confie. */
    var rolesLibres = ["ingenieur", "dessinateur"].filter(function (r) { return libres[r] && libres[r].length; });
    if (rolesLibres.length) {
      var nbLibres = rolesLibres.reduce(function (s, r) { return s + libres[r].length; }, 0);
      plan.appendChild(el("div", { class: "pl-groupe a-affecter", "data-anim": "g|libre" }, [
        el("div", {}, [
          el("div", { class: "num-section", text: nbLibres + (nbLibres > 1 ? " charges sans personne" : " charge sans personne") }),
          el("h3", { text: "À affecter" })
        ])
      ]));
      rolesLibres.forEach(function (r) {
        var total = libres[r].reduce(function (s, i) { return s + i.charge; }, 0);
        plan.appendChild(el("div", { class: "pl-nom", "data-anim": "n|libre|" + r }, [
          el("div", { class: "pl-membre" }, [
            el("div", {}, [
              el("div", { class: "n", text: r === "ingenieur" ? "Charge ingénieur" : "Charge dessin" }),
              el("div", { class: "r", text: "À affecter" }),
              el("div", { class: "c", text: libres[r].length + (libres[r].length > 1 ? " tâches · " : " tâche · ") + C.fmtJours(total) + " j" })
            ])
          ])
        ]));
        // data-membre vide : la ligne reçoit aussi les charges qu'on veut remettre à affecter
        plan.appendChild(el("div", { class: "pl-zone a-affecter", "data-anim": "z|libre|" + r, dataset: { membre: "", role: r } }, [fondDe(null), pisteDe(libres[r])]));
      });
    }

    /* ---- une ligne par membre ---- */
    if (!membres.length) {
      plan.appendChild(el("div", { class: "pl-nom" }));
      plan.appendChild(el("div", { class: "pl-zone" }, [
        el("div", { class: "vide",
          text: barreRecherche && barreRecherche.valeur().trim() ? "Personne ne correspond à cette recherche" : "Aucun membre à afficher" })
      ]));
      return;
    }

    var TITRES_GROUPES = { ingenieur: "Ingénieurs", dessinateur: "Dessinateurs" };
    var groupeCourant = null;
    membres.forEach(function (m) {
      // Un intertitre à chaque changement de métier, comme dans la page Équipe
      var cote = D.cote(m.metier);
      if (cote !== groupeCourant) {
        groupeCourant = cote;
        var nb = membres.filter(function (x) { return D.cote(x.metier) === cote; }).length;
        plan.appendChild(el("div", { class: "pl-groupe", "data-anim": "g|" + cote }, [
          el("div", {}, [
            el("div", { class: "num-section", text: nb + (nb > 1 ? " membres" : " membre") }),
            el("h3", { text: TITRES_GROUPES[cote] || "Autres" })
          ])
        ]));
      }
      var b = Calc.bilan(m, jours, rep[m.id], canton);
      plan.appendChild(el("div", { class: "pl-nom", "data-anim": "n|" + m.id }, [
        el("div", { class: "pl-membre" }, [
          el("div", {}, [
            el("div", { class: "n", text: m.prenom + " " + m.nom }),
            // Le métier seul : le planning parle de charge, pas de hiérarchie.
            // Les statuts se lisent dans la page Équipe et dans la console.
            el("div", { class: "r", text: D.libelleMetier(m.metier) }),
            el("div", { class: "c", text: C.fmtJours(b.charge) + " / " + C.fmtJours(b.capacite) + " j" })
          ])
        ])
      ]));

      var fond = fondDe(m);
      var piste = pisteDe(barres[m.id] || []);

      var bilan = el("div", { class: "pl-bilan" });
      sems.forEach(function (s) {
        var bs = Calc.bilan(m, s.jours, rep[m.id], canton);
        var classe = bs.charge <= 0.005 ? "nul"
          : bs.charge > bs.capacite + 0.05 ? "trop"
          : bs.taux >= 0.9 ? "plein" : "";
        bilan.appendChild(el("div", { class: "pl-bw " + classe, style: "--span:" + s.jours.length }, [
          el("span", { text: "S" + s.num + "  " + C.fmtJours(bs.charge) + " / " + C.fmtJours(bs.capacite) + " j" }),
          el("span", { class: "bj" }, [el("i", { style: "width:" + Math.min(100, bs.capacite > 0 ? Math.round(bs.taux * 100) : (bs.charge ? 100 : 0)) + "%" })])
        ]));
      });

      var zone = el("div", { class: "pl-zone", "data-anim": "z|" + m.id, dataset: { membre: m.id, role: D.cote(m.metier) } }, [fond, piste, bilan]);
      plan.appendChild(zone);
    });
  }

  /* Vue d'une semaine : les barres sont placées en fractions de jour. Une charge
     partielle n'occupe que sa part de la journée, et deux tâches qui tiennent dans
     le même jour se partagent la ligne : la dernière placée est décalée au matin,
     sans jamais sortir de son jour d'échéance. Positions : index du jour + fraction. */
  function placeAuDemiJour(liste, piste, canton) {
    var n = jours.length;
    function poids(k) { return C.estWeekend(jours[k]) ? 0.5 : 1; }   // week-ends à demi-largeur

    // Échéance la plus tardive d'abord, puis la plus petite charge : les demi-journées
    // se calent en fin de jour, les tâches plus longues se glissent juste avant.
    var tries = liste.slice().sort(function (x, y) {
      return x.fin < y.fin ? 1 : x.fin > y.fin ? -1 : x.charge - y.charge;
    });

    var fronts = [];                           // par ligne : début de la barre la plus à gauche
    tries.forEach(function (info) {
      var m = D.membre(info.membreId);
      if (m && !m.actif) m = null;
      var cap = function (j) { return m ? Calc.capaciteJour(m, j, canton) : (C.estOuvre(j, canton) ? 1 : 0); };
      var iFin = C.diff(jours[0], info.fin), finOuvre = cap(info.fin) > 0;

      // Première ligne libre à droite, ou libre dans le jour d'échéance lui-même
      var l = 0, fin;
      for (;; l++) {
        var front = l < fronts.length ? fronts[l] : Infinity;
        if (front >= iFin + 1) { fin = iFin + 1; break; }
        if (finOuvre && front > iFin + 0.001) { fin = front; break; }
      }
      var debut = debutPosition(info, iFin, fin - iFin, cap);
      if (info.avancee) debut = Math.min(debut, C.diff(jours[0], info.debut));
      fronts[l] = debut;

      // Découpage aux bords de la fenêtre
      var si = Math.floor(debut), sf = debut - si;
      if (si < 0) { si = 0; sf = 0; }
      var ei = Math.ceil(fin - 1e-9) - 1, ef = fin - ei;
      if (ei >= n) { ei = n - 1; ef = 1; }
      if (ei < 0 || si > n - 1 || ei < si) return;

      var total = 0;
      for (var k = si; k <= ei; k++) total += poids(k);
      var marges = "";
      if (sf > 0.01) marges += ";margin-left:calc(2px + " + (sf * poids(si) / total * 100).toFixed(3) + "%)";
      if (ef < 0.99) marges += ";margin-right:calc(2px + " + ((1 - ef) * poids(ei) / total * 100).toFixed(3) + "%)";

      piste.appendChild(barre(info, si + 1, ei - si + 1, l + 1, canton, marges));
    });
  }

  /** Début d'une barre qui finit à la fraction `fracFin` de son jour d'échéance :
   *  on remonte la charge jour après jour, selon la capacité de la personne. */
  function debutPosition(info, iFin, fracFin, cap) {
    var reste = info.charge, j = info.fin, i = iFin, c = cap(j);
    if (c > 0) {
      var u = fracFin * c;
      if (reste <= u + 1e-6) return i + fracFin - reste / c;
      reste -= u;
    }
    for (var garde = 0; garde < 1500; garde++) {
      j = C.ajoute(j, -1); i--; c = cap(j);
      if (c > 0) {
        if (reste <= c + 1e-6) return i + 1 - reste / c;
        reste -= c;
      }
    }
    return i;
  }

  function barre(info, c1, cn, ligne, canton, marges) {
    var t = info.tache, a = D.affaire(t.affaireId);
    var auj = C.isoAuj();
    var classes = ["bt"];
    if (cn <= 2) classes.push("etroite");
    if (info.role === "ingenieur") classes.push("role-i");
    /* Part bouclée : la barre reste à sa place chez la personne qui l'a rendue,
       en demi-teinte et marquée d'une coche, mais ne pèse plus sur sa charge.
       L'autre métier, lui, garde sa barre pleine tant qu'il n'a pas fini. */
    if (t.statut === "termine") classes.push("termine");
    else if (info.fini) classes.push("part-finie");
    else if ((info.echeancePart || t.echeance) < auj) classes.push("retard");
    if (info.avancee) classes.push("lissee");
    // Le filet d'or marque l'échéance : une part reportée ne finit pas à la sienne
    if (!info.reportee && C.diff(jours[0], info.fin) + 1 <= jours.length) classes.push("fin");
    var etirable = !info.fini && t.statut !== "termine" && D.peutEcrireTache(t);

    var n = el("div", {
      class: classes.join(" "),
      style: "--tt:" + UI.teinte(a ? a.teinte : 1) + ";--c1:" + c1 + ";--cn:" + cn + ";--l:" + ligne + (marges || ""),
      tabindex: "0", role: "button",
      // Une tâche n'a qu'une part par métier : (tâche, métier) suit la barre d'une ligne à l'autre
      "data-anim": "b|" + t.id + "|" + info.role, "data-anim-taille": "",
      "data-anim-etat": t.statut === "termine" || info.fini ? "fini" : "",
      title: (a ? a.code + " · " : "") + t.titre + "\n" +
             D.METIERS[info.role] + " · " + C.fmtJours(info.charge) + " j\n" +
             C.fmtCH(info.debut) + " → " + C.fmtCH(info.fin) +
             (info.fini && t.statut !== "termine" ? "\n" + D.PARTS[info.role].label + " terminé" : "") +
             (info.reportee ? "\nEn retard : échéance du " + C.fmtCH(info.echeancePart || t.echeance) + " dépassée, charge reprise dès aujourd'hui"
               : t.statut !== "termine" && !info.fini && t.echeance < auj ? "\nEn retard" : "") +
             (info.role === "ingenieur" && !info.fini && Calc.enchainee(t)
               ? "\nCalcul à rendre avant le dessin (échéance de la tâche : " + C.fmtCH(t.echeance) + ")" : "") +
             (info.avancee ? "\nCommence plus tôt : charge lissée" : "") +
             (etirable ? "\nBord gauche : étirer pour changer la charge (Maj + flèches au clavier)" : "")
    }, [
      etirable ? el("i", { class: "poignee", "aria-hidden": "true" }) : null,
      info.fini ? el("i", { class: "coche", "aria-hidden": "true" }) : null,
      el("span", { class: "code", text: a ? a.code : "—" }),
      el("span", { class: "lib", text: t.titre }),
      el("span", { class: "jr", text: C.fmtJours(info.charge) + " j" })
    ]);

    activeGlissement(n, info, canton);
    n.addEventListener("keydown", function (e) {
      if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && e.shiftKey) {
        // Maj + flèche : la barre s'allonge (←) ou se raccourcit (→) d'une demi-journée
        e.preventDefault();
        if (etirable) changeCharge(info, info.charge + (e.key === "ArrowLeft" ? 0.5 : -0.5));
      } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        applique(info, e.key === "ArrowLeft" ? -1 : 1, null);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); fiche(info);
      }
    });
    return n;
  }

  /* ------------------------------------------------- glisser-déposer */

  function activeGlissement(n, info, canton) {
    n.addEventListener("pointerdown", function (e) {
      if (e.button) return;

      /* Au doigt, pas de glisser-déposer : sur un écran de téléphone il est
         imprécis et empêche de faire défiler la page. Un appui ouvre la fiche,
         qui permet de décaler et de réaffecter. Un balayage reste un défilement. */
      if (e.pointerType === "touch") {
        var tx = e.clientX, ty = e.clientY, annule = false;
        var suit = function (ev) { if (Math.abs(ev.clientX - tx) > 10 || Math.abs(ev.clientY - ty) > 10) annule = true; };
        var nettoie = function () {
          n.removeEventListener("pointermove", suit);
          n.removeEventListener("pointerup", leve);
          n.removeEventListener("pointercancel", nettoie);
        };
        var leve = function () { nettoie(); if (!annule) fiche(info); };
        n.addEventListener("pointermove", suit);
        n.addEventListener("pointerup", leve);
        n.addEventListener("pointercancel", nettoie);
        return;
      }

      var zone = n.closest(".pl-zone");
      if (!zone) return;
      e.preventDefault();
      if (e.target.closest(".poignee")) { etire(e, n, zone, info, canton); return; }
      // Colonnes de largeurs inégales (week-ends resserrés) : on lit leurs bords réels.
      var bords = [].map.call(zone.querySelectorAll(".pl-fond i"), function (c) {
        var r = c.getBoundingClientRect(); return { g: r.left, d: r.right };
      });
      function colonne(x) {
        for (var k = 0; k < bords.length; k++) if (x < bords[k].d) return k;
        return bords.length - 1;
      }
      var x0 = e.clientX, y0 = e.clientY, bouge = false, delta = 0, cible = null;
      var col0 = colonne(x0);

      // Rectangles des lignes, figés au début du geste : plus fiable que elementFromPoint.
      var zones = [].map.call(document.querySelectorAll(".pl-zone[data-membre]"), function (z) {
        return { id: z.dataset.membre, role: z.dataset.role, el: z, r: z.getBoundingClientRect() };
      });

      try { n.setPointerCapture(e.pointerId); } catch (err) {}

      function bougeSouris(ev) {
        var dx = ev.clientX - x0, dy = ev.clientY - y0;
        if (!bouge && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
        if (!bouge) { bouge = true; n.classList.add("glisse"); document.body.classList.add("glisse-en-cours"); }
        var col1 = colonne(ev.clientX);
        delta = col1 - col0;
        n.style.transform = "translateX(" + (bords[col1].g - bords[col0].g) + "px)";

        var trouve = null;
        for (var i = 0; i < zones.length; i++) {
          if (ev.clientY >= zones[i].r.top && ev.clientY <= zones[i].r.bottom) { trouve = zones[i]; break; }
        }
        if (trouve !== cible) {
          zones.forEach(function (z) { z.el.classList.remove("cible"); });
          cible = trouve;
          if (cible && cible.id !== (info.membreId || "")) cible.el.classList.add("cible");
        }
      }

      function fin(ev) {
        n.removeEventListener("pointermove", bougeSouris);
        n.removeEventListener("pointerup", fin);
        n.removeEventListener("pointercancel", fin);
        try { n.releasePointerCapture(e.pointerId); } catch (err) {}
        zones.forEach(function (z) { z.el.classList.remove("cible"); });
        n.classList.remove("glisse");
        document.body.classList.remove("glisse-en-cours");
        n.style.transform = "";
        if (!bouge) { fiche(info); return; }
        applique(info, delta, cible ? cible.id : null, cible ? cible.role : null);
      }

      n.addEventListener("pointermove", bougeSouris);
      n.addEventListener("pointerup", fin);
      n.addEventListener("pointercancel", fin);
    });
  }

  /* Étirer une barre par son bord gauche : l'échéance reste, la charge suit.
     Elle devient la capacité de la personne entre le jour visé et la fin de la
     barre (jours travaillés, absences, temps partiel), arrondie à la demi-journée —
     l'inverse exact du calcul qui avait placé le début. */
  function etire(e, n, zone, info, canton) {
    var bords = [].map.call(zone.querySelectorAll(".pl-fond i"), function (c) {
      var r = c.getBoundingClientRect(); return { g: r.left, d: r.right };
    });
    function colonne(x) {
      for (var k = 0; k < bords.length; k++) if (x < bords[k].d) return k;
      return bords.length - 1;
    }
    var m = info.membreId ? D.membre(info.membreId) : null;
    if (m && !m.actif) m = null;
    function cap(j) { return m ? Calc.capaciteJour(m, j, canton) : (C.estOuvre(j, canton) ? 1 : 0); }
    var finCol = C.diff(jours[0], info.fin);                     // peut tomber hors de la fenêtre
    var derniere = Math.min(finCol, jours.length - 1);
    var jr = n.querySelector(".jr"), texte0 = jr ? jr.textContent : "";
    var style0 = n.getAttribute("style"), charge = info.charge, bouge = false;

    try { n.setPointerCapture(e.pointerId); } catch (err) {}
    n.classList.add("etire");
    document.body.classList.add("glisse-en-cours");

    function suit(ev) {
      var col = Math.min(colonne(ev.clientX), derniere);
      var dispo = 0;
      for (var j = jours[col]; j <= info.fin; j = C.ajoute(j, 1)) dispo += cap(j);
      charge = Math.max(0.5, Math.round(dispo * 2) / 2);
      bouge = bouge || charge !== info.charge;
      var fin = Math.min(finCol, jours.length - 1);
      n.style.setProperty("--c1", col + 1);
      n.style.setProperty("--cn", Math.max(1, fin - col + 1));
      n.style.marginLeft = "2px";
      if (jr) jr.textContent = C.fmtJours(charge) + " j";
    }
    function fin() {
      n.removeEventListener("pointermove", suit);
      n.removeEventListener("pointerup", fin);
      n.removeEventListener("pointercancel", fin);
      try { n.releasePointerCapture(e.pointerId); } catch (err) {}
      n.classList.remove("etire");
      document.body.classList.remove("glisse-en-cours");
      if (!bouge || charge === info.charge) {
        n.setAttribute("style", style0);
        if (jr) jr.textContent = texte0;
        return;
      }
      changeCharge(info, charge);
    }
    n.addEventListener("pointermove", suit);
    n.addEventListener("pointerup", fin);
    n.addEventListener("pointercancel", fin);
  }

  /** Nouvelle charge d'une part, avec « Annuler » dans le message. */
  function changeCharge(info, charge) {
    var t = D.tache(info.tache.id);
    if (!t) return;
    charge = Math.max(0.5, Math.round(charge * 2) / 2);
    var champ = info.role === "ingenieur" ? "chargeInge" : "chargeDessin";
    var avant = t[champ];
    if (charge === avant) return;
    var metier = info.role === "ingenieur" ? "calcul" : "dessin";
    D.retoucheTache(t.id, objet(champ, charge)).then(function () {
      rend();
      // « Annuler » vient de lui-même dans le message (UI.toast), Ctrl+Z aussi
      UI.toast("Charge " + metier + " : " + C.fmtJours(charge) + " j (au lieu de " + C.fmtJours(avant) + ").");
    }).catch(function (err) { UI.toast(err.message); rend(); });
  }
  function objet(k, v) { var o = {}; o[k] = v; return o; }

  /** Décale la tâche de `delta` jours et, si demandé, la réaffecte à un autre membre.
   *  membreCible vide ("") : la ligne « À affecter » du métier roleCible — la charge redevient libre. */
  function applique(info, delta, membreCible, roleCible) {
    var t = D.tache(info.tache.id);
    if (!t) return;
    var champs = {};
    if (delta) {
      // On déplace l'échéance ; le début se recalcule. Une échéance posée sur un
      // jour chômé glisse au prochain jour ouvré dans le sens du déplacement.
      var ech = C.ajoute(t.echeance, delta), pas = delta > 0 ? 1 : -1, garde = 0;
      while (C.chome(ech, D.canton()) && garde++ < 30) ech = C.ajoute(ech, pas);
      delta = C.diff(t.echeance, ech);
      if (delta) { champs.echeance = ech; champs.debut = null; }
    }
    var reaffecte = null, libere = false;
    var champ = info.role === "ingenieur" ? "ingenieurId" : "dessinateurId";
    var actuel = t[champ];
    if (membreCible === "") {
      if (roleCible === info.role && actuel) { champs[champ] = null; libere = true; }
    } else if (membreCible) {
      var m = D.membre(membreCible);
      if (m && m.id !== actuel) {
        if (D.cote(m.metier) !== info.role) {
          UI.toast("Une charge " + (info.role === "ingenieur" ? "ingénieur" : "dessin") +
                   " ne peut aller qu'à un " + (info.role === "ingenieur" ? "ingénieur" : "dessinateur") + ".");
          if (!delta) return;
        } else {
          champs[champ] = m.id;
          reaffecte = m.prenom + " " + m.nom;
        }
      }
    }
    if (!Object.keys(champs).length) return;
    D.retoucheTache(t.id, champs).then(function () {
      rend();
      var dits = [];
      if (delta) dits.push("décalée de " + (delta > 0 ? "+" : "") + delta + " j");
      if (reaffecte) dits.push("confiée à " + reaffecte);
      if (libere) dits.push("remise à affecter");
      UI.toast("Tâche " + dits.join(", ") + ".");
    }).catch(function (e) { UI.toast(e.message); });
  }

  /* -------------------------------------------------------------- fiche */

  /* Fiche rapide d'une barre, donc d'un métier : « Terminé » n'y ferme que
     cette part. Le même volet, sans rôle, s'ouvre au clic sur une ligne de la
     page Tâches (UI.ficheTache dans ui.js). */
  function fiche(info) {
    UI.ficheTache(info.tache.id, { role: info.role, charge: info.charge, surEnregistrement: rend });
  }

  /* ------------------------------------------------------------ alertes */

  function rendAlertes(canton) {
    var hote = UI.vide(document.getElementById("alertes"));
    var cle = D.version() + "|" + canton + "|" + Calc.lissage() + "|" + C.isoAuj();
    if (cacheAlertes.cle !== cle) cacheAlertes = { cle: cle, liste: Calc.alertes(D.etat(), canton) };
    var liste = cacheAlertes.liste.filter(function (al) {
      if (!vue.affaire) return true;
      if (al.tacheId) { var t = D.tache(al.tacheId); return t && t.affaireId === vue.affaire; }
      return true;
    });
    document.getElementById("titre-alertes").textContent =
      liste.length ? liste.length + (liste.length > 1 ? " points d'attention" : " point d'attention") : "Rien à signaler";

    if (!liste.length) {
      hote.appendChild(el("div", { class: "vide", text: "Aucun retard, aucune surcharge" }));
      return;
    }
    liste.slice(0, 20).forEach(function (al) {
      hote.appendChild(el("div", { class: "al " + al.type }, [
        el("span", { class: "q", text: al.quoi }),
        el("div", {}, [el("b", { text: al.texte }), " — " + al.detail])
      ]));
    });
    if (liste.length > 20) {
      hote.appendChild(el("div", { class: "secondaire", style: "font-family:var(--mono);font-size:11px;color:var(--texte-faible)", text: "et " + (liste.length - 20) + " autres" }));
    }
  }
})();
</script>
