<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annuaire · Planification</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F5F2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%236B5233'/%3E%3Cpath d='M28 82V27h24v55M52 82V46h21v36M20 82h60' fill='none' stroke='%23E9D6B0' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* Version 2 : charte claire unique. La marque du bureau (logo, couleurs) est
   reprise du dernier passage de ce compte, avant le premier rendu ;
   ui.js / portail.js la confirment ensuite. */
(function(){var r=document.documentElement,m="str";r.setAttribute("data-version","v2");r.setAttribute("data-theme","clair");try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=3">
<link rel="stylesheet" href="/planif/assets/marque.css?v=3">
<link rel="stylesheet" href="/planif/assets/planif.css?v=78">
<link rel="stylesheet" href="/planif/assets/habillage.css?v=14">
</head>
<body class="large">

<div data-chrome></div>

<main>
  <!-- Page du module Communication (07.10.2026) : même titre, sous-barre en dessous (ui.js) -->
  <div class="wrap entete">
    <h1>Communication <span id="titre-liste" class="compte-titre"></span></h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>

  <div class="wrap" data-bandeau></div>

  <div class="wrap">
    <section class="section">
      <!-- La recherche reste sous les yeux quand la liste défile -->
      <div class="tete-collante seule-recherche">
        <div data-recherche></div>
      </div>
      <div class="defile" id="liste"></div>
    </section>
  </div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=6"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=42"></script>
<script src="/planif/assets/donnees.js?v=54"></script>
<script src="/planif/assets/calculs.js?v=11"></script>
<script src="/planif/assets/version.js?v=3"></script>
<script src="/planif/assets/ui.js?v=79"></script>
<script src="/planif/assets/tchat.js?v=7"></script>
<script src="/planif/assets/palette.js?v=15"></script>
<script src="/planif/assets/direct.js?v=13"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, el = UI.el;

  var barre = null;                                 // recherche instantanée
  var suivi = UI.suiviApparitions();

  if (!UI.session()) return;

  D.pret().then(function () {
    UI.chrome("annuaire", [{ label: "Nouvelle fiche", or: true, icone: "ico-ajout-contact", action: function () { formulaire(null); } }]);
    UI.pied();
    // Collé sous la barre, le bloc de recherche se resserre (planif.css)
    UI.colleSousBarre(document.querySelector(".tete-collante"));
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");

    /* « Nouvelle fiche » ne paraît qu'une fois, dans la barre du haut (et en
       bouton flottant au téléphone) : le doublon en tête de section faisait
       deux boutons identiques à un écran d'intervalle. */

    barre = UI.recherche({
      hote: document.querySelector("[data-recherche]"),
      exemple: "Rechercher un nom, une société, un rôle, un numéro…",
      surSaisie: dessine,
      surEntree: function () { var l = selection(); if (l.length === 1) formulaire(l[0].id); }
    });
    D.surRechargement(dessine);
    dessine();
  }).catch(UI.echec);

  /* ------------------------------------------------------------- affichage */

  function nomAffiche(c) {
    var personne = (c.prenom + " " + c.nom).trim();
    return personne || c.societe;
  }

  function champsCherches(c) {
    return [c.nom, c.prenom, c.societe, c.role, c.telephone, c.natel, c.email, c.site,
            c.adresse, c.npa, c.localite, c.canton, c.pays, c.observations];
  }

  function selection(opts) {
    opts = opts || {};
    var mots = opts.sansTexte || !barre ? [] : barre.termes();
    return D.contacts().filter(function (c) { return UI.correspond(champsCherches(c), mots); });
  }

  /** Numéro cliquable : « 021 555 10 20 » compose tel:+41215551020 sans les espaces. */
  function lienTel(numero, mots) {
    if (!numero) return null;
    return el("a", { href: "tel:" + numero.replace(/[^+0-9]/g, ""), class: "lien-doux" }, [UI.surligne(numero, mots)]);
  }

  /* Adresse sur trois lignes au plus : la rue, puis « NPA localité (canton) »,
     puis le pays quand il sort de Suisse — l'écrire partout n'apprendrait rien. */
  function adresse(c, mots) {
    var ville = [c.npa, c.localite].filter(Boolean).join(" ");
    var lieu = ville + (c.canton ? (ville ? " " : "") + "(" + c.canton + ")" : "");
    var etranger = c.pays && !/^(suisse|schweiz|svizzera|switzerland|ch)$/i.test(c.pays.trim());
    if (!c.adresse && !lieu && !etranger) return el("span", { class: "secondaire", text: "—" });
    return el("div", {}, [
      c.adresse ? el("div", {}, [UI.surligne(c.adresse, mots)]) : null,
      lieu ? el("div", { class: c.adresse ? "secondaire" : "" }, [UI.surligne(lieu, mots)]) : null,
      etranger ? el("div", { class: "secondaire" }, [UI.surligne(c.pays, mots)]) : null
    ]);
  }

  /* L'adresse ouverte dans Google Maps, dans un onglet à part : le planning
     reste là où il était. Le lien n'apparaît que s'il y a de quoi chercher —
     une rue, ou au moins une localité —, et le canton reste dehors : le NPA
     suffit à lever l'ambiguïté, les parenthèses embrouillent la recherche. */
  function lienCarte(c) {
    if (!c.adresse && !c.localite && !c.npa) return null;
    var ou = [c.adresse, [c.npa, c.localite].filter(Boolean).join(" "), c.pays].filter(Boolean).join(", ");
    return UI.lienIcone("carte", "Voir sur la carte", nomAffiche(c),
      "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ou), true);
  }

  /* Adresse électronique puis site, l'une sous l'autre — comme le fixe et le
     natel dans la colonne d'à côté. Le site s'affiche sans « www. » : ce qui
     compte est le domaine, et la colonne est étroite. */
  function enLigne(c, mots) {
    if (!c.email && !c.site) return el("span", { class: "secondaire", text: "—" });
    return el("div", {}, [
      c.email ? el("div", {}, [el("a", { href: "mailto:" + c.email, class: "lien-doux" }, [UI.surligne(c.email, mots)])]) : null,
      c.site ? el("div", { class: c.email ? "secondaire" : "" }, [
        el("a", {
          href: D.urlSite(c), class: "lien-doux", target: "_blank", rel: "noopener noreferrer",
          title: "Ouvrir " + D.urlSite(c)
        }, [UI.surligne(c.site.replace(/^www\./i, ""), mots)])
      ]) : null
    ]);
  }

  function dessine() {
    var contacts = selection();
    var mots = barre ? barre.termes() : [];
    var hote = document.getElementById("liste");
    UI.vide(hote);
    suivi.debut();
    if (barre) barre.compte(contacts.length, selection({ sansTexte: true }).length);
    document.getElementById("titre-liste").textContent =
      contacts.length + (contacts.length > 1 ? " fiches" : " fiche") + " dans l'annuaire";

    if (!contacts.length) {
      var q = barre ? barre.valeur().trim() : "";
      if (!q) {
        hote.appendChild(el("div", { class: "vide", text: "Aucune fiche — commence par en créer une" }));
        return;
      }
      hote.appendChild(el("div", { class: "sans-resultat" }, [
        el("p", { class: "q" }, ["Rien pour « ", el("em", { text: q }), " »"]),
        el("p", { class: "aide", text: "La recherche porte sur le nom, la société, le rôle, les numéros, l'adresse et les observations." })
      ]));
      return;
    }

    var corps = el("tbody");
    contacts.forEach(function (c) {
      var personne = (c.prenom + " " + c.nom).trim();

      var telephones = el("div", {});
      if (c.telephone) telephones.appendChild(el("div", { class: "num" }, [lienTel(c.telephone, mots)]));
      if (c.natel) {
        telephones.appendChild(el("div", { class: "num" }, [
          el("span", { class: "secondaire", style: "margin-right:6px", text: "Natel" }),
          lienTel(c.natel, mots)
        ]));
      }
      if (!c.telephone && !c.natel) telephones.appendChild(el("span", { class: "secondaire", text: "—" }));

      corps.appendChild(suivi.marque(el("tr", {}, [
        el("td", {}, [
          el("div", { class: "principal" }, [UI.surligne(nomAffiche(c), mots)]),
          personne && c.societe ? el("div", { class: "secondaire" }, [UI.surligne(c.societe, mots)]) : null
        ]),
        el("td", {}, [
          c.role ? el("span", { class: "etiq" }, [UI.surligne(c.role, mots)]) : el("span", { class: "secondaire", text: "—" })
        ]),
        el("td", {}, [telephones]),
        el("td", {}, [enLigne(c, mots)]),
        el("td", {}, [adresse(c, mots)]),
        el("td", {}, [
          c.observations ? el("div", { class: "secondaire" }, [UI.surligne(c.observations, mots)]) : el("span", { class: "secondaire", text: "—" })
        ]),
        el("td", { class: "actions" }, [
          lienCarte(c),
          UI.boutonIcone("modifier", "Modifier", nomAffiche(c), function () { formulaire(c.id); }),
          UI.boutonIcone("supprimer", "Supprimer", nomAffiche(c), function () { supprime(c); })
        ])
      ]), c.id));
    });

    hote.appendChild(el("table", { class: "liste", style: "min-width:1040px" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Contact" }),
        el("th", { text: "Rôle" }),
        el("th", { text: "Téléphone" }),
        el("th", { text: "E-mail et site" }),
        el("th", { text: "Adresse" }),
        el("th", { text: "Observations" }),
        el("th", { text: "" })
      ])]),
      corps
    ]));
  }

  /* ------------------------------------------------------------ formulaire */

  function formulaire(idContact) {
    var c = idContact ? D.contact(idContact) : null;

    /* Fenêtre resserrée, comme le formulaire de tâche : deux champs par ligne,
       pas d'espacement inutile entre les sections. Qui, comment le joindre,
       où il est, ce qu'il faut savoir — les titres ne portent que l'adresse et
       rien d'autre : les libellés des champs disent déjà le reste. */
    var corps = el("div", {}, [
      el("div", { class: "grille-champs" }, [
        UI.champ({ nom: "prenom", label: "Prénom", valeur: c ? c.prenom : "", exemple: "Claire", autocomplete: "given-name" }),
        UI.champ({ nom: "nom", label: "Nom", valeur: c ? c.nom : "", exemple: "Devaud", autocomplete: "family-name" }),
        UI.champ({ nom: "societe", label: "Société", valeur: c ? c.societe : "", exemple: "Atelier Devaud architectes", large: true,
                   aide: "Le nom ou la société suffit." }),
        UI.champ({ nom: "role", label: "Rôle", valeur: c ? c.role : "", exemple: "Architecte, entreprise…" }),
        UI.champ({ nom: "email", label: "E-mail", type: "email", valeur: c ? c.email : "", exemple: "claire.devaud@exemple.ch" }),
        UI.champ({ nom: "site", label: "Site web", valeur: c ? c.site : "", exemple: "exemple.ch", inputmode: "url" }),
        UI.champ({ nom: "telephone", label: "Téléphone fixe", type: "tel", valeur: c ? c.telephone : "", exemple: "021 555 10 20", inputmode: "tel" }),
        UI.champ({ nom: "natel", label: "Natel", type: "tel", valeur: c ? c.natel : "", exemple: "079 555 10 21", inputmode: "tel" })
      ]),
      el("fieldset", {}, [
        el("div", { class: "legende", text: "Adresse postale" }),
        // NPA, localité, canton et pays sont courts : une seule ligne pour les quatre
        el("div", { class: "grille-champs", style: "grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))" }, [
          UI.champ({ nom: "adresse", label: "Rue et numéro", valeur: c ? c.adresse : "", exemple: "Rue de la Gare 12", large: true, autocomplete: "street-address" }),
          UI.champ({ nom: "npa", label: "NPA", valeur: c ? c.npa : "", exemple: "1003", inputmode: "numeric", autocomplete: "postal-code" }),
          UI.champ({ nom: "localite", label: "Localité", valeur: c ? c.localite : "", exemple: "Lausanne", autocomplete: "address-level2" }),
          UI.champ({ nom: "canton", label: "Canton", valeur: c ? c.canton : "", exemple: "VD" }),
          UI.champ({ nom: "pays", label: "Pays", valeur: c ? c.pays : "Suisse", exemple: "Suisse", autocomplete: "country-name" })
        ])
      ]),
      el("fieldset", {}, [
        el("div", { class: "grille-champs" }, [
          UI.champ({ nom: "observations", label: "Observations", type: "textarea", rows: 2, valeur: c ? c.observations : "",
                     exemple: "Disponibilités, interlocuteur à privilégier…", large: true })
        ])
      ])
    ]);

    UI.ouvre({
      surtitre: c ? "Modifier" : "Nouvelle fiche",
      titre: c ? nomAffiche(c) : "Fiche de contact",
      corps: corps, compacte: true,
      boutons: [
        { label: "Annuler" },
        {
          label: "Enregistrer", or: true, entree: true, action: function () {
            var v = UI.lit(corps);
            var p = c ? D.majContact(c.id, v) : D.ajouteContact(v);
            return p.then(function () { dessine(); UI.toast(c ? "Fiche modifiée." : "Fiche créée."); })
              .catch(function (e) { UI.toast(e.message); return false; });
          }
        }
      ]
    });
  }

  function supprime(c) {
    UI.confirme("Supprimer cette fiche ?", nomAffiche(c) + (c.societe && nomAffiche(c) !== c.societe ? " · " + c.societe : "") + ". Cette action est définitive.", "Supprimer", true)
      .then(function (ok) {
        if (!ok) return;
        D.suppContact(c.id).then(function () { dessine(); UI.toast("Fiche supprimée."); })
          .catch(function (e) { UI.toast(e.message); });
      });
  }
})();
</script>
</body>
</html>
