<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Absences · Planification</title>
<meta name="theme-color" content="#F6F2EA">
<script>
/* Marque de l'espace, reprise comme dans /planif/ (vert du bureau « ab », sable sinon) */
(function(){var r=document.documentElement,m="str";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<link rel="stylesheet" href="/planif/assets/marque.css?v=3">
<link rel="stylesheet" href="/planif2/assets/equipes.css?v=1">
<!--
  Bureau (/planif2/) — module Absences, version 2 (02.11.2026).
  Même bandeau que l'Équipe (equipes.js). À droite, une ligne par personne,
  par prénom puis nom : fonction, succursale et secteur, ses absences de la
  période, et une LED par jour ouvré — verte présent, orange absent, éteinte
  férié ou jour non travaillé. Autant de semaines que la largeur en tient.
  Lecture seule pour l'instant : poser une absence se fait encore dans /planif/.
-->
<style>
:root{--led-abs:#F59E0B;--case:22px}
.outils{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.bascule{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--doux);cursor:pointer}
.bascule input{width:16px;height:16px;accent-color:var(--m-fort)}
.semaine-nav{margin-left:0}

.grille{display:flex;flex-direction:column;gap:6px}
.ligne{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:var(--carte);box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.03)}
.ligne .qui{flex:0 0 260px}
.ligne .periodes{display:block;margin-top:2px;font-size:12px;line-height:16px;color:#B45309;white-space:normal}
.ligne.entete{position:sticky;top:-18px;z-index:2;background:var(--m-fond);box-shadow:none;padding-top:6px;padding-bottom:6px}
.ligne.entete .qui{visibility:hidden;height:1px}
.ligne.entete .avatar{visibility:hidden;height:1px}

.jours{position:relative;z-index:0;flex:1;min-width:0;display:flex;gap:12px;justify-content:flex-start}
.sem{display:flex;gap:4px}
.sem .no{display:block}
.cellule{width:var(--case);display:flex;flex-direction:column;align-items:center;gap:3px}
.cellule i{font-style:normal;font-size:11px;line-height:12px;font-weight:600;color:var(--doux)}
.cellule small{font-size:10px;line-height:11px;color:var(--faible)}
.cellule.auj{position:relative}
.cellule.auj::before{content:"";position:absolute;inset:-4px -1px;border-radius:6px;background:var(--m-pale);z-index:-1}
.cellule.auj i{color:var(--m-fort)}
.tete-sem{display:flex;flex-direction:column;gap:2px}
.tete-sem b{font-size:11px;line-height:13px;color:var(--faible);font-weight:600;padding-left:2px}
.led.abs{background:var(--led-abs);box-shadow:0 0 6px rgba(245,158,11,.75),inset 0 -1px 1px rgba(0,0,0,.15)}
.led.abs-demi{background:linear-gradient(90deg,var(--led-abs) 50%,var(--led-off) 50%);box-shadow:0 0 4px rgba(245,158,11,.5)}

@media (max-width:700px){
  .ligne{flex-wrap:wrap}
  .ligne .qui{flex:1 1 calc(100% - 60px)}
  .ligne .jours{flex:1 1 100%;padding-left:54px}
  .ligne.entete{display:none}
  .outils{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="page" id="page">
  <aside class="bandeau" id="bandeau" aria-label="Équipes">
    <div class="recherche"><input id="q" type="search" placeholder="Chercher une personne" autocomplete="off" spellcheck="false" aria-label="Chercher une personne"></div>
    <nav class="arbre" id="arbre"></nav>
  </aside>
  <button type="button" class="replier" id="replier" title="Réduire le bandeau" aria-controls="bandeau" aria-expanded="true">‹</button>

  <main class="contenu" id="contenu">
    <div class="tete">
      <h1 id="titre">Tous</h1><span class="compte" id="compte"></span>
      <div class="outils">
        <label class="bascule"><input type="checkbox" id="absents">Seulement les absents</label>
        <div class="semaine-nav">
          <button type="button" id="prec" title="Période précédente" aria-label="Période précédente">‹</button>
          <span id="sem"></span>
          <button type="button" id="suiv" title="Période suivante" aria-label="Période suivante">›</button>
          <button type="button" id="cette" hidden>Aujourd'hui</button>
        </div>
      </div>
    </div>
    <div class="grille" id="grille"></div>
    <p class="legende"><span><span class="led on"></span>Présent</span><span><span class="led abs"></span>Absent</span><span><span class="led demi"></span>Demi-journée</span><span><span class="led"></span>Férié ou jour non travaillé</span></p>
  </main>
</div>

<script src="/planif/assets/calendrier.js?v=7"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=60"></script>
<script src="/planif/assets/donnees.js?v=80"></script>
<script src="/planif/assets/calculs.js?v=16"></script>
<script src="/planif2/assets/equipes.js?v=2"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, SB = window.Sb, E = window.Equipes;
  var $ = function (s) { return document.querySelector(s); };
  var INITIALES = ["L", "M", "M", "J", "V"];
  var NOMS_JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"];
  var lundi = C.lundi(C.isoAuj());
  var absents = $("#absents");
  try { absents.checked = localStorage.getItem("planif2.absences.absents") === "1"; } catch (e) {}
  absents.addEventListener("change", function () {
    try { localStorage.setItem("planif2.absences.absents", absents.checked ? "1" : ""); } catch (e) {}
    liste();
  });

  E.monte({ nom: "absences", surChange: liste });
  if (SB && SB.configure && !SB.connecte()) { $("#grille").innerHTML = '<p class="vide">Connexion requise.</p>'; return; }
  D.pret().then(function () {
    E.pret(); liste();
    D.surRechargement(function () { E.arbre(); liste(); });
  }).catch(function (e) {
    var p = document.createElement("p"); p.className = "vide"; p.textContent = (e && e.message) || "Chargement impossible.";
    $("#grille").appendChild(p);
  });

  /* Autant de semaines que la largeur en tient (1 sur téléphone, 6 au plus) */
  function nbSemaines() {
    var w = $("#contenu").clientWidth - 44;
    if (innerWidth <= 700) return 1;
    return Math.max(1, Math.min(6, Math.floor((w - 28 - 300) / (5 * 26 + 12))));
  }
  var dernierNb = 0;
  addEventListener("resize", function () { if (D.etat() && nbSemaines() !== dernierNb) liste(); });
  // Le bandeau qui se replie change la largeur
  $("#replier").addEventListener("click", function () { setTimeout(function () { if (D.etat()) liste(); }, 260); });

  function cellule(j, auj) {
    var d = document.createElement("span"); d.className = "cellule" + (j === auj ? " auj" : "");
    return d;
  }

  function liste() {
    if (!D.etat()) return;
    var n = dernierNb = nbSemaines(), auj = C.isoAuj(), semaines = [];
    for (var s = 0; s < n; s++) semaines.push([0, 1, 2, 3, 4].map(function (i) { return C.ajoute(lundi, s * 7 + i); }));
    var debut = semaines[0][0], fin = semaines[n - 1][4];

    var l = E.membres().map(function (m) {
      var periodes = (m.absences || []).filter(function (a) { return a.debut <= fin && (a.fin || a.debut) >= debut; })
        .sort(function (a, b) { return a.debut < b.debut ? -1 : 1; });
      return { m: m, periodes: periodes };
    });
    if (absents.checked) l = l.filter(function (x) { return x.periodes.length; });

    $("#titre").textContent = E.titre();
    var na = l.filter(function (x) { return x.periodes.length; }).length;
    $("#compte").textContent = l.length + (l.length > 1 ? " personnes" : " personne") + (absents.checked ? "" : " · " + na + (na > 1 ? " absentes" : " absente") + " sur la période");
    $("#sem").textContent = (n > 1 ? "Semaines " + C.semaineISO(debut).num + " à " + C.semaineISO(fin).num : "Semaine " + C.semaineISO(debut).num) + " · " + E.jj(debut) + " – " + E.jj(fin);
    $("#cette").hidden = lundi === C.lundi(auj);

    var hote = $("#grille");
    hote.textContent = "";

    // En-tête : numéro de semaine, initiale et quantième de chaque jour
    var tete = document.createElement("div"); tete.className = "ligne entete";
    var fantome = { prenom: "", nom: "", absences: [] };
    tete.appendChild(E.avatar(fantome));
    var q0 = document.createElement("div"); q0.className = "qui"; tete.appendChild(q0);
    var jt = document.createElement("div"); jt.className = "jours";
    semaines.forEach(function (sem) {
      var bloc = document.createElement("div"); bloc.className = "tete-sem";
      var b = document.createElement("b"); b.textContent = "S" + C.semaineISO(sem[0]).num; bloc.appendChild(b);
      var rang = document.createElement("div"); rang.className = "sem";
      sem.forEach(function (j, i) {
        var c = cellule(j, auj);
        c.innerHTML = "<i></i><small></small>";
        c.querySelector("i").textContent = INITIALES[i];
        c.querySelector("small").textContent = C.dt(j).getDate();
        rang.appendChild(c);
      });
      bloc.appendChild(rang); jt.appendChild(bloc);
    });
    tete.appendChild(jt); hote.appendChild(tete);

    if (!l.length) {
      var p = document.createElement("p"); p.className = "vide";
      p.textContent = absents.checked ? "Personne n'est absent sur la période." : "Personne ne correspond.";
      hote.appendChild(p); return;
    }

    l.forEach(function (x) {
      var m = x.m, ligne = document.createElement("article"); ligne.className = "ligne";
      ligne.appendChild(E.avatar(m));
      var qui = E.qui(m);
      if (x.periodes.length) {
        var per = document.createElement("span"); per.className = "periodes";
        per.textContent = x.periodes.map(function (a) {
          var f = a.fin || a.debut;
          return (f === a.debut ? "Le " + E.jj(a.debut) : "Du " + E.jj(a.debut) + " au " + E.jj(f)) + (a.motif ? " · " + a.motif : "");
        }).join(" ; ");
        qui.appendChild(per);
      }
      ligne.appendChild(qui);
      var jours = document.createElement("div"); jours.className = "jours";
      semaines.forEach(function (sem) {
        var rang = document.createElement("div"); rang.className = "sem";
        sem.forEach(function (j, i) {
          var info = E.presence(m, j), c = cellule(j, auj), poids = window.Calc.poidsJour(m, j) || 0;
          var cls = info.absence ? (poids > 0 && poids < 1 ? " abs-demi" : poids > 0 ? " abs" : "")
                  : info.p >= 1 ? " on" : info.p > 0 ? " demi" : "";
          c.title = NOMS_JOURS[i] + " " + E.jj(j) + " : " + (info.chome ? info.chome
            : info.absence ? "absent" + (info.absence.motif ? " (" + info.absence.motif + ")" : "")
            : info.p >= 1 ? "présent" : info.p > 0 ? "demi-journée" : "ne travaille pas ce jour");
          var led = document.createElement("span"); led.className = "led" + cls;
          c.appendChild(led); rang.appendChild(c);
        });
        jours.appendChild(rang);
      });
      ligne.appendChild(jours);
      hote.appendChild(ligne);
    });
  }

  $("#prec").addEventListener("click", function () { lundi = C.ajoute(lundi, -7 * dernierNb); liste(); });
  $("#suiv").addEventListener("click", function () { lundi = C.ajoute(lundi, 7 * dernierNb); liste(); });
  $("#cette").addEventListener("click", function () { lundi = C.lundi(C.isoAuj()); liste(); });
})();
</script>
</body>
</html>
