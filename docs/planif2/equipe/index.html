<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Équipe · Planification</title>
<meta name="theme-color" content="#F6F2EA">
<script>
/* Marque de l'espace, reprise comme dans /planif/ (vert du bureau « ab », sable sinon) */
(function(){var r=document.documentElement,m="str";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<link rel="stylesheet" href="/planif/assets/marque.css?v=3">
<!--
  Bureau (/planif2/) — module Équipe, version 2 (02.11.2026).
  Bandeau à gauche repliable (chevron, comme la visionneuse IFC) : recherche,
  « Tous », les administrateurs, puis chaque succursale et ses secteurs.
  À droite, les membres triés par prénom puis nom, avec leur semaine :
  initiale du jour et une LED, verte si la personne est là, éteinte sinon.
  Lecture seule ; mêmes données que /planif/ (donnees.js, non modifié).
-->
<link rel="stylesheet" href="/planif2/assets/equipes.css?v=1">
</head>
<body>
<div class="page" id="page">
  <aside class="bandeau" id="bandeau" aria-label="Équipes">
    <div class="recherche"><input id="q" type="search" placeholder="Chercher une personne" autocomplete="off" spellcheck="false" aria-label="Chercher une personne"></div>
    <nav class="arbre" id="arbre"></nav>
  </aside>
  <button type="button" class="replier" id="replier" title="Réduire le bandeau" aria-controls="bandeau" aria-expanded="true">‹</button>

  <main class="contenu">
    <div class="tete">
      <h1 id="titre">Tous</h1><span class="compte" id="compte"></span>
      <div class="semaine-nav">
        <button type="button" id="prec" title="Semaine précédente" aria-label="Semaine précédente">‹</button>
        <span id="sem"></span>
        <button type="button" id="suiv" title="Semaine suivante" aria-label="Semaine suivante">›</button>
        <button type="button" id="cette" hidden>Cette semaine</button>
      </div>
    </div>
    <div class="membres" id="membres"></div>
    <p class="legende"><span><span class="led on"></span>Présent</span><span><span class="led demi"></span>Demi-journée</span><span><span class="led"></span>Absent ou jour non travaillé</span></p>
  </main>
</div>

<script src="/planif/assets/calendrier.js?v=7"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=61"></script>
<script src="/planif/assets/donnees.js?v=83"></script>
<script src="/planif/assets/calculs.js?v=16"></script>
<script src="/planif2/assets/equipes.js?v=3"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, SB = window.Sb, E = window.Equipes;
  var $ = function (s) { return document.querySelector(s); };
  var JOURS = ["L", "M", "M", "J", "V"];
  var NOMS_JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"];
  var lundi = C.lundi(C.isoAuj());

  E.monte({ nom: "equipe", surChange: liste });
  if (SB && SB.configure && !SB.connecte()) { $("#membres").innerHTML = '<p class="vide">Connexion requise.</p>'; return; }
  D.pret().then(function () {
    E.pret(); liste();
    D.surRechargement(function () { E.arbre(); liste(); });
  }).catch(function (e) {
    var p = document.createElement("p"); p.className = "vide"; p.textContent = (e && e.message) || "Chargement impossible.";
    $("#membres").appendChild(p);
  });

  function liste() {
    if (!D.etat()) return;
    var hote = $("#membres"), l = E.membres();
    var auj = C.isoAuj(), jours = [0, 1, 2, 3, 4].map(function (i) { return C.ajoute(lundi, i); });
    $("#titre").textContent = E.titre();
    $("#compte").textContent = l.length + (l.length > 1 ? " personnes" : " personne");
    $("#sem").textContent = "Semaine " + C.semaineISO(lundi).num + " · " + E.jj(jours[0]) + " – " + E.jj(jours[4]);
    $("#cette").hidden = lundi === C.lundi(auj);
    hote.textContent = "";
    if (!l.length) { var p = document.createElement("p"); p.className = "vide"; p.textContent = "Personne ne correspond."; hote.appendChild(p); return; }
    l.forEach(function (m) {
      var c = document.createElement("article"); c.className = "membre";
      var sem = document.createElement("div"); sem.className = "semaine";
      jours.forEach(function (j, i) {
        var x = E.presence(m, j), p = x.p;
        var d = document.createElement("span"); d.className = "jour" + (j === auj ? " auj" : "");
        d.title = NOMS_JOURS[i] + " " + E.jj(j) + " : " + (x.chome ? x.chome : x.absence ? "absent" + (x.absence.motif ? " (" + x.absence.motif + ")" : "") :
          p >= 1 ? "présent" : p > 0 ? "demi-journée" : "ne travaille pas ce jour");
        d.innerHTML = "<i></i><span class=\"led" + (p >= 1 ? " on" : p > 0 ? " demi" : "") + "\"></span>";
        d.querySelector("i").textContent = JOURS[i];
        sem.appendChild(d);
      });
      c.appendChild(E.avatar(m)); c.appendChild(E.qui(m)); c.appendChild(sem);
      hote.appendChild(c);
    });
  }

  $("#prec").addEventListener("click", function () { lundi = C.ajoute(lundi, -7); liste(); });
  $("#suiv").addEventListener("click", function () { lundi = C.ajoute(lundi, 7); liste(); });
  $("#cette").addEventListener("click", function () { lundi = C.lundi(C.isoAuj()); liste(); });
})();
</script>
</body>
</html>
