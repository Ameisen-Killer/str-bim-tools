<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Facturation · Planification</title>
<meta name="theme-color" content="#F6F2EA">
<script>
/* Marque de l'espace, reprise comme dans /planif/ (vert du bureau « ab », sable sinon) */
(function(){var r=document.documentElement,m="str";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";if(m==="str"&&s&&s.email&&localStorage.getItem("planif.teinte:"+s.email)==="vert")r.setAttribute("data-teinte","vert");}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<link rel="stylesheet" href="/planif/assets/marque.css?v=3">
<link rel="stylesheet" href="/planif2/assets/equipes.css?v=1">
<link rel="stylesheet" href="/planif2/assets/module.css?v=1">
<!--
Bureau V2 — Facturation (02.11.2026) : avancement et facturé par secteur et par phase.
Mêmes données que /planif/inter-secteurs/?vue=facturation (non modifiée). Saisie : Donnees.saisitMandat.
-->
<style>
.fa-ligne{position:relative;display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:10px 16px;align-items:center;width:100%;padding:10px 14px 10px 19px;border:0;border-radius:8px;background:var(--carte);text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.03);overflow:hidden}
.fa-ligne::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--teinte,var(--t1))}
.fa-ligne:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.fa-ligne .lib b{display:block;font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa-ligne .lib .code{font-size:12px;font-weight:700;color:var(--teinte,var(--t1))}
.fa-ligne .lib small{display:block;font-size:12px;line-height:16px;color:var(--faible);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:118px;display:flex;flex-direction:column;gap:3px;padding:6px 8px;border-radius:7px;background:var(--m-voile)}
.ph.alerte{background:#FDECEC}
.ph.fini{opacity:.6}
.ph .nom{font-size:11px;line-height:14px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .nom b{color:var(--texte);margin-right:4px}
.jl{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:4px;font-size:10px;color:var(--faible)}
.jl span:last-child{text-align:right;color:var(--doux)}
.bloc>h2 .sigle{display:inline-block;padding:0 6px;border-radius:5px;background:var(--m-pale);color:var(--m-fort);font-size:11px;line-height:18px}
.liste-lignes{gap:6px}
.sp{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--m-voile)}
.sp-tete{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sp-tete .t{flex:1;font-size:13px}
.sp-tete .t b{margin-right:6px}
.sp-tete .moy{width:150px;display:flex;flex-direction:column;gap:3px}
.sp-l{display:grid;grid-template-columns:minmax(80px,1fr) 1fr 1fr;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--ligne);font-size:12px}
.sp-l.vise{background:var(--m-pale);border-radius:6px}
.sp-c{display:flex;flex-direction:column;gap:2px}
.sp-c .l{display:flex;align-items:center;gap:4px}
.sp-c input{width:58px;height:30px;padding:0 6px;border:1px solid var(--ligne);border-radius:6px;font:inherit;font-size:13px;text-align:right;background:#fff}
.sp-c input:disabled{background:transparent;border-color:transparent;color:var(--doux)}
.sp-c .jauge{flex:1}
.sp-c small{font-size:10px;color:var(--faible)}
.sp-ent{display:grid;grid-template-columns:minmax(80px,1fr) 1fr 1fr;gap:8px;font-size:11px;color:var(--faible);padding:0 0 2px}
.histo{list-style:none;margin:0;padding:0;font-size:12px;line-height:18px;color:var(--doux)}
.histo b{color:var(--texte);font-weight:600}
@media (max-width:700px){.fa-ligne{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="page" id="page">
  <aside class="bandeau" id="bandeau" aria-label="Facturation">
    <div class="recherche"><input id="q" type="search" placeholder="Rechercher une affaire, un responsable…" autocomplete="off" spellcheck="false" aria-label="Rechercher une affaire, un responsable…"></div>
    <nav class="arbre" id="arbre"></nav>
  </aside>
  <button type="button" class="replier" id="replier" title="Réduire le bandeau" aria-controls="bandeau" aria-expanded="true">‹</button>

  <main class="contenu" id="contenu">
    <div class="tete">
      <h1 id="titre">Facturation</h1><span class="compte" id="compte"></span>
      <div class="outils" id="outils"><label class="bascule"><input type="checkbox" id="terminees"> Affaires terminées</label></div>
    </div>
    <div id="liste"></div>
  </main>
</div>

<script src="/planif/assets/calendrier.js?v=7"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=62"></script>
<script src="/planif/assets/donnees.js?v=87"></script>
<script src="/planif/assets/calculs.js?v=17"></script>
<script src="/planif2/assets/module.js?v=2"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, el = M.el, $ = function (s) { return document.querySelector(s); };
  var q = $("#q"), cTerm = $("#terminees");
  var filtre = "tous";        // tous | s:<succursale> | d:<discipline> | af | avance | sans

  M.bandeau();
  q.addEventListener("input", liste);
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") { q.value = ""; liste(); } });
  cTerm.addEventListener("change", tout);

  M.demarre(function () {
    if (!D.voitFacturation()) { $("#liste").appendChild(el("p", "vide", "La facturation ne t'est pas ouverte.")); return; }
    var moi = D.monMembre();
    if (moi && moi.succursale && auMandat().some(function (a) { return a.succursale === moi.succursale; })) filtre = "s:" + moi.succursale;
    tout();
    D.surRechargement(tout);
  });
  function tout() { if (!D.voitFacturation()) return; arbre(); liste(); }

  function auMandat() { return D.affaires({ tous: cTerm.checked }).filter(function (a) { return D.phasesMandat(a).length; }); }
  function teinte(a) { return "var(--t" + ((a && a.teinte) || 1) + ")"; }
  function nomSecteur(c) { return D.DISCIPLINES[c] || c; }
  function av(a, p, d) { return D.valeurMandat(a.id, p, d, "avancement"); }
  function fa(a, p, d) { return D.valeurMandat(a.id, p, d, "facturation"); }
  function cases(a) {           // [{phase, d}] de l'affaire
    var l = [];
    D.phasesMandat(a).forEach(function (p) { p.disciplines.forEach(function (d) { l.push({ phase: p.phase, d: d }); }); });
    return l;
  }
  function aFacturer(a) { return cases(a).some(function (x) { return av(a, x.phase, x.d) > fa(a, x.phase, x.d); }); }
  function dAvance(a) { return cases(a).some(function (x) { return fa(a, x.phase, x.d) > av(a, x.phase, x.d); }); }
  function sansMandat() { return D.affaires().filter(function (a) { return a.phase !== "AO" && !D.phasesMandat(a).length; }); }

  function arbre() {
    var l = auMandat(), e = [{ cle: "tous", nom: "Toutes les affaires au mandat", n: l.length }];
    e.push({ cle: "af", nom: "Avancées au-delà du facturé", n: l.filter(aFacturer).length });
    e.push({ cle: "avance", nom: "Facturées d'avance", n: l.filter(dAvance).length });
    var succ = Object.keys(D.SUCCURSALES);
    if (succ.length > 1 || l.some(function (a) { return !a.succursale; })) {
      e.push({ titre: "Succursales" });
      succ.forEach(function (s) { e.push({ cle: "s:" + s, nom: D.SUCCURSALES[s], n: l.filter(function (a) { return a.succursale === s; }).length }); });
      var sans = l.filter(function (a) { return !a.succursale; }).length;
      if (sans) e.push({ cle: "s:_", nom: "Non renseignée", n: sans });
    }
    var parD = {};
    l.forEach(function (a) { D.phasesMandat(a).forEach(function (p) { p.disciplines.forEach(function (d) { (parD[d] || (parD[d] = {}))[a.id] = 1; }); }); });
    var codes = D.rangeDisciplines(Object.keys(parD));
    if (codes.length) {
      e.push({ titre: "Secteurs" });
      codes.forEach(function (c) { e.push({ cle: "d:" + c, nom: nomSecteur(c), n: Object.keys(parD[c]).length }); });
    }
    var sm = sansMandat().length;
    if (sm) { e.push({ titre: "À compléter" }); e.push({ cle: "sans", nom: "En cours sans mandat décrit", n: sm }); }
    M.arbre($("#arbre"), e, filtre, function (cle) { filtre = cle; arbre(); liste(); });
  }
  function titreFiltre() {
    if (filtre === "tous") return "Facturation";
    if (filtre === "af") return "Avancées au-delà du facturé";
    if (filtre === "avance") return "Facturées d'avance";
    if (filtre === "sans") return "Affaires sans mandat décrit";
    var v = filtre.slice(2);
    if (filtre.indexOf("s:") === 0) return v === "_" ? "Succursale non renseignée" : D.SUCCURSALES[v] || v;
    return nomSecteur(v);
  }
  function texte(a) { var r = a.responsableId && D.membre(a.responsableId); return [a.code, a.nom, r && r.prenom, r && r.nom].join(" "); }

  function liste() {
    if (!D.etat()) return;
    var hote = $("#liste"); hote.textContent = "";
    $("#titre").textContent = titreFiltre();
    if (filtre === "sans") return listeSans(hote);
    var l = auMandat().filter(function (a) {
      if (filtre === "af") return aFacturer(a);
      if (filtre === "avance") return dAvance(a);
      if (filtre.indexOf("s:") === 0) return (a.succursale || "_") === filtre.slice(2);
      return true;
    }).filter(function (a) { return M.cherche(texte(a), q.value); });
    var seul = filtre.indexOf("d:") === 0 ? filtre.slice(2) : null;
    var parSecteur = {};
    l.forEach(function (a) {
      D.phasesMandat(a).forEach(function (p) {
        p.disciplines.forEach(function (d) {
          if (seul && d !== seul) return;
          if (filtre === "af" && !(av(a, p.phase, d) > fa(a, p.phase, d))) return;
          if (filtre === "avance" && !(fa(a, p.phase, d) > av(a, p.phase, d))) return;
          var s = parSecteur[d] || (parSecteur[d] = {});
          (s[a.id] || (s[a.id] = { a: a, phases: [] })).phases.push(p.phase);
        });
      });
    });
    var codes = D.rangeDisciplines(Object.keys(parSecteur)), montrees = {};
    codes.forEach(function (code) {
      var lignes = Object.keys(parSecteur[code]).map(function (k) { return parSecteur[code][k]; })
        .sort(function (x, y) { return (x.a.code || "~").localeCompare(y.a.code || "~", "fr", { numeric: true }) || x.a.nom.localeCompare(y.a.nom, "fr"); });
      var nAf = 0, nAv = 0, nPh = 0;
      lignes.forEach(function (x) { montrees[x.a.id] = 1; x.phases.forEach(function (p) { nPh++; var v = av(x.a, p, code), f = fa(x.a, p, code); if (v > f) nAf++; if (f > v) nAv++; }); });
      var bloc = el("section", "bloc"), h = el("h2");
      h.appendChild(el("span", "sigle", D.sigleDiscipline(code)));
      h.appendChild(document.createTextNode(nomSecteur(code)));
      h.appendChild(el("small", null, lignes.length + (lignes.length > 1 ? " affaires · " : " affaire · ") + nPh + (nPh > 1 ? " phases" : " phase")));
      if (nAf) h.appendChild(el("span", "pastille orange", nAf + " à facturer"));
      if (nAv) h.appendChild(el("span", "pastille rouge", nAv + " facturée" + (nAv > 1 ? "s" : "") + " d'avance"));
      bloc.appendChild(h);
      var ll = el("div", "liste-lignes");
      lignes.forEach(function (x) { ll.appendChild(ligne(x.a, x.phases, code)); });
      bloc.appendChild(ll);
      hote.appendChild(bloc);
    });
    var n = Object.keys(montrees).length;
    $("#compte").textContent = n + (n > 1 ? " affaires" : " affaire");
    if (!codes.length) hote.appendChild(el("p", "vide", auMandat().length ? "Rien ici." :
      "Aucune affaire n'a encore de mandat décrit. Les phases SIA et leurs disciplines se cochent dans la fiche de l'affaire (page Affaires de la V1, « Modifier »)."));
  }
  function jl(lib, v, cls, alerte) {
    var r = el("div", "jl"); r.appendChild(el("span", null, lib));
    var j = el("div", "jauge" + (cls ? " " + cls : "") + (alerte ? " trop" : "")), i = el("i"); i.style.width = Math.min(100, v || 0) + "%"; j.appendChild(i);
    r.appendChild(j); r.appendChild(el("span", null, (v || 0) + " %"));
    return r;
  }
  function ligne(a, phases, code) {
    var b = el("button", "fa-ligne"); b.type = "button"; b.style.setProperty("--teinte", teinte(a));
    var lib = el("div", "lib");
    if (a.code) lib.appendChild(el("span", "code", a.code));
    lib.appendChild(el("b", null, a.nom));
    var r = a.responsableId && D.membre(a.responsableId);
    var s = [r ? "Resp. " + r.prenom + " " + r.nom : "", a.phase ? "en phase " + a.phase : "", a.statut !== "active" && D.STATUTS_AFFAIRE ? (D.STATUTS_AFFAIRE[a.statut] || "").toLowerCase() : ""].filter(Boolean).join(" · ");
    if (s) lib.appendChild(el("small", null, s));
    b.appendChild(lib);
    var ph = el("div", "phases");
    phases.forEach(function (p) {
      var v = av(a, p, code), f = fa(a, p, code);
      var c = el("div", "ph" + (f > v ? " alerte" : "") + (v >= 100 && f >= 100 ? " fini" : ""));
      var n = el("div", "nom"); n.title = D.libellePhase(p); n.appendChild(el("b", null, p)); n.appendChild(document.createTextNode(D.PHASES[p] || ""));
      c.appendChild(n); c.appendChild(jl("Av.", v)); c.appendChild(jl("Fact.", f, "fact", f > v));
      ph.appendChild(c);
    });
    b.appendChild(ph);
    b.addEventListener("click", function () { saisie(a.id, code); });
    return b;
  }
  function listeSans(hote) {
    var l = sansMandat().filter(function (a) { return M.cherche(texte(a), q.value); });
    $("#compte").textContent = l.length + (l.length > 1 ? " affaires" : " affaire");
    hote.appendChild(el("p", "bandeau-info", "Ces affaires en cours n'ont pas encore de phases SIA au mandat : elles se cochent dans la fiche de l'affaire."));
    var ll = el("div", "liste-lignes");
    l.forEach(function (a) {
      var b = el("button", "ligne-l"); b.type = "button";
      var lib = el("span", "lib"); lib.appendChild(el("b", null, D.libelleAffaire(a)));
      lib.appendChild(el("small", null, [a.succursale ? D.SUCCURSALES[a.succursale] : "", a.phase ? "phase " + a.phase : ""].filter(Boolean).join(" · ") || "—"));
      b.appendChild(lib);
      b.addEventListener("click", function () { M.ouvreModule("affaires", "/planif2/affaires/?q=" + encodeURIComponent(a.code || a.nom)); });
      ll.appendChild(b);
    });
    hote.appendChild(ll);
  }

  /* ---------- Saisie ---------- */
  function quand(x) {
    var m = x.par && D.membre(x.par), d = new Date(x.le);
    return (isNaN(d) ? "" : M.jj(C.iso ? C.iso(d) : x.le.slice(0, 10), true)) + (m ? " · " + m.prenom + " " + m.nom : "");
  }
  function majJ(j, v, alerte) { j.firstChild.style.width = Math.min(100, v) + "%"; j.classList.toggle("trop", !!alerte); }
  function jauge(v, cls) { var j = el("div", "jauge" + (cls ? " " + cls : "")); var i = el("i"); i.style.width = Math.min(100, v || 0) + "%"; j.appendChild(i); return j; }
  function saisie(id, vise) {
    var a = D.affaire(id); if (!a) return;
    var champs = [], corps = [];
    corps.push(el("p", "vide-msg", "Pourcentages par phase et par discipline. Chaque saisie est gardée dans l'historique ; la moyenne des disciplines donne celle de la phase."));
    D.phasesMandat(a).forEach(function (p) {
      var bloc = el("section", "sp"), t = el("div", "sp-tete"), tt = el("div", "t");
      tt.appendChild(el("b", null, p.phase)); tt.appendChild(document.createTextNode(D.PHASES[p.phase] || ""));
      t.appendChild(tt);
      var moy = el("div", "moy"), mA = jauge(0), mF = jauge(0, "fact"); moy.appendChild(mA); moy.appendChild(mF); t.appendChild(moy);
      bloc.appendChild(t);
      var ent = el("div", "sp-ent"); ["Discipline", "Avancement", "Facturé"].forEach(function (x) { ent.appendChild(el("span", null, x)); }); bloc.appendChild(ent);
      var lignes = [];
      p.disciplines.forEach(function (d) {
        var l = el("div", "sp-l" + (vise === d ? " vise" : "")), cells = {};
        l.appendChild(el("span", null, nomSecteur(d)));
        ["avancement", "facturation"].forEach(function (genre) {
          var x = D.saisieMandat(a.id, p.phase, d, genre);
          var peut = genre === "facturation" ? D.peutSaisirFacturation() : D.peutSaisirAvancement(a, d);
          var i = el("input"); i.type = "number"; i.min = "0"; i.max = "100"; i.step = "1"; i.inputMode = "numeric";
          i.value = x ? x.valeur : 0; i.disabled = !peut;
          if (!peut) i.title = genre === "facturation" ? "Demande le droit « Saisir la facturation »" : "Le responsable de l'affaire ou le chef du secteur saisit cet avancement";
          var j = jauge(x ? x.valeur : 0, genre === "facturation" ? "fact" : "");
          var c = el("div", "sp-c"), r = el("div", "l"); r.appendChild(i); r.appendChild(el("span", null, "%")); r.appendChild(j);
          c.appendChild(r); c.appendChild(el("small", null, x ? quand(x) : "pas encore saisi"));
          l.appendChild(c);
          var o = { input: i, jauge: j, phase: p.phase, discipline: d, genre: genre, avant: x ? x.valeur : 0 };
          cells[genre] = o; champs.push(o);
          i.addEventListener("input", recalcule);
        });
        lignes.push(cells); bloc.appendChild(l);
      });
      function lu(o) { var n = parseInt(o.input.value, 10); return isFinite(n) ? Math.max(0, Math.min(100, n)) : 0; }
      function recalcule() {
        var sA = 0, sF = 0;
        lignes.forEach(function (c) { var v = lu(c.avancement), f = lu(c.facturation); sA += v; sF += f; majJ(c.avancement.jauge, v); majJ(c.facturation.jauge, f, f > v); });
        majJ(mA, Math.round(sA / lignes.length)); majJ(mF, Math.round(sF / lignes.length), sF > sA);
      }
      recalcule();
      corps.push(bloc);
    });
    var peut = champs.some(function (c) { return !c.input.disabled; });
    var err = el("p", "erreur"); err.hidden = true; corps.push(err);
    var act = el("div", "actions");
    if (peut) {
      var ok = el("button", "btn principal", "Enregistrer"); ok.type = "button"; act.appendChild(ok);
      ok.addEventListener("click", function () {
        var items = [], faux = null; err.hidden = true;
        champs.forEach(function (c) {
          if (c.input.disabled) return;
          var brut = String(c.input.value).trim(), n = Number(brut.replace(",", "."));
          if (brut === "" || !isFinite(n) || n < 0 || n > 100) { faux = faux || c; return; }
          if (Math.round(n) !== c.avant) items.push({ phase: c.phase, discipline: c.discipline, genre: c.genre, valeur: Math.round(n) });
        });
        if (faux) { faux.input.focus(); err.textContent = "Un pourcentage va de 0 à 100."; err.hidden = false; return; }
        if (!items.length) { M.annonce("Rien n'a changé."); return; }
        ok.disabled = true;
        D.saisitMandat(a.id, items).then(function (n) {
          M.annonce(n > 1 ? n + " pourcentages enregistrés." : "Pourcentage enregistré.", true, tout);
          tout(); saisie(a.id, vise);
        }).catch(function (e) { ok.disabled = false; err.textContent = e.message; err.hidden = false; });
      });
    }
    if (D.pagePermise("affaires")) {
      var v = el("button", "btn", "Voir dans Affaires"); v.type = "button";
      v.addEventListener("click", function () { M.ouvreModule("affaires", "/planif2/affaires/?q=" + encodeURIComponent(a.code || a.nom)); });
      act.appendChild(v);
    }
    corps.push(act);
    var h = D.historiqueMandat(a.id).slice(0, 20);
    if (h.length) {
      corps.push(el("h3", null, "Historique"));
      var ul = el("ul", "histo");
      h.forEach(function (x) {
        var li = el("li");
        li.appendChild(el("b", null, x.phase + " · " + nomSecteur(x.discipline)));
        li.appendChild(document.createTextNode(" — " + D.GENRES_SAISIE[x.genre] + " " + x.valeur + " % · " + quand(x)));
        ul.appendChild(li);
      });
      corps.push(ul);
    }
    M.panneau.ouvre([el("div", "surtitre", "Avancement et facturation" + (a.code ? " · " + a.code : "")), el("h2", null, a.nom)], corps, teinte(a));
  }
})();

</script>
</body>
</html>
