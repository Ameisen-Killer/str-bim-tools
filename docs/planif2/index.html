<html lang="fr">
<head>

<script>
/* Marque de l'espace, comme dans /planif/ : « ab » pour le bureau qui a la sienne
   (charte verte et logo du bureau), « str » sinon — et toujours en démonstration.
   Reprise du dernier passage de ce compte avant le premier rendu ; confirmée
   ensuite par Donnees.marque(). */
(function(){var r=document.documentElement,m="str";try{var s=JSON.parse(localStorage.getItem("planif.session")||"null");m=(s&&s.email?localStorage.getItem("planif.marque:"+s.email):localStorage.getItem("planif.marque"))||"str";}catch(e){}if(m!=="ab")m="str";r.setAttribute("data-marque",m);if(m==="ab"){var i=document.querySelector("link[rel=icon]");if(i)i.href="/planif/assets/logo-ab-marque.svg?v=1";}})();
</script>
<link rel="preload" href="/assets/polices/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<!--
  Planificateur, version bureau (01.11.2026) — version parallèle de /planif/.
  Même base, même connexion (session planif.session), mêmes droits : les
  modules sont les pages de /planif/, ouvertes telles quelles dans des
  fenêtres internes. Rien n'est modifié dans /planif/ : la barre du haut de
  chaque page est seulement masquée dans la fenêtre (feuille injectée).
-->
<style>
:root{
  color-scheme:dark;
  --or:#D6A85C;
  --or-rvb:214,168,92;
  --or-fonce:#A9782E;
  --noir:#050505;
  --barre:rgba(12,11,9,.82);
  --tuile:linear-gradient(160deg,rgba(40,34,24,.92),rgba(12,11,9,.92));
  --tuile-bord:rgba(214,168,92,.32);
  --panneau:rgba(18,16,13,.94);
  --controle:rgba(255,255,255,.04);
  --controle-survol:rgba(214,168,92,.12);
  --ligne:rgba(214,168,92,.18);
  --texte:#EDE8DF;
  --texte-doux:rgba(237,232,223,.78);
  --texte-faible:rgba(237,232,223,.5);
  --rouge:#E5484D;
  --fil-rvb:214,168,92;
  --tuile-fond:#14110D;
  --ombre-texte:0 1px 3px rgba(0,0,0,.9);
  --ombre:0 32px 64px rgba(0,0,0,.55),0 2px 21px rgba(0,0,0,.45),0 0 0 1px rgba(214,168,92,.14);
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--sans);font-size:14px;line-height:20px;color:var(--texte);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 75% 65% at 60% 55%,#1C170F 0%,#0D0B08 45%,var(--noir) 100%) fixed;background-color:var(--noir)}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* ---------- Fond d'écran : ossature filaire en or qui tourne lentement ---------- */
#fond{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- Bureau : icônes à gauche, carte « Aujourd'hui » à droite ---------- */
.bureau{position:fixed;inset:0 0 56px 0}
.icones{position:absolute;inset:0;padding:14px 10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,108px);grid-auto-columns:96px;gap:4px;align-content:start}
.icone{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 4px;border:1px solid transparent;border-radius:6px;color:var(--texte);text-align:center;cursor:default;outline:none;
  text-shadow:var(--ombre-texte);font-size:12px;line-height:15px;opacity:0;transform:translateY(6px);animation:apparait .45s cubic-bezier(.1,.9,.2,1) forwards;animation-delay:calc(var(--r,0) * 45ms)}
@keyframes apparait{to{opacity:1;transform:none}}
.tuile{position:relative;width:60px;height:60px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--tuile);border:1px solid var(--tuile-bord);color:var(--or);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .2s}
.tuile svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tuile svg .plein{fill:currentColor;stroke:none}
.tuile svg .doux{opacity:.45}
.tuile svg .fond,.tache svg .fond,.titre svg .fond{fill:var(--tuile-fond)}
.icone:hover .tuile{transform:scale(1.06);border-color:rgba(var(--or-rvb),.7);box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 18px rgba(var(--or-rvb),.18)}
.icone:hover{background:rgba(var(--or-rvb),.07);border-color:rgba(var(--or-rvb),.14)}
.icone.choisie,.icone:focus-visible{background:rgba(var(--or-rvb),.14);border-color:rgba(var(--or-rvb),.35)}
.badge{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rouge);color:#fff;font:600 11px/20px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--noir);text-shadow:none}
.badge.or{background:var(--or);color:#1B1406}

/* Carte « Aujourd'hui » */
.aujourdhui{position:absolute;top:16px;right:16px;width:320px;max-height:calc(100% - 32px);overflow:auto;border-radius:14px;padding:18px 18px 12px;background:rgba(14,12,10,.72);border:1px solid var(--ligne);box-shadow:0 10px 30px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);opacity:0;transform:translateY(8px);animation:apparait .5s .25s cubic-bezier(.1,.9,.2,1) forwards;user-select:text;-webkit-user-select:text}
.aujourdhui .jour{margin:0;color:var(--or);font-size:12px;letter-spacing:.04em}
.aujourdhui h1{margin:2px 0 12px;font:300 24px/30px var(--sans)}
.aujourdhui h1 b{font-weight:600}
.aujourdhui h2{margin:14px 0 6px;font:600 12px/16px var(--sans);color:var(--texte-doux)}
.signal{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:0 0 6px;border:1px solid var(--ligne);border-radius:8px;background:var(--controle);text-align:left;cursor:pointer}
.signal:hover{background:var(--controle-survol)}
.signal b{min-width:24px;font-size:16px;color:var(--or)}
.ligne-t{display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;font-size:13px;line-height:17px}
.ligne-t:hover{background:var(--controle-survol)}
/* Case à cocher : terminer sa part de la tâche (gris, orange dans la semaine, rouge à échéance) */
.ligne-c{display:flex;align-items:center;gap:2px}
.ligne-c .ligne-t{flex:1;min-width:0}
.coche{flex:none;width:30px;height:30px;padding:0;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:6px;--c:var(--texte-faible)}
.coche:hover{background:var(--controle-survol)}
.coche.orange{--c:#F5A524}
.coche.rouge{--c:var(--rouge)}
.coche span{width:16px;height:16px;border:2px solid var(--c);border-radius:4px;display:grid;place-items:center;transition:background .15s,transform .15s}
.coche span::after{content:"";width:8px;height:4px;margin-top:-2px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transition:transform .15s}
.coche:hover span{transform:scale(1.08)}
.coche.cochee span{background:var(--c)}
.coche.cochee span::after{transform:rotate(-45deg) scale(1)}
.ligne-c.finie .lib{text-decoration:line-through;color:var(--texte-faible)}
.annonce{position:fixed;left:50%;bottom:72px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;background:var(--panneau);border:1px solid var(--ligne);box-shadow:var(--ombre);font-size:13px;max-width:calc(100vw - 32px)}
.annonce button{border:0;background:none;padding:0;color:var(--or);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ligne-t .lib{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne-t .quand{flex:none;color:var(--texte-faible);font-size:12px}
.ligne-t .quand.rouge{color:var(--rouge)}
.vide-msg{margin:4px 6px;color:var(--texte-faible);font-size:13px}
.aujourdhui .espace{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--ligne);color:var(--texte-faible);font-size:11px}

/* ---------- Infobulle ---------- */
.bulle{position:fixed;z-index:30;max-width:280px;padding:6px 9px;border-radius:6px;background:var(--panneau);color:var(--texte);border:1px solid var(--ligne);box-shadow:0 4px 10px rgba(0,0,0,.4);font-size:12px;line-height:16px;pointer-events:none}

/* ---------- Dock ---------- */
.barre{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--barre);border-top:1px solid var(--ligne);
  -webkit-backdrop-filter:blur(40px) saturate(1.3);backdrop-filter:blur(40px) saturate(1.3);padding-bottom:env(safe-area-inset-bottom)}
.barre .centre{display:flex;gap:8px;align-items:flex-end;height:46px;padding:0 8px}
.tache{--s:1;position:relative;flex:none;width:calc(40px * var(--s));height:calc(40px * var(--s));border:1px solid var(--tuile-bord);border-radius:calc(10px * var(--s));
  background:var(--tuile);box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;cursor:default;padding:0;color:var(--or);
  transition:width .14s ease-out,height .14s ease-out,border-radius .14s ease-out,transform .25s cubic-bezier(.3,1.6,.5,1)}
.tache svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tache svg .plein{fill:currentColor;stroke:none}
.tache svg .doux{opacity:.45}
.tache:active{transform:scale(.9)}
.tache .etiquette{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;padding:4px 10px;border-radius:8px;color:var(--texte);
  background:var(--panneau);border:1px solid var(--ligne);box-shadow:0 4px 12px rgba(0,0,0,.4);font-size:12px;line-height:16px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.tache:hover .etiquette{opacity:1;transform:translateX(-50%)}
.tache .badge{top:-5px;right:-6px;min-width:16px;height:16px;padding:0 4px;font-size:10px;line-height:16px}
.tache.demarrer-ico{background:linear-gradient(160deg,#E7BE77,#A9782E);border-color:rgba(255,255,255,.25);color:#1B1406}
.tache.demarrer-ico svg{stroke-width:7}
.tache.ouverte::after{content:"";position:absolute;bottom:-6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--texte-doux)}
.tache.devant::after{background:var(--or);width:14px;margin-left:-7px;border-radius:3px}
.tache.sep{width:1px;height:28px;border:0;background:var(--ligne);box-shadow:none;margin:0 2px 6px;pointer-events:none}
.gauche{position:absolute;left:14px;top:0;bottom:0;display:flex;align-items:center;gap:10px;font-size:12px;line-height:16px;color:var(--texte-doux)}
.gauche b{font-weight:600;color:var(--or)}
.droite{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.zone{height:44px;padding:0 10px;border:0;border-radius:6px;background:transparent;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:12px;line-height:16px;cursor:default}
.zone:hover{background:var(--controle-survol)}
.zone.ico{flex-direction:row;align-items:center;width:40px;justify-content:center;padding:0}
.zone.ico svg{width:16px;height:16px}

/* ---------- Menu Démarrer ---------- */
.demarrer{position:fixed;left:50%;bottom:66px;z-index:25;width:min(700px,calc(100vw - 16px));max-height:calc(100vh - 82px);display:flex;flex-direction:column;border-radius:12px;background:var(--panneau);border:1px solid var(--ligne);box-shadow:var(--ombre);
  -webkit-backdrop-filter:blur(60px) saturate(1.3);backdrop-filter:blur(60px) saturate(1.3);transform:translate(-50%,0);transition:transform .2s cubic-bezier(.1,.9,.2,1),opacity .15s;overflow:hidden}
.demarrer.ferme{transform:translate(-50%,24px);opacity:0;pointer-events:none}
.demarrer .corps{padding:22px 28px 10px;overflow:auto}
.demarrer h2{margin:10px 0 8px;font:600 12px/16px var(--sans);color:var(--or);letter-spacing:.04em}
.demarrer h2:first-child{margin-top:0}
.epingles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.epingle{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;font-size:13px;line-height:17px}
.epingle:hover,.epingle:focus-visible{background:var(--controle-survol);outline:none}
.epingle .tuile{width:36px;height:36px;border-radius:9px}
.epingle .tuile svg{width:22px;height:22px;stroke-width:2.6}
.demarrer .pied{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 28px;border-top:1px solid var(--ligne);background:var(--controle)}
.profil{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--or);color:#1B1406;font:600 12px/1 var(--sans);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profil small{display:block;color:var(--texte-faible);font-size:11px;line-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.pied .boutons{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pied .bouton{height:32px;padding:0 10px;border:1px solid var(--ligne);border-radius:6px;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.pied .bouton:hover{background:var(--controle-survol)}
.pied .bouton.quitter:hover{background:#7A1E1E;border-color:#7A1E1E}
.pied select{height:32px;border:1px solid var(--ligne);border-radius:6px;background:#15130F;padding:0 6px;font-size:12px}
.roles{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--texte-faible)}

/* ---------- Fenêtres des modules ---------- */
.fenetres{position:fixed;inset:0 0 56px 0;z-index:10;pointer-events:none}
.fenetre{position:absolute;display:flex;flex-direction:column;min-width:340px;min-height:240px;border-radius:12px;overflow:hidden;pointer-events:auto;
  background:var(--panneau);border:1px solid var(--ligne);box-shadow:var(--ombre);transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1)}
.fenetre.neuve{opacity:0;transform:scale(.94)}
.fenetre.reduite{opacity:0;transform:translateY(40%) scale(.3);pointer-events:none}
.fenetre.agrandie{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.fenetre:not(.active){box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.4)}
.fenetre:not(.active) .titre{opacity:.6}
.titre{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px;line-height:16px;touch-action:none;cursor:default;border-bottom:1px solid var(--ligne)}
.titre .mini{width:20px;height:20px;flex:none;color:var(--or)}
.titre .mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.titre .mini svg .plein{fill:currentColor;stroke:none}
.titre .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titre button,.titre a{flex:none;width:44px;height:38px;border:0;background:transparent;display:grid;place-items:center;color:var(--texte)}
.titre button:hover,.titre a:hover{background:var(--controle-survol)}
.titre .fermer:hover{background:#C42B1C;color:#fff}
.titre button svg,.titre a svg{width:10px;height:10px}
.fenetre .cadre{position:relative;flex:1;display:flex;background:#F6F2EA}
.fenetre iframe{position:relative;z-index:1;flex:1;width:100%;border:0;background:transparent;opacity:0;transition:opacity .2s}
.fenetre iframe.pret{opacity:1}
.fenetre iframe.pret + .charge,.fenetre .cadre:has(iframe.pret) .charge{display:none}
.fenetre .charge{position:absolute;inset:0;z-index:0;display:grid;place-items:center;color:#7A5A2B;font-size:13px;pointer-events:none}
.fenetres.bouge iframe{pointer-events:none}
.poignee{position:absolute;z-index:2}
.poignee.d{top:38px;right:0;bottom:8px;width:6px;cursor:ew-resize}
.poignee.b{left:0;right:8px;bottom:0;height:6px;cursor:ns-resize}
.poignee.g{top:38px;left:0;bottom:8px;width:6px;cursor:ew-resize}
.poignee.db{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.fenetre.agrandie .poignee{display:none}

/* ---------- Écran de connexion ---------- */
.verrou{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,5,5,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);user-select:text;-webkit-user-select:text}
.verrou .boite{width:min(380px,100%);text-align:center}
.verrou .logo{width:72px;height:72px;margin:0 auto 14px}
.verrou .heure{font:200 64px/1 var(--sans);letter-spacing:-.02em}
.verrou .date{margin:6px 0 26px;color:var(--texte-doux)}
.verrou form{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:14px;background:var(--panneau);border:1px solid var(--ligne);box-shadow:var(--ombre);text-align:left}
.verrou label{font-size:12px;color:var(--texte-doux)}
.verrou input{width:100%;height:42px;margin-top:4px;padding:0 12px;border:1px solid var(--ligne);border-radius:8px;background:#0E0D0B;font-size:16px;outline:none}
.verrou input:focus{border-color:var(--or)}
.verrou .principal{height:42px;border:0;border-radius:8px;background:var(--or);color:#1B1406;font-weight:600;cursor:pointer}
.verrou .principal:disabled{opacity:.6}
.verrou .liens{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.verrou .liens a,.verrou .liens button{border:0;background:none;padding:0;color:var(--or);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.verrou .msg{margin:0;padding:8px 10px;border-radius:8px;background:rgba(229,72,77,.14);color:#FFB4B6;font-size:13px}
.message-bureau{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;max-width:min(460px,calc(100vw - 32px));padding:14px 18px;border-radius:12px;background:var(--panneau);border:1px solid var(--ligne);text-align:center}

/* ---------- Charte du bureau (marque « ab ») : celle de /planif/ pour ce bureau ----------
   Fond clair #F4F5F2, cartes blanches arrondies à ombre douce, accent vert,
   boutons principaux en vert clair à texte foncé, logo du bureau. Jamais en démonstration. */
.logo-ab{display:none}
:root[data-marque="ab"] #fond{display:none}   /* pas d'ossature qui tourne : le logo seul (02.11.2026) */
/* Le logo officiel du bureau au centre du bureau, sous les icônes */
.logo-centre{position:fixed;left:50%;top:calc(50% - 28px);transform:translate(-50%,-50%);height:min(42vh,380px);width:auto;max-width:60vw;pointer-events:none;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.08));opacity:0;animation:logoVient .8s .1s ease-out forwards}
@keyframes logoVient{to{opacity:1}}
:root[data-marque="ab"] .logo-ab{display:block}
:root[data-marque="ab"] .logo-str{display:none}
:root[data-marque="ab"]{
  color-scheme:light;
  --or:#4D7A1C;
  --or-rvb:77,122,28;
  --or-fonce:#3B5E15;
  --noir:#F4F5F2;
  --barre:rgba(255,255,255,.86);
  --tuile:#FFFFFF;
  --tuile-bord:rgba(0,0,0,.07);
  --tuile-fond:#FFFFFF;
  --panneau:rgba(255,255,255,.97);
  --controle:#F6FAEE;
  --controle-survol:#EEF5DE;
  --ligne:rgba(0,0,0,.09);
  --texte:#1F2419;
  --texte-doux:rgba(31,36,25,.72);
  --texte-faible:rgba(31,36,25,.5);
  --fil-rvb:93,145,38;
  --ombre-texte:none;
  --ombre:0 24px 56px rgba(0,0,0,.14),0 2px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05);
}

  /* ---------- Carte « Aujourd'hui » ---------- */

    // Ce qui attend une action

    if (n.veille) signaux.push([n.veille, n.veille > 1 ? "nouvelles publications simap.ch" : "nouvelle publication simap.ch", "veille"]);

  /* Cocher : termine SA part de la tâche (le calcul s'il en est l'ingénieur, le

     même écriture que le pouce de l'accueil de /planif/ (Donnees.retoucheTache),

  function coche(t, moi, u) {

    b.type = "button"; b.className = "coche " + u; b.innerHTML = "<span></span>";

      D.retoucheTache(t.id, champs).then(function () {
        var apres = D.tache(t.id);

  /* ---------- Fenêtres : chaque module dans la sienne ---------- */
  /* La page de /planif/ s'ouvre telle quelle ; dans la fenêtre, sa barre du
     haut est masquée (le bureau la remplace). La feuille est posée dès que le
     document de la fenêtre existe, à chaque navigation. */
  var CSS_DEDANS = "[data-chrome]{display:none!important}:root{--h-chrome:0px!important}";
  var couche = $("#fenetres"), FEN = {}, zMax = 10;

  function ecrirePos(f) {

  var BTN = {

    agrandir: '<svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg>',
    onglet: '<svg viewBox="0 0 10 10"><path d="M4 .5h5.5V6M9.5.5L4 6M7 9.5H.5V3" fill="none" stroke="currentColor"/></svg>',
    fermer: '<svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg>'
  };
  function habille(f) {
    var doc;
    try { doc = f.ifr.contentDocument; } catch (e) { return; }

    var loc = "";
    try { loc = f.ifr.contentWindow.location.pathname; } catch (e) {}
    // La page renvoie à la connexion : la session est finie, le bureau la redemande
    if (/^\/planif\/connexion\//.test(loc)) { Object.keys(FEN).forEach(function (k) { fermer(FEN[k]); }); verrou("Ta session a pris fin : reconnecte-toi."); return; }
    if (/^\/planif\//.test(loc) && !doc.getElementById("planif2-dedans")) {
      var s = doc.createElement("style"); s.id = "planif2-dedans"; s.textContent = CSS_DEDANS;

    var t = (doc.title || "").replace(/\s*·\s*(Planification|Espace démo).*$/i, "");
    if (t && t !== f.titre) { f.titre = t; f.el.querySelector(".nom").textContent = t; }

  function ouvrir(a, href) {

    el.innerHTML = '<div class="titre"><span class="mini">' + svgIco(a.id) + '</span><span class="nom"></span>' +
      '<a class="onglet" target="_blank" rel="noopener" title="Ouvrir dans un onglet">' + BTN.onglet + "</a>" +
      '<button class="reduire" title="Réduire">' + BTN.reduire + "</button>" +
      '<button class="agrandir" title="Agrandir">' + BTN.agrandir + "</button>" +
      '<button class="fermer" title="Fermer">' + BTN.fermer + "</button></div>" +
      '<div class="cadre"><div class="charge">Ouverture…</div><iframe allow="fullscreen; clipboard-read; clipboard-write; geolocation" allowfullscreen></iframe></div>' +
      '<div class="poignee g"></div><div class="poignee d"></div><div class="poignee b"></div><div class="poignee db"></div>';

    if (!p) { p = { l: Math.min(1280, W * .84), h: Math.min(860, H * .9) }; p.x = (W - p.l) / 2 + n * 28 - 40; p.y = Math.max(8, (H - p.h) / 2 + n * 28 - 40); }

    glisser(f, titre, "deplace");

  function devant(f) {

  function glisser(f, poignee, mode) {

  });
  addEventListener("resize", function () { Object.keys(FEN).forEach(function (k) { cadre(FEN[k]); }); });

  /* Les modules V2 ouvrent un autre module dans sa fenêtre (module.js, M.ouvreModule) */
  window.Bureau = { ouvre: function (id, href) { var a = parId[id]; if (a && permises.indexOf(a) >= 0) ouvrir(a, href); } };

  /* ---------- Plein écran ---------- */
  var ICO_PLEIN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
      ICO_SORTIR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 1.5v4h-4M14.5 5.5h-4v-4M10.5 14.5v-4h4M1.5 10.5h4v4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
  var bPlein = $("#btn-plein"), fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function pleinMaj() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    bPlein.innerHTML = on ? ICO_SORTIR : ICO_PLEIN;
    bPlein.title = on ? "Quitter le plein écran" : "Plein écran";
  }
  if (!fsOk) bPlein.hidden = true;
  pleinMaj();
  bPlein.addEventListener("click", function () {
    var d = document, r = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
  });
  document.addEventListener("fullscreenchange", pleinMaj);
  document.addEventListener("webkitfullscreenchange", pleinMaj);

  /* ---------- Fond d'écran : ossature filaire en or (poteaux, dalles) qui tourne ---------- */
  var cv = $("#fond"), ctx = cv.getContext("2d"), L, H, dpr;
  function taille() { dpr = Math.min(window.devicePixelRatio || 1, 2); L = innerWidth; H = innerHeight; cv.width = L * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  taille(); addEventListener("resize", taille);
  var segs = [], nx = 4, ny = 3, nz = 5;
  for (var k = 0; k <= nz; k++) for (var i = 0; i <= nx; i++) for (var j = 0; j <= ny; j++) {
    var a = [i - nx / 2, k - nz / 2, j - ny / 2];
    if (i < nx) segs.push([a, [a[0] + 1, a[1], a[2]]]);
    if (j < ny) segs.push([a, [a[0], a[1], a[2] + 1]]);
    if (k < nz) segs.push([a, [a[0], a[1] + 1, a[2]]]);
  }
  var t0 = performance.now();
  function dessine(t) {
    var ang = (t - t0) / 26000, c = Math.cos(ang), s = Math.sin(ang);
    var ech = Math.min(L, H) / 11, cx = L * .55, cy = H * .5;
    if (document.documentElement.getAttribute("data-marque") === "ab") { requestAnimationFrame(dessine); return; }
    var fil = getComputedStyle(document.documentElement).getPropertyValue("--fil-rvb").trim() || "214,168,92";
    ctx.clearRect(0, 0, L, H);
    ctx.lineWidth = 1;
    segs.forEach(function (sg) {
      var pr = sg.map(function (q) {
        var x = q[0] * c - q[2] * s, zz = q[0] * s + q[2] * c, y = q[1];
        var f = 7 / (7 + zz * .6);
        return [cx + x * ech * f, cy - y * ech * f + zz * ech * .28, zz];
      });
      var prof = (pr[0][2] + pr[1][2]) / 2;
      ctx.strokeStyle = "rgba(" + fil + "," + (0.16 - prof * .03).toFixed(3) + ")";
      ctx.beginPath(); ctx.moveTo(pr[0][0], pr[0][1]); ctx.lineTo(pr[1][0], pr[1][1]); ctx.stroke();
    });
    requestAnimationFrame(dessine);
  }
  requestAnimationFrame(dessine);
})();
</script>
