<style>
.carte-aff{position:relative;height:calc(100vh - 110px);min-height:380px;overflow:hidden;border-radius:10px;background:#E8E8E3;box-shadow:0 1px 3px rgba(0,0,0,.08);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.carte-aff.glisse{cursor:grabbing}
.ca-scene{position:absolute;inset:0;transform-origin:0 0}
.ca-tuiles{position:absolute;inset:0}
.ca-tuiles img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.carte-aff[data-fond="plan"] .ca-tuiles{filter:grayscale(1) contrast(.7) brightness(1.08);opacity:.72}
.carte-aff[data-fond="couleur"] .ca-tuiles{filter:saturate(.7) contrast(.85);opacity:.85}
.carte-aff[data-fond="photo"] .ca-tuiles{filter:saturate(.8) brightness(.9)}
.ca-point{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:0;border:0;background:none;color:var(--texte);cursor:pointer;transform:translate(-11px,-11px);white-space:nowrap;z-index:1}
.ca-point i{width:16px;height:16px;flex:none;transform:rotate(45deg);margin:2px;background:var(--tt);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .15s}
.ca-point b{font-size:11px;font-weight:700;line-height:1;padding:4px 6px;border-radius:5px;background:#fff;color:var(--tt);box-shadow:0 1px 5px rgba(0,0,0,.25)}
.ca-point:hover,.ca-point.choisi{z-index:2}
.ca-point:hover i,.ca-point.choisi i{transform:rotate(45deg) scale(1.3)}
.ca-point.choisi b{background:var(--tt);color:#fff}
.ca-outils{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:6px}
.ca-outils button{width:34px;height:34px;display:grid;place-items:center;font-size:18px;border:1px solid var(--ligne);border-radius:8px;background:rgba(255,255,255,.92);color:var(--texte);cursor:pointer}
.ca-outils button:hover{background:#fff;color:var(--m-fort)}
.ca-fonds{position:absolute;left:10px;bottom:10px;z-index:4;display:flex;padding:3px;border-radius:9px;background:rgba(255,255,255,.92);border:1px solid var(--ligne)}
.ca-fonds button{padding:5px 11px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:12px;color:var(--doux)}
.ca-fonds button[aria-pressed="true"]{background:var(--m-clair);color:var(--texte);font-weight:600}
.ca-credit{position:absolute;right:0;bottom:0;z-index:4;padding:3px 7px;font-size:10px;color:var(--doux);background:rgba(255,255,255,.8);border-top-left-radius:6px}
.ca-credit a{color:inherit}
.ca-etat{position:absolute;left:10px;top:10px;z-index:4;padding:6px 10px;border-radius:7px;font-size:12px;color:var(--doux);background:rgba(255,255,255,.92);border:1px solid var(--ligne)}
.ca-etat:empty{display:none}

</style>

  }

      .then(function (p) { cache[k] = p ? { lat: p.lat, lon: p.lon, t: Date.now() } : { lat: null, t: Date.now() }; garde(); return p; });
  }
  function localiseTout() {

  }

    var tx0 = Math.floor(x0 / TUILE), tx1 = Math.floor((x0 + L) / TUILE), ty0 = Math.max(0, Math.floor(y0 / TUILE)), ty1 = Math.min(n - 1, Math.floor((y0 + H) / TUILE));

      b.setAttribute("aria-label", D.libelleAffaire(a) + " — " + a.adresse); b.title = D.libelleAffaire(a);
      b.appendChild(el("i")); b.appendChild(el("b", null, a.code || a.nom));
      b.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });

  }
  function dessine() { if (!carte.isConnected) return; mesure(); dessineTuiles(); dessinePoints(); }

  var roue = 0, derniereRoue = 0;

  /* ---------- Filtres ---------- */
  function teinte(a) { return "var(--t" + ((a && a.teinte) || 1) + ")"; }
