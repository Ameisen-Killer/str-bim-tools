<style>
:root{
  --noir:#050505;
  --or:#D6A85C;
  --texte:#ECE8E0;

  --g:clamp(18px,4vw,56px);

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--noir);color:var(--texte);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.page{
  min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  padding-block:max(clamp(18px,3vw,36px),env(safe-area-inset-top)) max(clamp(18px,3vw,36px),env(safe-area-inset-bottom));

}

  display:flex;justify-content:space-between;align-items:baseline;gap:16px;

<script>
(function(){
  var cv = document.getElementById("bat"), ctx = cv.getContext("2d");
  var page = document.getElementById("page");
  // Choix assumé : l'animation complète est jouée même si le système demande de réduire les mouvements

  function norm(a){var l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}
  function clamp(x){return x<0?0:x>1?1:x}
  function ease(p){return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2}
  function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
  var graine = 1;

  // ---------- Maquettes : bâtiments inventés, l'un d'eux est tiré au sort à chaque visite ----------
  // (?batiment=1, 2 ou 3 force un modèle, pour les tests)
  var faces = [], loggias = [];
  // Trame des niveaux de la façade en cours de création (base, hauteur d'étage) : c'est elle que
  // le survol allume. Chaque maquette la règle avant de monter ses volumes.
  var grille = {b:0, p:4};

  function Face(O, a, n, W, H){
    var f = {O:O, a:a, n:n, W:W, H:H, g:grille, glass:false, lines:[], quads:[], dep:D(O[1])};   // le reflet du verre suit la montée
    f.P = function(s,t){return [O[0]+a[0]*s, O[1]+t, O[2]+a[2]*s]};
    f.c = [O[0]+a[0]*W/2, O[1]+H/2, O[2]+a[2]*W/2];
    faces.push(f); return f;
  }
  function L(f, s0, t0, s1, t1, cls, d, t){ f.lines.push({a:f.P(s0,t0), b:f.P(s1,t1), c:cls, d:d, t:t}) }
  function Q(f, s0, s1, t0, t1, o, d, t, twinkle){
    var q = {p:[f.P(s0,t0),f.P(s1,t0),f.P(s1,t1),f.P(s0,t1)], o:o, cur:o, d:d, t:t||1.4};
    f.quads.push(q); if (twinkle) loggias.push(q); return q;
  }

  // Boîte posée à la cote y0, de hauteur h : quatre façades orientées vers l'extérieur.
  // « sauf » liste les façades à ne pas créer (s, e, n, o), par exemple celles collées à un autre volume.
  function boite(x0, z0, x1, z1, y0, h, fn, sauf){
    sauf = sauf || "";
    if (sauf.indexOf("s") < 0) fn(Face([x0,y0,z0], [1,0,0],  [0,0,-1], x1-x0, h), "s");
    if (sauf.indexOf("e") < 0) fn(Face([x1,y0,z0], [0,0,1],  [1,0,0],  z1-z0, h), "e");
    if (sauf.indexOf("n") < 0) fn(Face([x1,y0,z1], [-1,0,0], [0,0,1],  x1-x0, h), "n");
    if (sauf.indexOf("o") < 0) fn(Face([x0,y0,z1], [0,0,-1], [-1,0,0], z1-z0, h), "o");
  }

  // La construction monte du sol vers le sommet : délai proportionnel à la hauteur
  var KM = .05;
  function D(y){ return .3 + y*KM }
  function vert(f, s, t0, t1, cls){ L(f, s,t0, s,t1, cls, D(f.O[1]+t0), Math.max(.6, (t1-t0)*KM*1.25)) }
  function horiz(f, t, cls, s0, s1){ L(f, s0 == null ? 0 : s0, t, s1 == null ? f.W : s1, t, cls, D(f.O[1]+t) + .15, 1.1) }
  function contour(f, cls){ horiz(f, 0, cls); horiz(f, f.H, cls); vert(f, 0, 0, f.H, cls); vert(f, f.W, 0, f.H, cls) }
  function allume(f, s0, s1, t0, t1, proba, amax){
    var r = rnd(graine++), r2 = rnd(graine++);
    Q(f, s0, s1, t0, t1, r < proba ? amax*(.55 + .45*r2) : .02 + r2*.03, D(f.O[1]+t0) + .9 + r2*1.2, 1.4, true);
  }

  // Mur-rideau de bureaux : meneaux fins, planchers, plateaux éclairés par tronçons
  function murRideau(f, etage, meneau, proba, amax){
    f.glass = true; contour(f, "v");
    var nm = Math.max(1, Math.round(f.W/meneau)), mw = f.W/nm, ne = Math.max(1, Math.round(f.H/etage)), eh = f.H/ne;
    for (var k=1;k<nm;k++) vert(f, k*mw, 0, f.H, k%3 === 0 ? "v" : "vf");
    for (var j=1;j<ne;j++) horiz(f, j*eh, "vf");
    for (var j2=0;j2<ne;j2++){
      var s = 0;
      while (s < f.W - .1){
        var fin = Math.min(f.W, s + mw*(2 + Math.floor(rnd(graine++)*4)));
        allume(f, s+.2, fin-.2, j2*eh+.4, (j2+1)*eh-.6, proba, amax);
        s = fin;
      }
    }
  }
  // Couronnement à ailettes verticales
  function ailettes(f, pas){
    f.glass = true; contour(f, "v");
    var n = Math.max(1, Math.round(f.W/pas));
    for (var k=1;k<n;k++) vert(f, k*f.W/n, 0, f.H, k%2 ? "vf" : "v");
    horiz(f, f.H - 1.2, "v");
  }
  // Fenêtres percées étroites
  function percee(f, etage, trame, largeur, proba){
    contour(f, "");
    var ne = Math.max(1, Math.round(f.H/etage)), eh = f.H/ne, nt = Math.max(1, Math.round(f.W/trame)), tw = f.W/nt;
    for (var j=1;j<ne;j++) horiz(f, j*eh, "f");
    for (var j2=0;j2<ne;j2++) for (var k=0;k<nt;k++){
      var c = (k+.5)*tw, s0 = c - largeur/2, s1 = c + largeur/2, t0 = j2*eh + .7, t1 = (j2+1)*eh - .5, d = D(f.O[1]+t0) + .3;
      L(f, s0,t0, s0,t1, "f", d, .6); L(f, s1,t0, s1,t1, "f", d, .6);
      allume(f, s0+.1, s1-.1, t0+.1, t1-.1, proba, .85);
    }
  }

  var BATIMENTS = [
    { aria: "une tour de bureaux vitrée à redans, posée sur un socle", th0: .55, construire: function(){
        KM = 4.6/88;
        boite(0,0, 36,36, 0,12,  function(f){ murRideau(f, 4, 3, .3, .5) });
        boite(4,4, 32,32, 12,36, function(f){ murRideau(f, 4, 1.4, .2, .5) });
        boite(8,8, 28,28, 48,28, function(f){ murRideau(f, 4, 1.4, .18, .5) });
        boite(12,12, 24,24, 76,12, function(f){ ailettes(f, .8) });
      }},
    { aria: "deux tours jumelles reliées en hauteur par une passerelle vitrée", th0: -.45, construire: function(){
        KM = 4.6/84;
        boite(0,0, 20,20, 0,84,   function(f){ percee(f, 4, 3.3, .9, .28) });
        boite(34,12, 54,32, 0,64, function(f){ percee(f, 4, 3.3, .9, .28) });
        boite(20,12, 34,18, 52,8, function(f){ murRideau(f, 4, 1.2, .35, .6) }, "eo");
      }},
    { aria: "un socle de logements en L aux loggias éclairées et une haute tour de verre de 28 niveaux", th0: Math.atan2(93, 174), construire: function(){
        // Première maquette du site, tour portée de 18 à 28 niveaux
        var RDC = 5.2, ETAGE = 3.0, NIV = 9, HAUT = RDC + NIV*ETAGE, ACRO = HAUT + .8;
        var T_NIV = 28, T_ETAGE = 3.9, T_HAUT = T_NIV*T_ETAGE + 1.2;

        // Façade du socle, découpée en segments : loggias, atrium, fente dorée, mur-rideau
        function socle(O, a, n, W, dep, segs){
          var f = Face(O, a, n, W, ACRO); f.dep = dep;
          segs = segs || [[0, W, "log"]];
          L(f, 0,0, W,0, "", dep, 1.4);
          L(f, 0,0, 0,ACRO, "", dep, 2.6);
          L(f, W,0, W,ACRO, "", dep, 2.6);
          for (var j=0;j<=NIV;j++){
            var t = RDC + j*ETAGE;
            L(f, 0,t, W,t, (j===0||j===NIV) ? "" : "f", dep + .25 + j*.24, 1.1);
          }
          L(f, 0,ACRO, W,ACRO, "", dep + .25 + NIV*.24 + .2, 1.2);
          segs.forEach(function(sg){
            var s0 = sg[0], s1 = sg[1], w = s1 - s0, type = sg[2];
            if (s0 > 0) L(f, s0,0, s0,ACRO, "", dep + .1, 2.6);
            if (type === "log"){
              var nb = Math.max(1, Math.round(w/3.6)), bw = w/nb;
              for (var k=1;k<nb;k++) L(f, s0+k*bw,RDC, s0+k*bw,HAUT, "", dep + k*.035, 2.6);
              for (var k2=2;k2<nb;k2+=2) L(f, s0+k2*bw,0, s0+k2*bw,RDC, "", dep + k2*.035, 1.2);
              for (var j2=0;j2<NIV;j2++){
                var tt = RDC + j2*ETAGE;
                L(f, s0,tt+.5, s1,tt+.5, "f", dep + .45 + j2*.24, 1.1);
                for (var k3=0;k3<nb;k3++){
                  var r = rnd(graine++), r2 = rnd(graine++);
                  Q(f, s0+k3*bw+.7, s0+(k3+1)*bw-.7, tt+.8, tt+ETAGE-.25,
                    r < .34 ? .45 + r2*.4 : .02 + r2*.03, dep + 1.1 + j2*.24 + r2*1.6, 1.4, true);
                }
              }
            } else if (type === "atr"){
              Q(f, s0+.6, s1-.6, RDC, HAUT-.4, .14, dep + 1.8, 2);
            } else if (type === "fente"){
              Q(f, s0+.15, s1-.15, RDC, HAUT, .45, dep + 1.8, 2);
            } else if (type === "verre"){
              var nv = Math.max(1, Math.round(w/1.275));
              for (var v=1;v<nv;v++) L(f, s0+v*w/nv,RDC, s0+v*w/nv,HAUT, v%2 ? "vf" : "v", dep + v*.05, 2.6);
            }
          });
        }
        // Façade de la tour : verre, meneaux fins, bandeau marqué tous les quatre niveaux
        function tourVerre(O, a, n, W, dep){
          var f = Face(O, a, n, W, T_HAUT); f.glass = true; f.dep = dep;
          var nm = Math.round(W/1.5), mw = W/nm, montee = 3.6*T_HAUT/71.4;
          for (var k=0;k<=nm;k++) L(f, k*mw,0, k*mw,T_HAUT, (k===0||k===nm||k%4===0) ? "v" : "vf", dep + k*.025, montee);
          for (var j=0;j<=T_NIV;j++){
            var t = j*T_ETAGE, fort = (j%4===0 || j===T_NIV);
            L(f, 0,t, W,t, fort ? "v" : "vf", dep + .3 + j*.2, 1.2);
            if (fort && j>0) L(f, 0,t-.6, W,t-.6, "vf", dep + .4 + j*.2, 1.2);
          }
          L(f, 0,T_HAUT, W,T_HAUT, "v", dep + .3 + T_NIV*.2 + .2, 1.4);
        }
        // Boîte au sol : quatre façades orientées vers l'extérieur (sud, est, nord, ouest)
        function volume(x0, z0, x1, z1, fn, sauf){
          sauf = sauf || "";
          if (sauf.indexOf("s") < 0) fn([x0,0,z0], [1,0,0],  [0,0,-1], x1-x0, "s");
          if (sauf.indexOf("e") < 0) fn([x1,0,z0], [0,0,1],  [1,0,0],  z1-z0, "e");
          if (sauf.indexOf("n") < 0) fn([x1,0,z1], [-1,0,0], [0,0,1],  x1-x0, "n");
          if (sauf.indexOf("o") < 0) fn([x0,0,z1], [0,0,-1], [-1,0,0], z1-z0, "o");
        }

        // Corps principal, à l'angle : fente dorée puis mur-rideau sur la façade est
        grille = {b:RDC, p:ETAGE};
        volume(40,0, 70,42, function(O,a,n,W,cote){
          if (cote === "s") socle(O,a,n,W, .2);
          else if (cote === "e") socle(O,a,n,W, .35, [[0,28,"log"],[28,29.6,"fente"],[29.6,W,"verre"]]);
          else if (cote === "n") socle(O,a,n,W, .6);
          else socle([40,0,42], a, n, 28, .6);
        });
        // Aile gauche, fendue par l'atrium ; sa façade est est collée au corps principal
        volume(0,0, 40,14, function(O,a,n,W,cote){
          if (cote === "s") socle(O,a,n,W, .5, [[0,33,"log"],[33,40,"atr"]]);
          else if (cote === "n") socle(O,a,n,W, .6, [[0,7,"atr"],[7,40,"log"]]);
          else socle(O,a,n,W, .6);
        }, "e");
        // Tour en retrait
        grille = {b:0, p:T_ETAGE};
        volume(6,22, 32,48, function(O,a,n,W){ tourVerre(O,a,n,W, 2.6) });
      }}
  ];

  var choix = +(location.search.match(/[?&]batiment=(\d)/) || [])[1];
  var numero = (choix >= 1 && choix <= BATIMENTS.length) ? choix - 1 : Math.floor(Math.random()*BATIMENTS.length);
  var BAT = BATIMENTS[numero];
  BAT.construire();
  cv.setAttribute("aria-label", "Maquette filaire qui se construit puis tourne lentement : " + BAT.aria + ". Ouvrir la présentation de CAN 241");

  // Centre, taille et cercle d'implantation déduits de la maquette tirée
  var bx0=1e9, bz0=1e9, bx1=-1e9, bz1=-1e9, hmax=0;
  faces.forEach(function(f){
    [f.P(0,0), f.P(f.W,0)].forEach(function(p){ bx0=Math.min(bx0,p[0]); bx1=Math.max(bx1,p[0]); bz0=Math.min(bz0,p[2]); bz1=Math.max(bz1,p[2]); });
    hmax = Math.max(hmax, f.O[1] + f.H);
  });
  var CENTRE = [(bx0+bx1)/2, 0, (bz0+bz1)/2];
  var TAILLE = Math.max(bx1-bx0, bz1-bz0, hmax);
  var RAYON = .74*Math.max(bx1-bx0, bz1-bz0);
  var loggiaFin = 0;
  faces.forEach(function(f){
    f.lines.forEach(function(l){ loggiaFin = Math.max(loggiaFin, l.d + l.t) });
    f.quads.forEach(function(q){ loggiaFin = Math.max(loggiaFin, q.d + q.t) });
  });

  // ---------- Caméra en orbite ----------
  var angleTest = (location.search.match(/[?&]angle=(-?\d+)/) || [])[1];   // ?angle=90 : vue figée pour les tests
  var R = 2.9*TAILLE, EH = 6, TH0 = angleTest != null ? +angleTest*Math.PI/180 : BAT.th0;
  var LUM = norm([.8, 0, -.6]);
  var cam = {};
  function camera(th){
    cam.eye = [CENTRE[0] + R*Math.sin(th), EH, CENTRE[2] - R*Math.cos(th)];
    cam.fw = norm([CENTRE[0]-cam.eye[0], 0, CENTRE[2]-cam.eye[2]]);
    cam.rt = [cam.fw[2], 0, -cam.fw[0]];
  }
  function proj(p){
    var dx = p[0]-cam.eye[0], dz = p[2]-cam.eye[2];
    var z = dx*cam.fw[0] + dz*cam.fw[2];
    return [(dx*cam.rt[0] + dz*cam.rt[2])/z, -(p[1]-EH)/z];
  }

  // Cadrage valable pour tous les angles : le bâtiment ne sort jamais du cadre
  var ext = {x:0, y0:1e9, y1:-1e9};
  (function(){
    var pts = [];
    faces.forEach(function(f){ pts.push(f.P(0,0), f.P(0,f.H), f.P(f.W,0), f.P(f.W,f.H)) });
    for (var i=0;i<72;i++){
      camera(i/72*Math.PI*2);
      pts.forEach(function(p){ var q = proj(p); ext.x = Math.max(ext.x, Math.abs(q[0])); ext.y0 = Math.min(ext.y0, q[1]); ext.y1 = Math.max(ext.y1, q[1]); });
    }
  })();

  var W = 0, H = 0, dpr = 1, S = 1, CX = 0, CY = 0;
  var RECUL = .8;                           // < 1 : caméra plus éloignée, bâtiment plus petit dans le cadre
  function taille(){
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    S = RECUL * Math.min(W*.94/(2*ext.x), H*.94/(ext.y1-ext.y0));
    CX = W/2; CY = H/2 - S*(ext.y0+ext.y1)/2;
  }
  var dCY = 0;                              // décalage vertical du cadrage, pendant la plongée
  function ecran(p){ var q = proj(p); return [CX + S*q[0], CY + dCY + S*q[1]] }

  // ---------- Niveau allumé : survol, balayage d'invitation, plongée ----------
  var niv = {y:0, a:0, cible:0, mx:0, my:0, libelle:false};
  var visibles = [];                        // faces vues à la dernière image, de la plus lointaine à la plus proche

  /** Le niveau de la façade f qui contient la cote y, en cotes locales [t0, t1], ou null. */
  function niveauDe(f, y){
    var y0 = f.O[1], y1 = f.O[1] + f.H;
    if (y < y0 - 1e-6 || y > y1 + 1e-6) return null;
    var g = f.g, a, b;
    if (y < g.b){ a = 0; b = g.b; }
    else { var k = Math.floor((y - g.b)/g.p); a = g.b + k*g.p; b = a + g.p; }
    a = Math.max(a, y0); b = Math.min(b, y1);
    return b - a > .3 ? [a - y0, b - y0] : null;
  }

  /** Façade la plus proche sous le point d'écran (x, y) et cote du bâtiment visée, ou null. */
  function vise(x, y){
    for (var k = visibles.length - 1; k >= 0; k--){
      var f = visibles[k], q = f.ecr;
      if (!q || !dansQuad(x, y, q)) continue;
      // Rayon de l'œil par ce point, coupé par le plan de la façade
      var qx = (x - CX)/S, qy = (y - CY - dCY)/S;
      var d = [cam.fw[0] + qx*cam.rt[0], -qy, cam.fw[2] + qx*cam.rt[2]];
      var nd = f.n[0]*d[0] + f.n[2]*d[2];
      if (Math.abs(nd) < 1e-9) continue;
      var lam = (f.n[0]*(f.O[0] - cam.eye[0]) + f.n[2]*(f.O[2] - cam.eye[2]))/nd;
      return {f:f, y:EH + lam*d[1]};
    }
    return null;
  }
  function dansQuad(x, y, q){
    var signe = 0;
    for (var i = 0; i < 4; i++){
      var a = q[i], b = q[(i+1)%4];
      var c = (b[0]-a[0])*(y-a[1]) - (b[1]-a[1])*(x-a[0]);
      if (Math.abs(c) < 1e-9) continue;
      var s = c > 0 ? 1 : -1;
      if (signe && s !== signe) return false;
      signe = s;
    }
    return true;
  }

  var COUL = {"":"236,232,224", f:"236,232,224", v:"170,192,214", vf:"170,192,214"};
  var ALPHA = {"":.62, f:.2, v:.5, vf:.16};

  function dessiner(T, th){
    camera(th);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#050505"; ctx.fillRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.lineCap = "butt"; ctx.lineJoin = "miter";

    // ligne de sol : cercle d'implantation
    var ps = ease(clamp((T-.1)/2.4));
    if (ps > 0){
      ctx.beginPath();
      for (var i=0;i<=96*ps;i++){
        var an = TH0 - Math.PI/2 + i/96*Math.PI*2;
        var e = ecran([CENTRE[0] + RAYON*Math.cos(an), 0, CENTRE[2] + RAYON*Math.sin(an)]);
        i ? ctx.lineTo(e[0],e[1]) : ctx.moveTo(e[0],e[1]);
      }
      ctx.strokeStyle = "rgba(236,232,224,.13)"; ctx.stroke();
    }

    // faces visibles, de la plus lointaine à la plus proche
    var vis = [];
    for (var k=0;k<faces.length;k++){
      var f = faces[k];
      var vx = cam.eye[0]-f.c[0], vz = cam.eye[2]-f.c[2];
      if (f.n[0]*vx + f.n[2]*vz <= 0) continue;
      f.z = (f.c[0]-cam.eye[0])*cam.fw[0] + (f.c[2]-cam.eye[2])*cam.fw[2];
      vis.push(f);
    }
    vis.sort(function(a,b){ return b.z - a.z });
    visibles = vis;

    for (var m=0;m<vis.length;m++){
      var f = vis[m];
      var c0 = ecran(f.P(0,0)), c1 = ecran(f.P(f.W,0)), c2 = ecran(f.P(f.W,f.H)), c3 = ecran(f.P(0,f.H));
      f.ecr = [c0, c1, c2, c3];
      ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.lineTo(c1[0],c1[1]); ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.closePath();
      ctx.fillStyle = "#050505"; ctx.fill();

      var lam = Math.max(0, f.n[0]*LUM[0] + f.n[2]*LUM[2]);
      var eclat = .72 + .4*lam;

      if (f.glass){
        var ap = ease(clamp((T - f.dep - 3.2)/2.4));
        if (ap > 0){
          var vv = norm([cam.eye[0]-f.c[0], 0, cam.eye[2]-f.c[2]]);
          var hv = norm([LUM[0]+vv[0], 0, LUM[2]+vv[2]]);
          var spec = Math.pow(Math.max(0, f.n[0]*hv[0] + f.n[2]*hv[2]), 10);
          var g = ctx.createLinearGradient(0, c3[1], 0, c0[1]);
          g.addColorStop(0, "rgba(200,216,232," + ((.05 + .2*spec)*ap).toFixed(3) + ")");
          g.addColorStop(1, "rgba(159,182,204," + ((.01 + .04*spec)*ap).toFixed(3) + ")");
          ctx.fillStyle = g; ctx.fill();
        }
      }

      for (var qi=0;qi<f.quads.length;qi++){
        var q = f.quads[qi];
        var a = clamp((T - q.d)/q.t) * q.cur;
        if (a < .01) continue;
        var p0 = ecran(q.p[0]), p1 = ecran(q.p[1]), p2 = ecran(q.p[2]), p3 = ecran(q.p[3]);
        ctx.globalAlpha = a*(.8 + .25*lam);
        ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.closePath();
        ctx.fillStyle = "#D6A85C"; ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (var cls in COUL){
        ctx.beginPath(); var n = 0;
        for (var li=0;li<f.lines.length;li++){
          var l = f.lines[li]; if (l.c !== cls) continue;
          var p = ease(clamp((T - l.d)/l.t)); if (p <= 0) continue;
          var b = [l.a[0]+(l.b[0]-l.a[0])*p, l.a[1]+(l.b[1]-l.a[1])*p, l.a[2]+(l.b[2]-l.a[2])*p];
          var e0 = ecran(l.a), e1 = ecran(b);
          ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]); n++;
        }
        if (n){ ctx.strokeStyle = "rgba(" + COUL[cls] + "," + Math.min(1, ALPHA[cls]*eclat).toFixed(3) + ")"; ctx.stroke(); }
      }

      // Niveau allumé : un bandeau d'or qui fait le tour du bâtiment, masqué comme le reste
      // par les façades plus proches, dessinées ensuite
      if (niv.a > .01){
        var nt = niveauDe(f, niv.y);
        if (nt){
          var b0 = ecran(f.P(0,nt[0])), b1 = ecran(f.P(f.W,nt[0])), b2 = ecran(f.P(f.W,nt[1])), b3 = ecran(f.P(0,nt[1]));
          ctx.beginPath(); ctx.moveTo(b0[0],b0[1]); ctx.lineTo(b1[0],b1[1]); ctx.lineTo(b2[0],b2[1]); ctx.lineTo(b3[0],b3[1]); ctx.closePath();
          ctx.fillStyle = "rgba(214,168,92," + (.13*niv.a*(.8 + .3*lam)).toFixed(3) + ")"; ctx.fill();
          ctx.beginPath(); ctx.moveTo(b0[0],b0[1]); ctx.lineTo(b1[0],b1[1]); ctx.moveTo(b3[0],b3[1]); ctx.lineTo(b2[0],b2[1]);
          ctx.strokeStyle = "rgba(214,168,92," + (.9*niv.a).toFixed(3) + ")"; ctx.stroke();
        }
      }
    }

    // Invitation au survol : où mène le clic
    if (niv.libelle && niv.a > .05){
      ctx.font = "400 11px 'IBM Plex Mono', ui-monospace, Consolas, monospace";
      if ("letterSpacing" in ctx) ctx.letterSpacing = "2px";
      ctx.fillStyle = "rgba(214,168,92," + (.95*niv.a).toFixed(3) + ")";
      var txt = "MÉTRÉ CAN 241 →", lx = niv.mx + 18, ly = niv.my - 12;
      if (lx + ctx.measureText(txt).width > W - 8) lx = niv.mx - 18 - ctx.measureText(txt).width;
      ctx.fillText(txt, lx, Math.max(14, ly));
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    }

    // Plongée : la scène s'assombrit avant de céder la place à CAN 241
    if (plonge && plonge.p > .55){
      ctx.fillStyle = "rgba(5,5,5," + (Math.min(1, (plonge.p - .55)/.45)*.7).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  window.addEventListener("resize", taille);
  taille();

  requestAnimationFrame(function(){ requestAnimationFrame(function(){ page.classList.add("go"); }); });

  // ---------- Animation : construction, puis rotation lente ----------
  var parTour = +(location.search.match(/[?&]tour=(\d+)/) || [])[1] || 60;
  var VITESSE = angleTest != null ? 0 : Math.PI*2/parTour;   // un tour en 75 s (?tour=N pour tester)
  var DEBUT_ROT = loggiaFin - 1.5;
  var t0 = null, prec = 0, th = TH0, omega = 0, prochaine = DEBUT_ROT + 1;
  var glisse = false, gx = 0, gt = 0, gv = 0;

  function frame(now){
    if (t0 === null) t0 = now;
    var T = (now - t0)/1000, dt = Math.min(.05, T - prec); prec = T;

    if (!glisse){
      var cible = T > DEBUT_ROT ? VITESSE : 0;
      omega += (cible - omega) * Math.min(1, dt*(T - DEBUT_ROT < 6 ? .35 : 1.2));
      th += omega*dt;
    }

    // après la construction, une loggia s'allume ou s'éteint de temps en temps
    if (T > prochaine){
      prochaine = T + .7;
      var q = loggias[Math.floor(Math.random()*loggias.length)];
      q.o = q.o > .3 ? .02 + Math.random()*.03 : .45 + Math.random()*.4;
    }
    if (T > DEBUT_ROT) for (var i=0;i<loggias.length;i++){
      var lq = loggias[i], d = lq.o - lq.cur, pas = dt/2.8;
      lq.cur = Math.abs(d) <= pas ? lq.o : lq.cur + Math.sign(d)*pas;
    }

    // Une fois le bâtiment monté, un niveau d'or le parcourt du pied au sommet :
    // il dit, sans un mot, qu'on peut le toucher
    var bal = (T - BALAYAGE)/2.6;
    if (!survole && !plonge && bal > 0 && bal < 1){
      niv.y = hmax*ease(bal); niv.cible = Math.sin(Math.PI*bal)*.75; niv.libelle = false;
    } else if (!survole && !plonge && bal >= 1) niv.cible = 0;

    // Plongée : la caméra descend vers le niveau choisi et s'en approche
    if (plonge){
      plonge.p = ease(clamp((now - plonge.t0)/1150));
      R = R0 + (R1 - R0)*plonge.p;
      EH = EH0 + (plonge.y - EH0)*plonge.p;
      dCY = (H/2 - CY)*plonge.p;
      niv.y = plonge.y; niv.cible = 1;
      if (plonge.p >= .999 && !plonge.parti){ plonge.parti = true; location.href = "/can241/"; }
    }
    niv.a += (niv.cible - niv.a)*Math.min(1, dt*(niv.cible > niv.a ? 9 : 5));

    dessiner(T, th);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Le bâtiment mène à CAN 241 ----------
  // Survol : le niveau visé s'allume ; clic ou appui : la caméra plonge vers lui, puis la page CAN 241
  // s'ouvre (et, dans les navigateurs qui savent le faire, la scène se fond dans la travée).
  var R0 = R, R1 = 1.3*TAILLE, EH0 = EH, BALAYAGE = loggiaFin + .6;
  var survole = false, plonge = null, appui = null;
  function construit(){ return t0 !== null && (performance.now() - t0)/1000 > DEBUT_ROT }
  function point(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] }
  function plonger(y){
    if (plonge) return;
    plonge = {t0: performance.now(), y: Math.max(2, Math.min(hmax - 2, y)), p: 0};
    page.classList.add("plonge");
    cv.style.cursor = "default";
  }
  // Retour arrière depuis CAN 241 : la page revient du cache telle qu'on l'avait quittée
  window.addEventListener("pageshow", function(e){
    if (!e.persisted || !plonge) return;
    plonge = null; R = R0; EH = EH0; dCY = 0; niv.cible = 0; survole = false;
    page.classList.remove("plonge"); cv.style.cursor = "";
  });

  // On peut aussi faire tourner le bâtiment à la main, puis il reprend sa course
  cv.addEventListener("pointerdown", function(e){
    if (plonge) return;
    glisse = true; gx = e.clientX; gt = performance.now(); gv = 0;
    appui = {x: e.clientX, y: e.clientY, t: gt};
    cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", function(e){
    if (!glisse){
      if (e.pointerType === "touch" || plonge || !construit()) return;
      var p = point(e), v = vise(p[0], p[1]);
      survole = !!v;
      if (v){ niv.y = v.y; niv.cible = 1; niv.libelle = true; niv.mx = p[0]; niv.my = p[1]; }
      else { niv.cible = 0; niv.libelle = false; }
      cv.style.cursor = v ? "pointer" : "";
      return;
    }
    var now = performance.now(), dth = -(e.clientX - gx) * 3.2 / Math.max(W, 320);
    th += dth; gv = dth / Math.max(.008, (now - gt)/1000);
    gx = e.clientX; gt = now;
  });
  function relacher(e){
    if (!glisse) return;
    glisse = false; cv.classList.remove("drag");
    omega = Math.max(-2.5, Math.min(2.5, gv));
    // Un appui bref, sans glisser : c'est un clic
    if (e && e.type === "pointerup" && appui && construit() &&
        Math.hypot(e.clientX - appui.x, e.clientY - appui.y) < 8 && performance.now() - appui.t < 600){
      var p = point(e), v = vise(p[0], p[1]);
      if (v) plonger(v.y);
    }
    appui = null;
  }
  cv.addEventListener("pointerup", relacher);
  cv.addEventListener("pointercancel", relacher);
  cv.addEventListener("pointerleave", function(e){
    if (glisse || plonge || e.pointerType === "touch") return;
    survole = false; niv.cible = 0; niv.libelle = false; cv.style.cursor = "";
  });
  // Au clavier : le bâtiment est un lien
  cv.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); plonger(hmax*.42); }
  });
})();
</script>
