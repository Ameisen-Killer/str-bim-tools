<style>
:root{
  --noir:#050505;
  --or:#D6A85C;

  --g:clamp(18px,4vw,56px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--noir);color:var(--texte);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.page{
  min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  padding-block:max(clamp(18px,3vw,36px),env(safe-area-inset-top)) max(clamp(18px,3vw,36px),env(safe-area-inset-bottom));

  display:flex;justify-content:space-between;align-items:baseline;gap:16px;

<script>
(function(){
  var cv = document.getElementById("bat"), ctx = cv.getContext("2d");
  var page = document.getElementById("page");
  // Choix assumé : l'animation complète est jouée même si le système demande de réduire les mouvements

  function norm(a){var l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}
  function clamp(x){return x<0?0:x>1?1:x}
  function ease(p){return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2}
  function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
  var graine = 1;

  // ---------- Maquette : bâtiment inventé, socle en L et tour de verre ----------
  var faces = [], loggias = [];

  function Face(O, a, n, W, H){
    var f = {O:O, a:a, n:n, W:W, H:H, glass:false, lines:[], quads:[], dep:D(O[1])};   // le reflet du verre suit la montée
    f.P = function(s,t){return [O[0]+a[0]*s, O[1]+t, O[2]+a[2]*s]};
    f.c = [O[0]+a[0]*W/2, O[1]+H/2, O[2]+a[2]*W/2];
    faces.push(f); return f;
  }
  function L(f, s0, t0, s1, t1, cls, d, t){ f.lines.push({a:f.P(s0,t0), b:f.P(s1,t1), c:cls, d:d, t:t}) }
  function Q(f, s0, s1, t0, t1, o, d, t, twinkle){
    var q = {p:[f.P(s0,t0),f.P(s1,t0),f.P(s1,t1),f.P(s0,t1)], o:o, cur:o, d:d, t:t||1.4};
    f.quads.push(q); if (twinkle) loggias.push(q); return q;
  }
  // Ossature porteuse (poteaux, dalles, noyau), tracée en or avant que les façades ne l'habillent
  var ossature = [], feux = [], cotesNiv = [], grue = null;
  var AVANCE = .9;   // la trame d'axes se trace seule au début, avant les premiers poteaux
  function os(a, b, cls, d, t){ ossature.push({a:a, b:b, c:cls, d:d, t:t}) }

  // Délai de construction par défaut (la maquette fixe ses propres départs)
  var KM = .05;
  function D(y){ return .3 + y*KM }

  var BAT =
    { aria: "un socle de logements en L aux loggias éclairées et une haute tour de verre de 28 niveaux, dont l'ossature porteuse monte avant les façades", th0: Math.atan2(93, 174), construire: function(){
        // Première maquette du site, tour portée de 18 à 28 niveaux
        var RDC = 5.2, ETAGE = 3.0, NIV = 9, HAUT = RDC + NIV*ETAGE, ACRO = HAUT + .8;
        var T_NIV = 28, T_ETAGE = 3.9, T_HAUT = T_NIV*T_ETAGE + 1.2;
        var DECAL = 1.4 + AVANCE;   // les façades attendent que l'ossature soit lancée

        // Façade du socle, découpée en segments : loggias, atrium, fente dorée, mur-rideau
        function socle(O, a, n, W, dep, segs){
          dep += DECAL;
          var f = Face(O, a, n, W, ACRO); f.dep = dep; f.monte = 2.6;
          segs = segs || [[0, W, "log"]];
          L(f, 0,0, W,0, "", dep, 1.4);
          L(f, 0,0, 0,ACRO, "", dep, 2.6);
          L(f, W,0, W,ACRO, "", dep, 2.6);
          for (var j=0;j<=NIV;j++){
            var t = RDC + j*ETAGE;
            L(f, 0,t, W,t, (j===0||j===NIV) ? "" : "f", dep + .25 + j*.24, 1.1);
          }
          L(f, 0,ACRO, W,ACRO, "", dep + .25 + NIV*.24 + .2, 1.2);
          segs.forEach(function(sg){
            var s0 = sg[0], s1 = sg[1], w = s1 - s0, type = sg[2];
            if (s0 > 0) L(f, s0,0, s0,ACRO, "", dep + .1, 2.6);
            if (type === "log"){
              var nb = Math.max(1, Math.round(w/3.6)), bw = w/nb;
              for (var k=1;k<nb;k++) L(f, s0+k*bw,RDC, s0+k*bw,HAUT, "", dep + k*.035, 2.6);
              for (var k2=2;k2<nb;k2+=2) L(f, s0+k2*bw,0, s0+k2*bw,RDC, "", dep + k2*.035, 1.2);
              for (var j2=0;j2<NIV;j2++){
                var tt = RDC + j2*ETAGE;
                L(f, s0,tt+.5, s1,tt+.5, "f", dep + .45 + j2*.24, 1.1);
                for (var k3=0;k3<nb;k3++){
                  var r = rnd(graine++), r2 = rnd(graine++);
                  Q(f, s0+k3*bw+.7, s0+(k3+1)*bw-.7, tt+.8, tt+ETAGE-.25,
                    r < .34 ? .45 + r2*.4 : .02 + r2*.03, dep + 1.1 + j2*.24 + r2*1.6, 1.4, true);
                }
              }
            } else if (type === "atr"){
              Q(f, s0+.6, s1-.6, RDC, HAUT-.4, .14, dep + 1.8, 2);
            } else if (type === "fente"){
              Q(f, s0+.15, s1-.15, RDC, HAUT, .45, dep + 1.8, 2);
            } else if (type === "verre"){
              var nv = Math.max(1, Math.round(w/1.275));
              for (var v=1;v<nv;v++) L(f, s0+v*w/nv,RDC, s0+v*w/nv,HAUT, v%2 ? "vf" : "v", dep + v*.05, 2.6);
            }
          });
        }
        // Façade de la tour : verre, meneaux fins, bandeau marqué tous les quatre niveaux
        function tourVerre(O, a, n, W, dep){
          dep += DECAL;
          var f = Face(O, a, n, W, T_HAUT); f.glass = true; f.dep = dep;
          var nm = Math.round(W/1.5), mw = W/nm, montee = 3.6*T_HAUT/71.4;
          f.monte = montee;
          for (var k=0;k<=nm;k++) L(f, k*mw,0, k*mw,T_HAUT, (k===0||k===nm||k%4===0) ? "v" : "vf", dep + k*.025, montee);
          for (var j=0;j<=T_NIV;j++){
            var t = j*T_ETAGE, fort = (j%4===0 || j===T_NIV);
            L(f, 0,t, W,t, fort ? "v" : "vf", dep + .3 + j*.2, 1.2);
            if (fort && j>0) L(f, 0,t-.6, W,t-.6, "vf", dep + .4 + j*.2, 1.2);
          }
          L(f, 0,T_HAUT, W,T_HAUT, "v", dep + .3 + T_NIV*.2 + .2, 1.4);
        }
        // Boîte au sol : quatre façades orientées vers l'extérieur (sud, est, nord, ouest)
        function volume(x0, z0, x1, z1, fn, sauf){
          sauf = sauf || "";
          if (sauf.indexOf("s") < 0) fn([x0,0,z0], [1,0,0],  [0,0,-1], x1-x0, "s");
          if (sauf.indexOf("e") < 0) fn([x1,0,z0], [0,0,1],  [1,0,0],  z1-z0, "e");
          if (sauf.indexOf("n") < 0) fn([x1,0,z1], [-1,0,0], [0,0,1],  x1-x0, "n");
          if (sauf.indexOf("o") < 0) fn([x0,0,z1], [0,0,-1], [-1,0,0], z1-z0, "o");
        }

        // Ossature, niveau par niveau : les poteaux montent d'un étage, puis la dalle se referme dessus
        function niveau(contour, poteaux, y0, y1, d, t){
          poteaux.forEach(function(p){ os([p[0],y0,p[1]], [p[0],y1,p[1]], "s", d, t) });
          for (var i=0;i<contour.length;i++){
            var a = contour[i], b = contour[(i+1)%contour.length];
            os([a[0],y1,a[1]], [b[0],y1,b[1]], "sf", d + t*.6, .5);
          }
        }
        function grille(xs, zs, bord){
          var r = [];
          xs.forEach(function(x, i){ zs.forEach(function(z, j){
            if (!bord || i === 0 || j === 0 || i === xs.length-1 || j === zs.length-1) r.push([x, z]);
          }) });
          return r;
        }
        // Socle en L : trame de poteaux dans l'aile et le corps principal
        var dalleSocle = [[.4,.4],[69.6,.4],[69.6,41.6],[40.4,41.6],[40.4,13.6],[.4,13.6]];
        var poteauxSocle = grille([.6,8,16,24,32], [.6,7,13.4]).concat(grille([40.6,48,55,62,69.4], [.6,7,14,21,28,35,41.4]));
        var cotes = [0, RDC];
        for (var jn=1;jn<=NIV;jn++) cotes.push(RDC + jn*ETAGE);
        for (var js=1;js<cotes.length;js++) niveau(dalleSocle, poteauxSocle, cotes[js-1], cotes[js], AVANCE + .2 + (js-1)*.13, .16);
        // Tour : poteaux de façade et noyau central
        var dalleTour = [[6.4,22.4],[31.6,22.4],[31.6,47.6],[6.4,47.6]];
        var poteauxTour = grille([6.5,12.75,19,25.25,31.5], [22.5,28.75,35,41.25,47.5], true);
        var noyau = [[16,32],[22,32],[22,38],[16,38]];
        for (var jt=1;jt<=T_NIV;jt++){
          niveau(dalleTour, poteauxTour, (jt-1)*T_ETAGE, jt*T_ETAGE, AVANCE + .5 + (jt-1)*.11, .14);
          niveau(noyau, noyau, (jt-1)*T_ETAGE, jt*T_ETAGE, AVANCE + .5 + (jt-1)*.11, .14);
        }
        // Cotes de niveau posées pendant la montée (socle à droite, tour à gauche)
        cotesNiv = [
          {y:0, t:AVANCE + .2, tour:false},
          {y:RDC, t:AVANCE + .36, tour:false},
          {y:HAUT, t:AVANCE + .2 + (NIV)*.13 + .16, tour:false},
          {y:15*T_ETAGE, t:AVANCE + .5 + 14*.11 + .14, tour:true},
          {y:T_NIV*T_ETAGE, t:AVANCE + .5 + (T_NIV-1)*.11 + .14, tour:true}
        ];
        // Grue à tour entre l'aile et la tour : elle monte avec l'ossature, puis s'en va
        grue = {x:1.5, z:19, debut:AVANCE + .5, duree:T_NIV*.11, haut:T_NIV*T_ETAGE, max:T_HAUT + 4, vise:Math.atan2(35-19, 19-1.5)};

        // Corps principal, à l'angle : fente dorée puis mur-rideau sur la façade est
        volume(40,0, 70,42, function(O,a,n,W,cote){
          if (cote === "s") socle(O,a,n,W, .2);
          else if (cote === "e") socle(O,a,n,W, .35, [[0,28,"log"],[28,29.6,"fente"],[29.6,W,"verre"]]);
          else if (cote === "n") socle(O,a,n,W, .6);
          else socle([40,0,42], a, n, 28, .6);
        });
        // Aile gauche, fendue par l'atrium ; sa façade est est collée au corps principal
        volume(0,0, 40,14, function(O,a,n,W,cote){
          if (cote === "s") socle(O,a,n,W, .5, [[0,33,"log"],[33,40,"atr"]]);
          else if (cote === "n") socle(O,a,n,W, .6, [[0,7,"atr"],[7,40,"log"]]);
          else socle(O,a,n,W, .6);
        }, "e");
        // Tour en retrait
        volume(6,22, 32,48, function(O,a,n,W){ tourVerre(O,a,n,W, 2.6) });
        // Feux de balisage aux quatre angles du sommet
        feux = [[6,T_HAUT,22], [32,T_HAUT,22], [32,T_HAUT,48], [6,T_HAUT,48]];
      }};

  BAT.construire();
  cv.setAttribute("aria-label", "Maquette filaire qui se construit puis tourne lentement : " + BAT.aria);

  // Centre, taille et cercle d'implantation déduits de la maquette
  var bx0=1e9, bz0=1e9, bx1=-1e9, bz1=-1e9, hmax=0;
  faces.forEach(function(f){
    [f.P(0,0), f.P(f.W,0)].forEach(function(p){ bx0=Math.min(bx0,p[0]); bx1=Math.max(bx1,p[0]); bz0=Math.min(bz0,p[2]); bz1=Math.max(bz1,p[2]); });
    hmax = Math.max(hmax, f.O[1] + f.H);
  });
  var CENTRE = [(bx0+bx1)/2, 0, (bz0+bz1)/2];
  var TAILLE = Math.max(bx1-bx0, bz1-bz0, hmax);
  var RAYON = .74*Math.max(bx1-bx0, bz1-bz0);
  var loggiaFin = 0;
  faces.forEach(function(f){
    f.lines.forEach(function(l){ loggiaFin = Math.max(loggiaFin, l.d + l.t) });
    f.quads.forEach(function(q){ loggiaFin = Math.max(loggiaFin, q.d + q.t) });
  });

  // ---------- Caméra en orbite ----------
  var angleTest = (location.search.match(/[?&]angle=(-?\d+)/) || [])[1];   // ?angle=90 : vue figée pour les tests
  var R = 2.9*TAILLE, EH = 6, TH0 = angleTest != null ? +angleTest*Math.PI/180 : BAT.th0;
  var LUM = norm([.8, 0, -.6]);
  var cam = {};
  function camera(th){
    cam.eye = [CENTRE[0] + R*Math.sin(th), EH, CENTRE[2] - R*Math.cos(th)];
    cam.fw = norm([CENTRE[0]-cam.eye[0], 0, CENTRE[2]-cam.eye[2]]);
    cam.rt = [cam.fw[2], 0, -cam.fw[0]];
  }
  var MIROIR = false;   // vrai pendant le dessin du reflet : la maquette est retournée sous le sol
  function proj(p){
    var dx = p[0]-cam.eye[0], dz = p[2]-cam.eye[2];
    var z = dx*cam.fw[0] + dz*cam.fw[2];
    return [(dx*cam.rt[0] + dz*cam.rt[2])/z, -((MIROIR ? -p[1] : p[1])-EH)/z];
  }

  // Cadrage valable pour tous les angles : le bâtiment ne sort jamais du cadre
  var ext = {x:0, y0:1e9, y1:-1e9};
  (function(){
    var pts = [];
    faces.forEach(function(f){ pts.push(f.P(0,0), f.P(0,f.H), f.P(f.W,0), f.P(f.W,f.H)) });
    for (var i=0;i<72;i++){
      camera(i/72*Math.PI*2);
      pts.forEach(function(p){ var q = proj(p); ext.x = Math.max(ext.x, Math.abs(q[0])); ext.y0 = Math.min(ext.y0, q[1]); ext.y1 = Math.max(ext.y1, q[1]); });
    }
  })();

  var W = 0, H = 0, dpr = 1, S = 1, CX = 0, CY = 0;
  var rcv = document.createElement("canvas"), rctx = rcv.getContext("2d"), principal = ctx;   // reflet au sol
  var RECUL = .8;                           // < 1 : caméra plus éloignée, bâtiment plus petit dans le cadre
  function taille(){
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    rcv.width = cv.width; rcv.height = cv.height;
    S = RECUL * Math.min(W*.94/(2*ext.x), H*.94/(ext.y1-ext.y0));
    CX = W/2; CY = H/2 - S*(ext.y0+ext.y1)/2;
  }
  function ecran(p){ var q = proj(p); return [CX + S*q[0], CY + S*q[1]] }

  var COUL = {"":"236,232,224", f:"236,232,224", v:"170,192,214", vf:"170,192,214"};
  var ALPHA = {"":.62, f:.2, v:.5, vf:.16};
  var OSS = {s:.6, sf:.32};

  function dessiner(T, th){
    camera(th);

    // reflet : la maquette retournée, dessinée à part puis fondue vers le bas
    ctx = rctx; MIROIR = true;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,rcv.width,rcv.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 1; ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    maquette(T);
    MIROIR = false;
    var y0 = ecran(CENTRE)[1], y1 = Math.min(H - 2, ecran([CENTRE[0], -.32*hmax, CENTRE[2]])[1]);
    if (y1 > y0 + 4){
      var fondu = ctx.createLinearGradient(0, y0, 0, y1);
      fondu.addColorStop(0, "rgba(0,0,0,1)"); fondu.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalCompositeOperation = "destination-in";
      ctx.fillStyle = fondu; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
    }
    ctx = principal;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#050505"; ctx.fillRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.lineCap = "butt"; ctx.lineJoin = "miter";
    if (y1 > y0 + 4){
      ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = .2;
      ctx.drawImage(rcv, 0, 0);
      ctx.globalAlpha = 1; ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    // ligne de sol : cercle d'implantation
    var ps = ease(clamp((T-.1)/2.4));
    if (ps > 0){
      ctx.beginPath();
      for (var i=0;i<=96*ps;i++){
        var an = TH0 - Math.PI/2 + i/96*Math.PI*2;
        var e = ecran([CENTRE[0] + RAYON*Math.cos(an), 0, CENTRE[2] + RAYON*Math.sin(an)]);
        i ? ctx.lineTo(e[0],e[1]) : ctx.moveTo(e[0],e[1]);
      }
      ctx.strokeStyle = "rgba(236,232,224,.13)"; ctx.stroke();
    }

    trame(T);
    maquette(T);
    cotesDessin(T);
  }

  function maquette(T){
    // ossature en or, dessinée sous les façades qui la recouvrent en montant
    for (var oc in OSS){
      ctx.beginPath(); var no = 0;
      for (var oi=0;oi<ossature.length;oi++){
        var ol = ossature[oi]; if (ol.c !== oc) continue;
        var op = ease(clamp((T - ol.d)/ol.t)); if (op <= 0) continue;
        var ob = [ol.a[0]+(ol.b[0]-ol.a[0])*op, ol.a[1]+(ol.b[1]-ol.a[1])*op, ol.a[2]+(ol.b[2]-ol.a[2])*op];
        var oe0 = ecran(ol.a), oe1 = ecran(ob);
        ctx.moveTo(oe0[0],oe0[1]); ctx.lineTo(oe1[0],oe1[1]); no++;
      }
      if (no){ ctx.strokeStyle = "rgba(214,168,92," + OSS[oc] + ")"; ctx.stroke(); }
    }

    grueDessin(T);

    // faces visibles, de la plus lointaine à la plus proche
    var vis = [];
    for (var k=0;k<faces.length;k++){
      var f = faces[k];
      var vx = cam.eye[0]-f.c[0], vz = cam.eye[2]-f.c[2];
      if (f.n[0]*vx + f.n[2]*vz <= 0) continue;
      f.z = (f.c[0]-cam.eye[0])*cam.fw[0] + (f.c[2]-cam.eye[2])*cam.fw[2];
      vis.push(f);
    }
    vis.sort(function(a,b){ return b.z - a.z });

    for (var m=0;m<vis.length;m++){
      var f = vis[m];
      // la façade ne masque l'ossature qu'à mesure qu'elle monte
      var hf = f.monte ? f.H*ease(clamp((T - f.dep)/f.monte)) : f.H;
      var c0 = ecran(f.P(0,0)), c1 = ecran(f.P(f.W,0)), c2 = ecran(f.P(f.W,hf)), c3 = ecran(f.P(0,hf)), ch = ecran(f.P(0,f.H));
      ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.lineTo(c1[0],c1[1]); ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.closePath();
      // pendant la montée, la façade reste translucide : l'ossature se devine derrière, puis la façade se ferme
      if (hf > .01){
        ctx.globalAlpha = f.monte ? .45 + .55*ease(clamp((T - f.dep - f.monte + .4)/1.8)) : 1;
        ctx.fillStyle = "#050505"; ctx.fill(); ctx.globalAlpha = 1;
      }

      var lam = Math.max(0, f.n[0]*LUM[0] + f.n[2]*LUM[2]);
      var eclat = .72 + .4*lam;

      if (f.glass){
        var ap = ease(clamp((T - f.dep - 3.2)/2.4));
        if (ap > 0 && hf > .01){
          var vv = norm([cam.eye[0]-f.c[0], 0, cam.eye[2]-f.c[2]]);
          var hv = norm([LUM[0]+vv[0], 0, LUM[2]+vv[2]]);
          var spec = Math.pow(Math.max(0, f.n[0]*hv[0] + f.n[2]*hv[2]), 10);
          var g = ctx.createLinearGradient(0, ch[1], 0, c0[1]);
          g.addColorStop(0, "rgba(200,216,232," + ((.05 + .2*spec)*ap).toFixed(3) + ")");
          g.addColorStop(1, "rgba(159,182,204," + ((.01 + .04*spec)*ap).toFixed(3) + ")");
          ctx.fillStyle = g; ctx.fill();
        }
      }

      for (var qi=0;qi<f.quads.length;qi++){
        var q = f.quads[qi];
        var a = clamp((T - q.d)/q.t) * q.cur;
        if (a < .01) continue;
        var p0 = ecran(q.p[0]), p1 = ecran(q.p[1]), p2 = ecran(q.p[2]), p3 = ecran(q.p[3]);
        ctx.globalAlpha = a*(.8 + .25*lam);
        ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.closePath();
        ctx.fillStyle = "#D6A85C"; ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (var cls in COUL){
        ctx.beginPath(); var n = 0;
        for (var li=0;li<f.lines.length;li++){
          var l = f.lines[li]; if (l.c !== cls) continue;
          var p = ease(clamp((T - l.d)/l.t)); if (p <= 0) continue;
          var b = [l.a[0]+(l.b[0]-l.a[0])*p, l.a[1]+(l.b[1]-l.a[1])*p, l.a[2]+(l.b[2]-l.a[2])*p];
          var e0 = ecran(l.a), e1 = ecran(b);
          ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]); n++;
        }
        if (n){ ctx.strokeStyle = "rgba(" + COUL[cls] + "," + Math.min(1, ALPHA[cls]*eclat).toFixed(3) + ")"; ctx.stroke(); }
      }
    }

    // feux de balisage : un bref éclat rouge, ensemble, une fois la tour achevée ;
    // l'angle le plus éloigné, caché derrière la tour, reste éteint
    if (T > loggiaFin){
      var cyc = ((T - loggiaFin) % 1.6)/1.6, fl = cyc < .3 ? Math.sin(cyc/.3*Math.PI) : 0;
      if (fl > .01){
        var loin = 0, dmax = -1;
        feux.forEach(function(p, i){
          var d = (p[0]-cam.eye[0])*(p[0]-cam.eye[0]) + (p[2]-cam.eye[2])*(p[2]-cam.eye[2]);
          if (d > dmax){ dmax = d; loin = i; }
        });
        feux.forEach(function(p, i){
          if (i === loin) return;
          var e = ecran(p), r = 7;
          var g = ctx.createRadialGradient(e[0],e[1],0, e[0],e[1],r);
          g.addColorStop(0, "rgba(255,90,70," + fl.toFixed(3) + ")");
          g.addColorStop(.3, "rgba(230,40,30," + (.6*fl).toFixed(3) + ")");
          g.addColorStop(1, "rgba(230,40,30,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e[0], e[1], r, 0, Math.PI*2); ctx.fill();
        });
      }
    }
  }

  // ---------- Chantier : grue, trame d'axes, cotes de niveau ----------
  function segs(liste, rgb, a){
    if (a <= .005 || !liste.length) return;
    ctx.beginPath();
    liste.forEach(function(sg){ var e0 = ecran(sg[0]), e1 = ecran(sg[1]); ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]); });
    ctx.strokeStyle = "rgba(" + rgb + "," + a.toFixed(3) + ")"; ctx.stroke();
  }
  function grueDessin(T){
    if (!grue) return;
    var a = ease(clamp((T - grue.debut + .3)/.8)) * (1 - ease(clamp((T - loggiaFin + 1)/2.5)));
    if (a <= .005) return;
    var monte = clamp((T - grue.debut)/grue.duree)*grue.haut;
    var h = Math.min(grue.max, Math.max(10, monte + 6));
    var x = grue.x, z = grue.z, c = 1, L = [];
    // fût en treillis
    [[-c,-c],[c,-c],[c,c],[-c,c]].forEach(function(p){ L.push([[x+p[0],0,z+p[1]], [x+p[0],h,z+p[1]]]) });
    for (var y=0, k=0; y+3<=h; y+=3, k++){
      var b = k%2 ? -c : c;
      L.push([[x-c,y,z-c],[x+c,y+3,z-c]], [[x+c,y,z+c],[x-c,y+3,z+c]], [[x-c,y,z+c*b],[x-c,y+3,z-c*b]], [[x+c,y,z-c*b],[x+c,y+3,z+c*b]]);
    }
    // flèche et contre-flèche, qui pivotent lentement
    var ang = grue.vise + .55*Math.sin(T*.35), ux = Math.cos(ang), uz = Math.sin(ang), px = -uz*.7, pz = ux*.7;
    var LF = 30, LC = 9;
    function pt(d, dy, lat){ return [x + ux*d + px*lat, h + dy, z + uz*d + pz*lat] }
    L.push([pt(-LC,0,-1), pt(LF,0,-1)], [pt(-LC,0,1), pt(LF,0,1)], [pt(0,1.4,0), pt(LF,0,0)]);
    for (var d=0; d<LF; d+=2.5) L.push([pt(d,0,-1), pt(d+1.25,1.4*(1-(d+1.25)/LF),0)], [pt(d+1.25,1.4*(1-(d+1.25)/LF),0), pt(d+2.5,0,1)]);
    // mât de tête, tirants, lest
    L.push([pt(0,0,0), pt(0,6,0)], [pt(0,6,0), pt(LF*.65,0,0)], [pt(0,6,0), pt(-LC,0,0)]);
    L.push([pt(-LC,0,-1), pt(-LC,-2,-1)], [pt(-LC,0,1), pt(-LC,-2,1)], [pt(-LC,-2,-1), pt(-LC,-2,1)], [pt(-LC+2,-2,-1), pt(-LC+2,-2,1)], [pt(-LC,-2,-1), pt(-LC+2,-2,-1)], [pt(-LC,-2,1), pt(-LC+2,-2,1)]);
    // chariot et câble
    var ch = 12 + 10*(.5 + .5*Math.sin(T*.5));
    L.push([pt(ch,0,0), pt(ch,-9,0)], [pt(ch-.8,-9,0), pt(ch+.8,-9,0)]);
    segs(L, "236,232,224", .32*a);
  }

  // trame d'axes au sol, tracée en tout premier, qui s'efface une fois le bâtiment achevé
  var AXES_X = [.6,8,16,24,32,40.6,48,55,62,69.4], AXES_Z = [.6,7,14,21,28,35,41.4,47.5];
  function trame(T){
    var fin = 1 - ease(clamp((T - DEBUT_ROT)/2));
    if (fin <= 0) return;
    ctx.save();
    ctx.setLineDash([5,4]);
    var tous = [];
    AXES_X.forEach(function(v, i){ tous.push({a:[v,0,-7], b:[v,0,55], nom:String(i+1), d:.1 + i*.04}) });
    AXES_Z.forEach(function(v, i){ tous.push({a:[-7,0,v], b:[77,0,v], nom:"ABCDEFGH".charAt(i), d:.25 + i*.04}) });
    ctx.font = "9px 'IBM Plex Mono', ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    tous.forEach(function(ax){
      var p = ease(clamp((T - ax.d)/.8)); if (p <= 0) return;
      var a = .26*fin*Math.min(1, p*2);
      var e0 = ecran(ax.a), e1 = ecran([ax.a[0]+(ax.b[0]-ax.a[0])*p, 0, ax.a[2]+(ax.b[2]-ax.a[2])*p]);
      ctx.beginPath(); ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]);
      ctx.strokeStyle = "rgba(214,168,92," + a.toFixed(3) + ")"; ctx.stroke();
      // bulle de repère au départ de l'axe
      var ab = clamp((T - ax.d)/.4)*fin;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(e0[0], e0[1], 7, 0, Math.PI*2);
      ctx.fillStyle = "#050505"; ctx.fill();
      ctx.strokeStyle = "rgba(214,168,92," + (.55*ab).toFixed(3) + ")"; ctx.stroke();
      ctx.fillStyle = "rgba(214,168,92," + (.85*ab).toFixed(3) + ")"; ctx.fillText(ax.nom, e0[0], e0[1] + .5);
      ctx.setLineDash([5,4]);
    });
    ctx.restore();
  }

  // cotes de niveau en police mono, à l'angle le plus à droite du socle ou le plus à gauche de la tour
  var ANGLES_SOCLE = [[0,0],[70,0],[70,42],[40,42],[40,14],[0,14]], ANGLES_TOUR = [[6,22],[32,22],[32,48],[6,48]];
  function cotesDessin(T){
    var fin = 1 - ease(clamp((T - DEBUT_ROT)/1.5));
    if (fin <= 0) return;
    ctx.save();
    ctx.font = "10px 'IBM Plex Mono', ui-monospace, monospace"; ctx.textBaseline = "alphabetic";
    cotesNiv.forEach(function(cn){
      var a = ease(clamp((T - cn.t)/.6))*fin; if (a <= .01) return;
      var best = null;
      (cn.tour ? ANGLES_TOUR : ANGLES_SOCLE).forEach(function(c){
        var e = ecran([c[0], cn.y, c[1]]);
        if (!best || (cn.tour ? e[0] < best[0] : e[0] > best[0])) best = e;
      });
      var dir = cn.tour ? -1 : 1, x0 = best[0] + dir*6, x1 = best[0] + dir*52, y = best[1];
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y);
      ctx.strokeStyle = "rgba(214,168,92," + (.45*a).toFixed(3) + ")"; ctx.stroke();
      var cx = x0 + dir*7;
      ctx.beginPath(); ctx.moveTo(cx-3.5, y-6); ctx.lineTo(cx+3.5, y-6); ctx.lineTo(cx, y); ctx.closePath();
      ctx.fillStyle = "rgba(214,168,92," + (.8*a).toFixed(3) + ")"; ctx.fill();
      ctx.textAlign = cn.tour ? "right" : "left";
      ctx.fillText((cn.y ? "+ " : "± ") + cn.y.toFixed(2), x0 + dir*14, y - 3);
    });
    ctx.restore();
  }

  window.addEventListener("resize", taille);
  taille();

  requestAnimationFrame(function(){ requestAnimationFrame(function(){ page.classList.add("go"); }); });

  // ---------- Animation : construction, puis rotation lente ----------
  var parTour = +(location.search.match(/[?&]tour=(\d+)/) || [])[1] || 60;
  var VITESSE = angleTest != null ? 0 : Math.PI*2/parTour;   // un tour en 75 s (?tour=N pour tester)
  var DEBUT_ROT = loggiaFin - 1.5;
  var t0 = null, prec = 0, th = TH0, omega = 0, prochaine = DEBUT_ROT + 1;
  var glisse = false, gx = 0, gt = 0, gv = 0;
  var incl = 0, inclL = 0;

  function frame(now){
    if (t0 === null) t0 = now;
    var T = (now - t0)/1000, dt = Math.min(.05, T - prec); prec = T;

    if (!glisse){
      var cible = T > DEBUT_ROT ? VITESSE : 0;
      omega += (cible - omega) * Math.min(1, dt*(T - DEBUT_ROT < 6 ? .35 : 1.2));
      th += omega*dt;
    }

    // après la construction, les loggias s'allument et s'éteignent ; au fil des tours, le crépuscule
    // en allume davantage (jusqu'à deux sur trois), puis le nombre revient doucement à la normale
    if (T > prochaine){
      prochaine = T + .3;
      var nuit = .5 - .5*Math.cos((T - DEBUT_ROT)/90*Math.PI*2);
      var q = loggias[Math.floor(Math.random()*loggias.length)];
      q.o = Math.random() < .34 + .32*nuit ? .45 + Math.random()*.4 : .02 + Math.random()*.03;
    }
    if (T > DEBUT_ROT) for (var i=0;i<loggias.length;i++){
      var lq = loggias[i], d = lq.o - lq.cur, pas = dt/2.8;
      lq.cur = Math.abs(d) <= pas ? lq.o : lq.cur + Math.sign(d)*pas;
    }

    inclL += (incl - inclL) * Math.min(1, dt*4);
    dessiner(T, th + inclL);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Sur téléphone, pencher l'appareil à gauche ou à droite fait pivoter un peu la vue
  window.addEventListener("deviceorientation", function(e){
    if (e.gamma == null) return;
    incl = Math.max(-25, Math.min(25, e.gamma)) * Math.PI/180 * 1.2;
  });
  // Sur ordinateur, la souris fait pivoter un peu la vue selon sa position dans la fenêtre
  window.addEventListener("pointermove", function(e){
    if (e.pointerType !== "mouse" || glisse) return;
    incl = (e.clientX/Math.max(1, window.innerWidth) - .5) * .6;
  });
  document.addEventListener("mouseleave", function(){ incl = 0; });
  // iPhone : Safari n'envoie l'inclinaison qu'après une autorisation demandée lors d'un toucher
  // (« touchend » ou « click », pas « pointerdown »), n'importe où sur la page
  var permis = false;
  function demanderInclinaison(){
    if (permis || !window.DeviceOrientationEvent || typeof DeviceOrientationEvent.requestPermission !== "function") return;
    permis = true;
    DeviceOrientationEvent.requestPermission().then(function(r){ if (r !== "granted") permis = false; }).catch(function(){ permis = false; });
  }
  document.addEventListener("touchend", demanderInclinaison);
  document.addEventListener("click", demanderInclinaison);

  // On peut aussi faire tourner le bâtiment à la main, puis il reprend sa course
  cv.addEventListener("pointerdown", function(e){
    glisse = true; gx = e.clientX; gt = performance.now(); gv = 0;
    cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", function(e){
    if (!glisse) return;
    var now = performance.now(), dth = -(e.clientX - gx) * 3.2 / Math.max(W, 320);
    th += dth; gv = dth / Math.max(.008, (now - gt)/1000);
    gx = e.clientX; gt = now;
  });
  function relacher(){
    if (!glisse) return;
    glisse = false; cv.classList.remove("drag");
    omega = Math.max(-2.5, Math.min(2.5, gv));
  }
  cv.addEventListener("pointerup", relacher);
  cv.addEventListener("pointercancel", relacher);
})();
