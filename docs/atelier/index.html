<style>
/* Habillage inspiré de Windows 11 (Fluent), le même que /fgh/, /ifc/ et /dxf/ */
:root{
  color-scheme:dark;
  --accent:#60CDFF;
  --sur-accent:#000;
  --barre:rgba(32,32,32,.82);
  --tuile:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  --tuile-bord:rgba(255,255,255,.18);
  --panneau:rgba(40,40,40,.9);
  --fenetre:#272C32;
  --controle:rgba(255,255,255,.061);
  --controle-survol:rgba(255,255,255,.084);
  --ligne:rgba(255,255,255,.083);
  --texte:#FFFFFF;
  --texte-doux:rgba(255,255,255,.786);
  --texte-faible:rgba(255,255,255,.545);
  --ombre:0 32px 64px rgba(0,0,0,.37),0 2px 21px rgba(0,0,0,.37),0 0 0 1px rgba(0,0,0,.3);
  --selection:rgba(255,255,255,.12);
  --selection-bord:rgba(255,255,255,.2);
  --fond-1:#0B1A33;
  --fond-2:#1D4E89;
  --fond-3:#5FA8E8;
  --fil:255,255,255;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Inter Tight",sans-serif;
  --titre:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Inter Tight",sans-serif;
}
:root[data-theme="clair"]{
  color-scheme:light;
  --accent:#005FB8;
  --sur-accent:#FFF;
  --barre:rgba(243,243,243,.85);
  --tuile:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,.7));
  --tuile-bord:rgba(0,0,0,.08);
  --panneau:rgba(243,243,243,.92);
  --fenetre:#F1F2F3;
  --controle:rgba(0,0,0,.035);
  --controle-survol:rgba(0,0,0,.06);
  --ligne:rgba(0,0,0,.0803);
  --texte:#1B1B1B;
  --texte-doux:rgba(0,0,0,.62);
  --texte-faible:rgba(0,0,0,.45);
  --ombre:0 32px 64px rgba(0,0,0,.19),0 2px 21px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.06);
  --selection:rgba(255,255,255,.35);
  --selection-bord:rgba(255,255,255,.6);
  --fond-1:#A9C8EE;
  --fond-2:#D8E7F8;
  --fond-3:#FFFFFF;
  --fil:0,40,90;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--sans);font-size:14px;line-height:20px;color:var(--texte);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 60% at 62% 58%,var(--fond-3) 0%,var(--fond-2) 38%,var(--fond-1) 100%) fixed;background-color:var(--fond-1)}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* ---------- Fond d'écran : ossature filaire qui respire ---------- */
#fond{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- Icônes du bureau ---------- */
.bureau{position:fixed;inset:0 0 48px 0;padding:12px 8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,104px);grid-auto-columns:92px;gap:4px;align-content:start}
.icone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 4px;border:1px solid transparent;border-radius:4px;color:#fff;text-align:center;cursor:default;outline:none;
  text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.35);font-size:12px;line-height:16px;opacity:0;transform:translateY(6px);animation:apparait .45s cubic-bezier(.1,.9,.2,1) forwards}
.icone:nth-child(2){animation-delay:.07s}.icone:nth-child(3){animation-delay:.14s}.icone:nth-child(4){animation-delay:.21s}.icone:nth-child(5){animation-delay:.28s}
@keyframes apparait{to{opacity:1;transform:none}}
.icone .tuile{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;background:var(--tuile);border:1px solid var(--tuile-bord);box-shadow:0 4px 12px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.icone:hover .tuile{transform:scale(1.06)}
.icone svg{width:42px;height:42px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.icone:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
.icone.choisie,.icone:focus-visible{background:var(--selection);border-color:var(--selection-bord)}
:root[data-theme="clair"] .icone{color:#1B1B1B;text-shadow:0 0 6px rgba(255,255,255,.9)}

/* ---------- Infobulle ---------- */
.bulle{position:fixed;z-index:30;max-width:280px;padding:6px 9px;border-radius:4px;background:var(--panneau);color:var(--texte);border:1px solid var(--ligne);box-shadow:0 4px 8px rgba(0,0,0,.2);font-size:12px;line-height:16px;pointer-events:none;
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}

/* ---------- Barre des tâches ---------- */
.barre{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--barre);border-top:1px solid var(--ligne);
  -webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4);padding-bottom:env(safe-area-inset-bottom)}
/* Dock façon iOS : les icônes grossissent sous le pointeur, leurs voisines un peu moins.
   Tout passe par transform (--s grossit, --dx écarte les voisines, --p enfonce au clic) : aucune remise en page. */
.barre{overflow:visible}
.barre .centre{display:flex;gap:8px;align-items:flex-end;height:40px;padding:0 8px}
.tache{--s:1;--dx:0px;--p:1;position:relative;flex:none;width:36px;height:36px;border:1px solid var(--tuile-bord);border-radius:9px;
  background:var(--tuile);box-shadow:0 2px 8px rgba(0,0,0,.22);display:grid;place-items:center;cursor:default;padding:0;
  transform:translateX(var(--dx)) scale(calc(var(--s) * var(--p)));transform-origin:50% 100%;transition:transform .14s ease-out;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tache svg{width:72%;height:72%}
.tache:active{--p:.9}
/* le point et l'étiquette ne grossissent pas avec l'icône */
.tache::after{transform:scale(calc(1 / var(--s)));transform-origin:50% 100%}
.tache[aria-expanded="true"]::after{content:"";position:absolute;bottom:calc(-5px / var(--s));left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--texte-doux)}
.tache .etiquette{position:absolute;bottom:calc(100% + 10px / var(--s));left:50%;translate:-50% 4px;scale:calc(1 / var(--s));transform-origin:50% 100%;white-space:nowrap;padding:4px 10px;border-radius:8px;
  background:var(--fenetre);border:1px solid var(--ligne);box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:12px;line-height:16px;opacity:0;pointer-events:none;transition:opacity .15s,translate .15s}
.tache:hover .etiquette{opacity:1;translate:-50% 0}
.demarrer-ico{background:linear-gradient(160deg,#E7BE77,#A9782E)!important;border-color:rgba(255,255,255,.25)!important}
.droite{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.zone{height:40px;padding:0 8px;border:0;border-radius:4px;background:transparent;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:12px;line-height:16px;cursor:default}
.zone:hover{background:var(--controle-survol)}
.zone.theme{flex-direction:row;align-items:center;width:40px;justify-content:center}
.zone.theme svg{width:16px;height:16px}
.gauche{position:absolute;left:12px;top:0;bottom:0;display:flex;align-items:center;gap:10px;font-size:12px;line-height:16px;color:var(--texte-doux)}
.gauche b{font-family:var(--titre);font-weight:600;color:var(--texte)}

/* ---------- Menu Démarrer ---------- */
.demarrer{position:fixed;left:50%;bottom:58px;z-index:25;width:min(640px,calc(100vw - 16px));border-radius:8px;background:var(--panneau);border:1px solid var(--ligne);box-shadow:var(--ombre);
  -webkit-backdrop-filter:blur(60px) saturate(1.5);backdrop-filter:blur(60px) saturate(1.5);transform:translate(-50%,0);transition:transform .2s cubic-bezier(.1,.9,.2,1),opacity .15s;overflow:hidden}
.demarrer.ferme{transform:translate(-50%,24px);opacity:0;pointer-events:none}
.demarrer .corps{padding:28px 32px 16px}
.demarrer h2{margin:0 0 12px;font:600 14px/20px var(--titre)}
.epingles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.epingle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:4px;text-align:center;font-size:12px;line-height:16px}
.epingle:hover,.epingle:focus-visible{background:var(--controle-survol);outline:none}
.epingle svg{width:36px;height:36px}
.epingle small{color:var(--texte-faible);font-size:11px}
.demarrer .pied{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;border-top:1px solid var(--ligne);background:var(--controle)}
.profil{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--sur-accent);font:600 12px/1 var(--titre)}
.profil small a.raccourci{text-decoration:underline;text-underline-offset:2px}
.profil small a.raccourci:hover{color:var(--accent)}
.profil small{display:block;color:var(--texte-faible);font-size:11px;line-height:14px}
.pied .ver{color:var(--texte-faible);font-size:12px}

/* ---------- Écran d'identification : le bureau n'apparaît qu'une fois connecté ---------- */
.verrou{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:24px}
:root[data-verrou] .verrou{display:grid}
:root[data-verrou] .bureau,:root[data-verrou] .barre,:root[data-verrou] .fenetres,:root[data-verrou] .demarrer,:root[data-verrou] .bulle{visibility:hidden}
:root[data-verrou] .icone{animation:none}   /* les icônes rejouent leur arrivée à la connexion */
.verrou form{width:min(300px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.verrou .portrait{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#E7BE77,#A9782E);border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.verrou .portrait svg{width:54px;height:54px}
.verrou h1{margin:6px 0 10px;font:600 22px/28px var(--titre)}
.verrou .champ{width:100%;height:36px;padding:0 11px;border:1px solid var(--ligne);border-bottom-color:var(--texte-faible);border-radius:4px;background:var(--fenetre);color:var(--texte);font:inherit;outline:none;user-select:text;-webkit-user-select:text}
.verrou .champ::placeholder{color:var(--texte-faible)}
.verrou .champ:focus{border-bottom:2px solid var(--accent)}
.verrou .mdp{position:relative;width:100%}
.verrou .mdp .champ{padding-right:40px}
.verrou .entrer{position:absolute;right:2px;top:2px;width:32px;height:32px;padding:0;border:0;border-radius:3px;background:transparent;display:grid;place-items:center;cursor:pointer}
.verrou .entrer:hover,.verrou .entrer:focus-visible{background:var(--controle-survol);outline:none}
.verrou .entrer svg{width:14px;height:14px}
.verrou .dit{min-height:32px;margin:0;font-size:12px;line-height:16px}
.verrou a{font-size:12px;line-height:16px;color:var(--texte-doux);text-decoration:underline;text-underline-offset:2px}
.verrou a:hover{color:var(--accent)}

/* ---------- Extinction ---------- */
.zone.eteindre:hover{background:#C42B1C;color:#fff}
.eteint{position:fixed;inset:0;z-index:100;background:#000;color:rgba(255,255,255,.75);display:grid;place-items:center;text-align:center;opacity:0;transition:opacity .9s;pointer-events:none}
.eteint.on{opacity:1;pointer-events:auto}
.eteint p{margin:0 0 18px;font:300 15px/22px var(--titre);transition:opacity .6s}
.eteint .actions{display:flex;gap:10px;justify-content:center;opacity:0;transition:opacity .6s .6s}
.eteint.fini .actions{opacity:1}
.eteint button,.eteint a{padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:13px;cursor:pointer}
.eteint button:hover,.eteint a:hover{background:rgba(255,255,255,.16)}
.pied .boutons{display:flex;align-items:center;gap:10px}
.pied .alim{width:32px;height:32px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;cursor:default}
.pied .alim:hover{background:var(--controle-survol)}
.pied .alim svg,.zone.eteindre svg,.zone.plein svg{width:16px;height:16px}

/* ---------- Fenêtres des outils (fond opaque, sans flou : le flou d'une grande surface coûte cher à la carte graphique) ---------- */
.fenetres{position:fixed;inset:0 0 48px 0;z-index:10;pointer-events:none}
.fenetre{position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:220px;border-radius:12px;overflow:hidden;pointer-events:auto;
  background:var(--fenetre);border:1px solid var(--ligne);box-shadow:var(--ombre);
  transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1)}
.fenetre.neuve{opacity:0;transform:scale(.94)}
.fenetre.reduite{opacity:0;transform:translateY(40%) scale(.3);pointer-events:none}
.fenetre.agrandie{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.fenetre:not(.active){box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.2)}
.fenetre:not(.active) .titre{opacity:.6}
.titre{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px;line-height:16px;touch-action:none;cursor:default}
.titre svg{width:18px;height:18px;flex:none}
.titre .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titre button,.titre a{flex:none;width:44px;height:36px;border:0;background:transparent;display:grid;place-items:center;color:var(--texte)}
.titre button:hover,.titre a:hover{background:var(--controle-survol)}
.titre .fermer:hover{background:#C42B1C;color:#fff}
.titre button svg,.titre a svg{width:10px;height:10px}
.fenetre iframe{flex:1;width:100%;border:0;background:#fff}
.fenetre.bouge iframe,.fenetres.bouge iframe{pointer-events:none}
.poignee{position:absolute;z-index:2}
.poignee.d{top:36px;right:0;bottom:8px;width:6px;cursor:ew-resize}
.poignee.b{left:0;right:8px;bottom:0;height:6px;cursor:ns-resize}
.poignee.g{top:36px;left:0;bottom:8px;width:6px;cursor:ew-resize}
.poignee.db{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.fenetre.agrandie .poignee{display:none}
.tache.ouverte::after{content:"";position:absolute;bottom:calc(-6px / var(--s));left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--texte-doux)}
.tache.devant::after{background:var(--accent);width:14px;margin-left:-7px;border-radius:3px}

@media (max-width:640px){
  .bureau{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,92px);grid-template-rows:none;grid-auto-rows:104px;justify-content:center;padding-top:24px}
  .gauche .long,.zone.horloge .date{display:none}
  .demarrer .corps{padding:20px 16px 12px}
  .demarrer .pied{padding:12px 16px}
}
</style>
</head>
<body>

<canvas id="fond" aria-hidden="true"></canvas>

<main class="bureau" id="bureau" aria-label="Bureau"></main>

<div class="demarrer ferme" id="demarrer" role="dialog" aria-label="Démarrer" aria-hidden="true">
  <div class="corps">
    <h2>Épinglé</h2>
    <div class="epingles" id="epingles"></div>
  </div>
  <div class="pied">
    <div class="profil"><span class="avatar" id="avatar">TV</span><div><span id="profil-nom">Tony VARIN</span><small>STR BIM Tools · <a class="raccourci" href="/atelier/Creer-raccourci-Atelier-STR.cmd" download title="Fichier à lancer une fois : crée sur le bureau Windows un raccourci qui ouvre l'atelier en plein écran">Raccourci Windows</a></small></div></div>
    <div class="boutons"><span class="ver" id="ver-menu"></span><button class="alim" id="btn-deconnexion" title="Se déconnecter"></button><button class="alim" id="btn-alim" title="Éteindre l'atelier"></button></div>
  </div>
</div>

<div class="fenetres" id="fenetres"></div>

<nav class="barre" aria-label="Barre des tâches">
  <div class="gauche"><b id="nom-barre">Atelier STR</b><span class="long">STR BIM Tools · Tony VARIN</span><span id="version"></span></div>
  <div class="centre" id="taches">
    <button class="tache demarrer-ico" id="btn-demarrer" aria-expanded="false" aria-controls="demarrer" aria-label="Tous les outils">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9l8-5 8 5v12M4 15h16M12 4v17" fill="none" stroke="#1B1406" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="etiquette">Tous les outils</span>
    </button>
  </div>
  <div class="droite">
    <button class="zone theme" id="btn-theme" title="Thème clair ou sombre"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    <button class="zone theme plein" id="btn-plein" title="Plein écran (F11)"></button>
    <button class="zone theme eteindre" id="btn-eteindre" title="Éteindre l'atelier"></button>
    <div class="zone horloge" aria-live="off"><span id="heure"></span><span class="date" id="date"></span></div>
  </div>
</nav>

<div class="bulle" id="bulle" hidden></div>

<div class="verrou" id="verrou" role="dialog" aria-label="Connexion à l'atelier">
  <form id="verrou-form" novalidate>
    <span class="portrait"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9l8-5 8 5v12M4 15h16M12 4v17" fill="none" stroke="#1B1406" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    <h1>Atelier STR</h1>
    <input class="champ" id="verrou-email" type="email" placeholder="Adresse" aria-label="Adresse de courriel" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
    <span class="mdp"><input class="champ" id="verrou-mdp" type="password" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password" required>
      <button class="entrer" type="submit" title="Se connecter" aria-label="Se connecter"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
    <p class="dit" id="verrou-dit" role="status"></p>
    <a href="/planif/connexion/">Premier accès ou mot de passe oublié</a>
  </form>
</div>

<div class="eteint" id="eteint" hidden>
  <div><p id="eteint-texte">Arrêt de l'atelier…</p>
  <div class="actions"><button id="btn-rallumer">Rallumer l'atelier</button><a href="/">str-bim-tools.com</a></div></div>
</div>

<script>
(function(){
  "use strict";
  var NOM = "Atelier STR";
  var VERSION = "1.12.0";

  // Icônes Fluent dessinées à la main (aucune bibliothèque)
  var DESSINS = {
    fgh: '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E39B2E"/></linearGradient><linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FD068"/><stop offset="1" stop-color="#0F7B0F"/></linearGradient></defs>' +

  });

  // ---------- Plein écran ----------
  var ICO_PLEIN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
      ICO_SORTIR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 1.5v4h-4M14.5 5.5h-4v-4M10.5 14.5v-4h4M1.5 10.5h4v4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>',
      ICO_ALIM = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.6 3.6a5.5 5.5 0 1 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  var bPlein = $("#btn-plein"), fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function pleinMaj(){
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    bPlein.innerHTML = on ? ICO_SORTIR : ICO_PLEIN;
    bPlein.title = on ? "Quitter le plein écran" : "Plein écran";
  }
  if (!fsOk) bPlein.hidden = true;   // iPhone : pas de plein écran pour une page
  pleinMaj();
  bPlein.addEventListener("click", function(){
    var d = document, r = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
  });
  document.addEventListener("fullscreenchange", pleinMaj);
  document.addEventListener("webkitfullscreenchange", pleinMaj);

  // ---------- Éteindre : ferme les fenêtres, sort du plein écran, puis ferme l'onglet ----------
  // Un navigateur ne laisse fermer par script que l'onglet qu'un script a ouvert : sinon on reste sur un écran noir.
  $("#btn-eteindre").innerHTML = ICO_ALIM; $("#btn-alim").innerHTML = ICO_ALIM;
  var ecran = $("#eteint");
  function eteindre(){
    menu(false);
    Object.keys(FEN).forEach(function(k){ fermer(FEN[k]); });
    ecran.hidden = false; ecran.classList.remove("fini");
    $("#eteint-texte").textContent = "Arrêt de l'atelier…";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ ecran.classList.add("on"); }); });
    setTimeout(function(){
      var d = document;
      if (d.fullscreenElement || d.webkitFullscreenElement) try { (d.exitFullscreen || d.webkitExitFullscreen).call(d); } catch(e){}
      try { window.close(); } catch(e){}
      // toujours là : le navigateur a refusé de fermer l'onglet
      setTimeout(function(){
        $("#eteint-texte").textContent = "L'atelier est éteint. Tu peux fermer cet onglet.";
        ecran.classList.add("fini");
      }, 300);
    }, 1200);
  }
  function rallumer(){
    ecran.classList.remove("on", "fini");
    setTimeout(function(){ ecran.hidden = true; }, 900);
  }
  $("#btn-eteindre").addEventListener("click", eteindre);
  $("#btn-alim").addEventListener("click", eteindre);
  $("#btn-rallumer").addEventListener("click", rallumer);

  // ---------- Identification : comptes et session de la planification (/fgh/acces.js) ----------
  // Se connecter ici ouvre aussi la planification et les outils FGH, se déconnecter les ferme tous.
  var A = window.FghAcces, racine = document.documentElement, vEmail = $("#verrou-email"), vMdp = $("#verrou-mdp"), vDit = $("#verrou-dit"), vOccupe = false;
  var EXPIRE = "Ta session a expiré : reconnecte-toi.";
  function verrouille(){ return racine.hasAttribute("data-verrou"); }
  function profilMaj(){
    var email = (A && A.email()) || "";
    if (!email) return;
    // « t.varin@… » donne « TV »
    var mots = email.split("@")[0].split(/[._-]+/).filter(Boolean);
    $("#avatar").textContent = ((mots[0] || "").charAt(0) + (mots.length > 1 ? mots[mots.length - 1].charAt(0) : (mots[0] || "").charAt(1))).toUpperCase();
    $("#profil-nom").textContent = email;
  }
  function verrouiller(message){
    menu(false);
    Object.keys(FEN).forEach(function(k){ fermer(FEN[k]); });
    racine.setAttribute("data-verrou", "");
    vDit.textContent = message || ""; vMdp.value = "";
    (vEmail.value ? vMdp : vEmail).focus();
  }
  function deverrouiller(){
    racine.removeAttribute("data-verrou");
    vDit.textContent = ""; vMdp.value = "";
    profilMaj();
  }
  // La session rangée dans le navigateur peut avoir été révoquée : la base tranche, sans bloquer l'affichage.
  // Une panne réseau ne verrouille pas.
  function controle(){
    A.fetch(A.URL_BASE + "/auth/v1/user").then(function(r){
      if (r.status === 401 || r.status === 403) verrouiller(EXPIRE);
    }, function(e){ if (e && e.perdue) verrouiller(EXPIRE); });
  }
  try { vEmail.value = localStorage.getItem("atelier.email") || ""; } catch(e){}
  if (!A) vDit.textContent = "Connexion indisponible : recharge la page (Ctrl+F5).";
  else if (A.connecte()){ profilMaj(); controle(); }
  if (verrouille()) (vEmail.value ? vMdp : vEmail).focus();
  $("#verrou-form").addEventListener("submit", function(e){
    e.preventDefault();
    if (!A || vOccupe) return;
    var email = vEmail.value.trim(), mdp = vMdp.value;
    if (!email || !mdp){ vDit.textContent = "Saisis ton adresse et ton mot de passe."; (email ? vMdp : vEmail).focus(); return; }
    vOccupe = true; vDit.textContent = "Connexion…";
    A.connexion(email, mdp).then(function(){
      try { localStorage.setItem("atelier.email", email); } catch(e){}
      deverrouiller();
    }, function(err){
      vDit.textContent = (err && err.message) || "Connexion impossible.";
      vMdp.focus(); vMdp.select();
    }).then(function(){ vOccupe = false; });
  });
  $("#btn-deconnexion").innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 2.5h-4v11h4M10 5l3 3-3 3M13 8H6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  $("#btn-deconnexion").addEventListener("click", function(){
    if (A) A.deconnexion();
    verrouiller("");
  });
  // Connexion ou déconnexion faite dans un autre onglet (planification, outils FGH) : l'atelier suit
  addEventListener("storage", function(e){
    if (!A || (e.key !== null && e.key !== "planif.session")) return;
    if (!A.connecte()){ if (!verrouille()) verrouiller(""); }
    else if (verrouille()) deverrouiller(); else profilMaj();
  });

  // ---------- Thème ----------
  $("#btn-theme").addEventListener("click", function(){
    var r = document.documentElement, c = r.getAttribute("data-theme") === "clair" ? "sombre" : "clair";
    r.setAttribute("data-theme", c);
    try { localStorage.setItem("atelier.theme", c); } catch(e){}
    filMaj();
  });

  // ---------- Horloge ----------
  // Réveil calé sur le changement de minute : l'heure tourne à la seconde près, avec un seul réveil par minute
  var elHeure = $("#heure"), elDate = $("#date");
  function heure(){
    var d = new Date(), z = function(x){ return (x < 10 ? "0" : "") + x; };
    elHeure.textContent = z(d.getHours()) + ":" + z(d.getMinutes());
    elDate.textContent = z(d.getDate()) + "." + z(d.getMonth() + 1) + "." + d.getFullYear();
    return d;
  }
  function horloge(){
    var d = heure();
    setTimeout(horloge, 60050 - (d.getSeconds() * 1000 + d.getMilliseconds()));
  }
  horloge();
  // Onglet resté longtemps en arrière-plan ou poste sorti de veille : remise à l'heure dès le retour
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) heure(); });

  // ---------- Fond d'écran : ossature filaire (poteaux, dalles) qui tourne lentement ----------
  // Le fond passe sous les flous de la barre, des tuiles et des fenêtres : chaque image redessinée les fait
  // recalculer. D'où 20 images par seconde (la rotation fait un tour en 2 min 40 : un demi-pixel par image
  // au plus), l'arrêt complet quand le fond est caché ou que le navigateur n'est pas au premier plan,
  // et un tracé sans rien allouer en mémoire.
  var cv = $("#fond"), ctx = cv.getContext("2d"), L, H, dpr;
  var nx = 4, ny = 3, nz = 5, pasI = ny + 1, pasK = (nx + 1) * (ny + 1), NN = (nz + 1) * pasK;
  var noeuds = new Float32Array(NN * 3), proj = new Float32Array(NN * 3), liens = [], n = 0;
  for (var k = 0; k <= nz; k++) for (var i = 0; i <= nx; i++) for (var j = 0; j <= ny; j++, n++){
    noeuds[n*3] = i - nx/2; noeuds[n*3 + 1] = k - nz/2; noeuds[n*3 + 2] = j - ny/2;
    if (i < nx) liens.push(n, n + pasI);
    if (j < ny) liens.push(n, n + 1);
    if (k < nz) liens.push(n, n + pasK);
  }
  var NS = liens.length / 2, niveau = new Uint8Array(NS), NIV = 16, ang = 0, fil = "255,255,255";
  function trace(){
    var c = Math.cos(ang), s = Math.sin(ang), ech = Math.min(L, H) / 11, cx = L * .62, cy = H * .5, m, q, v;
    for (m = 0; m < NN; m++){
      var x = noeuds[m*3]*c - noeuds[m*3 + 2]*s, z = noeuds[m*3]*s + noeuds[m*3 + 2]*c, f = 7 / (7 + z * .6);
      proj[m*3] = cx + x * ech * f; proj[m*3 + 1] = cy - noeuds[m*3 + 1] * ech * f + z * ech * .28; proj[m*3 + 2] = z;
    }
    // opacité selon la profondeur (0,10 − 0,02 × profondeur), rangée en 16 niveaux : un tracé par niveau
    for (q = 0; q < NS; q++){
      v = Math.round((0.10 - (proj[liens[q*2]*3 + 2] + proj[liens[q*2 + 1]*3 + 2]) * .01) * 100) - 1;
      niveau[q] = v < 0 ? 0 : v >= NIV ? NIV - 1 : v;
    }
    ctx.clearRect(0, 0, L, H);
    ctx.lineWidth = 1;
    for (v = 0; v < NIV; v++){
      var vide = true;
      for (q = 0; q < NS; q++){
        if (niveau[q] !== v) continue;
        if (vide){ ctx.beginPath(); vide = false; }
        var d1 = liens[q*2] * 3, d2 = liens[q*2 + 1] * 3;
        ctx.moveTo(proj[d1], proj[d1 + 1]); ctx.lineTo(proj[d2], proj[d2 + 1]);
      }
      if (!vide){ ctx.strokeStyle = "rgba(" + fil + "," + ((v + 1) / 100).toFixed(2) + ")"; ctx.stroke(); }
    }
  }
  function filMaj(){ fil = getComputedStyle(document.documentElement).getPropertyValue("--fil").trim() || fil; trace(); }
  function taille(){ dpr = Math.min(window.devicePixelRatio || 1, 2); L = innerWidth; H = innerHeight; cv.width = L * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); trace(); }
  taille(); filMaj(); addEventListener("resize", taille);
  // Fond à l'arrêt : navigateur pas au premier plan (un clic dans un outil de l'atelier compte comme premier plan),
  // écran d'extinction, ou une fenêtre agrandie (elle couvre tout le bureau)
  function cache(){
    if (!document.hasFocus()) return true;
    if (!ecran.hidden && ecran.classList.contains("on")) return true;
    for (var id in FEN) if (FEN[id].el.classList.contains("agrandie") && !FEN[id].el.classList.contains("reduite")) return true;
    return false;
  }
  var tDernier = 0;
  function boucle(t){
    if (cache()){ tDernier = 0; setTimeout(function(){ requestAnimationFrame(boucle); }, 400); return; }
    var dt = t - tDernier;
    if (dt >= 45){
      // l'angle n'avance que pendant l'affichage : pas de saut au retour d'une pause
      if (tDernier) ang += Math.min(dt, 100) / 26000;
      tDernier = t; trace();
    }
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
})();
</script>
</body>
