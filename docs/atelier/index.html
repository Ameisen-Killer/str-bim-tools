<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atelier STR · STR Bim Tools</title>
<meta name="description" content="Atelier STR : page de démarrage des outils web STR Bim Tools (validateur de réservations, visionneuse IFC, visionneuse DXF).">
<meta name="theme-color" content="#050505">
<script>(function(){var r=document.documentElement;try{var c=localStorage.getItem("atelier.theme")||"sombre";r.setAttribute("data-theme",c);}catch(e){r.setAttribute("data-theme","sombre");}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M6 26V12l10-6 10 6v14M6 19h20M16 6v20' fill='none' stroke='%23D6A85C' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/polices/polices.css?v=4">
<style>
/* Atelier STR : une table à dessin, à la charte noir et or du site */
:root{
  color-scheme:dark;
  --fond:#050505;
  --encre:236,232,224;
  --texte:#ECE8E0;
  --texte-doux:rgba(236,232,224,.7);
  --texte-faible:rgba(236,232,224,.42);
  --or:#D6A85C;
  --or-rvb:214,168,92;
  --tuile:rgba(236,232,224,.035);
  --tuile-survol:rgba(236,232,224,.07);
  --ligne:rgba(236,232,224,.12);
  --verre:rgba(12,12,12,.78);
  --ombre:0 24px 48px rgba(0,0,0,.55),0 0 0 1px rgba(236,232,224,.08);
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
:root[data-theme="clair"]{
  color-scheme:light;
  --fond:#F2EFE8;
  --encre:28,26,22;
  --texte:#1C1A16;
  --texte-doux:rgba(28,26,22,.7);
  --texte-faible:rgba(28,26,22,.48);
  --or:#9A6B1F;
  --or-rvb:154,107,31;
  --tuile:rgba(255,255,255,.55);
  --tuile-survol:rgba(255,255,255,.9);
  --ligne:rgba(28,26,22,.14);
  --verre:rgba(250,248,243,.82);
  --ombre:0 24px 48px rgba(60,45,20,.18),0 0 0 1px rgba(28,26,22,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--fond);color:var(--texte);font-family:var(--sans);font-weight:300;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* ---------- Fond : quadrillage de calque et ossature filaire ---------- */
#fond{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- En-tête ---------- */
.entete{position:fixed;left:24px;top:20px;z-index:5}
.entete .marque{font:400 11px/14px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.entete h1{margin:4px 0 0;font:200 30px/34px var(--sans);letter-spacing:-.01em}

/* ---------- Icônes ---------- */
.bureau{position:fixed;left:16px;top:92px;bottom:96px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,118px);grid-auto-columns:104px;gap:8px;align-content:start;z-index:4}
.icone{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px 8px;text-align:center;outline:none;cursor:default;
  font:400 11px/14px var(--mono);letter-spacing:.02em;color:var(--texte-doux);opacity:0;transform:translateY(8px);animation:apparait .6s cubic-bezier(.2,.8,.2,1) forwards}
.icone:nth-child(2){animation-delay:.1s}.icone:nth-child(3){animation-delay:.2s}.icone:nth-child(4){animation-delay:.3s}
@keyframes apparait{to{opacity:1;transform:none}}
.icone .tuile{width:60px;height:60px;display:grid;place-items:center;border:1px solid var(--ligne);background:var(--tuile);transition:border-color .2s,background .2s,transform .2s}
.icone svg{width:36px;height:36px;overflow:visible}
.icone:hover .tuile{border-color:rgba(var(--or-rvb),.6);background:var(--tuile-survol);transform:translateY(-2px)}
.icone:hover{color:var(--texte)}
/* sélection : repères de coupe aux quatre coins, comme sur un tirage */
.icone::before,.icone::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s;
  background:
    linear-gradient(var(--or),var(--or)) left top/10px 1px no-repeat,linear-gradient(var(--or),var(--or)) left top/1px 10px no-repeat,
    linear-gradient(var(--or),var(--or)) right top/10px 1px no-repeat,linear-gradient(var(--or),var(--or)) right top/1px 10px no-repeat,
    linear-gradient(var(--or),var(--or)) left bottom/10px 1px no-repeat,linear-gradient(var(--or),var(--or)) left bottom/1px 10px no-repeat,
    linear-gradient(var(--or),var(--or)) right bottom/10px 1px no-repeat,linear-gradient(var(--or),var(--or)) right bottom/1px 10px no-repeat}
.icone.choisie::before,.icone:focus-visible::before{opacity:1}
.icone.choisie{color:var(--texte)}
.icone.choisie .tuile{border-color:var(--or)}

/* dessins au trait : or + encre */
.trait{fill:none;stroke:rgb(var(--encre));stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.trait-or{fill:none;stroke:var(--or);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.aplat{fill:rgba(var(--or-rvb),.16);stroke:none}

/* ---------- Infobulle ---------- */
.bulle{position:fixed;z-index:30;max-width:260px;padding:7px 10px;background:var(--verre);color:var(--texte);border:1px solid rgba(var(--or-rvb),.4);font-size:12px;line-height:16px;pointer-events:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* ---------- Règle d'outils (bas de l'écran) ---------- */
.regle{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;padding:6px;
  background:var(--verre);border:1px solid var(--ligne);box-shadow:var(--ombre);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.regle::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(var(--or-rvb),.55) 0 1px,transparent 1px 8px);opacity:.6}
.outil{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:default;position:relative}
.outil:hover,.outil[aria-expanded="true"]{background:var(--tuile-survol)}
.outil svg{width:26px;height:26px;overflow:visible;transition:transform .12s}
.outil:active svg{transform:scale(.88)}
.sep{width:1px;height:28px;background:var(--ligne);margin:0 6px}
.logo .trait-or{stroke-width:1.6}

/* ---------- Cartouche (bas droite) ---------- */
.cartouche{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;display:grid;grid-template-columns:auto auto;border:1px solid var(--ligne);background:var(--verre);
  font:400 10px/14px var(--mono);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.cartouche > div{padding:5px 10px;border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.cartouche > div:nth-child(2n){border-right:0}
.cartouche > div:nth-last-child(-n+2){border-bottom:0}
.cartouche small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--texte-faible)}
.cartouche .titre{grid-column:1/-1;border-right:0;font:300 15px/20px var(--sans);color:var(--texte)}
.cartouche .titre small{color:var(--or)}
.cartouche b{font-weight:400;color:var(--texte)}

/* ---------- Panneau des outils ---------- */
.panneau{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:25;width:min(560px,calc(100vw - 24px));background:var(--verre);border:1px solid var(--ligne);box-shadow:var(--ombre);
  -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);transform:translate(-50%,0);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.panneau.ferme{transform:translate(-50%,16px);opacity:0;pointer-events:none}
.panneau .tete{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px 10px;border-bottom:1px solid var(--ligne)}
.panneau .tete span{font:400 11px/14px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.panneau .tete small{font:400 11px/14px var(--mono);color:var(--texte-faible)}
.liste{list-style:none;margin:0;padding:8px}
.liste a{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:10px 12px}
.liste a:hover,.liste a:focus-visible{background:var(--tuile-survol);outline:none}
.liste svg{width:30px;height:30px;overflow:visible;justify-self:center}
.liste b{display:block;font-weight:400;font-size:15px}
.liste small{display:block;color:var(--texte-faible);font-size:12px;line-height:16px}
.liste .adr{font:400 11px/14px var(--mono);color:var(--texte-faible)}
.panneau .pied{display:flex;justify-content:space-between;padding:10px 22px 14px;border-top:1px solid var(--ligne);font:400 11px/14px var(--mono);color:var(--texte-faible)}
.panneau .pied b{font-weight:400;color:var(--texte)}

@media (max-width:760px){
  .cartouche{display:none}
  .entete{left:16px}
  .bureau{left:0;right:0;top:96px;grid-auto-flow:row;grid-template-columns:repeat(auto-fill,104px);grid-template-rows:none;grid-auto-rows:118px;justify-content:center}
  .liste .adr{display:none}
}
</style>
</head>
<body>

<canvas id="fond" aria-hidden="true"></canvas>

<header class="entete">
  <div class="marque">STR BIM Tools</div>
  <h1 id="nom">Atelier STR</h1>
</header>

<main class="bureau" id="bureau" aria-label="Outils"></main>

<div class="panneau ferme" id="panneau" role="dialog" aria-label="Outils" aria-hidden="true">
  <div class="tete"><span>Outils</span><small id="compte"></small></div>
  <ul class="liste" id="liste"></ul>
  <div class="pied"><span>STR BIM Tools · <b>Tony VARIN</b></span><span id="ver-panneau"></span></div>
</div>

<nav class="regle" id="regle" aria-label="Règle d'outils">
  <button class="outil logo" id="btn-outils" aria-expanded="false" aria-controls="panneau" title="Tous les outils">
    <svg viewBox="0 0 26 26" aria-hidden="true"><path class="trait-or" d="M4 23V10l9-6 9 6v13M4 16.5h18M13 4v19"/></svg>
  </button>
  <span class="sep"></span>
  <span id="raccourcis" style="display:contents"></span>
  <span class="sep"></span>
  <button class="outil" id="btn-theme" title="Thème clair ou sombre">
    <svg viewBox="0 0 26 26" aria-hidden="true"><circle class="trait" cx="13" cy="13" r="7"/><path d="M13 6a7 7 0 0 1 0 14z" fill="var(--or)"/></svg>
  </button>
</nav>

<aside class="cartouche" aria-label="Cartouche">
  <div class="titre"><small>Atelier</small><span id="nom-cartouche">Atelier STR</span></div>
  <div><small>Auteur</small><b>Tony VARIN</b></div>
  <div><small>Version</small><b id="version"></b></div>
  <div><small>Date</small><b id="date"></b></div>
  <div><small>Heure</small><b id="heure"></b></div>
</aside>

<div class="bulle" id="bulle" hidden></div>

<script>
(function(){
  "use strict";
  var NOM = "Atelier STR";
  var VERSION = "1.2.0";

  // Dessins au trait, dans l'esprit des fils de fer du site (aucune bibliothèque)
  var DESSINS = {
    // réservation : dalle en plan, une ouverture, coche de validation
    fgh: '<svg viewBox="0 0 36 36" aria-hidden="true"><path class="trait" d="M3 10l15-7 15 7-15 7z"/><path class="trait" d="M3 10v4l15 7 15-7v-4"/>' +
         '<path class="aplat" d="M13 10l5-2.3 5 2.3-5 2.3z"/><path class="trait-or" d="M13 10l5-2.3 5 2.3-5 2.3z"/>' +
         '<circle class="trait-or" cx="26" cy="26" r="7"/><path class="trait-or" d="M22.8 26.2l2.2 2.2 4.3-4.6"/></svg>',
    // maquette IFC : cube filaire avec ses arêtes cachées
    ifc: '<svg viewBox="0 0 36 36" aria-hidden="true"><path class="aplat" d="M18 3l13 7.5-13 7.5L5 10.5z"/><path class="trait-or" d="M18 3l13 7.5v15L18 33 5 25.5v-15z"/>' +
         '<path class="trait-or" d="M5 10.5L18 18l13-7.5M18 18v15"/><path class="trait" stroke-dasharray="2 2.4" d="M18 3v15M5 25.5L18 18l13 7.5"/></svg>',
    // plan DXF : feuille, cotation et murs
    dxf: '<svg viewBox="0 0 36 36" aria-hidden="true"><path class="trait" d="M6 3h18l6 6v24H6z"/><path class="trait" d="M24 3v6h6"/>' +
         '<path class="aplat" d="M10 13h16v6H10z"/><path class="trait-or" d="M10 13h16v14H10zM10 19h9M19 13v6"/>' +
         '<path class="trait" d="M10 30.5h16M10 29.3v2.4M26 29.3v2.4"/></svg>'
  };

  var APPS = [
    {id:"fgh", nom:"Réservations", long:"Validateur de réservations", href:"/fgh/", desc:"Valide les réservations FGH sur la maquette IFC, sans Revit."},
    {id:"ifc", nom:"IFC", long:"Visionneuse IFC", href:"/ifc/", desc:"Ouvre, explore et modifie une maquette IFC dans le navigateur."},
    {id:"dxf", nom:"DXF / DWG", long:"Visionneuse DXF", href:"/dxf/", desc:"Ouvre un plan DXF ou DWG : calques, propriétés, mesure."}
  ];

  var $ = function(s){ return document.querySelector(s); };
  document.title = NOM + " · STR Bim Tools";
  $("#nom").textContent = NOM; $("#nom-cartouche").textContent = NOM;
  $("#version").textContent = "v" + VERSION;
  $("#ver-panneau").textContent = "v" + VERSION;
  $("#compte").textContent = APPS.length + " outils";

  // Les dessins n'ont aucun identifiant : un même dessin sert sur le bureau, le panneau et la règle
  var bureau = $("#bureau"), tactile = window.matchMedia && matchMedia("(pointer:coarse)").matches;
  APPS.forEach(function(a){
    // icône de l'atelier : un clic sélectionne, un double-clic ouvre (un toucher suffit sur écran tactile)
    var el = document.createElement("a");
    el.className = "icone"; el.href = a.href;
    el.innerHTML = '<span class="tuile">' + DESSINS[a.id] + "</span><span></span>";
    el.lastChild.textContent = a.nom; el.dataset.desc = a.long + " : " + a.desc;
    el.setAttribute("aria-label", a.long + " : " + a.desc);
    el.addEventListener("click", function(e){
      if (tactile || e.detail === 0) return;          // toucher ou Entrée au clavier : on ouvre
      e.preventDefault(); choisir(el);
    });
    el.addEventListener("dblclick", function(){ location.href = a.href; });
    el.addEventListener("mouseenter", function(){ bulle(el); });
    el.addEventListener("mouseleave", function(){ $("#bulle").hidden = true; });
    bureau.appendChild(el);

    // ligne du panneau
    var li = document.createElement("li"), l = document.createElement("a");
    l.href = a.href; l.innerHTML = DESSINS[a.id] + '<span><b></b><small></small></span><span class="adr"></span>';
    l.querySelector("b").textContent = a.long; l.querySelector("small").textContent = a.desc;
    l.querySelector(".adr").textContent = "str-bim-tools.com" + a.href;
    li.appendChild(l); $("#liste").appendChild(li);

    // raccourci sur la règle
    var r = document.createElement("a");
    r.className = "outil"; r.href = a.href; r.title = a.long; r.innerHTML = DESSINS[a.id];
    $("#raccourcis").appendChild(r);
  });

  function choisir(el){
    [].forEach.call(document.querySelectorAll(".icone.choisie"), function(x){ x.classList.remove("choisie"); });
    if (el) el.classList.add("choisie");
  }
  document.addEventListener("pointerdown", function(e){
    if (!e.target.closest(".icone")) choisir(null);
    if (!e.target.closest("#panneau,#btn-outils")) panneau(false);
  });

  var minuteur;
  function bulle(el){
    clearTimeout(minuteur);
    minuteur = setTimeout(function(){
      if (!el.matches(":hover")) return;
      var b = $("#bulle"), r = el.getBoundingClientRect();
      b.textContent = el.dataset.desc; b.hidden = false;
      b.style.left = Math.min(r.right + 6, innerWidth - b.offsetWidth - 8) + "px";
      b.style.top = (r.top + 12) + "px";
    }, 450);
  }

  // ---------- Panneau des outils ----------
  var pan = $("#panneau"), btn = $("#btn-outils");
  function panneau(ouvrir){
    if (ouvrir === undefined) ouvrir = pan.classList.contains("ferme");
    pan.classList.toggle("ferme", !ouvrir);
    pan.setAttribute("aria-hidden", ouvrir ? "false" : "true");
    btn.setAttribute("aria-expanded", ouvrir ? "true" : "false");
    if (ouvrir){ var p = pan.querySelector(".liste a"); if (p) p.focus({preventScroll:true}); }
  }
  btn.addEventListener("click", function(){ panneau(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") panneau(false);
    var ic = [].slice.call(document.querySelectorAll(".icone")), i = ic.indexOf(document.activeElement);
    if (i >= 0 && /^Arrow/.test(e.key)){
      e.preventDefault();
      var j = /Down|Right/.test(e.key) ? Math.min(i + 1, ic.length - 1) : Math.max(i - 1, 0);
      ic[j].focus(); choisir(ic[j]);
    }
  });

  // ---------- Thème ----------
  $("#btn-theme").addEventListener("click", function(){
    var r = document.documentElement, c = r.getAttribute("data-theme") === "clair" ? "sombre" : "clair";
    r.setAttribute("data-theme", c);
    try { localStorage.setItem("atelier.theme", c); } catch(e){}
    teintes();
  });

  // ---------- Heure et date du cartouche ----------
  function horloge(){
    var d = new Date(), z = function(x){ return (x < 10 ? "0" : "") + x; };
    $("#heure").textContent = z(d.getHours()) + ":" + z(d.getMinutes());
    $("#date").textContent = z(d.getDate()) + "." + z(d.getMonth() + 1) + "." + d.getFullYear();
  }
  horloge(); setInterval(horloge, 10000);

  // ---------- Fond : quadrillage de calque + ossature filaire or qui tourne lentement ----------
  var cv = $("#fond"), ctx = cv.getContext("2d"), L, H, dpr, encre, or;
  function teintes(){
    var s = getComputedStyle(document.documentElement);
    encre = s.getPropertyValue("--encre").trim(); or = s.getPropertyValue("--or-rvb").trim();
  }
  function taille(){ dpr = Math.min(window.devicePixelRatio || 1, 2); L = innerWidth; H = innerHeight; cv.width = L * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  teintes(); taille(); addEventListener("resize", taille);

  // ossature : 4 x 3 travées, 5 niveaux de dalles, poteaux aux nœuds
  var segs = [], nx = 4, ny = 3, nz = 5;
  for (var k = 0; k <= nz; k++) for (var i = 0; i <= nx; i++) for (var j = 0; j <= ny; j++){
    var a = [i - nx/2, k - nz/2, j - ny/2];
    if (i < nx) segs.push([a, [a[0] + 1, a[1], a[2]], k]);
    if (j < ny) segs.push([a, [a[0], a[1], a[2] + 1], k]);
    if (k < nz) segs.push([a, [a[0], a[1] + 1, a[2]], k + .5]);
  }
  var t0 = performance.now();
  function dessine(t){
    var dt = t - t0;
    ctx.clearRect(0, 0, L, H);

    // quadrillage de calque : fin tous les 24 px, appuyé tous les 120 px
    ctx.lineWidth = 1;
    for (var g = 0; g < 2; g++){
      var pas = g ? 120 : 24;
      ctx.strokeStyle = "rgba(" + encre + "," + (g ? .06 : .025) + ")";
      ctx.beginPath();
      for (var x = .5; x < L; x += pas){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (var y = .5; y < H; y += pas){ ctx.moveTo(0, y); ctx.lineTo(L, y); }
      ctx.stroke();
    }

    // ossature : se construit niveau par niveau, puis tourne
    var monte = Math.min(dt / 2600, 1) * (nz + 1);
    var ang = .6 + dt / 30000, c = Math.cos(ang), s = Math.sin(ang);
    var ech = Math.min(L, H) / 10, cx = L * (L > 760 ? .64 : .5), cy = H * .5;
    segs.forEach(function(sg){
      if (sg[2] > monte) return;
      var pr = [sg[0], sg[1]].map(function(q){
        var x = q[0]*c - q[2]*s, z = q[0]*s + q[2]*c, f = 7 / (7 + z * .6);
        return [cx + x * ech * f, cy - q[1] * ech * f + z * ech * .3, z];
      });
      var prof = (pr[0][2] + pr[1][2]) / 2, al = Math.max(.04, .2 - prof * .035);
      ctx.strokeStyle = "rgba(" + or + "," + al.toFixed(3) + ")";
      ctx.beginPath(); ctx.moveTo(pr[0][0], pr[0][1]); ctx.lineTo(pr[1][0], pr[1][1]); ctx.stroke();
    });
    requestAnimationFrame(dessine);
  }
  requestAnimationFrame(dessine);
})();
</script>
</body>
</html>
