<body>

<!-- Connexion de l'espace AB (06.10.2026) : mêmes comptes que la planification
     (Supabase Auth), habillage du bureau. Les liens reçus par courriel arrivent
     sur la connexion de la planification, qui renvoie ici (repère « ab.lien »). -->
<main class="cx">
  <div class="cx-carte">
    <img class="cx-logo" src="/ab/assets/logo-ab.svg?v=1" alt="AB Ingénieurs civils, géotechnique, environnement" width="150" height="200">
    <div class="cx-boite">
      <h1 id="titre">Connexion</h1>
      <p class="cx-sous">Votre espace de travail</p>

      <form id="formulaire" autocomplete="on" novalidate>
        <div class="cx-champs">
          <div class="cx-champ">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="cx-champ">
            <label for="mdp" id="label-mdp">Mot de passe</label>
            <input type="password" id="mdp" name="mdp" autocomplete="current-password" required>
            <div class="cx-aide" id="aide-mdp" hidden>Six caractères au minimum.</div>
          </div>
        </div>

        <div class="cx-msg" id="message" role="alert" hidden></div>

        <button class="cx-valider" type="submit" id="valider">Se connecter</button>
      </form>

      <div class="cx-bas">
        <button type="button" id="oubli">Mot de passe oublié ou première connexion</button>
        <button type="button" id="demo">Essayer la démo</button>
      </div>
    </div>
  </div>
  <p class="cx-pied">Espace AB Ingénieurs · <span id="version"></span></p>
</main>

<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=38"></script>
<script src="/ab/assets/version.js?v=1"></script>
<script>
(function () {
  "use strict";

  var p = new URLSearchParams(location.search);
  /* Pas de renvoi hors de l'espace AB (même vérification que la connexion de
     la planification : le navigateur résout l'adresse, on regarde où elle mène). */
  function retourSur(brut) {
    try {
      var u = new URL(brut || "/ab/", location.origin);
      if (u.origin === location.origin && /^\/ab\//.test(u.pathname) && !/^\/ab\/connexion\//.test(u.pathname)) return u.pathname + u.search + u.hash;
    } catch (e) {}
    return "/ab/";
  }
  var retour = retourSur(p.get("retour"));

  var form = document.getElementById("formulaire");
  var email = document.getElementById("email");
  var mdp = document.getElementById("mdp");
  var valider = document.getElementById("valider");
  var oubli = document.getElementById("oubli");
  var demo = document.getElementById("demo");
  var boiteMsg = document.getElementById("message");
  var titre = document.getElementById("titre");
  var labelMdp = document.getElementById("label-mdp");
  var aideMdp = document.getElementById("aide-mdp");

  var mode = "connexion";            // connexion | nouveau (mot de passe à choisir depuis un lien)
  /* Lien reçu par courriel : { jeton, type } tant que le jeton n'a pas servi,
     puis { jetons } (session ouverte), pour qu'un mot de passe refusé puisse
     être corrigé sans redemander de lien. */
  var lien = null;

  function dis(texte, bon) {
    boiteMsg.textContent = texte;
    boiteMsg.className = "cx-msg" + (bon ? " ok" : "");
    boiteMsg.hidden = !texte;
  }

  var OUBLI = "« Mot de passe oublié ou première connexion »";

  /* Identifiant sans @ (le compte de démonstration « demo ») : c'est une
     adresse du domaine du site, que la personne n'a pas à connaître. */
  function adresseDe(saisie) {
    return saisie && saisie.indexOf("@") < 0 ? saisie.toLowerCase() + "@str-bim-tools.com" : saisie;
  }

  function messageLien(code, texte) {
    if (code === "otp_expired" || /expired|invalid/i.test(texte || "")) {
      return "Ce lien a expiré ou a déjà servi. Saisis ton adresse, puis " + OUBLI + " pour en recevoir un nouveau.";
    }
    return "Lien refusé : " + texte;
  }

  function passeEn(m) {
    mode = m;
    var nouveau = m === "nouveau";
    titre.textContent = nouveau ? "Nouveau mot de passe" : "Connexion";
    valider.textContent = nouveau ? "Enregistrer et entrer" : "Se connecter";
    labelMdp.textContent = nouveau ? "Mot de passe à choisir" : "Mot de passe";
    mdp.autocomplete = nouveau ? "new-password" : "current-password";
    aideMdp.hidden = !nouveau;
    // Le lien suffit à reconnaître la personne : l'adresse n'est pas redemandée
    email.readOnly = nouveau;
    email.parentNode.hidden = nouveau && !email.value;
    oubli.hidden = nouveau;
    demo.hidden = nouveau;
    mdp.value = "";
  }

  if (p.get("motif")) dis(p.get("motif"));
  if (!window.Sb || !window.Sb.configure) {
    dis("Aucune base n'est configurée : l'outil fonctionne en mode local, sans connexion.");
    valider.disabled = true;
    oubli.disabled = true;
    demo.disabled = true;
  }

  /* --- retour d'un lien reçu par courriel ---
     Deux formes. #jeton=…&type=… : modèles de courriels de l'outil ; placé
     après le #, le jeton n'est jamais envoyé au serveur du site, et il n'est
     échangé qu'à la validation du mot de passe, jamais à l'ouverture de la
     page (un antivirus qui visite les liens à l'avance ne le grille pas).
     #access_token=… : modèles d'origine de Supabase ; la session est déjà ouverte. */
  (function retourDeLien() {
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    var type = h.get("type") || p.get("type") || "";
    var jeton = h.get("jeton") || p.get("jeton");
    var refus = h.get("error_description") || p.get("error_description") || h.get("error") || p.get("error");

    if (jeton) {
      lien = { jeton: jeton, type: type };
    } else if (h.get("access_token") && /^(recovery|signup|magiclink|invite)$/.test(type)) {
      lien = { jetons: { access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") } };
    } else if (refus) {
      dis(messageLien(h.get("error_code") || p.get("error_code"), refus));
    }
    if (lien || refus) history.replaceState(null, "", location.pathname);   // le jeton ne reste ni dans l'historique ni à l'écran

    if (lien) {
      passeEn("nouveau");
      var bienvenue = type === "signup" || type === "invite";
      if (bienvenue) titre.textContent = "Bienvenue";
      dis(bienvenue ? "Choisis ton mot de passe pour activer ton accès." : "Choisis ton nouveau mot de passe.", true);
    }
  })();

  /* --- lien par courriel : premier accès, ou mot de passe oublié ---
     Même demande dans les deux cas : le compte est créé s'il n'existe pas
     encore (pour une adresse inscrite dans la liste des accès). */
  oubli.addEventListener("click", function () {
    var adresse = email.value.trim();
    if (!adresse) { dis("Saisis d'abord ton adresse, puis redemande un lien."); email.focus(); return; }
    oubli.disabled = true;
    /* Les courriels mènent à la connexion de la planification : ce repère
       lui dit de renvoyer ici, avec le lien, quand il revient sur ce navigateur. */
    try { localStorage.setItem("ab.lien", String(Date.now())); } catch (e) {}
    window.Sb.envoieLien(adresse).then(function () {
      dis("Lien envoyé à " + adresse + " : ouvre-le pour choisir ton mot de passe. Rien reçu d'ici quelques minutes ? Regarde dans les indésirables.", true);
    }).catch(function (err) {
      var m = err.message || "";
      dis(/non autoris/i.test(m) ? "Cette adresse n'est pas autorisée : demande l'accès à l'administrateur de l'outil."
        : /création de comptes est fermée/i.test(m) ? "Ton accès n'est pas encore ouvert : contacte l'administrateur de l'outil."
        : err.reseau || /patiente|limite|trop de tentatives/i.test(m) ? m
        : "Envoi impossible pour l'instant : réessaie dans quelques minutes.");
    }).then(function () { oubli.disabled = false; });
  });

  /* --- démonstration : entre d'un clic dans le Bureau de test (compte-demo.sql) --- */
  demo.addEventListener("click", function () {
    dis("");
    demo.disabled = true;
    window.Sb.connexion(adresseDe("demo"), "demo")
      .then(function () { location.replace("/ab/"); })
      .catch(function (err) { demo.disabled = false; dis(err.message); });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    dis("");
    var adresse = email.value.trim(), secret = mdp.value;

    if (mode === "connexion") {
      if (!adresse) { dis("L'adresse e-mail est obligatoire."); return email.focus(); }
      if (!secret) { dis("Le mot de passe est obligatoire."); return mdp.focus(); }
    } else if (secret.length < 6) {
      dis("Mot de passe trop court : six caractères au minimum."); return mdp.focus();
    }

    valider.disabled = true;
    valider.textContent = "…";

    function fini(msg) {
      valider.disabled = false;
      valider.textContent = mode === "nouveau" ? "Enregistrer et entrer" : "Se connecter";
      if (msg) dis(msg);
    }

    if (mode === "connexion") {
      window.Sb.connexion(adresseDe(adresse), secret)
        .then(function () { location.replace(retour); })
        .catch(function (err) { fini(err.message); });
      return;
    }

    // Le jeton du lien ne sert qu'une fois : la session obtenue est gardée pour les essais suivants
    var jetons = lien.jetons ? Promise.resolve(lien.jetons)
      : window.Sb.verifieLien(lien.jeton, lien.type).then(function (j) { lien = { jetons: j }; return j; }, function (err) {
          if (err.reseau) throw err;                     // panne réseau : le lien reste bon, on pourra réessayer
          lien = null;
          passeEn("connexion");
          throw new Error(messageLien("otp_expired", ""));
        });
    jetons
      .then(function (j) { return window.Sb.choisitMotDePasse(j, secret); })
      .then(function () { try { localStorage.removeItem("ab.lien"); } catch (e) {} location.replace(retour); })
      .catch(function (err) { fini(err.message); });
  });

  // Date de la version publiée, au pied
  var v = window.AB_VERSION && /^(\d{4})-(\d\d)-(\d\d)$/.exec(window.AB_VERSION);
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  if (v) document.getElementById("version").textContent = "Version du " + parseInt(v[3], 10) + " " + MOIS[parseInt(v[2], 10) - 1] + " " + v[1];

  (mode === "nouveau" ? mdp : email).focus();
})();
</script>
</body>
</html>
