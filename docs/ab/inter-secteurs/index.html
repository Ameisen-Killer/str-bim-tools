<body class="large">

<div data-chrome></div>

<!-- Module Inter-secteurs (version AB, 06.10.2026) : ce qui traverse les
     secteurs. Les appels d'offres (une affaire en phase « AO » : public ou
     privé, demandeur pris dans l'annuaire, date de remise = échéance de
     l'affaire, secteurs concernés, résultat), leur agenda (attaché à l'AO, non
     à une personne) et les affaires qui font intervenir plusieurs secteurs. -->
<main>
  <div class="wrap entete">
    <h1>Inter-secteurs <span id="titre-inter" class="compte-titre"></span></h1>
    <div class="filet-or" aria-hidden="true"></div>
  </div>
  <div class="wrap" data-bandeau></div>
  <div class="wrap">
    <nav class="is-sommaire" aria-label="Sections de la page">
      <a href="#ao">Appels d'offres</a>
      <a href="#agenda">Agenda des AO</a>
      <a href="#transversal">Affaires transversales</a>
    </nav>

    <section class="section" id="ao">
      <div class="tete-section">
        <h2>Appels d'offres</h2>
        <div class="outils">
          <select id="f-resultat" class="btn" aria-label="Filtrer par résultat">
            <option value="en_cours">En cours</option>
            <option value="gagne">Gagnés</option>
            <option value="perdu">Perdus ou abandonnés</option>
            <option value="">Tous</option>
          </select>
          <select id="f-type" class="btn" aria-label="Filtrer par type">
            <option value="">Public et privé</option>
            <option value="public">Public</option>
            <option value="prive">Privé</option>
          </select>
        </div>
      </div>
      <div class="defile" id="liste-ao"></div>
    </section>

    <section class="section" id="agenda">
      <div class="tete-section">
        <h2>Agenda des appels d'offres</h2>
        <div class="outils">
          <label class="case"><input type="checkbox" id="f-passes"> Voir les 30 derniers jours</label>
          <button class="btn" type="button" id="btn-rdv">Ajouter un rendez-vous</button>
        </div>
      </div>
      <div id="liste-agenda"></div>
    </section>

    <section class="section" id="transversal">
      <div class="tete-section">
        <div>
          <h2>Affaires transversales</h2>
          <p class="is-chapeau">Les affaires en cours qui font intervenir plusieurs secteurs : ceux déclarés sur l'affaire, et ceux des personnes qui y travaillent.</p>
        </div>
      </div>
      <div class="defile" id="liste-trans"></div>
    </section>
  </div>
</main>

<div data-pied></div>

<script src="/planif/assets/calendrier.js?v=6"></script>
<script src="/planif/assets/config.js?v=1"></script>
<script src="/planif/assets/supabase.js?v=37"></script>
<script src="/planif/assets/donnees.js?v=46"></script>
<script src="/planif/assets/calculs.js?v=11"></script>
<script src="/ab/assets/version.js?v=1"></script>
<script src="/planif/assets/ui.js?v=67"></script>
<script src="/planif/assets/palette.js?v=12"></script>
<script src="/planif/assets/direct.js?v=6"></script>
<script>
(function () {
  "use strict";
  var D = window.Donnees, C = window.Cal, Calc = window.Calc, el = UI.el;
  var JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  var filtres = { resultat: "en_cours", type: "", passes: false };

  if (!UI.session()) return;

  D.pret().then(function () {
    chrome();
    UI.pied();
    UI.bandeauDemo(document.querySelector("[data-bandeau]"));
    document.querySelector(".entete").classList.add("vu");

    document.getElementById("f-resultat").addEventListener("change", function () { filtres.resultat = this.value; rend(); });
    document.getElementById("f-type").addEventListener("change", function () { filtres.type = this.value; rend(); });
    document.getElementById("f-passes").addEventListener("change", function () { filtres.passes = this.checked; rend(); });
    document.getElementById("btn-rdv").addEventListener("click", function () { formEvenement(null, {}); });

    D.surRechargement(rend);
    rend();
  }).catch(UI.echec);

  function auj() { return C.isoAuj(); }

  function chrome() {
    var actions = [];
    if (D.aDroit("affaires_creer")) {
      actions.push({ label: "Nouvel appel d'offres", or: true, icone: "ico-ajout-affaire", action: function () { formAO(null); } });
    }
    UI.chrome("inter", actions);
  }

  /* ================================================================ outils */

  function deux(n) { return (n < 10 ? "0" : "") + n; }
  function jourCourt(iso) { var d = C.dt(iso); return d ? JOURS[d.getDay()] + " " + C.fmtCourt(iso) : "—"; }
  function relatif(iso) {
    var n = C.diff(auj(), iso);
    if (n === 0) return "aujourd'hui";
    if (n === 1) return "demain";
    if (n > 0) return "dans " + n + " j";
    return n === -1 ? "hier" : "il y a " + (-n) + " j";
  }
  function chf(n) { return n == null ? "—" : "CHF " + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "’"); }
  function nomSecteur(code) { return D.DISCIPLINES[code] || code; }
  function nomContact(c) {
    if (!c) return "";
    var nom = [c.prenom, c.nom].filter(Boolean).join(" ");
    return c.societe ? c.societe + (nom ? " — " + nom : "") : nom;
  }
  function etiquetteSecteur(code, declare) {
    return el("span", { class: "etiq is-secteur" + (declare ? " declare" : ""), title: declare ? "Déclaré sur l'affaire" : "Par les personnes qui y travaillent", text: nomSecteur(code) });
  }
  function pastilleAffaire(a) {
    return el("span", { class: "is-affaire" }, [
      el("span", { class: "pastille", style: "color:" + UI.teinte(a.teinte), "aria-hidden": "true" }),
      el("span", { class: "num is-code", style: "color:" + UI.teinte(a.teinte), text: a.code }),
      el("span", { class: "is-nom", text: a.nom })
    ]);
  }

  /** Les appels d'offres : affaires en phase AO, ou qui ont reçu un résultat. */
  function appelsDOffres() {
    return D.affaires({ tous: true }).filter(function (a) { return a.phase === "AO" || a.aoResultat; });
  }
  function enCours(a) { return !a.aoResultat || a.aoResultat === "en_cours"; }

  /** Secteurs d'une affaire : déclarés, puis ceux des personnes de l'équipe et des tâches ouvertes. */
  function secteursDe(a) {
    var declares = {}, tous = {};
    (a.secteurs || []).forEach(function (c) { declares[c] = tous[c] = true; });
    function ajoute(id) { var m = id && D.membre(id); if (m && m.discipline) tous[m.discipline] = true; }
    a.ingenieurs.concat(a.dessinateurs).forEach(ajoute);
    D.taches({ affaireId: a.id, sansTerminees: true }).forEach(function (t) { ajoute(t.ingenieurId); ajoute(t.dessinateurId); });
    var ordre = Object.keys(D.DISCIPLINES);
    var codes = Object.keys(tous).sort(function (x, y) { return ordre.indexOf(x) - ordre.indexOf(y); });
    return codes.map(function (c) { return { code: c, declare: !!declares[c] }; });
  }

  /* ================================================================ rendu */

  function rend() {
    var aos = appelsDOffres();
    var nEnCours = aos.filter(enCours).length;
    var nRdv = D.agenda({ depuis: auj() }).length;
    document.getElementById("titre-inter").textContent =
      nEnCours + (nEnCours > 1 ? " AO en cours" : " AO en cours") + " · " + nRdv + (nRdv > 1 ? " rendez-vous à venir" : " rendez-vous à venir");
    listeAO(aos);
    listeAgenda();
    listeTransversales();
  }

  /* ------------------------------------------------------- appels d'offres */
  function listeAO(aos) {
    var hote = UI.vide(document.getElementById("liste-ao"));
    var l = aos.filter(function (a) {
      if (filtres.type && a.aoType !== filtres.type) return false;
      if (filtres.resultat === "en_cours") return enCours(a);
      if (filtres.resultat === "gagne") return a.aoResultat === "gagne";
      if (filtres.resultat === "perdu") return a.aoResultat === "perdu" || a.aoResultat === "abandonne";
      return true;
    }).sort(function (x, y) { return (x.echeance || "9999") < (y.echeance || "9999") ? -1 : (x.echeance || "9999") > (y.echeance || "9999") ? 1 : x.code.localeCompare(y.code, "fr", { numeric: true }); });

    if (!l.length) {
      hote.appendChild(el("p", { class: "vide", text: aos.length ? "Aucun appel d'offres pour ces filtres." :
        "Aucun appel d'offres pour l'instant." + (D.aDroit("affaires_creer") ? " « Nouvel appel d'offres », en haut, en ouvre un." : "") }));
      return;
    }
    var t = el("table", { class: "liste is-table" });
    t.appendChild(el("thead", {}, [el("tr", {}, ["Appel d'offres", "Type", "Demandeur", "Secteurs", "Remise", "Honoraires", "Prochain rendez-vous", "Résultat"].map(function (h) { return el("th", { text: h }); }))]));
    var corps = el("tbody");
    l.forEach(function (a) {
      var demandeur = a.demandeurId ? D.contact(a.demandeurId) : null;
      var prochain = D.agenda({ affaireId: a.id, depuis: auj() })[0];
      var n = a.echeance ? C.diff(auj(), a.echeance) : null;
      var tr = el("tr", { class: "cliquable", tabindex: "0", "data-anim": "t|" + a.id,
        onclick: function (e) { if (!e.target.closest("a")) formAO(a.id); },
        onkeydown: function (e) { if (e.key === "Enter") formAO(a.id); }
      }, [
        el("td", {}, [pastilleAffaire(a)]),
        el("td", { text: a.aoType ? D.TYPES_AO[a.aoType] : "—" }),
        el("td", {}, [demandeur ? el("a", { class: "lien-doux", href: "/ab/annuaire/?q=" + encodeURIComponent(demandeur.societe || demandeur.nom), text: nomContact(demandeur) }) : el("span", { class: "is-faible", text: "—" })]),
        el("td", {}, secteursDe(a).length ? secteursDe(a).map(function (s) { return etiquetteSecteur(s.code, s.declare); }) : [el("span", { class: "is-faible", text: "—" })]),
        el("td", { class: "is-remise" + (enCours(a) && n !== null && n < 0 ? " depassee" : enCours(a) && n !== null && n <= 7 ? " proche" : "") }, a.echeance ? [
          el("span", { text: jourCourt(a.echeance) }),
          enCours(a) ? el("span", { class: "is-faible", text: " · " + (n < 0 ? "dépassée" : relatif(a.echeance)) }) : null
        ] : [el("span", { class: "is-faible", text: "—" })]),
        el("td", { class: "num", text: chf(a.aoMontant) }),
        el("td", {}, prochain ? [
          el("span", { text: jourCourt(prochain.jour) + (prochain.heure ? " " + prochain.heure : "") }),
          el("span", { class: "is-faible", text: " · " + prochain.titre })
        ] : [el("span", { class: "is-faible", text: "—" })]),
        el("td", {}, [el("span", { class: "etiq is-resultat " + (a.aoResultat || "en_cours"), text: D.RESULTATS_AO[a.aoResultat || "en_cours"] })])
      ]);
      corps.appendChild(tr);
    });
    t.appendChild(corps);
    hote.appendChild(t);
  }

  /* ------------------------------------------------------- agenda */
  function listeAgenda() {
    var hote = UI.vide(document.getElementById("liste-agenda"));
    var depuis = filtres.passes ? C.ajoute(auj(), -30) : auj();
    var l = D.agenda({ depuis: depuis });
    if (!l.length) {
      hote.appendChild(el("p", { class: "vide", text: "Aucun rendez-vous à venir. Visites, questions, remises et ouvertures des offres se notent ici." }));
      return;
    }
    var semaine = null, ul = null;
    l.forEach(function (r) {
      var a = D.affaire(r.affaireId);
      var lundi = C.lundi(r.jour);
      if (lundi !== semaine) {
        semaine = lundi;
        var s = C.semaineISO(lundi);
        hote.appendChild(el("div", { class: "is-semaine" + (lundi === C.lundi(auj()) ? " actuelle" : "") },
          ["Semaine " + s.num + " · du " + C.fmtCourt(lundi) + " au " + C.fmtCourt(C.ajoute(lundi, 4))]));
        ul = el("ul", { class: "is-agenda" });
        hote.appendChild(ul);
      }
      var d = C.dt(r.jour), passe = r.jour < auj();
      ul.appendChild(el("li", {}, [el("button", {
        type: "button", class: "is-rdv" + (passe ? " passe" : "") + (r.genre === "remise" ? " remise" : ""),
        onclick: function () { formEvenement(r.id, {}); }
      }, [
        el("span", { class: "is-cal", "aria-hidden": "true" }, [
          el("b", { text: String(d.getDate()) }),
          el("span", { text: JOURS[d.getDay()] + " " + C.fmtCourt(r.jour).split(" ")[1] })
        ]),
        el("span", { class: "is-rdv-lib" }, [
          el("span", { class: "is-rdv-titre" }, [
            r.heure ? el("span", { class: "is-heure", text: r.heure }) : null,
            r.titre
          ]),
          el("span", { class: "is-rdv-sous" }, [
            a ? pastilleAffaire(a) : null,
            r.lieu ? el("span", { class: "is-faible", text: " · " + r.lieu }) : null
          ])
        ]),
        el("span", { class: "etiq is-genre " + r.genre, text: D.GENRES_AGENDA[r.genre] })
      ])]));
    });
  }

  /* ------------------------------------------------------- affaires transversales */
  function listeTransversales() {
    var hote = UI.vide(document.getElementById("liste-trans"));
    var l = D.affaires().filter(function (a) { return a.phase !== "AO"; }).map(function (a) {
      return { a: a, secteurs: secteursDe(a) };
    }).filter(function (x) { return x.secteurs.length >= 2; })
      .sort(function (x, y) { return y.secteurs.length - x.secteurs.length || x.a.code.localeCompare(y.a.code, "fr", { numeric: true }); });
    if (!l.length) {
      hote.appendChild(el("p", { class: "vide", text: "Aucune affaire en cours ne fait intervenir plusieurs secteurs." }));
      return;
    }
    var t = el("table", { class: "liste is-table" });
    t.appendChild(el("thead", {}, [el("tr", {}, ["Affaire", "Phase", "Secteurs", "Équipe", "Tâches ouvertes", "Prochaine échéance", ""].map(function (h) { return el("th", { text: h }); }))]));
    var corps = el("tbody");
    l.forEach(function (x) {
      var a = x.a, ouvertes = D.taches({ affaireId: a.id, sansTerminees: true });
      var proch = ouvertes.filter(function (t) { return t.echeance && t.echeance >= auj(); })[0];
      corps.appendChild(el("tr", {}, [
        el("td", {}, [el("a", { class: "is-lien-affaire", href: "/ab/taches/?affaire=" + encodeURIComponent(a.id) + "&membre=" }, [pastilleAffaire(a)])]),
        el("td", { class: "is-faible", text: a.phase ? D.libellePhase(a.phase) : "—" }),
        el("td", {}, x.secteurs.map(function (s) { return etiquetteSecteur(s.code, s.declare); })),
        el("td", { class: "num", text: String(a.ingenieurs.length + a.dessinateurs.length) }),
        el("td", { class: "num", text: String(ouvertes.length) }),
        el("td", { text: proch ? jourCourt(proch.echeance) : "—" }),
        el("td", { class: "actions" }, [el("button", { type: "button", class: "btn btn-nu", text: "Secteurs…", onclick: function () { formSecteurs(a.id); } })])
      ]));
    });
    t.appendChild(corps);
    hote.appendChild(t);
  }

  /* ================================================================ formulaires */

  /** Ce qu'il faut renvoyer à majAffaire pour ne rien perdre de l'affaire. */
  function base(a) {
    return { code: a.code, nom: a.nom, note: a.note, teinte: a.teinte, statut: a.statut, echeance: a.echeance,
             phase: a.phase, adresse: a.adresse, ingenieurs: a.ingenieurs, dessinateurs: a.dessinateurs };
  }

  function casesSecteurs(choisis) {
    return el("div", { class: "cases" }, Object.keys(D.DISCIPLINES).map(function (c) {
      var input = el("input", { type: "checkbox", name: "secteurs", value: c });
      input.checked = (choisis || []).indexOf(c) >= 0;
      return el("label", { class: "case" }, [input, D.DISCIPLINES[c]]);
    }));
  }

  /** Prochain numéro libre : AO-2026-01, AO-2026-02… */
  function codeSuivant() {
    var an = C.dt(auj()).getFullYear(), pris = {};
    D.affaires({ tous: true }).forEach(function (a) { pris[a.code.toLowerCase()] = true; });
    for (var i = 1; i < 1000; i++) { var c = "AO-" + an + "-" + deux(i); if (!pris[c.toLowerCase()]) return c; }
    return "AO-" + an;
  }

  function formAO(id) {
    var a = id ? D.affaire(id) : null;
    if (!a && !D.aDroit("affaires_creer")) return UI.toast("Ouvrir un appel d'offres demande le droit d'ouvrir une affaire.");
    var contacts = D.contacts();
    var corps = el("div", {}, [
      el("div", { class: "grille-champs" }, [
        UI.champ({ nom: "code", label: "Numéro", valeur: a ? a.code : codeSuivant() }),
        UI.champ({ nom: "aoType", label: "Type", type: "select", valeur: a ? (a.aoType || "") : "public",
          options: [{ valeur: "", label: "—" }, { valeur: "public", label: "Public" }, { valeur: "prive", label: "Privé" }] }),
        UI.champ({ nom: "nom", label: "Objet de l'appel d'offres", valeur: a ? a.nom : "", exemple: "Halle des Sablières — ingénieur civil", large: true }),
        UI.champ({ nom: "demandeurId", label: "Demandeur (annuaire)", type: "select", large: true, valeur: a ? (a.demandeurId || "") : "",
          options: [{ valeur: "", label: contacts.length ? "— Choisir une fiche de l'annuaire —" : "— L'annuaire est vide —" }]
            .concat(contacts.map(function (c) { return { valeur: c.id, label: nomContact(c) }; })) }),
        UI.champ({ nom: "echeance", label: "Remise de l'offre", type: "date", valeur: a ? (a.echeance || "") : "" }),
        UI.champ({ nom: "aoMontant", label: "Honoraires offerts (CHF)", inputmode: "numeric", valeur: a && a.aoMontant != null ? a.aoMontant : "", exemple: "45000" }),
        UI.champ({ nom: "aoResultat", label: "Résultat", type: "select", valeur: a ? (a.aoResultat || "en_cours") : "en_cours",
          options: Object.keys(D.RESULTATS_AO).map(function (k) { return { valeur: k, label: D.RESULTATS_AO[k] }; }) })
      ]),
      el("fieldset", {}, [
        el("div", { class: "legende", text: "Secteurs concernés" }),
        casesSecteurs(a ? a.secteurs : [])
      ]),
      el("div", { class: "grille-champs", style: "margin-top:14px" }, [
        UI.champ({ nom: "note", label: "Note", type: "textarea", rows: 2, large: true, valeur: a ? a.note : "", exemple: "Critères d'adjudication, documents à fournir, partenaires…" })
      ])
    ]);
    if (a) {
      var rdv = D.agenda({ affaireId: a.id });
      corps.appendChild(el("fieldset", {}, [
        el("div", { class: "legende", text: "Agenda de cet appel d'offres" }),
        rdv.length ? el("ul", { class: "is-mini-agenda" }, rdv.map(function (r) {
          return el("li", { class: r.jour < auj() ? "passe" : "" }, [
            el("b", { text: jourCourt(r.jour) + (r.heure ? " " + r.heure : "") }), " · " + r.titre + " ",
            el("span", { class: "is-faible", text: "(" + D.GENRES_AGENDA[r.genre] + ")" })
          ]);
        })) : el("p", { class: "aide", text: "Aucun rendez-vous noté." })
      ]));
    }
    var boutons = [];
    if (a && D.aDroit("affaires_creer")) {
      boutons.push({ label: "Supprimer", rouge: true, gauche: true, action: function () {
        UI.confirme("Supprimer cet appel d'offres ?", "« " + a.code + " · " + a.nom + " » disparaît, avec ses tâches et son agenda.", "Supprimer", true)
          .then(function (ok) { if (ok) D.suppAffaire(a.id).then(function () { UI.toast("Appel d'offres supprimé."); rend(); }).catch(function (e) { UI.toast(e.message); }); });
      } });
    }
    if (a) boutons.push({ label: "Ajouter un rendez-vous", gauche: true, action: function () { setTimeout(function () { formEvenement(null, { affaireId: a.id }); }, 0); } });
    boutons.push({ label: "Annuler" });
    boutons.push({ label: "Enregistrer", or: true, entree: true, action: function () {
      var v = UI.lit(corps);
      var o = a ? base(a) : { teinte: (D.affaires({ tous: true }).length % 8) + 1, statut: "active", phase: "AO", adresse: "", ingenieurs: [], dessinateurs: [] };
      o.code = v.code; o.nom = v.nom; o.note = v.note; o.echeance = v.echeance || null;
      o.aoType = v.aoType; o.demandeurId = v.demandeurId; o.aoMontant = v.aoMontant;
      o.aoResultat = v.aoResultat; o.secteurs = v.secteurs || [];
      // Perdu ou abandonné : l'affaire se termine ; gagné ou en cours : elle vit
      if (v.aoResultat === "perdu" || v.aoResultat === "abandonne") o.statut = "terminee";
      else if (o.statut === "terminee") o.statut = "active";
      var p = a ? D.majAffaire(a.id, o) : D.ajouteAffaire(o);
      return p.then(function () {
        UI.toast(a ? "Appel d'offres modifié." : "Appel d'offres ouvert." + (v.aoResultat === "gagne" ? "" : ""));
        rend();
      }).catch(function (e) { UI.toast(e.message); return false; });
    } });
    UI.ouvre({ surtitre: a ? "Appel d'offres" : "Nouvel appel d'offres", titre: a ? a.code + " · " + a.nom : "Appel d'offres", corps: corps, compacte: true, boutons: boutons });
  }

  function formEvenement(id, o) {
    var r = id ? D.evenement(id) : null;
    var aos = appelsDOffres().filter(function (a) { return enCours(a) || (r && a.id === r.affaireId); });
    if (!aos.length) return UI.toast("Ouvre d'abord un appel d'offres : un rendez-vous s'y rattache toujours.");
    var corps = el("div", {}, [el("div", { class: "grille-champs" }, [
      UI.champ({ nom: "affaireId", label: "Appel d'offres", type: "select", large: true,
        valeur: r ? r.affaireId : (o.affaireId || aos[0].id),
        options: aos.map(function (a) { return { valeur: a.id, label: a.code + " · " + a.nom }; }) }),
      UI.champ({ nom: "genre", label: "Type de rendez-vous", type: "select", valeur: r ? r.genre : "visite",
        options: Object.keys(D.GENRES_AGENDA).map(function (k) { return { valeur: k, label: D.GENRES_AGENDA[k] }; }) }),
      UI.champ({ nom: "titre", label: "Intitulé", valeur: r ? r.titre : "", exemple: "Visite des lieux obligatoire" }),
      UI.champ({ nom: "jour", label: "Date", type: "date", valeur: r ? r.jour : auj() }),
      UI.champ({ nom: "heure", label: "Heure", type: "time", pas: 300, valeur: r ? r.heure : "" }),
      UI.champ({ nom: "lieu", label: "Lieu", valeur: r ? r.lieu : "", exemple: "Sur place, salle de conférence…", large: true }),
      UI.champ({ nom: "note", label: "Note", type: "textarea", rows: 2, large: true, valeur: r ? r.note : "" })
    ])]);
    // Intitulé vide : le type de rendez-vous en tient lieu
    var genre = corps.querySelector("select[name=genre]"), titre = corps.querySelector("input[name=titre]");
    titre.placeholder = D.GENRES_AGENDA[genre.value];
    genre.addEventListener("change", function () { titre.placeholder = D.GENRES_AGENDA[genre.value]; });

    var boutons = [];
    if (r) boutons.push({ label: "Supprimer", rouge: true, gauche: true, action: function () {
      return D.suppEvenement(r.id).then(function () { UI.toast("Rendez-vous retiré."); rend(); }).catch(function (e) { UI.toast(e.message); return false; });
    } });
    boutons.push({ label: "Annuler" });
    boutons.push({ label: "Enregistrer", or: true, entree: true, action: function () {
      var v = UI.lit(corps);
      if (!v.titre) v.titre = D.GENRES_AGENDA[v.genre];
      var p = r ? D.majEvenement(r.id, v) : D.ajouteEvenement(v);
      return p.then(function () { UI.toast(r ? "Rendez-vous modifié." : "Rendez-vous noté."); rend(); })
        .catch(function (e) { UI.toast(e.message); return false; });
    } });
    UI.ouvre({ surtitre: "Agenda des appels d'offres", titre: r ? r.titre : "Nouveau rendez-vous", corps: corps, compacte: true, boutons: boutons });
  }

  /** Secteurs déclarés sur une affaire en cours (les autres s'en déduisent). */
  function formSecteurs(id) {
    var a = D.affaire(id); if (!a) return;
    var corps = el("div", {}, [
      el("p", { class: "aide", style: "margin-bottom:12px", text: "Coche les secteurs qui interviennent sur cette affaire. Ceux des personnes qui y travaillent s'ajoutent d'eux-mêmes." }),
      casesSecteurs(a.secteurs)
    ]);
    UI.ouvre({ surtitre: "Secteurs de l'affaire", titre: a.code + " · " + a.nom, corps: corps, compacte: true, boutons: [
      { label: "Annuler" },
      { label: "Enregistrer", or: true, entree: true, action: function () {
        var o = base(a); o.secteurs = UI.lit(corps).secteurs || [];
        return D.majAffaire(a.id, o).then(function () { UI.toast("Secteurs enregistrés."); rend(); })
          .catch(function (e) { UI.toast(e.message); return false; });
      } }
    ] });
  }
})();
</script>
</body>
</html>
