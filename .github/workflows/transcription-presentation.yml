# Temporaire (15.11.2026) : transcrit la piste audio de la page de présentation avec
# les horaires des mots, pour repérer un passage à couper. À retirer ensuite.
name: Transcription de la présentation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcription:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip -q install faster-whisper && sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - name: Transcription
        run: |
          ffmpeg -loglevel error -y -i docs/planificateur-presentation-q7k3/presentation/presentation.mp3 -ar 16000 -ac 1 -f s16le /tmp/p.raw
          python - <<'PY'
          import numpy as np
          from faster_whisper import WhisperModel
          audio = np.fromfile("/tmp/p.raw", dtype=np.int16).astype(np.float32) / 32768.0
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          segs, _ = m.transcribe(audio, language="fr", word_timestamps=True)
          for s in segs:
              print(f"SEG {s.start:7.2f}-{s.end:7.2f} {s.text}")
              if s.start < 25 or "SIA" in s.text.upper().replace(".", "").replace(" ", "") or "S I A" in s.text.upper():
                  for w in s.words:
                      print(f"   MOT {w.start:7.2f}-{w.end:7.2f} {w.word}")
          PY
